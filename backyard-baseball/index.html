<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Backyard Baseball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#24324F; --ink-soft:#5B6887; --cream:#FFF9EF; --paper:#FFFFFF;
  --grass:#5CBF4B; --grass-d:#2F7D3A; --board:#1E5B3B; --board-edge:#C98B55;
  --sky:#8ED3FF; --navy:#1F2F6B; --red:#F0584F; --sun:#FFC83D; --orange:#FF7A45;
  --reuben:#1F2F6B; --jonah:#3FA3E6; --ellie:#E8559B;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --round:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#8ED3FF;color:var(--ink);font-family:var(--round);
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:#8ED3FF}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:4px}

/* ---------- scoreboard ---------- */
#board{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);
  background:linear-gradient(180deg,#26704A,#1B5234);border:4px solid var(--board-edge);border-radius:22px;
  box-shadow:0 6px 0 #8E5A31,0 14px 26px rgba(20,40,30,.28),inset 0 2px 0 rgba(255,255,255,.18);
  padding:6px 16px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--cream);pointer-events:none;min-width:min(440px,92vw)}
.bt{font:400 13px/1 var(--display);letter-spacing:.16em;color:#FFE6A8;opacity:.95}
.brow{display:flex;gap:14px;align-items:flex-end}
.brow>div{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px}
.brow span{font:700 10px/1 var(--round);letter-spacing:.16em;color:rgba(255,249,239,.72)}
.brow b{font:400 26px/1 var(--display);color:#FFD85A;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px;height:26px;align-items:center}
.dots i{width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(255,249,239,.8);display:block}
.dots i.on{background:#FF6B5B;border-color:#FFB0A6;box-shadow:0 0 8px rgba(255,107,91,.8)}
.dots.s i{width:11px;height:11px;border-width:2px}
.dots.s i.on{background:#FFD85A;border-color:#FFF0B8;box-shadow:0 0 6px rgba(255,216,90,.8)}
.srow{display:flex;gap:6px;align-items:center;font:700 10px/1 var(--round);letter-spacing:.16em;color:rgba(255,249,239,.72)}
#sbBases{width:40px;height:28px;display:block}
#sbBases rect{fill:none;stroke:rgba(255,249,239,.85);stroke-width:2.4}
#sbBases rect.on{fill:#FFD85A;stroke:#FFF3C4}

.corner{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px}
.corner.r{right:16px}
.icon-btn{width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 5px 0 rgba(36,50,79,.18),0 10px 20px rgba(36,50,79,.15);font-size:22px;display:grid;place-items:center}
.icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(36,50,79,.18)}

/* ---------- callouts ---------- */
.call{position:absolute;z-index:7;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-align:center;padding-inline:16px;opacity:0}
.call .pre{font-size:clamp(46px,9vw,96px);line-height:1}
.call .w{font:400 clamp(44px,9.5vw,118px)/.95 var(--display);color:#fff;text-wrap:balance;
  -webkit-text-stroke:10px var(--c1,#F0584F);paint-order:stroke fill;text-shadow:0 8px 0 var(--c2,#A8322B),0 16px 30px rgba(0,0,0,.25)}
.call .s{font:400 clamp(22px,4vw,44px)/1 var(--display);color:#fff;-webkit-text-stroke:6px var(--c1,#F0584F);paint-order:stroke fill;text-shadow:0 5px 0 var(--c2,#A8322B)}
.call.show{animation:callIn var(--dur,1.4s) cubic-bezier(.2,1.4,.4,1) forwards}
.call.hold{animation:callHold .35s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes callIn{0%{opacity:0;transform:scale(.3) rotate(-6deg)}12%{opacity:1;transform:scale(1.12) rotate(2deg)}22%{transform:scale(1) rotate(0)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06) translateY(-24px)}}
@keyframes callHold{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
.call.whack{--c1:#FF5A36;--c2:#A32C12}
.call.whack .w{font-size:clamp(50px,11vw,140px);color:#FFE45C}
.call.crush{--c1:#FF8A00;--c2:#A34E00}
.call.good{--c1:#2FA35A;--c2:#17643A}
.call.out{--c1:#5B6887;--c2:#2D3A57}
.call.strike{--c1:#F0584F;--c2:#9E2A24}
.call.foul{--c1:#E3A21A;--c2:#8E6206}
.call.dog{--c1:#8B4F22;--c2:#4F2A0E}
.call.top{top:calc(env(safe-area-inset-top,0px) + 6%)}
.call.top2{top:calc(env(safe-area-inset-top,0px) + 150px)}
.call.low{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 4%)}
.call.dogtime{--c1:#8B4F22;--c2:#4F2A0E}
.call.dogtime .w{color:#FFD85A;font-size:clamp(56px,12vw,150px)}
.call.save{--c1:#2FA35A;--c2:#17643A}
.call.hr{--c1:#FF5A36;--c2:#A32C12}
.call.hr .w{color:#FFE45C;font-size:clamp(60px,13vw,160px)}
.call.ellie{--c1:#E8559B;--c2:#9C2360}
.call.ellie .w{color:#FFE9FF;font-size:clamp(52px,11vw,140px)}
.call.fun{--c1:#1E9BD7;--c2:#0E5B85}
.call.inning{--c1:#1E5B3B;--c2:#0D3321}
#call2{top:52%}
#call2 .w{font-size:clamp(30px,6vw,64px);-webkit-text-stroke:7px var(--c1,#F0584F);text-shadow:0 5px 0 var(--c2,#A8322B)}

/* ---------- now batting ---------- */
#nb{position:absolute;z-index:6;left:clamp(16px,6vw,80px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,.96);border-radius:32px;padding:14px 26px 14px 14px;box-shadow:0 8px 0 rgba(36,50,79,.14),0 20px 40px rgba(36,50,79,.22);opacity:0;pointer-events:none;border:5px solid var(--kc,#1F2F6B)}
#nb.show{animation:nbIn 1.7s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes nbIn{0%{opacity:0;transform:translate(-60px,-50%) scale(.8)}14%{opacity:1;transform:translate(0,-50%) scale(1.04)}24%{transform:translate(0,-50%) scale(1)}84%{opacity:1;transform:translate(0,-50%)}100%{opacity:0;transform:translate(40px,-50%)}}
#nbCv{width:clamp(90px,14vw,140px);height:clamp(110px,17vw,170px);border-radius:22px;background:linear-gradient(180deg,#D8F0FF,#BFE6A8);display:block}
.nb-k{font:700 14px/1 var(--round);letter-spacing:.24em;color:var(--ink-soft)}
.nb-n{font:400 clamp(48px,8vw,92px)/.95 var(--display);color:var(--kc,#1F2F6B);letter-spacing:.01em}
.nb-t{font:400 clamp(22px,3.4vw,34px)/1 var(--display);color:var(--sun);-webkit-text-stroke:5px var(--kc,#1F2F6B);paint-order:stroke fill}

#tapHint{position:absolute;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);
  font:400 clamp(20px,3vw,30px)/1 var(--display);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;pointer-events:none;animation:bob 1s ease-in-out infinite alternate;white-space:nowrap}
@keyframes bob{from{transform:translate(-50%,0)}to{transform:translate(-50%,-8px)}}

/* ---------- chase HUD ---------- */
#chaseHud{position:absolute;z-index:5;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:16px}
.ch-title{font:400 clamp(26px,4.4vw,44px)/1 var(--display);color:#FFE45C;-webkit-text-stroke:7px #8B4F22;paint-order:stroke fill;text-shadow:0 5px 0 #4F2A0E}
.track{position:relative;width:min(720px,100%);height:58px;border-radius:30px;background:rgba(255,255,255,.94);box-shadow:0 6px 0 rgba(79,42,14,.2),0 14px 28px rgba(0,0,0,.18);border:4px solid #8B4F22}
.track::before{content:"";position:absolute;left:40px;right:40px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:repeating-linear-gradient(90deg,#E3C9A6 0 14px,transparent 14px 22px)}
.tk{position:absolute;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;display:grid;place-items:center;font-size:32px;transition:left .08s linear}
#tkKid{background:#fff;border:3px solid var(--kc,#1F2F6B);overflow:hidden;z-index:2}
#tkKid canvas{width:42px;height:42px;display:block}
#tkDog{z-index:1}
#tkBone{left:calc(100% - 28px);font-size:34px}
#sprint{position:absolute;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.94);border-radius:999px;padding:8px 16px;box-shadow:0 5px 0 rgba(36,50,79,.16);pointer-events:none;font:400 18px/1 var(--display);color:var(--ink);white-space:nowrap}
#sprint .bar{width:110px;height:14px;border-radius:8px;background:#E8EDF5;overflow:hidden}
#sprint .bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FFB020,#FF5A36);border-radius:inherit}
#sprint.on{background:#FFF1C2}
#chaseTip{position:absolute;z-index:5;left:50%;top:40%;transform:translateX(-50%);font:400 clamp(24px,4vw,40px)/1.15 var(--display);color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-align:center;pointer-events:none;white-space:nowrap}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.scroll{overflow-y:auto;touch-action:pan-y;justify-content:flex-start;-webkit-overflow-scrolling:touch}
.scroll>.inner{margin-block:auto}
.inner{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vh,18px);width:min(980px,100%)}
.logo{font:400 clamp(44px,8.6vw,104px)/.9 var(--display);color:#fff;letter-spacing:.01em;text-wrap:balance;
  -webkit-text-stroke:12px var(--navy);paint-order:stroke fill;text-shadow:0 9px 0 #0F1A45,0 20px 34px rgba(15,26,69,.3);transform:rotate(-2deg)}
.logo em{font-style:normal;color:#FFD85A}
.pickline{font:400 clamp(20px,3vw,30px)/1 var(--display);color:var(--navy);background:rgba(255,255,255,.9);padding:9px 20px;border-radius:999px;box-shadow:0 5px 0 rgba(36,50,79,.15)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,22px);width:100%}
.kcard{position:relative;background:rgba(255,255,255,.96);border-radius:30px;padding:10px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 8px 0 rgba(36,50,79,.14),0 18px 34px rgba(36,50,79,.18);border:5px solid transparent;transition:transform .25s cubic-bezier(.2,1.4,.4,1),border-color .2s}
.kcard canvas{width:100%;aspect-ratio:1/1.05;max-height:30vh;border-radius:22px;display:block;background:linear-gradient(180deg,#D8F0FF 0%,#EAF8FF 55%,#BFE6A8 56%,#A6DA8C 100%)}
.kcard .nm{font:400 clamp(26px,4vw,42px)/1 var(--display);color:var(--kc)}
.kcard .tg{font:700 clamp(12px,1.6vw,16px)/1 var(--round);letter-spacing:.14em;color:var(--ink-soft)}
.kcard.sel{border-color:var(--kc);transform:translateY(-8px) scale(1.03)}
.kcard.sel::after{content:"✓";position:absolute;top:-14px;right:-10px;width:40px;height:40px;border-radius:50%;background:var(--kc);color:#fff;display:grid;place-items:center;font:400 24px/1 var(--display);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.play{font:400 clamp(34px,6vw,64px)/1 var(--display);color:#fff;padding:20px 56px 24px;border-radius:40px;min-height:88px;
  background:linear-gradient(180deg,#FF9A5C,#FF6A3D 55%,#EC4B25);box-shadow:0 9px 0 #A8321A,0 20px 36px rgba(236,75,37,.4),inset 0 3px 0 rgba(255,255,255,.35);
  -webkit-text-stroke:3px #B53A1C;paint-order:stroke fill;animation:pulse 1.5s ease-in-out infinite}
.play:active{transform:translateY(7px);box-shadow:0 2px 0 #A8321A}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.05}}
.btn2{font:400 clamp(18px,2.6vw,26px)/1 var(--display);color:var(--navy);background:#fff;padding:16px 28px;border-radius:26px;min-height:64px;box-shadow:0 6px 0 rgba(36,50,79,.18),0 12px 22px rgba(36,50,79,.14)}
.btn2:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(36,50,79,.18)}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
#title{background:linear-gradient(180deg,rgba(142,211,255,.0) 0%,rgba(142,211,255,.15) 60%,rgba(80,160,70,.25) 100%)}
.champs{font:400 clamp(44px,8vw,96px)/.95 var(--display);color:#FFD85A;-webkit-text-stroke:11px #A8321A;paint-order:stroke fill;text-shadow:0 9px 0 #6E1E0E,0 18px 30px rgba(0,0,0,.25);transform:rotate(-2deg)}
#endCv{width:min(760px,100%);aspect-ratio:2/1;max-height:38vh;border-radius:30px;display:block;box-shadow:0 8px 0 rgba(36,50,79,.14),0 18px 34px rgba(36,50,79,.2)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(900px,100%)}
.st{background:rgba(255,255,255,.96);border-radius:22px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 6px 0 rgba(36,50,79,.12)}
.st b{font:400 clamp(28px,4.4vw,46px)/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.st span{font:700 clamp(10px,1.3vw,13px)/1.2 var(--round);letter-spacing:.1em;color:var(--ink-soft)}
.st.dog b{color:#8B4F22}
.dim{background:rgba(20,40,70,.45)}
.pcard{background:#fff;border-radius:32px;padding:26px 28px;display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:0 10px 0 rgba(36,50,79,.16)}
.pcard h2{margin:0;font:400 clamp(30px,5vw,48px)/1 var(--display);color:var(--navy)}
#wipe{position:absolute;inset:0;z-index:20;pointer-events:none;background:radial-gradient(circle at 50% 50%,#FFD85A 0 30%,#FFB53D 70%);clip-path:circle(0% at 50% 50%);transition:clip-path .42s cubic-bezier(.6,0,.4,1);display:grid;place-items:center;font-size:120px}
#wipe.on{clip-path:circle(75% at 50% 50%)}
@media (max-width:700px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .brow{gap:8px}.brow>div{min-width:44px}.brow b{font-size:22px}
  #nb{left:16px;right:16px;padding-right:16px}
}
@media (max-height:560px){
  .inner{gap:6px}
  .logo{font-size:clamp(30px,6vw,52px);-webkit-text-stroke-width:8px}
  .pickline{font-size:16px;padding:6px 14px}
  .kcard{padding:6px 6px 8px;border-radius:22px}
  .kcard canvas{max-height:25vh;aspect-ratio:auto;height:25vh}
  .kcard .nm{font-size:24px}
  .play{font-size:30px;padding:10px 36px 14px;min-height:58px}
  .champs{font-size:40px}
  #endCv{max-height:30vh}
  #board{transform:translateX(-50%) scale(.8);transform-origin:top center}
  .st b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){ .play,#tapHint{animation:none} }
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="board" hidden>
    <div class="bt">BACKYARD BASEBALL</div>
    <div class="brow">
      <div><span>INNING</span><b id="sbInn">1</b></div>
      <div><span>RUNS</span><b id="sbRuns">0</b></div>
      <div><span>OUTS</span><div class="dots" id="sbOuts"><i></i><i></i><i></i></div></div>
      <div><span>BASES</span>
        <svg id="sbBases" viewBox="0 0 40 28" aria-hidden="true">
          <rect id="b2" x="15" y="2" width="9" height="9" rx="1.5" transform="rotate(45 19.5 6.5)"/>
          <rect id="b3" x="4" y="13" width="9" height="9" rx="1.5" transform="rotate(45 8.5 17.5)"/>
          <rect id="b1" x="26" y="13" width="9" height="9" rx="1.5" transform="rotate(45 30.5 17.5)"/>
        </svg>
      </div>
    </div>
    <div class="srow">STRIKES <div class="dots s" id="sbStrikes"><i></i><i></i><i></i></div></div>
  </div>

  <div class="corner r" id="corner" hidden>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸</button>
  </div>

  <div id="chaseHud" hidden>
    <div class="ch-title">SAVE THE BALL!</div>
    <div class="track">
      <div class="tk" id="tkBone">🦴</div>
      <div class="tk" id="tkDog">🐶</div>
      <div class="tk" id="tkKid"><canvas id="tkCv" width="84" height="84"></canvas></div>
    </div>
  </div>
  <div id="sprint" hidden>⚡ HOLD TO SPRINT <div class="bar"><i id="sprintBar"></i></div></div>
  <div id="chaseTip" hidden>DRAG ← → TO DODGE<br>HOLD TO SPRINT!</div>

  <div id="tapHint" hidden>TAP ANYWHERE TO SWING!</div>

  <div id="nb">
    <canvas id="nbCv" width="280" height="340"></canvas>
    <div>
      <div class="nb-k">NOW BATTING</div>
      <div class="nb-n" id="nbName">REUBEN</div>
      <div class="nb-t" id="nbTag">#99</div>
    </div>
  </div>

  <div class="call" id="call"><div class="pre" id="callPre"></div><div class="w" id="callW"></div><div class="s" id="callS"></div></div>
  <div class="call" id="call2"><div class="w" id="call2W"></div></div>

  <div class="screen scroll" id="title">
    <div class="inner">
      <div class="logo">BACKYARD <em>BASEBALL</em></div>
      <div class="pickline">CHOOSE YOUR BATTER</div>
      <div class="cards">
        <button class="kcard" data-k="reuben" style="--kc:#1F2F6B"><canvas></canvas><div class="nm">REUBEN</div><div class="tg">#99 · AGE 9</div></button>
        <button class="kcard" data-k="jonah" style="--kc:#2F93D8"><canvas></canvas><div class="nm">JONAH</div><div class="tg">#10 · AGE 6</div></button>
        <button class="kcard" data-k="ellie" style="--kc:#E8559B"><canvas></canvas><div class="nm">ELLIE</div><div class="tg">PURPLE POWER · AGE 3</div></button>
      </div>
      <button class="play" id="playBtn">PLAY BALL!</button>
    </div>
    <div class="corner r"><button class="icon-btn" id="soundBtn" aria-label="Sound on or off">🔊</button></div>
  </div>

  <div class="screen dim" id="pause" hidden>
    <div class="pcard">
      <h2>TIME OUT!</h2>
      <div class="row">
        <button class="play" id="resumeBtn" style="animation:none">▶ PLAY</button>
        <button class="btn2" id="quitBtn">CHARACTER SELECT</button>
      </div>
      <button class="icon-btn" id="soundBtn2" aria-label="Sound on or off">🔊</button>
    </div>
  </div>

  <div class="screen scroll" id="end" hidden>
    <div class="inner">
      <div class="champs">BACKYARD CHAMPS!</div>
      <canvas id="endCv"></canvas>
      <div class="stats">
        <div class="st"><b id="stRuns">0</b><span>RUNS</span></div>
        <div class="st"><b id="stHits">0</b><span>HITS</span></div>
        <div class="st"><b id="stHr">0</b><span>HOME RUNS</span></div>
        <div class="st dog"><b id="stSaved">0</b><span>BALLS SAVED FROM DOG</span></div>
        <div class="st dog"><b id="stEaten">0</b><span>BALLS EATEN BY DOG</span></div>
      </div>
      <div class="row">
        <button class="play" id="againBtn">PLAY AGAIN</button>
        <button class="btn2" id="selectBtn">CHARACTER SELECT</button>
      </div>
    </div>
  </div>

  <div id="wipe">🐾</div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

function drawEyes(c, K, fx, ey, R, look, blink, exp, t) {
  const lx = look[0] * R * 0.07, ly = look[1] * R * 0.07;
  const eyes = [[fx - R * 0.3, 1], [fx + R * 0.42, 0.82]];
  for (const [ex, sc] of eyes) {
    const rx = R * 0.22 * sc, ry = R * 0.28;
    if (blink || exp === 'wail' || exp === 'happy') {
      c.beginPath(); c.lineCap = 'round'; c.lineWidth = R * 0.075; c.strokeStyle = '#3A2A2A';
      if (exp === 'wail') { c.moveTo(ex - rx, ey - ry * 0.4); c.lineTo(ex + rx * 0.6, ey); c.lineTo(ex - rx, ey + ry * 0.4); }
      else if (exp === 'happy') { c.arc(ex, ey + ry * 0.2, rx * 0.9, Math.PI * 1.1, Math.PI * 1.9); }
      else { c.arc(ex, ey, rx * 0.9, Math.PI * 0.1, Math.PI * 0.9); }
      c.stroke(); continue;
    }
    const wide = exp === 'O' ? 1.15 : 1;
    E(c, ex, ey, rx * wide, ry * wide); fs(c, '#FFFFFF', 'rgba(60,40,40,.35)', R * 0.04);
    c.save(); E(c, ex, ey, rx * wide, ry * wide); c.clip();
    C(c, ex + lx * sc, ey + ly, R * 0.17 * sc); c.fillStyle = K.iris; c.fill();
    C(c, ex + lx * sc, ey + ly, R * 0.1 * sc); c.fillStyle = '#1A1320'; c.fill();
    C(c, ex + lx * sc - R * 0.06, ey + ly - R * 0.08, R * 0.06); c.fillStyle = '#fff'; c.fill();
    if (exp === 'annoyed') { c.fillStyle = K.skin; c.fillRect(ex - rx * 1.2, ey - ry * 1.3, rx * 2.4, ry * 1.15); c.strokeStyle = '#3A2A2A'; c.lineWidth = R * 0.06; c.beginPath(); c.moveTo(ex - rx, ey - ry * 0.15); c.lineTo(ex + rx, ey - ry * 0.15); c.stroke(); }

  for (const [ex, sc, s] of [[fx - R * 0.3, 1, -1], [fx + R * 0.42, 0.82, 1]]) {

  }
}

  switch (exp) {

      c.beginPath(); c.moveTo(x - R * 0.34, y - R * 0.04); c.quadraticCurveTo(x, y + R * 0.5, x + R * 0.34, y - R * 0.04); c.closePath();

function addParticles(add) {

function renderChase() {

// ---------- title & end canvases ----------
const cards = [...document.querySelectorAll('.kcard canvas')];

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  let rdt = Math.min(0.05, (now - last) / 1000); last = now;
  if (window.__bb && window.__bb.speed) rdt *= window.__bb.speed;
  rt += rdt;
  if (slowUntil && rt > slowUntil) { timeScale = 1; slowUntil = 0; }
  if (!paused) update(rdt * timeScale, rdt);
  render();
  if (!$('#title').hidden) cards.forEach((cnv, i) => drawCard(cnv, ORDER[i], rt, ORDER[i] === saved.pick));
