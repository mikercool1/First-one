<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#152543">
<title>Fart Cave</title>
<script src="../rw-bridge.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
/* Cartoon cave: navy back wall, warm orange rock, lime-green gas, banana-yellow and bubblegum trim. */
:root {
  --bg: #152543; --ink: #FFF8E8; --dim: #BFD3F0; --yellow: #FFD23F; --pink: #FF5FA2; --lime: #9BE83C;
  --out: #2A1433; --panel: rgba(21,37,67,.9);
  --fun: "Lilita One", ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--fun);
  overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#game { position: fixed; inset: 0; overflow: hidden; background: var(--bg); }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* big chunky outlined text */
.pop { color: var(--yellow); -webkit-text-stroke: 3px var(--out); paint-order: stroke fill; letter-spacing: .03em; }

/* HUD */
#hud {
  position: absolute; z-index: 2; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  display: flex; align-items: baseline; gap: 18px; padding: 6px 20px 8px; border-radius: 999px;
  background: rgba(21,37,67,.55); border: 3px solid rgba(42,20,51,.8); pointer-events: none; white-space: nowrap;
}
#hud .dist { font-size: clamp(28px, 5.4vw, 46px); line-height: 1; text-shadow: 0 4px 0 var(--out); }
#hud .starCount { display: inline-flex; align-items: center; gap: 4px; align-self: center; font-size: clamp(22px, 4vw, 34px); line-height: 1;
  color: var(--yellow); -webkit-text-stroke: 3px var(--out); paint-order: stroke fill; }
#hud .starCount svg { width: 1em; height: 1em; fill: var(--yellow); stroke: var(--out); stroke-width: 1.6; stroke-linejoin: round; }
#hud .starCount.bump { animation: bump .35s cubic-bezier(.2,1.8,.4,1); }
@keyframes bump { 40% { transform: scale(1.35); } }
/* inside Rosenberg World the hub puts its close button top-left */
@media (max-width: 640px) { .rw-in-world #hud { left: auto; right: 12px; transform: none; max-width: calc(100% - 80px); gap: 10px; padding-inline: 14px; } }
#hud .best { font-size: clamp(16px, 2.6vw, 22px); color: var(--lime); -webkit-text-stroke: 2px var(--out); paint-order: stroke fill; }

/* NEW FART RECORD! and PFFFFFT! */
.shout {
  position: absolute; z-index: 3; left: 12px; right: 12px; text-align: center; pointer-events: none;
  font-size: clamp(40px, 10vw, 92px); line-height: 1; text-wrap: balance;
  text-shadow: 0 6px 0 var(--pink), 0 11px 0 var(--out);
}
#record { top: 24%; font-size: clamp(34px, 8vw, 72px); color: var(--lime); }
#pfft { top: 30%; transform: rotate(-6deg); color: #B8F55E; font-size: clamp(56px, 15vw, 140px); }
.shout.show { animation: boing .6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes boing { from { opacity: 0; transform: scale(.3) rotate(-14deg); } to { opacity: 1; } }
#pfft.show { animation: pfft .7s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pfft { from { opacity: 0; transform: scale(.2) rotate(8deg); } to { opacity: 1; transform: rotate(-6deg); } }

/* Screens */
.overlay {
  position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px);
}
#start { justify-content: space-between; }
.titleBlock { text-align: center; margin-top: 3vh; }
h1 {
  margin: 0; font-weight: 400; font-size: clamp(64px, 16vw, 150px); line-height: .9;
  color: var(--yellow); -webkit-text-stroke: 5px var(--out); paint-order: stroke fill;
  text-shadow: 0 7px 0 var(--pink), 0 14px 0 var(--out); transform: rotate(-3deg);
}
.sub {
  margin: 18px 0 0; font-size: clamp(22px, 5vw, 40px); color: var(--lime);
  -webkit-text-stroke: 3px var(--out); paint-order: stroke fill; text-shadow: 0 4px 0 var(--out);
}
.startBottom { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.hint {
  margin: 0; font-size: clamp(20px, 4vw, 30px); color: var(--ink); text-align: center;
  -webkit-text-stroke: 3px var(--out); paint-order: stroke fill; text-shadow: 0 3px 0 var(--out);
}
.bestLine { margin: 0; font-size: clamp(16px, 3vw, 22px); color: var(--dim); -webkit-text-stroke: 2px var(--out); paint-order: stroke fill; }
.btn {
  font: 400 clamp(30px, 6.5vw, 48px)/1 var(--fun); letter-spacing: .04em; color: #1E3A08; cursor: pointer;
  background: linear-gradient(#D2FF7E, #7FD62E); border: 5px solid var(--out); border-radius: 999px;
  padding: 22px 40px 26px; min-width: min(90vw, 420px);
  box-shadow: 0 9px 0 var(--out), 0 20px 40px rgba(155,232,60,.35), inset 0 -6px 0 rgba(0,0,0,.14);
  touch-action: manipulation; transition: transform .08s, opacity .25s;
  animation: throb 1.4s ease-in-out infinite;
}
.btn:active { transform: translateY(6px) scale(.98); box-shadow: 0 3px 0 var(--out); }
.btn:focus-visible { outline: 4px solid #fff; outline-offset: 4px; }
.btn.wait { visibility: hidden; opacity: 0; }
@keyframes throb { 50% { transform: scale(1.04); } }

#over { justify-content: center; background: rgba(12,20,40,.35); }
.card {
  width: min(100%, 480px); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding: 26px 22px 30px; border-radius: 34px; background: var(--panel); border: 5px solid var(--out);
  outline: 3px solid rgba(255,255,255,.14); outline-offset: -10px; box-shadow: 0 30px 80px rgba(0,0,0,.5);
}
.card.show { animation: rise .45s cubic-bezier(.2,1.3,.3,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.9); } to { opacity: 1; transform: none; } }
.card h2 { margin: 0 0 6px; font-weight: 400; font-size: clamp(40px, 9vw, 64px); line-height: 1; color: #FF8FB0;
  -webkit-text-stroke: 4px var(--out); paint-order: stroke fill; text-shadow: 0 5px 0 var(--out); transform: rotate(-2deg); }
.row { margin: 0; font-size: clamp(26px, 5.4vw, 38px); -webkit-text-stroke: 3px var(--out); paint-order: stroke fill; }
.row b { font-weight: 400; color: var(--yellow); }
.row.best b { color: var(--lime); }
.row.stars b { color: var(--yellow); }
.card .btn.back { margin-top: 4px; font-size: clamp(18px, 3.6vw, 24px); padding: 14px 22px 17px; animation: none;
  background: linear-gradient(#FFE27A, #F2B81E); color: #4A2A00; box-shadow: 0 6px 0 var(--out); }
#overRecord { margin: 2px 0 6px; font-size: clamp(24px, 5vw, 34px); color: var(--lime); -webkit-text-stroke: 3px var(--out); paint-order: stroke fill; text-shadow: 0 4px 0 var(--pink); }
.card .btn { margin-top: 14px; }

.mute {
  position: absolute; z-index: 6; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: 54px; height: 54px; padding: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
  background: var(--panel); border: 3px solid var(--out); color: var(--ink);
}
.mute svg { width: 26px; height: 26px; }
.mute[aria-pressed="true"] { color: #8394B4; }
@media (max-height: 520px) {
  .titleBlock { margin-top: 0; } .sub { margin-top: 10px; }
  .btn { padding: 16px 30px 20px; }
  .card { gap: 4px; padding: 16px 18px 20px; }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .shout.show, #pfft.show, .card.show { animation: none; }
}
</style>
</head>
<body>
<div id="game">
  <canvas id="c" aria-label="Fart Cave. Hold anywhere to fart up, let go to fall."></canvas>

  <div id="hud" hidden>
    <span class="dist pop" id="dist">DISTANCE: 0</span>
    <span class="best" id="best">BEST: 0</span>
    <span class="starCount" id="starHud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17l-5.9 3.3 1.3-6.6L2.5 9.1l6.6-.8z"/></svg><span id="starNum">0</span></span>
  </div>
  <div id="record" class="shout pop" hidden>NEW FART RECORD!</div>
  <div id="pfft" class="shout pop" hidden>PFFFFFT!</div>

  <section class="overlay" id="start">
    <div class="titleBlock">
      <h1>FART CAVE</h1>
      <p class="sub">HOW FAR CAN YOU FART?</p>
    </div>
    <div class="startBottom">
      <button type="button" class="btn" id="startBtn">START FARTING</button>
      <p class="hint">Hold to fart up. Let go to fall. Grab the stars!</p>
      <p class="bestLine" id="startBest" hidden></p>
    </div>
  </section>

  <section class="overlay" id="over" hidden>
    <div class="card" id="overCard">
      <h2>YOU CRASHED</h2>
      <p id="overRecord" hidden>NEW FART RECORD!</p>
      <p class="row">Distance: <b id="overDist">0</b></p>
      <p class="row best">Best: <b id="overBest">0</b></p>
      <p class="row stars">Stars: <b id="overStars">0</b></p>
      <button type="button" class="btn wait" id="againBtn">FART AGAIN</button>
      <button type="button" class="btn back wait" id="backBtn" data-rw-back hidden>BACK TO ROSENBERG WORLD</button>
    </div>
  </section>

  <button type="button" id="muteBtn" class="mute" aria-pressed="false" aria-label="Sound on">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 9h4l5-4v14l-5-4h-4z" fill="currentColor"/><g id="icoOn"><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g><g id="icoOff" style="display:none"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></g></svg>
  </button>
</div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const cv = $("c"), ctx = cv.getContext("2d");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
  const FONT = "'Lilita One', ui-rounded, 'Arial Rounded MT Bold', system-ui, sans-serif";

  // ---------- tuning (world units; the screen is always at least 600 tall and 700 wide) ----------
  const SEG = 20;                 // cave wall column spacing
  const UP = 1250, DOWN = 1000;   // fart lift and gravity, units/s^2
  const MAX_UP = 370, MAX_DOWN = 440;
  const GAP_MIN = 200;            // narrowest the cave ever gets
  const HS = 1.45;                // Fart Man drawing scale
  const STEP = 1 / 120;

  // how hard things are at a given distance: 0 at the start, creeping toward 1
  const difficulty = (x) => 1 - Math.exp(-Math.max(0, x) / 9000);
  const speedAt = (x) => 215 + 135 * (1 - Math.exp(-x / 16000));

  // ---------- state ----------
  let CW = 1, CH = 1, DPR = 1, S = 1, W = 700, H = 600;
  let state = "title";           // title | play | crash
  let stateT = 0, time = 0, camX = 0, speed = 0;
  let best = 0, dist = 0, recordShown = false, shake = 0, starsGot = 0;
  let cols = [], obs = [], gags = [], stars = [], parts = [], gen = null;
  const hero = { sx: 350, wx: 0, y: 300, vy: 0, ang: 0, cvx: 0, va: 0, hitTop: false };
  const held = new Set();
  let keyHeld = false, wasHolding = false;
  // each Rosenberg kid gets their own best
  const BRIDGE = window.RosenbergBridge || null;
  const BEST_KEY = "fartCaveBest" + (BRIDGE && BRIDGE.player ? "-" + BRIDGE.player : "");
  try { best = +localStorage.getItem(BEST_KEY) || 0; } catch (e) { best = 0; }

  // ---------- sizing ----------
  let bgGrad = null, ceilGrad = null, floorGrad = null;
  function resize() {
    const r = $("game").getBoundingClientRect();
    CW = Math.max(1, r.width); CH = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR);
    const oldH = H;
    S = Math.max(Math.min(CH / 600, CW / 700), CH / 1000);   // tall phones: don't let the cave get absurdly tall
    W = CW / S; H = CH / S;
    if (cols.length && Math.abs(oldH - H) > .5) {      // keep the cave, stretched to the new height
      const k = H / oldH;
      cols.forEach((c) => { c.top *= k; c.bot *= k; });
      obs.forEach((o) => { o.root *= k; o.tip *= k; if (o.y1 != null) { o.y1 *= k; o.y2 *= k; } });
      gags.forEach((g) => { g.y *= k; }); stars.forEach((st) => { st.y *= k; });
      hero.y *= k; if (gen) { gen.c0 *= k; gen.c1 *= k; }
    }
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, "#101C36"); bgGrad.addColorStop(.5, "#22406A"); bgGrad.addColorStop(1, "#101C36");
    ceilGrad = ctx.createLinearGradient(0, 0, 0, H * .5);
    ceilGrad.addColorStop(0, "#5A2620"); ceilGrad.addColorStop(1, "#D07A40");
    floorGrad = ctx.createLinearGradient(0, H, 0, H * .5);
    floorGrad.addColorStop(0, "#4E2020"); floorGrad.addColorStop(1, "#C87038");
  }

  // ---------- cave generation ----------
  const hash = (n) => { n = Math.imul(n ^ 0x5bd1e995, 2654435761) >>> 0; n ^= n >>> 15; return Math.imul(n, 2246822519) >>> 0; };

  function resetCave(withObstacles) {
    cols = []; obs = []; gags = []; stars = [];
    gen = { x: -SEG * 10, i: 0, c0: H / 2, c1: H / 2, legX: -SEG * 10, legLen: 700,
      nextObs: 750, nextGag: rand(500, 900), nextStar: 520, lastGag: "", lastObsX: -9999,
      sqX: 3500, sqLen: 0, obstacles: withObstacles, p1: rand(0, 9), p2: rand(0, 9), p3: rand(0, 9), p4: rand(0, 9) };
    genTo(W + 300);
  }

  function baseGap(x) {
    const g0 = Math.min(H * .84, H - 70);
    return GAP_MIN + (g0 - GAP_MIN) * (1 - difficulty(x));
  }

  function genTo(xMax) {
    while (gen.x < xMax) { gen.x += SEG; gen.i++; makeCol(gen.x, gen.i); }
  }

  function makeCol(x, i) {
    const d = difficulty(x);
    let g = baseGap(x);
    // now and then a squeeze: the cave pinches in for a stretch
    if (x > gen.sqX + gen.sqLen) {
      if (gen.sqLen) gen.sqX = x + rand(2600, 4600) - 1400 * d;
      gen.sqLen = d > .12 ? rand(500, 900) : 0;
    }
    if (gen.sqLen && x > gen.sqX) g = Math.max(GAP_MIN, g * (1 - (.18 + .2 * d) * Math.sin(Math.PI * (x - gen.sqX) / gen.sqLen)));
    // the passage drifts up and down, smoothly, a bit more as it gets harder
    if (x >= gen.legX + gen.legLen) {
      gen.c0 = gen.c1; gen.legX = x; gen.legLen = rand(380, 820);
      const wander = Math.max(0, Math.min(300, H / 2 - g / 2 - 30));
      const move = (.28 + .5 * d) * gen.legLen / 1.6;
      gen.c1 = clamp(gen.c0 + rand(-1, 1) * move, H / 2 - wander, H / 2 + wander);
    }
    let c = gen.c0 + (gen.c1 - gen.c0) * smooth((x - gen.legX) / gen.legLen);
    c = clamp(c, g / 2 + 22, H - g / 2 - 22);
    const bump = (a, b, q) => Math.max(0, 6 + 7 * Math.sin(x * .021 + a) + 4 * Math.sin(x * .057 + b) + (hash(i + q) % 100) / 100 * 4);
    const col = { x, i, top: c - g / 2 + bump(gen.p1, gen.p2, 0), bot: c + g / 2 - bump(gen.p3, gen.p4, 777), h: hash(i) };
    cols.push(col);
    if (gen.obstacles && x >= gen.nextObs) makeObstacle(col, d);
    if (x >= gen.nextGag) makeGag(col);
    if (gen.obstacles && x >= gen.nextStar) makeStar(col);
  }

  // gold stars to grab, always in open air: never next to an obstacle
  function makeStar(col) {
    const x = col.x;
    if (obs.some((o) => Math.abs(o.x - x) < 130)) { gen.nextStar = x + 60; return; }
    gen.nextStar = x + rand(700, 1250);
    gen.nextObs = Math.max(gen.nextObs, x + 140);
    const room = col.bot - col.top, m = Math.min(70, room * .3);
    stars.push({ x, y: col.top + m + Math.random() * (room - 2 * m), got: false, ph: rand(0, 6) });
  }

  function makeObstacle(col, d) {
    const x = col.x, top = col.top, bot = col.bot, room = bot - top;
    const clear = 165 - 40 * d;                      // guaranteed open space next to every obstacle
    gen.nextObs = x + (980 - 580 * d) * rand(.85, 1.25);
    gen.lastObsX = x;
    const kinds = ["down", "up"];
    if (d > .12) kinds.push("block");
    if (d > .3) kinds.push("pair", "block");
    let kind = pick(kinds);
    const w = rand(46, 72);
    const maxLen = room - clear - 16;
    if (maxLen < 30) return;
    if (kind === "block") {
      const hgt = Math.min(rand(.28, .42) * room, room - clear - 60);
      if (hgt < 50) kind = pick(["down", "up"]);
      else {
        const openAbove = Math.random() < .5;
        const slack = Math.max(0, room - hgt - clear - 40);
        const y1 = openAbove ? top + clear + rand(0, slack) : top + 20 + rand(0, slack);
        obs.push({ kind, x, w: rand(44, 60), y1, y2: y1 + hgt, root: 0, tip: 0, seed: col.h });
        return;
      }
    }
    if (kind === "pair") {
      const win = clear + 20, y = top + 30 + rand(0, Math.max(0, room - 60 - win));
      obs.push({ kind: "down", x, w, root: top - 40, tip: y, seed: col.h });
      obs.push({ kind: "up", x: x + rand(-8, 8), w, root: bot + 40, tip: y + win, seed: col.h >>> 3 });
      return;
    }
    const len = Math.min(rand(.3, .6) * room, maxLen);
    if (kind === "down") obs.push({ kind, x, w, root: top - 40, tip: top + len, seed: col.h });
    else obs.push({ kind, x, w, root: bot + 40, tip: bot - len, seed: col.h });
  }

  const GAGS = ["mole", "skeleton", "sign", "bat", "painting"];
  function makeGag(col) {
    gen.nextGag = col.x + rand(1300, 2400);
    let type = pick(GAGS.filter((g) => g !== gen.lastGag));
    // things standing on the floor keep well away from obstacles so nobody mistakes them for one
    if (type !== "painting" && type !== "bat") {
      if (col.x - gen.lastObsX < 240) type = pick(["painting", "bat"]);
      else gen.nextObs = Math.max(gen.nextObs, col.x + 260);
    }
    gen.lastGag = type;
    const g = { type, x: col.x, y: type === "bat" ? col.top : type === "painting" ? (col.top + col.bot) / 2 : col.bot, fled: false, vx: 0, vy: 0, t: 0 };
    gags.push(g);
  }

  function wallAt(x) {
    const f = (x - cols[0].x) / SEG;
    let k = Math.floor(f);
    k = clamp(k, 0, cols.length - 2);
    const t = clamp(f - k, 0, 1), a = cols[k], b = cols[k + 1];
    return [a.top + (b.top - a.top) * t, a.bot + (b.bot - a.bot) * t];
  }

  function trimWorld() {
    while (cols.length > 3 && cols[1].x < camX - 80) cols.shift();
    obs = obs.filter((o) => o.x + o.w > camX - 80);
    gags = gags.filter((g) => g.x > camX - 140 && g.x < camX + W + 600);
    stars = stars.filter((st) => st.x > camX - 80);
  }

  // ---------- Fart Man hitbox (local units, facing right, before HS) ----------
  const HITBOX = [];
  for (let k = 0; k < 12; k++) { const a = k / 12 * Math.PI * 2; HITBOX.push({ x: -2 + Math.cos(a) * 18, y: 1 + Math.sin(a) * 9.5 }); }
  for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2; HITBOX.push({ x: 22 + Math.cos(a) * 8.5, y: -13 + Math.sin(a) * 8.5 }); }
  function toWorld(p, x, y, a) {
    const c = Math.cos(a), s = Math.sin(a), px = p.x * HS, py = p.y * HS;
    return { x: x + px * c - py * s, y: y + px * s + py * c };
  }

  // ---------- input: hold anywhere ----------
  const isButton = (e) => e.target && e.target.closest && e.target.closest("button");
  window.addEventListener("pointerdown", (e) => { held.add(e.pointerId); if (!isButton(e) && e.cancelable) e.preventDefault(); });
  const lift = (e) => held.delete(e.pointerId);
  window.addEventListener("pointerup", lift);
  window.addEventListener("pointercancel", lift);
  window.addEventListener("touchend", (e) => { if (!e.touches || e.touches.length === 0) held.clear(); });
  const releaseAll = () => { held.clear(); keyHeld = false; };
  window.addEventListener("blur", releaseAll);
  document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });
  const block = (e) => { if (!isButton(e) && e.cancelable) e.preventDefault(); };
  document.addEventListener("touchstart", block, { passive: false });
  document.addEventListener("touchmove", (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
  document.addEventListener("gesturestart", block, { passive: false });
  document.addEventListener("dblclick", block, { passive: false });

    const s = dist + "|" + best;
    if (s === lastHud) return;
    lastHud = s;
    $("dist").textContent = "DISTANCE: " + dist.toLocaleString("en-US");
    $("best").textContent = "BEST: " + Math.max(best, dist).toLocaleString("en-US");
  }

  // ---------- sound (synthesized; unlocked on the first tap) ----------
  const MUTE_KEY = "fartCaveMuted";
  let ac = null, master = null, noiseBuf = null, muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) { muted = false; }
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) { /* ignore */ }
  function audio() {
    if (!ac) {
      try {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        master = ac.createGain(); master.gain.value = muted ? 0 : .9; master.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
        const ch = noiseBuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      } catch (e) { ac = null; }
    }
    return ac;
  }
  function unlockAudio() {
    const a = audio(); if (!a) return;
    try {
      if (a.state !== "running") a.resume();
      const s = a.createBufferSource(); s.buffer = a.createBuffer(1, 1, 22050); s.connect(a.destination); s.start(0);
    } catch (e) { /* ignore */ }
  }
  ["pointerdown", "touchend", "keydown", "click"].forEach((ev) => window.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
  function tone(f, d, type, v, delay, slide) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v || .1, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(master); o.start(t); o.stop(t + d + .05);
  }
  function burst(d, v, freq, type, delay) {
    const a = audio(); if (!a) return;
    const t = a.currentTime + (delay || 0), s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = noiseBuf; f.type = type || "lowpass"; f.frequency.value = freq || 800;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + d + .05);
  }
  function setMuted(m) {
    muted = m;
    try { localStorage.setItem(MUTE_KEY, m ? "1" : "0"); } catch (e) { /* ignore */ }
    if (master) master.gain.setTargetAtTime(m ? 0 : .9, ac.currentTime, .02);
    const b = $("muteBtn");
    b.setAttribute("aria-pressed", m ? "true" : "false");
    b.setAttribute("aria-label", m ? "Sound off" : "Sound on");
    $("icoOn").style.display = m ? "none" : ""; $("icoOff").style.display = m ? "" : "none";
  }
  $("muteBtn").addEventListener("click", (e) => { e.stopPropagation(); setMuted(!muted); });

  // the fart engine: a wobbly buzzing sawtooth with lip flutter, faded in while you hold
  let engine = null;
  function engineNodes() {
    const a = audio(); if (!a) return null;
    if (engine) return engine;
    const osc = a.createOscillator(); osc.type = "sawtooth"; osc.frequency.value = 90;
    const wob = a.createOscillator(); wob.frequency.value = 6.5;
    const wobG = a.createGain(); wobG.gain.value = 14; wob.connect(wobG).connect(osc.frequency);
    const flut = a.createOscillator(); flut.type = "square"; flut.frequency.value = 26;
    const flutG = a.createGain(); flutG.gain.value = .45;
    const amp = a.createGain(); amp.gain.value = .55; flut.connect(flutG).connect(amp.gain);
    const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 700; lp.Q.value = 6;
    const air = a.createBufferSource(); air.buffer = noiseBuf; air.loop = true;
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 380; bp.Q.value = 1.2;
    const airG = a.createGain(); airG.gain.value = .35;
    const g = a.createGain(); g.gain.value = 0;
    osc.connect(amp).connect(lp).connect(g); air.connect(bp).connect(airG).connect(g); g.connect(master);
    osc.start(); wob.start(); flut.start(); air.start();
    engine = { g, osc, flut, lp, on: false };
    return engine;
  }
  function soundTick() {
    const want = state === "play" && holding();
    if (!want && (!engine || !engine.on)) return;
    const e = engineNodes(); if (!e) return;
    const t = ac.currentTime;
    if (want !== e.on) {
      e.on = want;
      e.g.gain.cancelScheduledValues(t);
      if (want) {
        e.g.gain.setValueAtTime(0, t); e.g.gain.linearRampToValueAtTime(.5, t + .03); e.g.gain.setTargetAtTime(.34, t + .05, .1);
        e.osc.frequency.cancelScheduledValues(t);
        e.osc.frequency.setValueAtTime(150 + Math.random() * 40, t); e.osc.frequency.setTargetAtTime(80 + Math.random() * 25, t, .09);
        burst(.1, .25, 600, "bandpass");
      } else {
        e.g.gain.setTargetAtTime(0, t, .02);
      }
    }
  }
  const sfx = {
    toot: () => {
      const e = engine; if (!e || !ac || !e.on) return;
      const t = ac.currentTime, f = 70 + Math.random() * 60;
      e.osc.frequency.setTargetAtTime(f * 1.6, t, .02); e.osc.frequency.setTargetAtTime(f, t + .08, .08);
      e.flut.frequency.setTargetAtTime(18 + Math.random() * 20, t, .05);
      e.lp.frequency.setTargetAtTime(500 + Math.random() * 500, t, .05);
    },
    start: () => { tone(523, .1, "square", .06); tone(659, .1, "square", .06, .09); tone(784, .16, "square", .06, .18); },
    crash: () => {
      // PFFFFFT: a long deflating raspberry, then a boing and a sad trombone
      const a = audio(); if (!a) return;
      const t = a.currentTime, o = a.createOscillator(), fl = a.createOscillator(), flG = a.createGain(), amp = a.createGain(), g = a.createGain(), lp = a.createBiquadFilter();
      o.type = "sawtooth"; o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(55, t + .9);
      fl.type = "square"; fl.frequency.setValueAtTime(34, t); fl.frequency.linearRampToValueAtTime(14, t + .9);
      flG.gain.value = .5; amp.gain.value = .5; fl.connect(flG).connect(amp.gain);
      lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = 4;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.5, t + .03); g.gain.setValueAtTime(.45, t + .6); g.gain.exponentialRampToValueAtTime(.0001, t + .95);
      o.connect(amp).connect(lp).connect(g).connect(master);
      o.start(t); fl.start(t); o.stop(t + 1); fl.stop(t + 1);
      burst(.9, .22, 500, "bandpass");
      tone(160, .45, "sine", .2, .15, 2.2);                                           // boing
      [294, 277, 262, 247].forEach((f, i) => tone(f, i === 3 ? .7 : .28, "triangle", .08, 1.0 + i * .3, i === 3 ? .94 : 1));
    },
    record: () => { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, .18, "square", .06, i * .08)); tone(180, .3, "sawtooth", .1, .45, 1.6); },
    star: () => { [988, 1319, 1568].forEach((f, i) => tone(f, .14, "triangle", .08, i * .06)); tone(2093, .25, "sine", .05, .18); },
    eek: () => { tone(2400, .06, "sine", .04); tone(2900, .06, "sine", .04, .08); },
  };

  // ---------- main loop ----------
  let prev = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(.05, Math.max(0, (now - prev) / 1000)); prev = now;
    acc += dt;
    try {
      while (acc >= STEP) { update(STEP); acc -= STEP; }
      render(); updateHUD(); soundTick();
    } catch (err) { console.error(err); acc = 0; }
    requestAnimationFrame(frame);
  }

  setMuted(muted);
  resize();
  if (best > 0) { const sb = $("startBest"); sb.textContent = "BEST: " + best.toLocaleString("en-US"); sb.hidden = false; }
  hero.sx = W * .5;
  resetCave(false);
  hero.y = H / 2;
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 200));
  requestAnimationFrame((t) => { prev = t; frame(t); });
})();
</script>
</body>
</html>
