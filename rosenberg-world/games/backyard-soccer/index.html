<!doctype html>
<html lang="en">
<head>
<script src="../rw-bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Backyard Soccer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --ink:#24324F; --ink-soft:#5B6887; --cream:#FFF9EF; --paper:#FFFFFF;
  --grass:#5CBF4B; --grass-d:#2F7D3A; --board:#1E5B3B; --board-edge:#C98B55;
  --sky:#8ED3FF; --navy:#1F2F6B; --red:#F0584F; --sun:#FFC83D; --orange:#FF7A45;
  --reuben:#1F2F6B; --jonah:#3FA3E6; --ellie:#E8559B;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --round:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#8ED3FF;color:var(--ink);font-family:var(--round);
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:fixed;inset:0;overflow:hidden;background:#8ED3FF}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:4px}

/* ---------- scoreboard ---------- */
#board{position:absolute;z-index:4;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);
  background:linear-gradient(180deg,#26704A,#1B5234);border:4px solid var(--board-edge);border-radius:22px;
  box-shadow:0 6px 0 #8E5A31,0 14px 26px rgba(20,40,30,.28),inset 0 2px 0 rgba(255,255,255,.18);
  padding:6px 16px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--cream);pointer-events:none;min-width:min(440px,92vw)}
.bt{font:400 13px/1 var(--display);letter-spacing:.16em;color:#FFE6A8;opacity:.95}
.brow{display:flex;gap:14px;align-items:flex-end}
.brow>div{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px}
.brow span{font:700 10px/1 var(--round);letter-spacing:.16em;color:rgba(255,249,239,.72)}
.brow b{font:400 26px/1 var(--display);color:#FFD85A;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:5px;height:26px;align-items:center}
.dots i{width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(255,249,239,.8);display:block}
.dots i.on{background:#FF6B5B;border-color:#FFB0A6;box-shadow:0 0 8px rgba(255,107,91,.8)}
.dots.s i{width:11px;height:11px;border-width:2px}
.dots.s i.on{background:#FFD85A;border-color:#FFF0B8;box-shadow:0 0 6px rgba(255,216,90,.8)}
.srow{display:flex;gap:6px;align-items:center;font:700 10px/1 var(--round);letter-spacing:.16em;color:rgba(255,249,239,.72)}
#sbBases{width:40px;height:28px;display:block}
#sbBases rect{fill:none;stroke:rgba(255,249,239,.85);stroke-width:2.4}
#sbBases rect.on{fill:#FFD85A;stroke:#FFF3C4}

.corner{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:8px}
.corner.r{right:16px}
.icon-btn{width:52px;height:52px;border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 5px 0 rgba(36,50,79,.18),0 10px 20px rgba(36,50,79,.15);font-size:22px;display:grid;place-items:center}
.icon-btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(36,50,79,.18)}

/* ---------- callouts ---------- */
.call{position:absolute;z-index:7;left:0;right:0;top:30%;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;text-align:center;padding-inline:16px;opacity:0}
.call .pre{font-size:clamp(46px,9vw,96px);line-height:1}
.call .w{font:400 clamp(44px,9.5vw,118px)/.95 var(--display);color:#fff;text-wrap:balance;
  -webkit-text-stroke:10px var(--c1,#F0584F);paint-order:stroke fill;text-shadow:0 8px 0 var(--c2,#A8322B),0 16px 30px rgba(0,0,0,.25)}
.call .s{font:400 clamp(22px,4vw,44px)/1 var(--display);color:#fff;-webkit-text-stroke:6px var(--c1,#F0584F);paint-order:stroke fill;text-shadow:0 5px 0 var(--c2,#A8322B)}
.call.show{animation:callIn var(--dur,1.4s) cubic-bezier(.2,1.4,.4,1) forwards}
.call.hold{animation:callHold .35s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes callIn{0%{opacity:0;transform:scale(.3) rotate(-6deg)}12%{opacity:1;transform:scale(1.12) rotate(2deg)}22%{transform:scale(1) rotate(0)}82%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.06) translateY(-24px)}}
@keyframes callHold{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.1)}100%{opacity:1;transform:scale(1)}}
.call.whack{--c1:#FF5A36;--c2:#A32C12}
.call.whack .w{font-size:clamp(50px,11vw,140px);color:#FFE45C}
.call.crush{--c1:#FF8A00;--c2:#A34E00}
.call.good{--c1:#2FA35A;--c2:#17643A}
.call.out{--c1:#5B6887;--c2:#2D3A57}
.call.strike{--c1:#F0584F;--c2:#9E2A24}
.call.foul{--c1:#E3A21A;--c2:#8E6206}
.call.top{top:calc(env(safe-area-inset-top,0px) + 6%)}
.call.top2{top:calc(env(safe-area-inset-top,0px) + 150px)}
.call.low{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 4%)}
.call.save{--c1:#2FA35A;--c2:#17643A}
.call.hr{--c1:#FF5A36;--c2:#A32C12}
.call.hr .w{color:#FFE45C;font-size:clamp(60px,13vw,160px)}
.call.ellie{--c1:#E8559B;--c2:#9C2360}
.call.ellie .w{color:#FFE9FF;font-size:clamp(52px,11vw,140px)}
.call.pool{--c1:#1E9BD7;--c2:#0E5B85}
.call.pool .w{color:#E6F8FF}
.call.fun{--c1:#1E9BD7;--c2:#0E5B85}
.call.inning{--c1:#1E5B3B;--c2:#0D3321}
#call2{top:52%}
#call2 .w{font-size:clamp(30px,6vw,64px);-webkit-text-stroke:7px var(--c1,#F0584F);text-shadow:0 5px 0 var(--c2,#A8322B)}

/* ---------- now batting ---------- */
#nb{position:absolute;z-index:6;left:clamp(16px,6vw,80px);top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:14px;
  background:rgba(255,255,255,.96);border-radius:32px;padding:14px 26px 14px 14px;box-shadow:0 8px 0 rgba(36,50,79,.14),0 20px 40px rgba(36,50,79,.22);opacity:0;pointer-events:none;border:5px solid var(--kc,#1F2F6B)}
#nb.show{animation:nbIn 1.7s cubic-bezier(.2,1.2,.4,1) forwards}
@keyframes nbIn{0%{opacity:0;transform:translate(-60px,-50%) scale(.8)}14%{opacity:1;transform:translate(0,-50%) scale(1.04)}24%{transform:translate(0,-50%) scale(1)}84%{opacity:1;transform:translate(0,-50%)}100%{opacity:0;transform:translate(40px,-50%)}}
#nbCv{width:clamp(90px,14vw,140px);height:clamp(110px,17vw,170px);border-radius:22px;background:linear-gradient(180deg,#D8F0FF,#BFE6A8);display:block}
.nb-k{font:700 14px/1 var(--round);letter-spacing:.24em;color:var(--ink-soft)}
.nb-n{font:400 clamp(48px,8vw,92px)/.95 var(--display);color:var(--kc,#1F2F6B);letter-spacing:.01em}
.nb-t{font:400 clamp(22px,3.4vw,34px)/1 var(--display);color:var(--sun);-webkit-text-stroke:5px var(--kc,#1F2F6B);paint-order:stroke fill}

#tapHint{position:absolute;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);
  font:400 clamp(20px,3vw,30px)/1 var(--display);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;pointer-events:none;animation:bob 1s ease-in-out infinite alternate;white-space:nowrap}
@keyframes bob{from{transform:translate(-50%,0)}to{transform:translate(-50%,-8px)}}

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
.scroll{overflow-y:auto;touch-action:pan-y;justify-content:flex-start;-webkit-overflow-scrolling:touch}
.scroll>.inner{margin-block:auto}
.inner{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.8vh,18px);width:min(980px,100%)}
.logo{font:400 clamp(44px,8.6vw,104px)/.9 var(--display);color:#fff;letter-spacing:.01em;text-wrap:balance;
  -webkit-text-stroke:12px var(--navy);paint-order:stroke fill;text-shadow:0 9px 0 #0F1A45,0 20px 34px rgba(15,26,69,.3);transform:rotate(-2deg)}
.logo em{font-style:normal;color:#FFD85A}
.pickline{font:400 clamp(20px,3vw,30px)/1 var(--display);color:var(--navy);background:rgba(255,255,255,.9);padding:9px 20px;border-radius:999px;box-shadow:0 5px 0 rgba(36,50,79,.15)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2vw,22px);width:100%}
.kcard{position:relative;background:rgba(255,255,255,.96);border-radius:30px;padding:10px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 8px 0 rgba(36,50,79,.14),0 18px 34px rgba(36,50,79,.18);border:5px solid transparent;transition:transform .25s cubic-bezier(.2,1.4,.4,1),border-color .2s}
.kcard canvas{width:100%;aspect-ratio:1/1.05;max-height:30vh;border-radius:22px;display:block;background:linear-gradient(180deg,#D8F0FF 0%,#EAF8FF 55%,#BFE6A8 56%,#A6DA8C 100%)}
.kcard .nm{font:400 clamp(26px,4vw,42px)/1 var(--display);color:var(--kc)}
.kcard .tg{font:700 clamp(12px,1.6vw,16px)/1 var(--round);letter-spacing:.14em;color:var(--ink-soft)}
.kcard.sel{border-color:var(--kc);transform:translateY(-8px) scale(1.03)}
.kcard.sel::after{content:"✓";position:absolute;top:-14px;right:-10px;width:40px;height:40px;border-radius:50%;background:var(--kc);color:#fff;display:grid;place-items:center;font:400 24px/1 var(--display);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.play{font:400 clamp(34px,6vw,64px)/1 var(--display);color:#fff;padding:20px 56px 24px;border-radius:40px;min-height:88px;
  background:linear-gradient(180deg,#FF9A5C,#FF6A3D 55%,#EC4B25);box-shadow:0 9px 0 #A8321A,0 20px 36px rgba(236,75,37,.4),inset 0 3px 0 rgba(255,255,255,.35);
  -webkit-text-stroke:3px #B53A1C;paint-order:stroke fill;animation:pulse 1.5s ease-in-out infinite}
.play:active{transform:translateY(7px);box-shadow:0 2px 0 #A8321A}
@keyframes pulse{0%,100%{scale:1}50%{scale:1.05}}
.btn2{font:400 clamp(18px,2.6vw,26px)/1 var(--display);color:var(--navy);background:#fff;padding:16px 28px;border-radius:26px;min-height:64px;box-shadow:0 6px 0 rgba(36,50,79,.18),0 12px 22px rgba(36,50,79,.14)}
.btn2:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(36,50,79,.18)}
.row{display:flex;gap:14px;align-items:center;justify-content:center;flex-wrap:wrap}
#title{background:linear-gradient(180deg,rgba(142,211,255,.0) 0%,rgba(142,211,255,.15) 60%,rgba(80,160,70,.25) 100%)}
.champs{font:400 clamp(44px,8vw,96px)/.95 var(--display);color:#FFD85A;-webkit-text-stroke:11px #A8321A;paint-order:stroke fill;text-shadow:0 9px 0 #6E1E0E,0 18px 30px rgba(0,0,0,.25);transform:rotate(-2deg)}
#endCv{width:min(760px,100%);aspect-ratio:2/1;max-height:38vh;border-radius:30px;display:block;box-shadow:0 8px 0 rgba(36,50,79,.14),0 18px 34px rgba(36,50,79,.2)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(900px,100%)}
.st{background:rgba(255,255,255,.96);border-radius:22px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 6px 0 rgba(36,50,79,.12)}
.st b{font:400 clamp(28px,4.4vw,46px)/1 var(--display);color:var(--navy);font-variant-numeric:tabular-nums}
.st span{font:700 clamp(10px,1.3vw,13px)/1.2 var(--round);letter-spacing:.1em;color:var(--ink-soft)}
.dim{background:rgba(20,40,70,.45)}
.pcard{background:#fff;border-radius:32px;padding:26px 28px;display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:0 10px 0 rgba(36,50,79,.16)}
.pcard h2{margin:0;font:400 clamp(30px,5vw,48px)/1 var(--display);color:var(--navy)}
@media (max-width:700px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .brow{gap:8px}.brow>div{min-width:44px}.brow b{font-size:22px}
  #nb{left:16px;right:16px;padding-right:16px}
}
@media (max-height:560px){
  .inner{gap:6px}
  .logo{font-size:clamp(30px,6vw,52px);-webkit-text-stroke-width:8px}
  .pickline{font-size:16px;padding:6px 14px}
  .kcard{padding:6px 6px 8px;border-radius:22px}
  .kcard canvas{max-height:25vh;aspect-ratio:auto;height:25vh}
  .kcard .nm{font-size:24px}
  .play{font-size:30px;padding:10px 36px 14px;min-height:58px}
  .champs{font-size:40px}
  #endCv{max-height:30vh}
  #board{transform:translateX(-50%) scale(.8);transform-origin:top center}
  .st b{font-size:24px}
}
@media (prefers-reduced-motion:reduce){ .play,#tapHint{animation:none} }

/* ---------- soccer additions ---------- */
#board{min-width:min(460px,94vw)}
.brow{gap:18px}
.brow>div{min-width:70px}
.brow span{white-space:nowrap}
.brow b.clk{color:#FFFFFF;font-size:24px;min-width:74px;text-align:center}
.brow b.clk.gold{color:#FFD85A;font-size:17px;letter-spacing:.04em}
#kickBtn{position:absolute;z-index:6;right:calc(env(safe-area-inset-right,0px) + 18px);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  width:clamp(104px,15vw,140px);height:clamp(104px,15vw,140px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#FFB27A,#FF6A3D 55%,#EC4B25);color:#fff;
  font:400 clamp(26px,4vw,38px)/1 var(--display);-webkit-text-stroke:3px #B53A1C;paint-order:stroke fill;
  box-shadow:0 8px 0 #A8321A,0 16px 30px rgba(236,75,37,.35),inset 0 3px 0 rgba(255,255,255,.35);touch-action:none}
#kickBtn.hit{transform:translateY(6px);box-shadow:0 2px 0 #A8321A}
#tapHint{bottom:calc(env(safe-area-inset-bottom,0px) + 30px);left:calc(50% - 40px)}
.picks{display:flex;align-items:center;gap:clamp(8px,2vw,22px);width:100%}
.pickcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.2vh,12px);min-width:0}
.pickcol .cards{gap:clamp(6px,1.2vw,14px)}
.pickcol .kcard{border-radius:22px;padding:6px 6px 10px;border-width:4px}
.pickcol .kcard canvas{max-height:22vh;border-radius:16px}
.pickcol .kcard .nm{font-size:clamp(18px,2.6vw,30px)}
.pickcol .kcard .tg{font-size:clamp(10px,1.3vw,13px)}
.pickcol .kcard.sel::after{width:32px;height:32px;font-size:18px;top:-12px;right:-8px}
.pickcol .kcard[disabled]{opacity:.38;cursor:default}
.pickline.p1{color:var(--navy)}
.pickline.cpu{color:#A8321A}
.vs{font:400 clamp(36px,6vw,70px)/1 var(--display);color:#FFD85A;-webkit-text-stroke:9px var(--navy);paint-order:stroke fill;transform:rotate(-6deg);flex:none}
.call.goal{--c1:#FF5A36;--c2:#A32C12}
.call.goal .w{color:#FFE45C;font-size:clamp(64px,14vw,170px)}
.call.go{--c1:#2FA35A;--c2:#17643A}
.call.go .w{font-size:clamp(60px,12vw,150px)}
.stats .st span{white-space:normal}
@media (max-width:600px){
  #board{min-width:0;left:12px;right:80px;transform:none;padding:6px 8px 8px}
  .brow{gap:6px}.brow>div{min-width:0}.brow span{font-size:9px;letter-spacing:.08em}
  .brow b.clk{min-width:60px;font-size:22px}.brow b.clk.gold{font-size:13px}
  #tapHint{left:16px;right:140px;transform:none;white-space:normal;text-align:left;font-size:19px;animation:none}
}
@media (max-width:700px) and (orientation:portrait){
  .picks{flex-direction:column}
  .vs{font-size:34px;-webkit-text-stroke-width:7px}
  .pickcol .kcard canvas{max-height:15vh}
}
@media (max-height:560px){
  .pickcol .kcard canvas{max-height:24vh}
  .pickcol .kcard .nm{font-size:18px}
  .pickcol .kcard .tg{display:none}
  .vs{font-size:30px;-webkit-text-stroke-width:6px}
  #kickBtn{width:92px;height:92px;font-size:24px}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div id="board" hidden>
    <div class="bt">BACKYARD SOCCER</div>
    <div class="brow">
      <div><span id="sbN1">P1 · REUBEN</span><b id="sbS1">0</b></div>
      <div><span>CLOCK</span><b id="sbClock" class="clk">2:00</b></div>
      <div><span id="sbN2">CPU · JONAH</span><b id="sbS2">0</b></div>
    </div>
  </div>

  <div class="corner r" id="corner" hidden>
    <button class="icon-btn" id="pauseBtn" aria-label="Pause">⏸</button>
  </div>

  <div id="tapHint" hidden>DRAG TO RUN · PRESS KICK!</div>
  <button id="kickBtn" hidden aria-label="Kick">KICK!</button>

  <div class="call" id="call"><div class="pre" id="callPre"></div><div class="w" id="callW"></div><div class="s" id="callS"></div></div>
  <div class="call" id="call2"><div class="w" id="call2W"></div></div>

  <div class="screen scroll" id="title">
    <div class="inner">
      <div class="logo">BACKYARD <em>SOCCER</em></div>
      <div class="picks">
        <div class="pickcol">
          <div class="pickline p1">PLAYER 1</div>
          <div class="cards" id="cardsP1">
            <button class="kcard" data-side="p1" data-k="reuben" style="--kc:#1F2F6B"><canvas></canvas><div class="nm">REUBEN</div><div class="tg">FASTEST</div></button>
            <button class="kcard" data-side="p1" data-k="jonah" style="--kc:#2F93D8"><canvas></canvas><div class="nm">JONAH</div><div class="tg">TRICKY</div></button>
            <button class="kcard" data-side="p1" data-k="ellie" style="--kc:#E8559B"><canvas></canvas><div class="nm">ELLIE</div><div class="tg">BIG FEET</div></button>
          </div>
        </div>
        <div class="vs">VS</div>
        <div class="pickcol">
          <div class="pickline cpu">CPU</div>
          <div class="cards" id="cardsCPU">
            <button class="kcard" data-side="cpu" data-k="reuben" style="--kc:#1F2F6B"><canvas></canvas><div class="nm">REUBEN</div><div class="tg">FASTEST</div></button>
            <button class="kcard" data-side="cpu" data-k="jonah" style="--kc:#2F93D8"><canvas></canvas><div class="nm">JONAH</div><div class="tg">TRICKY</div></button>
            <button class="kcard" data-side="cpu" data-k="ellie" style="--kc:#E8559B"><canvas></canvas><div class="nm">ELLIE</div><div class="tg">BIG FEET</div></button>
          </div>
        </div>
      </div>
      <button class="play" id="playBtn">KICK OFF!</button>
    </div>
    <div class="corner r"><button class="icon-btn" id="soundBtn" aria-label="Sound on or off">🔊</button></div>
  </div>

  <div class="screen dim" id="pause" hidden>
    <div class="pcard">
      <h2>TIME OUT!</h2>
      <div class="row">
        <button class="play" id="resumeBtn" style="animation:none">▶ PLAY</button>
        <button class="btn2" id="quitBtn">CHARACTER SELECT</button>
      </div>
      <button class="icon-btn" id="soundBtn2" aria-label="Sound on or off">🔊</button>
    </div>
  </div>

  <div class="screen scroll" id="end" hidden>
    <div class="inner">
      <div class="champs" id="endTitle">YOU WIN!</div>
      <canvas id="endCv"></canvas>
      <div class="stats">
        <div class="st"><b id="stS1">0</b><span id="stN1">REUBEN GOALS</span></div>
        <div class="st"><b id="stS2">0</b><span id="stN2">JONAH GOALS</span></div>
        <div class="st"><b id="stShots">0</b><span>YOUR KICKS</span></div>
        <div class="st"><b id="stPool">0</b><span>SPLASHES IN FRANK’S POOL</span></div>
      </div>
      <div class="row">
        <button class="play" id="againBtn">PLAY AGAIN</button>
        <button class="btn2" id="selectBtn">CHARACTER SELECT</button>

}

}

// ---------- game flow ----------

}
function resetBall(x, z, y = BR) { Object.assign(ball, { x, y, z, px: x, pz: z, vx: 0, vy: 0, vz: 0, state: 'live', trail: [], last: null, outT: 0, grillHit: false, overCalled: false, netHit: false }); }
function kickoff(first, taker) {

  Object.assign(CPU, { x: near(CPU), z: MZ, vx: 0, vz: 0, wx: 0, wz: 0, face: -1, kickT: -1, tx: null, tz: null, dream: 0 });
  resetBall(0, MZ);

}
function goalScored(s) {

  b.state = 'net'; b.netSide = s; phase = 'goal';

  setBoard();
  sfx.whack(); sfx.cheer(); confettiBurst(160); doShake(10); timeScale = 0.35; slowUntil = rt + 0.55;
  const own = b.last && b.last !== scorer;
  const sub = own ? 'OOPS! OWN GOAL!' : scorer.id === 'ellie' ? 'ELLIE!!!!!!!' : `${nameOf(scorer)} SCORES!`;
  call('GOAL!!!', sub, 'goal', 2.4);

  react[other.id] = { type: { reuben: 'hips', jonah: 'knees', ellie: 'point' }[other.id], until };
  react[benchKid()] = { type: scorer.id === 'ellie' ? 'lostMind' : 'armsUp', until };

function timeUp() {

// ---------- players ----------
function unproject(sx, sy) {
  const F = baseF(cam.f);
  const s = Math.max(F / 60, (sy - H * cam.hz) / cam.y);
  return { x: cam.x + (sx - W / 2) / s, z: cam.z + F / s };
}
function steerTo(k, tx, tz) {
  const ex = tx - k.x, ez = tz - k.z, d = Math.hypot(ex, ez);
  if (d > 0.18) { const sp = Math.min(1, d / 0.7); k.wx = ex / d * sp; k.wz = ez / d * sp; return false; }
  k.wx = 0; k.wz = 0; return true;
}
function updHuman(dt) {
  const k = P1;
  if (auto) { aiThink(k, CPU, dt); return; }
  k.wx = 0; k.wz = 0;
  if (phase !== 'play') return;
  if (ptr.id !== null) { const gp = unproject(ptr.sx, ptr.sy); k.tx = clamp(gp.x, -FX - 1.5, FX + 1.5); k.tz = clamp(gp.z, FZ0 - 1, FZ1 + 0.6); }
  const kx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), kz = (keys.up ? 1 : 0) - (keys.down ? 1 : 0);
  if (kx || kz) { const d = Math.hypot(kx, kz); k.wx = kx / d; k.wz = kz / d; k.tx = null; return; }
  if (k.tx !== null && steerTo(k, k.tx, k.tz) && ptr.id === null) k.tx = null;
}
// Simple kid-level AI: chase the ball from behind, dribble at goal, shoot when close, otherwise guard the goal.
function aiThink(k, opp, dt) {
  k.think -= dt;
  if (k.think > 0) return;
  k.think = k.human ? 0.08 : k.id === 'ellie' ? 0.24 : 0.14;
  k.wx = 0; k.wz = 0;
  if (phase !== 'play' || k.dream > 0) return;
  const b = ball, s = k.side, ownX = -s * FX, goalX = s * FX;
  let tx, tz;
  if (b.state === 'out') { tx = clamp(b.x, -FX + 1.5, FX - 1.5) - s * 0.8; tz = clamp(b.z, FZ0 + 1.2, FZ1 - 1.2); }
  else if (b.state !== 'live') { tx = -s * 2.5; tz = MZ; }
  else {
    const px = b.x + b.vx * 0.25, pz = b.z + b.vz * 0.25;
    const dm = Math.hypot(b.x - k.x, b.z - k.z), dh = Math.hypot(b.x - opp.x, b.z - opp.z);
    const chase = dm < dh + 1.6 || (b.x - ownX) * s < 3.5;
    if (chase) {
      let ux = px - goalX, uz = pz - MZ; const ul = Math.hypot(ux, uz) || 1; ux /= ul; uz /= ul;
      const ahead = (k.x - px) * s > -0.05;
      if (ahead && dm < 2.5) { tx = px + ux * 0.9; tz = pz + (k.z >= pz ? 1 : -1) * 0.95; }
      else if (dm > 0.8) { tx = px + ux * 0.4; tz = pz + uz * 0.4; }
      else { tx = goalX; tz = MZ + (k.z - MZ) * 0.3; }
      const dg = Math.hypot(goalX - b.x, MZ - b.z);
      const danger = (b.x - ownX) * s < 4;
      if (dm < REACH[k.id] * 0.9 && !ahead && (dg < (k.human ? 8.5 : 4 + 4 * CPU_EASE[P1.id]) || danger) && Math.random() < (k.human ? 0.6 : 0.5 * CPU_EASE[P1.id])) tryKick(k);
    } else {
      tx = lerp(b.x, ownX, 0.5); tz = lerp(b.z, MZ, 0.5);
    }
  }
  steerTo(k, tx, tz);
  if (!k.human && k.id === 'ellie' && b.state === 'live' && Math.random() < 0.025) { k.dream = rnd(0.8, 1.4); k.wx = k.wz = 0; wtext('LA LA LA!', k.x, HT.ellie + 0.5, k.z, '#FFB9CB', 0.45); }
}
function moveKid(k, dt) {
  const sp = SPD[k.id] * (k.human ? 1 : 0.92 * CPU_EASE[P1.id]);
  if (k.dream > 0) { k.dream -= dt; k.wx = k.wz = 0; }
  const a = Math.min(1, dt * 9);
  k.vx += (k.wx * sp - k.vx) * a; k.vz += (k.wz * sp * 0.85 - k.vz) * a;
  k.x = clamp(k.x + k.vx * dt, -FX - 1.8, FX + 1.8); k.z = clamp(k.z + k.vz * dt, FZ0 - 1.2, FZ1 + 0.8);
  const s = Math.hypot(k.vx, k.vz); k.speed = s;
  if (s > 0.4) { k.ph += dt * (k.id === 'ellie' ? 22 : 13) * Math.min(1, s / 3); if (Math.abs(k.vx) > 0.3 && k.kickT < 0) k.face = Math.sign(k.vx); }
  if (k.kickT >= 0) { k.kickT += dt; if (k.kickT > 0.38) k.kickT = -1; }
  k.kickCd -= dt; k.touchCd -= dt;

  const b = ball;
  if (phase !== 'play' || b.state !== 'live') return;
  const ex = b.x - k.x, ez = b.z - k.z, d = Math.hypot(ex, ez);
  if (d < 0.5 && b.y < 0.7 && k.touchCd <= 0) {

    if (s > 0.8) { ux = k.vx / s; uz = k.vz / s; } else { ux = ex / (d || 1); uz = ez / (d || 1); }

    b.vx = ux * bs; b.vz = uz * bs; b.vy = Math.max(b.vy, 0);
    b.x = k.x + ux * 0.5; b.z = k.z + uz * 0.5;
    b.last = k; k.touchCd = 0.1; sfx.tap();

}
function separate() {
  const dx = CPU.x - P1.x, dz = CPU.z - P1.z, d = Math.hypot(dx, dz);
  if (d < 0.55 && d > 1e-4) { const push = (0.55 - d) / 2; P1.x -= dx / d * push; P1.z -= dz / d * push; CPU.x += dx / d * push; CPU.z += dz / d * push; }
}
function tryKick(k) {

  const b = ball, ex = b.x - k.x, ez = b.z - k.z, d = Math.hypot(ex, ez);
  if (k.human) $('#tapHint').hidden = true;
  if (b.state !== 'live' || d > REACH[k.id] || b.y > 1.1) { sfx.swish(); return false; }
  if (k.human) GS.stats.shots++;
  b.last = k; b.trail = [];
  sfx.kick(); doShake(3); dust(b.x, b.z, 8, 0.7, '#E6F4D8');
  if (Math.random() < 1 / 14) { skyBall(k); return true; }
  const gx = k.side * FX, dist = Math.hypot(gx - b.x, MZ - b.z);
  const spread = 0.35 + dist * 0.07 + (k.human ? 0 : 0.35);
  const tz = rnd(GOAL.z0 + 0.35, GOAL.z1 - 0.35) + rnd(-spread, spread);
  const dx = gx + k.side * 0.6 - b.x, dz = tz - b.z, dl = Math.hypot(dx, dz) || 1;

  if (k.id === 'reuben' && Math.random() < 0.25) call2('BOOM!', 'crush', 1);
  if (k.id === 'ellie' && Math.random() < 0.3) wtext('ELLIE!', k.x, HT.ellie + 0.5, k.z, '#FFE9FF', 0.5);

}
function aimBall(tx, ty, tz, apex) {
  const b = ball, vy = Math.sqrt(2 * GRAV * Math.max(0.3, apex - b.y));
  const disc = vy * vy - 2 * GRAV * (ty - b.y);

  return t;
}
// Every so often a kick goes straight up and over the fence into Frank's yard.
function skyBall(k) {
  const pool = Math.random() < 0.55;
  const [tx, tz] = pool ? [rnd(-4, 4), rnd(35.5, 40.5)] : [pick([-1, 1]) * rnd(7.5, 12), rnd(33, 43)];
  aimBall(tx, 0, tz, rnd(11, 14));
  ball.state = 'sky'; ball.overCalled = false;
  sfx.whack(); call2('SKY BALL!', 'fun', 1.3);

  for (const id of ORDER) react[id] = { type: 'lookUp', until: gt + 2.6 };
}

  b.state = 'away'; b.vx = b.vy = b.vz = 0; crowdLook = false;

}
function frankThrow() {
  const b = ball; if (b.state !== 'away') return;
  Object.assign(b, { x: frank.x - 0.4, y: 2.4, z: frank.z - 0.5, trail: [] });

// ---------- ball physics ----------
function updBall(dt) {
  const b = ball;
  if (b.state === 'away') { b.y = inPool(b.x, b.z) ? 0.08 + Math.sin(rt * 2) * 0.04 : BR; return; }
  const px = b.px, pz = b.pz, wasAir = b.y > BR + 0.01;
  b.vy -= GRAV * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  const hs = Math.hypot(b.vx, b.vz);
  b.spin += hs * dt / BR * 0.5 * (b.vx >= 0 ? 1 : -1);
  if (hs > 9 || b.state === 'sky' || b.state === 'return') { b.trail.push([b.x, b.y, b.z]); if (b.trail.length > 12) b.trail.shift(); } else if (b.trail.length) b.trail.shift();
  // ground
  if (b.y < BR) {
    b.y = BR;
    if (b.vy < -1.6) { b.vy = -b.vy * 0.55; if (b.vy > 3) dust(b.x, b.z, 3, 0.5, '#E6F4D8'); } else b.vy = 0;
    if (wasAir && (b.state === 'sky' || b.state === 'return')) { if (b.state === 'sky') skyLand(); else { b.state = 'live'; if (b.z < FZ0 || b.z > FZ1 || Math.abs(b.x) > FX) outOfPlay(); } }
  }
  if (b.y <= BR + 0.001) { const f = Math.exp(-1.25 * dt); b.vx *= f; b.vz *= f; }
  // goal lines, posts, crossbar
  if (b.state === 'live' && phase === 'play') {
    for (const s of [-1, 1]) {
      const gx = s * FX;
      if (!((px - gx) * s < 0 && (b.x - gx) * s >= 0)) continue;
      const inMouth = b.z > GOAL.z0 && b.z < GOAL.z1;
      const post = Math.min(Math.abs(b.z - GOAL.z0), Math.abs(b.z - GOAL.z1)) < 0.2 && b.y < GOAL.h + 0.1;
      if (post) { b.x = gx - s * 0.05; b.vx = -b.vx * 0.55; b.vz += (b.z < MZ ? -1 : 1) * rnd(0.5, 2); sfx.clang(); call2('OFF THE POST!', 'fun', 1.2); continue; }
      if (inMouth && Math.abs(b.y - GOAL.h) < 0.16) { b.x = gx - s * 0.05; b.vx = -b.vx * 0.5; b.vy = Math.abs(b.vy) * 0.6 + 2; sfx.clang(); call2('CROSSBAR!', 'fun', 1.2); continue; }
      if (inMouth && b.y < GOAL.h) goalScored(s); else outOfPlay();
      break;
    }
    if (b.state === 'live' && (b.z < FZ0 - BR || b.z > FZ1 + BR)) outOfPlay();
  }
  // the net catches the ball
  if (b.state === 'net') {
    const s = b.netSide, back = s * (FX + GOAL.d);
    if ((b.x - back) * s > -BR) { b.x = back - s * BR; b.vx = -b.vx * 0.12; b.vz *= 0.4; if (!b.netHit) { b.netHit = true; netShake = { s, t: 0.8 }; sfx.net(); } }
    if (b.z < GOAL.z0 + BR || b.z > GOAL.z1 - BR) { b.z = clamp(b.z, GOAL.z0 + BR, GOAL.z1 - BR); b.vz *= -0.2; }
    if (b.y > GOAL.h - BR) { b.y = GOAL.h - BR; b.vy = -Math.abs(b.vy) * 0.2; }
  }
  // the yard: fences, grill, camera side
  if (b.state === 'out' || b.state === 'live') {
    if (pz < FENCE_Z - 0.15 && b.z >= FENCE_Z - 0.15 && b.vz > 0 && b.y < FENCE_H) { b.z = FENCE_Z - 0.16; b.vz *= -0.4; fenceShake = 0.6; sfx.thud(); }
    if (Math.abs(b.x) > FENCE_X - 0.2) { b.x = Math.sign(b.x) * (FENCE_X - 0.2); b.vx *= -0.4; }
    if (b.z < -2.5) { b.z = -2.5; b.vz = Math.abs(b.vz) * 0.4; }
    if (!b.grillHit && Math.hypot(b.x - GRILL.x, b.z - GRILL.z) < 0.75 && b.y < 1.4) { b.grillHit = true; grillLid = 1; b.vx *= -0.5; b.vz *= -0.5; b.vy = 5; sfx.clang(); call2('GRILL SHOT!', 'fun', 1.4); }
  }
  if (b.state === 'sky' && b.z > FENCE_Z + 1 && !b.overCalled) { b.overCalled = true; call2('INTO FRANK’S YARD…', 'pool', 1.4); }
  if (b.state === 'out') { b.outT += dt; if (b.outT > 1.4) restartBall(); }
}

function followCam() {
  const b = ball;
  if (b.state === 'away' || (b.state === 'sky' && b.z > 15) || (b.state === 'return' && b.z > 18)) { shot(SHOT.frank(), false, 2); return; }
  shot(SHOT.play(phase === 'kickoff' ? 0 : b.x * 0.8), false, 2.4);
}

// ---------- end screen ----------
function showEnd() {
  phase = 'end';

  const win = GS.s1 > GS.s2;
  if (window.RosenbergBridge) RosenbergBridge.report({ score: GS.s1, stars: win ? 3 : 1 });
  $('#endTitle').textContent = win ? 'YOU WIN!' : `${nameOf(CPU)} WINS!`;

function renderYard() {
  drawSky('yard');
  drawYardGround();
  drawSideFence(-FENCE_X); drawSideFence(FENCE_X);
  const D = [];
  const add = (z, fn) => D.push({ z, fn });
  add(52, () => billboard(0, 0, 52, () => drawHouse(g, 100, blinds, neighborPeek)));
  TREES.forEach((tr, i) => add(tr.z, () => { const p = P3(tr.x, 0, tr.z); if (!p) return; g.save(); g.translate(p.x + (treeShake.i === i && treeShake.t > 0 ? Math.sin(rt * 40) * p.s * 0.1 : 0), p.y); drawTree(g, p.s, rt, tr.seed, tr.sc); g.restore(); }));
  add(19, () => billboard(-17, 0, 19, () => drawShed(g, 100)));
  add(GRILL.z, () => billboard(GRILL.x, 0, GRILL.z, () => drawGrill(g, 100, rt, grillLid)));
  add(12.5, () => billboard(14.5, 0, 12.5, () => drawChair(g, 100)));
  add(13.2, () => billboard(19, 0, 13.2, () => drawChair(g, 100)));
  add(SPRINK.z, () => billboard(SPRINK.x, 0, SPRINK.z, () => drawSprinkler(g, 100, sprinklerOn > 0, rt)));
  for (const e of evergreens()) add(e.z, () => { const p = P3(e.x, 0, e.z); if (!p) return; g.save(); g.translate(p.x, p.y); drawEvergreen(g, p.s, e.h, rt, e.seed); g.restore(); });
  add(FENCE_Z, () => drawFence(FENCE_Z, -FENCE_X, FENCE_X, false));
  add(frank.z, () => billboard(frank.x, 0, frank.z, () => drawNeighbor(g, 'frank', { pose: frank.pose, ph: 0 }, rt), 0.6));
  add(39.2, () => billboard(2.4, 0.02 + Math.sin(rt * 1.6) * 0.03, 39.2, () => { E(g, 0, 0, 55, 16); fs(g, '#FF7EB6', '#D9488A', 3); E(g, 0, -2, 28, 8); g.fillStyle = '#5EC8F2'; g.fill(); }));
  // goals & corner flags
  for (const s of [-1, 1]) { add(GOAL.z1 + 0.01, () => drawGoal(s, 'back')); add(GOAL.z0 - 0.01, () => drawGoal(s, 'front')); }
  FLAGS.forEach(([x, z], i) => add(z + 0.02, () => billboard(x, 0, z, () => drawFlag(g, rt, i))));
  // neighbourhood kids watching from the far touchline
  const cheer = gt < crowdUntil;
  for (const n of NEIGH) add(n.z, () => billboard(n.x, 0, n.z, () => drawNeighbor(g, n.v, { pose: crowdLook ? 'lookUp' : cheer ? 'catch' : 'ready' }, rt), 0.5));
  if (inGame()) {
    // the kid sitting this one out cheers from the sideline
    const id = benchKid();
    if (id) add(SIDELINE.z, () => { const r = react[id]; const P = r && gt < r.until ? { pose: r.type, face: 1 } : { pose: 'idle', face: ball.x > SIDELINE.x ? 1 : -1, look: [0.4, 0] }; billboard(SIDELINE.x, 0, SIDELINE.z, () => drawKid(g, id, P, rt), 0.45); });
    for (const k of [P1, CPU]) add(k.z, () => { billboard(k.x, 0, k.z, () => drawKid(g, k.id, kidPose(k), rt), 0.45); });
  }
  // ball
  const b = ball;
  add(b.z, () => {
    if (b.state === 'away' && !inPool(b.x, b.z)) return;
    const pg = P3(b.x, 0, b.z); if (pg && b.state !== 'away') shadowAt(g, pg.x, pg.y, Math.max(3, pg.s * BR * 1.3), Math.max(1.5, pg.s * BR * 0.45), 0.35);
    if (b.trail.length > 2) {
      g.lineCap = 'round';
      for (let i = 1; i < b.trail.length; i++) { const a = P3(...b.trail[i - 1]), c2 = P3(...b.trail[i]); if (!a || !c2) continue; g.strokeStyle = `rgba(255,255,255,${i / b.trail.length * 0.5})`; g.lineWidth = Math.max(1, c2.s * 0.2 * i / b.trail.length); g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(c2.x, c2.y); g.stroke(); }
    }
    const p = P3(b.x, b.y, b.z); if (!p) return;
    drawBall(g, p.x, p.y, Math.max(4, p.s * BR), b.spin);
  });
  BUTTERFLIES.forEach((bf, i) => {
    const x = bf.bx + Math.sin(rt * 0.4 + bf.ph) * 4, y = bf.by + Math.sin(rt * 1.3 + bf.ph) * 0.4, z = bf.bz + Math.cos(rt * 0.3 + bf.ph) * 3;
    add(z, () => billboard(x, y, z, () => { const f = Math.abs(Math.sin(rt * 18 + i)); g.fillStyle = bf.col; E(g, -6 * f, 0, 7 * f, 5); g.fill(); E(g, 6 * f, 0, 7 * f, 5); g.fill(); g.fillStyle = '#333'; E(g, 0, 0, 1.5, 4); g.fill(); }));
  });
  addParticles(add);
  D.sort((a, b2) => b2.z - a.z);
  for (const d of D) d.fn();
  if (inGame()) for (const k of [CPU, P1]) drawTag(k);
}
function render() {
  g.save();
  if (shake > 0) g.translate(rnd(-shake, shake), rnd(-shake, shake));
  renderYard();
  g.restore();
  drawConfetti();
}

// ---------- title & end canvases ----------
const cards = [...document.querySelectorAll('.kcard canvas')];
function drawCard(cnv, id, t, sel, face) {
  const c = cnv.getContext('2d'), w = cnv.width, h = cnv.height;
  c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, w, h);
  const k = h / 175;
  shadowAt(c, w / 2, h * 0.9, w * 0.28, h * 0.05, 0.25);
  c.save(); c.translate(w / 2 - face * 10 * k, h * 0.9); c.scale(k, k);
  const u = (t * 0.8 + (face < 0 ? 0.5 : 0)) % 1.5;
  const P = sel ? (u < 1 ? { pose: 'kick', k: u, face } : { pose: 'idle', face }) : { pose: 'idle', face };
  drawKid(c, id, P, t);
  if (sel) { const bt = u < 0.45 ? 0 : (u - 0.45) * 3; const bx = face * (26 + bt * 90), by = -8 - Math.sin(Math.min(1, bt) * Math.PI) * 40; if (bt < 1.2) drawBall(c, bx, by, 9, bt * 6 * face); }
  c.restore();
}
function drawEnd(t) {
  const cnv = $('#endCv'), c = cnv.getContext('2d'), w = cnv.width, h = cnv.height;
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.fillStyle = lgr(c, 0, 0, 0, h, ['#7CC8FF', '#CDEEFF']); c.fillRect(0, 0, w, h);
  c.fillStyle = '#6CC456'; c.beginPath(); c.moveTo(0, h * 0.72); c.quadraticCurveTo(w / 2, h * 0.6, w, h * 0.72); c.lineTo(w, h); c.lineTo(0, h); c.fill();
  c.fillStyle = lgr(c, 0, h * 0.44, 0, h * 0.64, ['#B07A4C', '#8C5A33']); c.fillRect(0, h * 0.44, w, h * 0.2);
  c.strokeStyle = 'rgba(70,38,16,.45)'; c.lineWidth = 2; for (let x = 0; x < w; x += h * 0.05) { c.beginPath(); c.moveTo(x, h * 0.44); c.lineTo(x, h * 0.64); c.stroke(); }
  for (let x = -h * 0.08; x < w + h * 0.2; x += h * 0.2) { c.save(); c.translate(x, h * 0.68); drawEvergreen(c, h * 0.087, 4.5, t, x); c.restore(); }
  const k = h / 300, win = GS.s1 > GS.s2;
  const kids = [[P1.id, win ? (P1.id === 'ellie' ? 'lostMind' : 'jump') : 'wave', 0.3, 1], [CPU.id, win ? 'wave' : (CPU.id === 'ellie' ? 'lostMind' : 'jump'), 0.7, -1]];
  for (const [id, pose, fx, face] of kids) { shadowAt(c, w * fx, h * 0.95, 44 * k, 9 * k, 0.25); c.save(); c.translate(w * fx, h * 0.95); c.scale(k * 1.55, k * 1.55); drawKid(c, id, { pose, face }, t); c.restore(); }
  shadowAt(c, w * 0.5, h * 0.95, 16 * k, 4 * k, 0.25);
  drawBall(c, w * 0.5, h * 0.95 - 13 * k, 13 * k, t);
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  let rdt = Math.min(0.05, (now - last) / 1000); last = now;
  if (window.__bs && window.__bs.speed) rdt *= window.__bs.speed;
  rt += rdt;
  if (slowUntil && rt > slowUntil) { timeScale = 1; slowUntil = 0; }
  if (!paused) update(rdt * timeScale, rdt);
  render();
  if (!$('#title').hidden) cardEls.forEach((b, i) => drawCard(cards[i], b.dataset.k, rt, saved[b.dataset.side] === b.dataset.k, b.dataset.side === 'p1' ? 1 : -1));
  if (!$('#end').hidden) drawEnd(rt);
  requestAnimationFrame(frame);
}

// ---------- input ----------
const cardEls = [...document.querySelectorAll('.kcard')];
function isUI(e) { return e.target.closest && e.target.closest('button, .screen'); }
window.addEventListener('pointerdown', e => {
  audioInit();
  if (paused || isUI(e) || phase === 'title' || phase === 'end') return;
  if (ptr.id === null) { ptr.id = e.pointerId; ptr.sx = e.clientX; ptr.sy = e.clientY; }
}, { passive: true });
window.addEventListener('pointermove', e => { if (e.pointerId === ptr.id) { ptr.sx = e.clientX; ptr.sy = e.clientY; } }, { passive: true });
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, e => { if (e.pointerId === ptr.id) ptr.id = null; }, { passive: true });
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down' };
window.addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; if (inGame()) e.preventDefault(); }
  if ((e.key === ' ' || e.key === 'Enter' || e.key === 'k' || e.key === 'K') && phase === 'play' && !paused) { e.preventDefault(); kickPress(); }
  if (e.key === 'Escape' && inGame()) togglePause();
});
window.addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
function kickPress() {
  audioInit();
  tryKick(P1);
  const kb = $('#kickBtn'); kb.classList.add('hit'); clearTimeout(kickPress.t); kickPress.t = setTimeout(() => kb.classList.remove('hit'), 120);
}
$('#kickBtn').addEventListener('pointerdown', e => { e.preventDefault(); if (!paused) kickPress(); });
function togglePause() { paused = !paused; $('#pause').hidden = !paused; ptr.id = null; for (const k in keys) keys[k] = false; if (paused) audioInit(); }
cardEls.forEach(b => b.addEventListener('click', () => {
  if (b.disabled) return;
  audioInit();
  const side = b.dataset.side, id = b.dataset.k;
  saved[side] = id;
  if (side === 'p1' && saved.cpu === id) saved.cpu = ORDER.find(k => k !== id);
  persist(); selCards(); sfx.pop();
}));
function selCards() {
  cardEls.forEach(b => {
    b.classList.toggle('sel', saved[b.dataset.side] === b.dataset.k);
    b.disabled = b.dataset.side === 'cpu' && b.dataset.k === saved.p1;
  });
}
$('#playBtn').addEventListener('click', startGame);
$('#againBtn').addEventListener('click', startGame);
$('#selectBtn').addEventListener('click', goTitle);
$('#pauseBtn').addEventListener('click', togglePause);
$('#resumeBtn').addEventListener('click', togglePause);
$('#quitBtn').addEventListener('click', goTitle);
$('#soundBtn').addEventListener('click', toggleMute);
$('#soundBtn2').addEventListener('click', toggleMute);
document.addEventListener('touchmove', e => { if (!e.target.closest('.scroll')) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && !paused && inGame()) togglePause(); });
window.addEventListener('resize', () => { resize(); if (!$('#title').hidden) cards.forEach(sizeCanvas); if (!$('#end').hidden) sizeCanvas($('#endCv')); });

// test hooks (harmless for players)
window.__bs = {
  speed: 0,
  auto(v) { auto = v; },
  kick() { kickPress(); },
  sky() { const k = P1; Object.assign(ball, { x: k.x + 0.4, z: k.z, y: BR, state: 'live' }); skyBall(k); },
  clock(v) { GS.clock = v; },
  state() { return { phase, s1: GS.s1, s2: GS.s2, clock: GS.clock, golden: GS.golden, ball: { ...ball, last: undefined, trail: undefined }, p1: { id: P1.id, x: P1.x, z: P1.z }, cpu: { id: CPU.id, x: CPU.x, z: CPU.z }, stats: GS.stats }; },
};

resize();
setMuteIcons(); selCards();
goTitle();
requestAnimationFrame(frame);
})();
