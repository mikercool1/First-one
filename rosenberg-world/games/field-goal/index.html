<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../rw-bridge.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Split the Uprights</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@600;700&family=Figtree:wght@500;700;800&display=swap">
<style>
:root{
  --ink:#FFFFFF; --muted:rgba(255,255,255,.72); --glass:rgba(10,16,34,.58); --glass-line:rgba(255,255,255,.14);
  --gold:#FFD23F; --good:#4CE08A; --bad:#FF6B5E;
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0B1224;color:var(--ink);font:16px/1.4 var(--body)}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
#field{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 0;pointer-events:none}
.chip{background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:14px;padding:7px 12px;display:flex;flex-direction:column;align-items:center;min-width:64px}
.chip b{font:18px/1.1 var(--display);letter-spacing:.02em}
.chip small{font-size:10px;font-weight:800;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.wind{flex-direction:row;gap:9px;padding:7px 14px}
.wind .arrow{width:30px;height:30px;transition:transform .5s}
.wind .arrow.calm{opacity:.35}
.wind-txt{display:flex;flex-direction:column;align-items:flex-start}
.balls{display:flex;gap:3px;height:22px;align-items:center}
.balls svg{width:22px;height:14px}
.balls svg.gone{opacity:.22;filter:grayscale(1)}
.mute{pointer-events:auto;position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 14px);width:40px;height:40px;border-radius:50%;
  border:1px solid var(--glass-line);background:var(--glass);color:#fff;font-size:18px;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px)}

/* ---------- banners ---------- */
.banner{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;padding:0 16px}
.banner .big{font:clamp(40px,11vw,86px)/.95 var(--display);color:var(--gold);letter-spacing:.01em;
  -webkit-text-stroke:2px rgba(40,20,0,.55);text-shadow:0 6px 0 rgba(0,0,0,.28),0 0 40px rgba(255,210,63,.45)}
.banner.miss .big{color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.28),0 0 40px rgba(255,107,94,.55)}
.banner .sub{margin-top:10px;font-weight:800;font-size:clamp(15px,4vw,20px);letter-spacing:.04em;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.banner .kicker{font-size:12px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.banner.show{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
.banner.hide{animation:fade .35s ease both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fade{to{opacity:0;transform:translateY(-12px)}}

.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);pointer-events:none;
  background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:10px 18px;border-radius:999px;font-weight:800;letter-spacing:.06em;white-space:nowrap;animation:breathe 1.6s ease-in-out infinite}
.hint .step{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--gold);color:#241800;font:12px var(--display);margin-right:8px;vertical-align:-3px}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.05)}}

.bubble{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom) + 76px);display:flex;align-items:flex-end;gap:8px;pointer-events:none;max-width:calc(100% - 32px)}
.bubble .face{width:64px;height:64px;flex:none;border-radius:50%;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35);border:3px solid #fff}
.bubble .face{background:radial-gradient(circle at 50% 35%,#FFF6DA,#FFD9A0)}
.bubble .say{background:#fff;color:#16204A;font-weight:800;padding:10px 14px;border-radius:18px 18px 18px 4px;box-shadow:0 6px 18px rgba(0,0,0,.3);margin-bottom:20px}
.bubble.show{animation:up .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes up{from{transform:translateY(30px);opacity:0}}

.toast{position:fixed;left:50%;top:calc(24% + 150px);transform:translateX(-50%);font-weight:800;color:var(--good);text-shadow:0 2px 8px rgba(0,0,0,.6);pointer-events:none;animation:pop .5s both}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at center,rgba(5,10,25,.25),rgba(5,10,25,.65))}
.card{width:100%;max-width:460px;background:var(--glass);border:1px solid var(--glass-line);border-radius:26px;padding:22px 18px 18px;
  backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:0 30px 80px rgba(0,0,0,.45);text-align:center}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
h1{margin:6px 0 4px;font:clamp(34px,10vw,50px)/.95 var(--display);letter-spacing:.01em;text-shadow:0 4px 0 rgba(0,0,0,.25)}
h1 span{color:var(--gold)}
.lede{margin:0 0 14px;color:var(--muted);font-weight:500}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 12px}
.pick button{appearance:none;border:0;background:rgba(255,255,255,.06);border-radius:16px;padding:8px 2px 6px;color:#fff;cursor:pointer;
  font:800 12px var(--body);display:flex;flex-direction:column;align-items:center;gap:4px;outline:2px solid transparent;transition:transform .15s,outline-color .15s,background .15s}
.pick button canvas{width:100%;height:92px;display:block;border-radius:12px;background:radial-gradient(circle at 50% 70%,color-mix(in srgb,var(--kc) 45%,transparent),transparent 70%)}
.pick button span{font:700 15px "Fredoka",var(--body)}
.pick button small{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pick button[aria-pressed="true"]{outline-color:var(--gold);background:rgba(255,210,63,.16);transform:translateY(-3px)}
.pick button:focus-visible{outline-color:#fff}
.how{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:700;margin:2px 0 16px}
.how i{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:#241800;font:10px var(--display);margin-right:5px;vertical-align:-3px}
.go{appearance:none;border:0;width:100%;padding:16px;border-radius:16px;background:linear-gradient(180deg,#FFE070,#F2B91C);color:#2A1C00;
  font:20px var(--display);letter-spacing:.04em;cursor:pointer;box-shadow:0 6px 0 #B98300,0 12px 26px rgba(242,185,28,.35);transition:transform .08s}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #B98300}
.link{appearance:none;border:0;background:none;color:var(--muted);font:700 14px var(--body);margin-top:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.best{margin-top:12px;font-size:13px;color:var(--muted);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 16px}
.stats div{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 4px}
.stats b{display:block;font:24px var(--display)}
.stats small{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.over-face{width:92px;height:92px;margin:0 auto 6px;border-radius:50%;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.over-face{background:radial-gradient(circle at 50% 35%,#FFF6DA,#FFD9A0)}
.quote{font-weight:800;margin:4px 0 0}
</style>
</head>
<body>
<canvas id="field" aria-label="A football stadium seen from behind the kicker"></canvas>

<div class="hud" id="hud" hidden>
  <div class="chip"><small>Level</small><b id="hLevel">1</b></div>
  <div class="chip wind">
    <svg class="arrow" id="hArrow" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,.12)"/><path d="M7 16 H23 M17 9 L24 16 L17 23" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="wind-txt"><small>Wind</small><b id="hWind">Calm</b></div>
  </div>
  <div class="chip"><small id="hYdsLbl">Yards</small><b id="hYds">23</b><div class="balls" id="hBalls"></div></div>
</div>

<div class="banner" id="banner" hidden></div>
<div class="hint" id="hint" hidden></div>
<div class="bubble" id="bubble" hidden><div class="face" id="bFace"></div><div class="say" id="bSay"></div></div>
<button class="mute" id="mute" aria-label="Sound on" title="Sound">🔊</button>

<section class="screen" id="title">
  <div class="card">
    <div class="eyebrow">Rosenberg World</div>
    <h1>Split the <span>Uprights</span></h1>
    <p class="lede">Pick your kicker. Every field goal you make, the kick gets longer and the wind gets stronger.</p>
    <div class="pick" id="pick" role="group" aria-label="Choose your kicker"></div>
    <div class="how"><span><i>1</i>Tap to aim</span><span><i>2</i>Tap to kick</span><span>Watch the wind 🚩</span></div>
    <button class="go" id="start">Kick off</button>
    <div class="best" id="best"></div>
  </div>
</section>

<section class="screen" id="over" hidden>
  <div class="card">
    <div class="over-face" id="oFace"></div>
    <div class="eyebrow">Final whistle</div>
    <h1 id="oTitle">Level 7</h1>
    <p class="quote" id="oQuote"></p>
    <div class="stats">
      <div><b id="oMade">0</b><small>Made</small></div>
      <div><b id="oLong">0</b><small>Longest</small></div>
      <div><b id="oBest">0</b><small>Best level</small></div>
    </div>
    <button class="go" id="again">Kick again</button>
    <button class="link" id="switch">Switch kicker</button>
    <button class="link" data-rw-back hidden>Back to Rosenberg World</button>
  </div>
</section>

<script>window.RW = window.RW || {}; RW.util = RW.util || { seeded(seed) { let s = seed % 2147483647 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; } };</script>
<script src="../../js/art.js"></script>
<script src="game.js"></script>
</body>
</html>
