<!doctype html>
<html lang="en">
<head>
<script src="../rw-bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Max-Man</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* One deliberate look: a toddler's playmat at night. Same in light and dark. */
:root{
  --mat:#1B1E3D; --mat-2:#252A52; --ink:#FFF4E2; --muted:#B9B6D8; --line:#3A3F72;
  --tomato:#FF5B4A; --sun:#FFC73A; --grass:#3FC57E; --sky:#4DA9FF; --grape:#A07BFF; --cocoa:#8A5329;
  --display:"Chewy","Comic Sans MS",ui-rounded,system-ui,sans-serif;
  --body:"Baloo 2",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.rw-in-world header{padding-left:56px}
.rw-back{margin-top:8px;font-size:15px!important;padding:8px 18px!important;min-height:0!important;background:transparent!important;box-shadow:none!important;color:#FFD23F!important;text-decoration:underline}
html,body{height:100%}
body{margin:0;background:var(--mat);color:var(--ink);font:16px/1.4 var(--body);padding-inline:16px;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
.app{max-width:620px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-block:12px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font:400 clamp(30px,8vw,42px)/1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.logo span:nth-child(1){color:var(--sun)} .logo span:nth-child(2){color:var(--tomato)} .logo span:nth-child(3){color:var(--grass)}
.logo span:nth-child(4){color:var(--sky)} .logo span:nth-child(5){color:var(--grape)} .logo span:nth-child(6){color:var(--sun)}
.logo span:nth-child(7){color:var(--tomato)}
.logo span{display:inline-block}
.logo span:nth-child(odd){transform:rotate(-5deg) translateY(1px)} .logo span:nth-child(even){transform:rotate(4deg)}
.hud{display:flex;gap:6px;font-variant-numeric:tabular-nums}
.hud div{background:var(--mat-2);border:1.5px solid var(--line);border-radius:12px;padding:2px 10px 3px;text-align:center;min-width:66px}
.hud b{display:block;font:800 19px/1.15 var(--body)}
.hud small{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.sub{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
#room{flex:1;min-width:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lives{display:flex;gap:4px;align-items:center}
.lives canvas{width:22px;height:22px}
.btn-sm{font:700 13px var(--body);color:var(--ink);background:var(--mat-2);border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.btn-sm:focus-visible,.go:focus-visible,.pad button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
#game{display:block;border-radius:14px;box-shadow:0 0 0 3px var(--line),0 14px 40px rgba(0,0,0,.45)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:12px}
.card{background:rgba(27,30,61,.94);border:3px solid var(--sun);border-radius:22px;padding:18px 20px 20px;max-width:400px;width:100%;text-align:center;
  box-shadow:0 10px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px;align-items:center;max-height:100%;overflow:auto}
.card h2{font:400 clamp(30px,8vw,40px)/1 var(--display);margin:0;color:var(--sun);text-wrap:balance}
.card p{margin:0;max-width:34ch;color:var(--ink)}
.card .fine{font-size:13px;color:var(--muted)}
.cast{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;width:100%;text-align:left}
.cast div{display:flex;gap:8px;align-items:center;font-size:13.5px;line-height:1.15}
.cast canvas{width:34px;height:34px;flex:none}
.cast b{display:block;font-size:14.5px}
.go{font:400 26px/1 var(--display);color:var(--mat);background:var(--sun);border:0;border-radius:999px;padding:12px 30px 13px;cursor:pointer;
  box-shadow:0 5px 0 #C9901A;transition:transform .08s}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #C9901A}
.pad{display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,50px);gap:6px;justify-content:center;padding-bottom:4px}
.pad button{font:800 22px var(--body);color:var(--ink);background:var(--mat-2);border:2px solid var(--line);border-radius:14px;cursor:pointer;touch-action:none}
.pad button:active{background:var(--line)}
.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .down{grid-column:2;grid-row:2}.pad .right{grid-column:3;grid-row:2}
@media (pointer:coarse){.pad{display:grid}}
@media (prefers-reduced-motion:reduce){.go{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="logo" aria-label="Max-Man"><span>M</span><span>a</span><span>x</span><span>-</span><span>M</span><span>a</span><span>n</span></h1>
    <div class="hud">
      <div><small>Mess pts</small><b id="score">0</b></div>
      <div><small>Best</small><b id="best">0</b></div>
    </div>
  </header>
  <div class="sub">
    <div class="lives" id="lives" aria-label="Lives"></div>
    <span id="room">Room 1 · The Kitchen</span>
    <div style="display:flex;gap:6px">
      <button class="btn-sm" id="pauseBtn" type="button">Pause</button>
      <button class="btn-sm" id="muteBtn" type="button">Sound on</button>
    </div>
  </div>
  <main class="stage" id="stage">
    <canvas id="game" aria-label="Max-Man maze"></canvas>
    <div class="overlay" id="overlay">
      <div class="card">
        <h2 id="ovTitle">Max is hungry!</h2>
        <p id="ovText">Max is three and he eats EVERYTHING. Gobble every Cheerio in the house and grab a cookie to splat the grown-up stuff with mud.</p>
        <div class="cast" id="cast"></div>
        <button class="go" id="goBtn" type="button">Let's make a mess!</button>
        <button class="go rw-back" type="button" data-rw-back hidden>Back to Rosenberg World</button>
        <p class="fine" id="ovFine">Arrow keys or WASD to move · swipe on a phone · P pauses</p>
      </div>
    </div>
  </main>
  <nav class="pad" aria-label="Direction pad">
    <button class="up" data-d="up" type="button" aria-label="Up">▲</button>
    <button class="left" data-d="left" type="button" aria-label="Left">◀</button>
    <button class="down" data-d="down" type="button" aria-label="Down">▼</button>
    <button class="right" data-d="right" type="button" aria-label="Right">▶</button>
  </nav>
</div>

<script>
(() => {
'use strict';

// ---------- the house ----------
const MAP = [
'############################',
'#............##............#',
'#.####.#####.##.#####.####.#',
'#o####.#####.##.#####.####o#',
'#.####.#####.##.#####.####.#',
'#..........................#',
'#.####.##.########.##.####.#',
'#.####.##.########.##.####.#',
'#......##....##....##......#',
'######.##### ## #####.######',
'     #.##### ## #####.#     ',
'     #.##          ##.#     ',
'     #.## ###--### ##.#     ',
'######.## #      # ##.######',
'      .   #      #   .      ',
'######.## #      # ##.######',
'     #.## ######## ##.#     ',
'     #.##          ##.#     ',
'     #.## ######## ##.#     ',
'######.## ######## ##.######',
'#............##............#',
'#.####.#####.##.#####.####.#',
'#.####.#####.##.#####.####.#',
'#o..##.......  .......##..o#',
'###.##.##.########.##.##.###',
'###.##.##.########.##.##.###',
'#......##....##....##......#',
'#.##########.##.##########.#',
'#.##########.##.##########.#',
'#..........................#',
'############################'];
const W = 28, H = 31, TUNNEL_ROW = 14;

const ROOMS = [
  {name:'The Kitchen',     walls:['#FF5B4A','#FFC73A','#3FC57E','#4DA9FF','#A07BFF'], mat:'#1B1E3D'},
  {name:'The Living Room', walls:['#FF8A3D','#FF6FB5','#4DA9FF','#FFE066','#6EDDC5'], mat:'#221A3A'},
  {name:'The Backyard',    walls:['#3FC57E','#9BD94A','#8A5329','#FFC73A','#58B8FF'], mat:'#14261F'},
  {name:'The Bathtub',     walls:['#6EDDC5','#4DA9FF','#FFFFFF','#FF9EC7','#A0C4FF'], mat:'#102436'},
  {name:"Grandma's House", walls:['#FF9EC7','#C8A2FF','#FFD1A1','#9FE3B8','#FF8A80'], mat:'#2A1B2E'},
];

const DIRS = {up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0}};
const NONE = {x:0,y:0};

// ---------- silly things Max says ----------
const SAYS = {
  start:  ["Let's make a MESS!","Max is HUNGRY!","I'm a big boy! RAWR!","Snack time!!"],
  cookie: ["COOKIE POWER!!","Sugar rush! Wheee!","I'm a T-REX! RAWR!","Nom nom NOM!"],
  idle:   ["Toot! Hee hee!","Why? Why? WHY?","I'm FAST like a race car!","Look at me!","No nap!",
           "I'm not messy, YOU'RE messy!","Uh oh... spaghetti-o!","I need a snack!","Vroom vroom!",
           "I did it all by myself!","Boogers!","I'm a dinosaur!"],
  clear:  ["All gone! MORE please!","I ate EVERYTHING!","Tummy full! ...Dessert?"],
};

// ---------- the grown-up stuff ----------
const GHOSTS = [
  {key:'bath',  name:'Bath Time',  color:'#4DA9FF', corner:{x:25,y:-3}, start:{x:13,y:11}, dot:0,  sec:0,
   blurb:'Wants to scrub off all that mess.',
   caught:"Nooo! Not BATH TIME!", splat:"No bath! YOU take a bath!"},
  {key:'broc',  name:'Broccoli',   color:'#3FC57E', corner:{x:2,y:-3},  start:{x:13,y:14}, dot:0,  sec:1,
   blurb:'"Just one bite, Max."',
   caught:"Yucky! Do I HAVE to?", splat:"Ew, broccoli! Bleh!"},
  {key:'tidy',  name:'Tidy-Up',    color:'#FF6FB5', corner:{x:27,y:31}, start:{x:11,y:14}, dot:30, sec:5,
   blurb:'Puts every toy back. Every one.',
   caught:"But I wasn't DONE!", splat:"No cleaning! MESS!"},
  {key:'bed',   name:'Bedtime',    color:'#A07BFF', corner:{x:0,y:31},  start:{x:16,y:14}, dot:60, sec:10,
   blurb:'Sleepy, but never gives up.',
   caught:"*yawn*... five more minutes...", splat:"Not tired! NOT TIRED!"},
];

const BONUS = [
  {e:'🍝', pts:100,  say:'Spaghetti hair!'},
  {e:'🧃', pts:300,  say:'Juice! Spill it!'},
  {e:'🍦', pts:500,  say:'Ice cream face!'},
  {e:'🍕', pts:700,  say:'Pizza pizza!'},
  {e:'🧁', pts:1000, say:'Frosting fingers!'},
  {e:'🍫', pts:2000, say:'CHOCOLATE!!!'},
];

// ---------- elements ----------
const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d');
const stage = $('stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

// ---------- sound ----------
let audio = null, muted = store.get('maxman-muted') === '1';
function ac(){
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audio = null; } }
  if (audio && audio.state === 'suspended') audio.resume();
  return audio;
}
function tone(freq, dur, type='square', vol=.08, slideTo=null, delay=0){
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol=.2, freq=900, delay=0){
  if (muted) return; const a = ac(); if (!a) return;
  const t = a.currentTime + delay;
  const buf = a.createBuffer(1, Math.ceil(a.sampleRate * dur), a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = freq; g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
let wakaFlip = false, lastWaka = 0;
const sfx = {
  waka(){ const n = performance.now(); if (n - lastWaka < 110) return; lastWaka = n; wakaFlip = !wakaFlip; tone(wakaFlip ? 330 : 460, .08, 'triangle', .09, wakaFlip ? 460 : 330); },
  cookie(){ tone(200, .35, 'square', .06, 900); tone(300, .35, 'triangle', .06, 1200, .08); },
  splat(){ noise(.25, .35, 700); tone(500, .25, 'sine', .12, 90); tone(700, .12, 'triangle', .05, 1400, .18); },
  giggle(){ for (let i = 0; i < 6; i++) tone(620 + (i%2)*160 + i*25, .07, 'triangle', .07, null, i*.075); },
  toot(){ if (muted) return; const a = ac(); if (!a) return; const t = a.currentTime;
    const o = a.createOscillator(), l = a.createOscillator(), lg = a.createGain(), g = a.createGain();
    o.type='sawtooth'; o.frequency.setValueAtTime(95,t); o.frequency.linearRampToValueAtTime(70,t+.45);
    l.frequency.value = 28; lg.gain.value = 18; l.connect(lg).connect(o.frequency);
    g.gain.setValueAtTime(.001,t); g.gain.linearRampToValueAtTime(.09,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.connect(g).connect(a.destination); o.start(t); l.start(t); o.stop(t+.52); l.stop(t+.52); },
  death(){ tone(700, 1.0, 'sine', .1, 110); tone(350, .9, 'triangle', .06, 60, .1); },
  bonus(){ [523,659,784,1047].forEach((f,i) => tone(f, .12, 'square', .06, null, i*.07)); },
  start(){ [392,523,659,523,659,784].forEach((f,i) => tone(f, .16, 'square', .05, null, i*.14)); },
  clear(){ [523,659,784,1047,784,1047].forEach((f,i) => tone(f, .14, 'triangle', .08, null, i*.1)); },
  life(){ [660,880,1320].forEach((f,i) => tone(f, .12, 'square', .06, null, i*.09)); },
};

// ---------- drawing helpers ----------
function roundBlob(c, x, y, r){ c.beginPath(); c.arc(x, y, r, 0, Math.PI*2); c.fill(); }

// Max: a round, grinning, spaghetti-smeared three-year-old
function drawMax(c, x, y, r, face, mouth, t, opts={}){
  c.save(); c.translate(x, y);
  if (opts.spin) c.rotate(opts.spin);
  let ang = 0, flip = false;
  if (face.x < 0) flip = true; else if (face.y < 0) ang = -Math.PI/2; else if (face.y > 0) ang = Math.PI/2;
  if (flip) c.scale(-1, 1); else c.rotate(ang);
  const m = .08 + mouth * .62;           // mouth half-angle in radians
  // messy hair: tufts sticking every which way
  c.fillStyle = '#7A4A22';
  const tufts = [-2.75,-2.45,-2.15,-1.85,-1.55,-1.25,-.95];
  tufts.forEach((a, i) => {
    const wig = Math.sin(t*9 + i*1.7) * .08;
    const len = r * (1.2 + (i%3)*.12);
    c.beginPath();
    c.moveTo(Math.cos(a-.22)*r*.8, Math.sin(a-.22)*r*.8);
    c.quadraticCurveTo(Math.cos(a+wig)*len*1.05, Math.sin(a+wig)*len*1.05, Math.cos(a+.3+wig)*len, Math.sin(a+.3+wig)*len);
    c.lineTo(Math.cos(a+.25)*r*.8, Math.sin(a+.25)*r*.8); c.closePath(); c.fill();
  });
  // mouth (dark) then face around it
  c.fillStyle = '#6E1B28'; roundBlob(c, 0, 0, r*.98);
  c.fillStyle = '#F7C9A1';
  c.beginPath(); c.moveTo(0,0); c.arc(0, 0, r, m, Math.PI*2 - m); c.closePath(); c.fill();
  // tongue + a tooth
  if (mouth > .15){
    c.save(); c.beginPath(); c.moveTo(0,0); c.arc(0,0,r,-m,m); c.closePath(); c.clip();
    c.fillStyle = '#FF7F8E'; roundBlob(c, r*.72, r*.18, r*.26);
    c.fillStyle = '#FFFFFF'; c.fillRect(r*.55, -Math.tan(m)*r*.55, r*.16, r*.14);
    c.restore();
  }
  // hair fringe over forehead
  c.fillStyle = '#7A4A22';
  c.beginPath(); c.arc(-r*.1, -r*.62, r*.42, Math.PI*1.05, Math.PI*1.95); c.fill();
  // eye
  c.fillStyle = '#FFFFFF'; roundBlob(c, r*.08, -r*.44, r*.21);
  c.fillStyle = '#2B1A12'; roundBlob(c, r*.14, -r*.43, r*.12);
  c.fillStyle = '#FFFFFF'; roundBlob(c, r*.18, -r*.48, r*.045);
  // rosy cheek
  c.fillStyle = 'rgba(255,110,110,.45)'; roundBlob(c, -r*.2, r*.18, r*.2);
  // the mess: chocolate smear, spaghetti sauce, a crumb
  c.fillStyle = '#7B4217';
  c.beginPath(); c.ellipse(r*.44, r*.5, r*.2, r*.12, .5, 0, Math.PI*2); c.fill();
  roundBlob(c, r*.28, r*.66, r*.07);
  c.fillStyle = '#E2382C'; roundBlob(c, -r*.55, -r*.02, r*.1); roundBlob(c, -r*.46, r*.1, r*.06);
  c.fillStyle = '#F2D18B'; roundBlob(c, -r*.02, r*.6, r*.06);
  c.restore();
}

function ghostBody(c, r, t, wob){
  c.beginPath();
  c.arc(0, -r*.1, r, Math.PI, 0);
  c.lineTo(r, r*.8);
  const bumps = 4, bw = (2*r)/bumps;
  for (let i = 0; i < bumps; i++){
    const x0 = r - i*bw, dy = Math.sin(t*10 + i + wob) * r*.08;
    c.quadraticCurveTo(x0 - bw/2, r*1.05 + dy, x0 - bw, r*.8);
  }
  c.closePath(); c.fill();
}
function ghostEyes(c, r, dir, sleepy){
  const lx = dir.x*r*.12, ly = dir.y*r*.12;
  c.fillStyle = '#FFFFFF';
  c.beginPath(); c.ellipse(-r*.35, -r*.15, r*.25, r*.3, 0, 0, Math.PI*2); c.ellipse(r*.35, -r*.15, r*.25, r*.3, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#1E2A6B';
  roundBlob(c, -r*.35 + lx, -r*.12 + ly, r*.13); roundBlob(c, r*.35 + lx, -r*.12 + ly, r*.13);
  if (sleepy){ // heavy eyelids
    c.fillStyle = '#7F5FE0';
    c.fillRect(-r*.62, -r*.47, r*.54, r*.28); c.fillRect(r*.08, -r*.47, r*.54, r*.28);
  }
}
function drawGhost(c, g, x, y, r, t, mode){
  c.save(); c.translate(x, y);
  if (mode === 'eyes'){
    ghostEyes(c, r, g.dir || NONE, false);
    c.fillStyle = 'rgba(255,255,255,.7)'; roundBlob(c, r*.8, -r*.7, r*.14); roundBlob(c, -r*.9, -r*.9, r*.1);
    c.restore(); return;
  }
  if (mode === 'scared' || mode === 'flash'){
    c.fillStyle = mode === 'flash' ? '#F4F1FF' : '#3949C7';
    ghostBody(c, r, t, g.idx);
    // mud splotches: Max is winning
    c.fillStyle = '#7B4217'; roundBlob(c, -r*.45, r*.35, r*.16); roundBlob(c, r*.5, -r*.55, r*.12); roundBlob(c, r*.2, r*.5, r*.09);
    c.fillStyle = mode === 'flash' ? '#D0283A' : '#FFD5A8';
    roundBlob(c, -r*.3, -r*.2, r*.11); roundBlob(c, r*.3, -r*.2, r*.11);
    c.strokeStyle = c.fillStyle; c.lineWidth = r*.1; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-r*.55, r*.3);
    for (let i = 1; i <= 6; i++) c.lineTo(-r*.55 + i*r*.183, r*.3 + (i%2 ? -r*.12 : 0));
    c.stroke(); c.restore(); return;
  }
  const d = g.dir || NONE;
  if (g.key === 'broc'){
    c.fillStyle = '#2E9A5F';
    [[-.55,-.85,.42],[0,-1.05,.48],[.55,-.85,.42],[-.25,-1.25,.3],[.3,-1.25,.3]].forEach(([a,b,s]) => roundBlob(c, a*r, b*r, s*r));
  }
  c.fillStyle = g.color; ghostBody(c, r, t, g.idx);
  if (g.key === 'broc'){ c.fillStyle = 'rgba(30,110,60,.55)'; roundBlob(c, -r*.5, r*.5, r*.1); roundBlob(c, r*.45, r*.35, r*.08); }
  ghostEyes(c, r, d, g.key === 'bed');
  if (g.key === 'bath'){ // rubber duck on top, bubbles
    c.fillStyle = '#FFD93A'; c.beginPath(); c.ellipse(r*.05, -r*1.1, r*.38, r*.22, 0, 0, Math.PI*2); c.fill();
    roundBlob(c, r*.3, -r*1.35, r*.2);
    c.fillStyle = '#FF8A1F'; c.beginPath(); c.moveTo(r*.46, -r*1.38); c.lineTo(r*.66, -r*1.32); c.lineTo(r*.46, -r*1.26); c.fill();
    c.fillStyle = '#1B1E3D'; roundBlob(c, r*.34, -r*1.4, r*.045);
    c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = r*.07;
    const b = (t*1.5) % 1;
    c.beginPath(); c.arc(-r*.95, -r*(.4 + b*.8), r*.14, 0, Math.PI*2); c.stroke();
    c.beginPath(); c.arc(r*1.0, -r*(.1 + ((b+.5)%1)*.8), r*.1, 0, Math.PI*2); c.stroke();
  } else if (g.key === 'tidy'){ // feather duster
    c.strokeStyle = '#8A5329'; c.lineWidth = r*.12; c.lineCap = 'round';
    c.beginPath(); c.moveTo(r*.7, r*.2); c.lineTo(r*1.05, -r*.9); c.stroke();
    c.fillStyle = '#FFE066';
    for (let i = 0; i < 5; i++){ const a = -2.2 + i*.4 + Math.sin(t*12)*.08; roundBlob(c, r*1.08 + Math.cos(a)*r*.28, -r*1.0 + Math.sin(a)*r*.28, r*.18); }
  } else if (g.key === 'bed'){ // droopy nightcap with pompom
    c.fillStyle = '#FFE8A3';
    c.beginPath(); c.moveTo(-r*.85, -r*.65); c.quadraticCurveTo(-r*.1, -r*1.9, r*1.05, -r*1.15);
    c.quadraticCurveTo(r*.4, -r*1.1, r*.8, -r*.6); c.closePath(); c.fill();
    c.fillStyle = '#FFFFFF'; roundBlob(c, r*1.08, -r*1.12, r*.17);
    c.fillStyle = '#FFFFFF'; c.font = `700 ${r*.55}px ${getComputedStyle(document.body).fontFamily}`;
    c.globalAlpha = .5 + .5*Math.sin(t*3); c.fillText('z', -r*1.25, -r*.9); c.globalAlpha = 1;
  }
  c.restore();
}

function drawCookie(c, x, y, r){
  c.fillStyle = '#D19453'; roundBlob(c, x, y, r);
  c.fillStyle = '#E7B071'; roundBlob(c, x - r*.2, y - r*.2, r*.55);
  c.fillStyle = '#4A2410';
  [[-.35,-.3],[.35,-.1],[-.05,.35],[.3,.45],[-.45,.25],[.1,-.5]].forEach(([a,b]) => roundBlob(c, x + a*r, y + b*r, r*.13));
  c.fillStyle = '#1B1E3D'; roundBlob(c, x + r*.85, y - r*.5, r*.28); // a bite out of it, obviously
}

// ---------- state ----------
let T = 20, DPR = 1, wallCanvas = null;
let grid, dots, dotsLeft, totalDots, wallComp;
let max, ghosts, level, score, best, lives, state, stateT, frightT, frightDur, combo;
let modeIdx, modeT, dotsEaten, sinceDotT, bonus, bonusShown, trail, particles, popups, bubble, idleT, shake, flashT;
let nextLifeAt;
best = +(store.get('maxman-best') || 0);

const MODES = [7,20,7,20,5,20,5,Infinity]; // scatter, chase, ...

function isWall(c, r){
  if (r === TUNNEL_ROW && (c < 0 || c >= W)) return false;
  if (c < 0 || c >= W || r < 0 || r >= H) return true;
  const ch = grid[r][c];
  return ch === '#' || ch === '-';
}

function buildLevel(){
  grid = MAP.map(row => row.split(''));
  dots = new Uint8Array(W*H); totalDots = 0;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
    if (grid[r][c] === '.') { dots[r*W+c] = 1; totalDots++; }
    if (grid[r][c] === 'o') { dots[r*W+c] = 2; totalDots++; }
  }
  dotsLeft = totalDots; dotsEaten = 0; bonusShown = 0; bonus = null; trail = [];
  // colour each connected wall piece like a different blob of playdough
  wallComp = new Int16Array(W*H).fill(-1); let n = 0;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
    if (grid[r][c] !== '#' || wallComp[r*W+c] >= 0) continue;
    const st = [[c,r]]; wallComp[r*W+c] = n;
    while (st.length){ const [x,y] = st.pop();
      for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx = x+dx, ny = y+dy;
        if (nx<0||ny<0||nx>=W||ny>=H||grid[ny][nx] !== '#'||wallComp[ny*W+nx] >= 0) continue;
        wallComp[ny*W+nx] = n; st.push([nx,ny]); } }
    n++;
  }
  renderWalls();
}

function room(){ return ROOMS[(level-1) % ROOMS.length]; }

function renderWalls(flash){
  wallCanvas = document.createElement('canvas');
  wallCanvas.width = W*T*DPR; wallCanvas.height = H*T*DPR;
  const c = wallCanvas.getContext('2d'); c.scale(DPR, DPR);
  const rm = room();
  c.fillStyle = rm.mat; c.fillRect(0, 0, W*T, H*T);
  // faint playmat stitching
  c.fillStyle = 'rgba(255,255,255,.035)';
  for (let r = 0; r < H; r += 2) for (let cc = (r/2)%2; cc < W; cc += 2) c.fillRect(cc*T, r*T, T, T);
  const colorOf = i => flash ? '#FFFFFF' : rm.walls[wallComp[i] % rm.walls.length];
  const pass = (width, shiftY, lighten) => {
    c.lineCap = 'round'; c.lineWidth = width;
    for (let r = 0; r < H; r++) for (let cc = 0; cc < W; cc++){
      const i = r*W+cc; if (grid[r][cc] !== '#') continue;
      let col = colorOf(i); if (lighten) col = mix(col, '#FFFFFF', lighten);
      c.fillStyle = col; c.strokeStyle = col;
      const x = (cc+.5)*T, y = (r+.5)*T + shiftY;
      roundBlob(c, x, y, width/2);
      if (cc+1 < W && grid[r][cc+1] === '#'){ c.beginPath(); c.moveTo(x,y); c.lineTo(x+T,y); c.stroke(); }
      if (r+1 < H && grid[r+1][cc] === '#'){ c.beginPath(); c.moveTo(x,y); c.lineTo(x,y+T); c.stroke(); }
      if (cc+1 < W && r+1 < H && grid[r][cc+1]==='#' && grid[r+1][cc]==='#' && grid[r+1][cc+1]==='#') c.fillRect(x, y, T, T);
    }
  };
  pass(T*.78, T*.06, -.35);  // shadow
  pass(T*.72, 0, 0);
  pass(T*.3, -T*.1, .45);    // shine
  // the baby gate on the grown-ups' room
  c.fillStyle = '#FFE8A3'; c.fillRect(13*T, 12*T + T*.4, 2*T, T*.2);
}
function mix(a, b, k){
  let pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  if (k < 0){ pb = 0; k = -k; }
  const ch = s => (pa>>s)&255, dh = s => (pb>>s)&255;
  const m = s => Math.round(ch(s) + (dh(s)-ch(s))*k);
  return `rgb(${m(16)},${m(8)},${m(0)})`;
}

function resetActors(){
  max = {x:13.5, y:23, dir:{...DIRS.left}, face:{...DIRS.left}, want:{...DIRS.left}, mouth:0, mouthV:1, dist:0};
  ghosts = GHOSTS.map((g, idx) => ({
    ...g, idx, x:g.start.x, y:g.start.y, dir: idx === 0 ? {...DIRS.left} : {...DIRS.up},
    state: idx === 0 ? 'active' : 'house', fright:false, bob:idx*.7,
  }));
  modeIdx = 0; modeT = 0; frightT = 0; combo = 0; sinceDotT = 0; houseT = 0;
  bubble = null; particles = []; popups = [];
}
let houseT = 0;

function newGame(){
  level = 1; score = 0; lives = 3; nextLifeAt = 10000;
  buildLevel(); resetActors(); updateHud();
  setState('ready'); say(pick(SAYS.start), 2.2); sfx.start();
}

function setState(s){ state = s; stateT = 0; }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function say(text, dur=1.8){ bubble = {text, t:dur, max:dur}; }

// ---------- movement ----------
function advance(e, dist, onCenter){
  let guard = 0;
  while (dist > 1e-9 && guard++ < 30){
    if (!e.dir.x && !e.dir.y){ onCenter(e); if (!e.dir.x && !e.dir.y) return; }
    const ax = e.dir.x ? 'x' : 'y', s = e.dir[ax], cur = e[ax];
    const next = s > 0 ? Math.floor(cur + 1e-6) + 1 : Math.ceil(cur - 1e-6) - 1;
    const d = Math.abs(next - cur);
    if (dist < d){ e[ax] += s*dist; return; }
    e[ax] = next; dist -= d;
    if (e.x <= -1 && e.dir.x < 0) e.x = W;
    else if (e.x >= W && e.dir.x > 0) e.x = -1;
    onCenter(e);
  }
}

function maxCenter(e){
  const w = e.want;
  if ((w.x || w.y) && !isWall(e.x + w.x, e.y + w.y)){ e.dir = {...w}; e.face = {...w}; return; }
  if (!isWall(e.x + e.dir.x, e.y + e.dir.y)) return;
  e.dir = {...NONE};
}

function ghostTarget(g){
  if (g.state === 'eyes') return {x:13, y:11};
  const scatter = modeIdx % 2 === 0;
  const mx = Math.round(max.x), my = Math.round(max.y), f = max.face;
  if (scatter) return g.corner;
  switch (g.key){
    case 'bath': return {x:mx, y:my};
    case 'broc': return {x:mx + f.x*4, y:my + f.y*4};
    case 'tidy': { const b = ghosts[0]; const px = mx + f.x*2, py = my + f.y*2; return {x:px*2 - Math.round(b.x), y:py*2 - Math.round(b.y)}; }
    case 'bed':  return Math.hypot(mx - g.x, my - g.y) > 8 ? {x:mx, y:my} : g.corner;
  }
  return {x:mx, y:my};
}

function ghostCenter(g){
  if (g.state === 'eyes' && g.x === 13 && g.y === 11){ g.state = 'entering'; g.dir = {...DIRS.down}; return; }
  const rev = {x:-g.dir.x, y:-g.dir.y};
  const opts = [DIRS.up, DIRS.left, DIRS.down, DIRS.right].filter(d =>
    !(d.x === rev.x && d.y === rev.y) && !isWall(g.x + d.x, g.y + d.y));
  if (!opts.length){ g.dir = rev; return; }
  if (g.fright){ g.dir = {...pick(opts)}; return; }
  const tg = ghostTarget(g);
  let bestD = Infinity, choice = opts[0];
  for (const d of opts){ const dd = (g.x + d.x - tg.x)**2 + (g.y + d.y - tg.y)**2; if (dd < bestD){ bestD = dd; choice = d; } }
  g.dir = {...choice};
}

function moveToward(g, tx, ty, dist){
  const dx = tx - g.x, dy = ty - g.y;
  if (Math.abs(dx) > 1e-6){ const s = Math.min(Math.abs(dx), dist); g.x += Math.sign(dx)*s; g.dir = {x:Math.sign(dx), y:0}; return Math.abs(dx) <= dist && Math.abs(dy) < 1e-6; }
  if (Math.abs(dy) > 1e-6){ const s = Math.min(Math.abs(dy), dist); g.y += Math.sign(dy)*s; g.dir = {x:0, y:Math.sign(dy)}; return Math.abs(dy) <= dist; }
  return true;
}

// ---------- update ----------
function speeds(){
  const L = Math.min(level - 1, 7);
  return { max: 7.4 + L*.3, ghost: 6.9 + L*.32, fright: 4.2, eyes: 15, tunnel: 3.6, house: 3.5 };
}

function update(dt){
  stateT += dt;
  for (const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 18*dt; p.t -= dt; }
  particles = particles.filter(p => p.t > 0);
  for (const p of popups) p.t -= dt;
  popups = popups.filter(p => p.t > 0);
  for (const s of trail) s.t -= dt;
  trail = trail.filter(s => s.t > 0);
  if (bubble){ bubble.t -= dt; if (bubble.t <= 0) bubble = null; }
  if (shake > 0) shake -= dt;

  if (state === 'ready'){ if (stateT > 2) setState('play'); return; }
  if (state === 'dying'){
    if (stateT > 2.4){
      lives--; updateHud();
      if (lives <= 0){ gameOver(); return; }
      resetActors(); setState('ready');
    }
    return;
  }
  if (state === 'clear'){
    const on = Math.floor(stateT*5) % 2 === 1;
    if (on !== flashT){ flashT = on; renderWalls(on); }
    if (stateT > 2.4){ level++; flashT = false; buildLevel(); resetActors(); updateHud(); setState('ready'); say(pick(SAYS.start), 2); sfx.start(); }
    return;
  }
  if (state !== 'play') return;

  const sp = speeds();

  // Max
  const w = max.want;
  if ((w.x || w.y) && w.x === -max.dir.x && w.y === -max.dir.y && (max.dir.x || max.dir.y)){ max.dir = {...w}; max.face = {...w}; }
  const bx = max.x, by = max.y;
  advance(max, sp.max*dt, maxCenter);
  const moved = Math.abs(max.x - bx) + Math.abs(max.y - by);
  if (moved > 0 && moved < 2){
    max.mouth += max.mouthV*dt*7; if (max.mouth > 1){ max.mouth = 1; max.mouthV = -1; } if (max.mouth < 0){ max.mouth = 0; max.mouthV = 1; }
    max.dist += moved;
    if (max.dist > .55){ max.dist = 0; dropMess(); }
  }

  // eat
  const c = Math.round(max.x), r = Math.round(max.y);
  if (c >= 0 && c < W && Math.abs(max.x - c) < .4 && Math.abs(max.y - r) < .4){
    const k = dots[r*W+c];
    if (k){
      dots[r*W+c] = 0; dotsLeft--; dotsEaten++; sinceDotT = 0;
      if (k === 1){ addScore(10); sfx.waka(); }
      else { addScore(50); eatCookie(); }
      if (dotsEaten === 70 || dotsEaten === 170){ bonus = {...BONUS[Math.min(level-1, BONUS.length-1)], t:9}; }
      if (!dotsLeft){ if (window.RosenbergBridge) RosenbergBridge.report({ score, stars: 2 }); setState('clear'); flashT = false; say(pick(SAYS.clear), 2.4); sfx.clear(); return; }
    }
  }
  sinceDotT += dt;

  if (bonus){
    bonus.t -= dt;
    if (Math.abs(max.x - 13.5) < .8 && Math.abs(max.y - 17) < .6){
      addScore(bonus.pts); popups.push({x:13.5, y:17, text:'+'+bonus.pts, t:1.3}); say(bonus.say, 1.6); sfx.bonus();
      burst(13.5, 17, ['#E2382C','#FFC73A','#F2D18B'], 16); bonus = null;
    } else if (bonus.t <= 0) bonus = null;
  }

  // scatter / chase clock pauses during cookie power
  if (frightT > 0){
    frightT -= dt;
    if (frightT <= 0){ ghosts.forEach(g => g.fright = false); combo = 0; }
  } else {
    modeT += dt;
    if (modeT > MODES[modeIdx]){ modeT = 0; modeIdx = Math.min(modeIdx+1, MODES.length-1); ghosts.forEach(g => { if (g.state === 'active') g.dir = {x:-g.dir.x, y:-g.dir.y}; }); }
  }

  // release the grown-ups from their room
  houseT += dt;
  for (const g of ghosts){
    if (g.state === 'house'){
      g.bob += dt*4;
      if (dotsEaten >= g.dot + (level > 1 ? -30 : 0) && houseT >= g.sec*(level > 1 ? .6 : 1) || sinceDotT > 4){ g.state = 'leaving'; sinceDotT = 0; }
    }
  }

  for (const g of ghosts){
    if (g.state === 'house') continue;
    if (g.state === 'leaving'){
      if (moveToward(g, 13, 11, sp.house*dt) && g.x === 13 && g.y === 11){ g.state = 'active'; g.dir = {...DIRS.left}; }
      continue;
    }
    if (g.state === 'entering'){
      if (moveToward(g, 13, 14, sp.eyes*.5*dt) && g.y === 14){ g.state = 'leaving'; g.fright = false; }
      continue;
    }
    let s = g.state === 'eyes' ? sp.eyes : g.fright ? sp.fright : sp.ghost;
    if (g.state !== 'eyes' && Math.round(g.y) === TUNNEL_ROW && (g.x < 6 || g.x > 21)) s = sp.tunnel;
    if (g.key === 'bed' && g.state === 'active' && !g.fright) s *= .94; // sleepy
    advance(g, s*dt, ghostCenter);
  }

  // bumps
  for (const g of ghosts){
    if (g.state !== 'active') continue;
    const dx = Math.abs(g.x - max.x), dy = Math.abs(g.y - max.y);
    if (dx < .65 && dy < .65){
      if (g.fright){
        combo++; const pts = 200 * 2**(combo-1); addScore(pts);
        g.fright = false; g.state = 'eyes';
        popups.push({x:g.x, y:g.y, text:'SPLAT! '+pts, t:1.2});
        burst(g.x, g.y, ['#7B4217','#8A5329','#5C2E0E'], 22);
        say(g.splat, 1.6); sfx.splat(); shake = reduceMotion ? 0 : .25;
      } else {
        setState('dying'); say(g.caught, 2.3); sfx.death(); setTimeout(() => sfx.giggle(), 1300);
        return;
      }
    }
  }

  // Max has a lot to say
  idleT -= dt;
  if (idleT <= 0){
    idleT = 9 + Math.random()*10;
    if (!bubble){ const line = pick(SAYS.idle); say(line, 2); if (line.startsWith('Toot')) { sfx.toot(); burst(max.x - max.face.x*.6, max.y - max.face.y*.6, ['#B9E86A','#D6F59A'], 8, .6); } }
  }
}

function eatCookie(){
  frightDur = Math.max(2, 7 - (level-1)*.8);
  frightT = frightDur; combo = 0;
  ghosts.forEach(g => { if (g.state === 'active'){ g.fright = true; g.dir = {x:-g.dir.x, y:-g.dir.y}; } });
  say(pick(SAYS.cookie), 1.6); sfx.cookie();
  burst(max.x, max.y, ['#D19453','#4A2410','#E7B071'], 14);
}

const MESS = ['#7B4217','#E2382C','#F2D18B','#B9E86A','#FF9EC7','#8A5329'];
function dropMess(){
  const m = {x:max.x + (Math.random()-.5)*.35, y:max.y + (Math.random()-.5)*.35, t:7, max:7,
    col:pick(MESS), kind:Math.random() < .55 ? 'crumb' : Math.random() < .5 ? 'smear' : 'print', rot:Math.random()*6.28,
    face:{...max.face}};
  trail.push(m); if (trail.length > 120) trail.shift();
}

function burst(x, y, cols, n, spd=1){
  for (let i = 0; i < n; i++){ const a = Math.random()*6.28, v = (2 + Math.random()*4)*spd;
    particles.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 2, t:.5 + Math.random()*.5, col:pick(cols), s:.07 + Math.random()*.08}); }
}

function addScore(n){
  score += n;
  if (score >= nextLifeAt){ lives++; nextLifeAt += 10000; sfx.life(); popups.push({x:max.x, y:max.y - 1, text:'1-UP!', t:1.5}); }
  if (score > best){ best = score; store.set('maxman-best', best); }
  updateHud();
}

function gameOver(){
  setState('over');
  if (window.RosenbergBridge) RosenbergBridge.report({ score, stars: score >= 1500 ? 1 : 0 });
  showOverlay('Nap time!', `Bedtime finally caught Max. He made ${score.toLocaleString()} mess points first${score >= best && score > 0 ? ', a new best' : ''}.`, 'Play again', false);
}

// ---------- render ----------
function render(t){
  const cw = W*T, ch = H*T;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-.5)*T*.3, (Math.random()-.5)*T*.3);
  ctx.drawImage(wallCanvas, 0, 0, cw, ch);
  ctx.beginPath(); ctx.rect(0, 0, cw, ch); ctx.clip();
  const P = v => (v + .5)*T;

  // mess trail
  for (const s of trail){
    ctx.globalAlpha = Math.min(1, s.t / s.max * 1.4) * .75;
    ctx.fillStyle = s.col;
    const x = P(s.x), y = P(s.y);
    if (s.kind === 'crumb'){ roundBlob(ctx, x, y, T*.06); roundBlob(ctx, x + T*.12, y + T*.05, T*.04); }
    else if (s.kind === 'smear'){ ctx.save(); ctx.translate(x, y); ctx.rotate(s.rot); ctx.beginPath(); ctx.ellipse(0, 0, T*.18, T*.07, 0, 0, 6.28); ctx.fill(); ctx.restore(); }
    else { // tiny sticky footprint
      ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(s.face.y, s.face.x) + Math.PI/2);
      ctx.beginPath(); ctx.ellipse(0, 0, T*.07, T*.11, 0, 0, 6.28); ctx.fill();
      for (let i = -1; i <= 1; i++) roundBlob(ctx, i*T*.05, -T*.15, T*.025);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;

  // Cheerios and cookies
  const pulse = 1 + Math.sin(t*6)*.1;
  ctx.lineWidth = T*.075; ctx.strokeStyle = '#E9C27A';
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++){
    const k = dots[r*W+c]; if (!k) continue;
    if (k === 1){ ctx.beginPath(); ctx.arc(P(c), P(r), T*.12, 0, 6.28); ctx.stroke(); }
    else drawCookie(ctx, P(c), P(r), T*.36*pulse);
  }

  if (bonus){
    const bob = Math.sin(t*4)*T*.08;
    ctx.font = `${T*1.3}px system-ui, "Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.globalAlpha = bonus.t < 2 ? (Math.floor(t*8)%2 ? .4 : 1) : 1;
    ctx.fillText(bonus.e, P(13.5), P(17) + bob); ctx.globalAlpha = 1;
  }

  // grown-ups
  const R = T*.78;
  for (const g of ghosts){
    if (state === 'dying' && stateT > .6) continue;
    if (state === 'clear') continue;
    let gx = g.x, gy = g.y;
    if (g.state === 'house') gy += Math.sin(g.bob)*.25;
    let mode = 'normal';
    if (g.state === 'eyes' || g.state === 'entering') mode = 'eyes';
    else if (g.fright) mode = frightT < 2 && Math.floor(t*5)%2 ? 'flash' : 'scared';
    drawGhost(ctx, g, P(gx), P(gy), R, t, mode);
  }

  // Max
  if (state === 'dying'){
    const k = Math.min(1, stateT/1.2);
    drawMax(ctx, P(max.x), P(max.y) + k*T*.2, T*.8*(1 - Math.max(0, stateT-1.6)*.5), max.face, (Math.sin(stateT*20)+1)/2, t, {spin: k*Math.PI*4 + (stateT > 1.2 ? Math.PI/2 : 0)});
    if (stateT > 1.2){ ctx.fillStyle = '#FFE066'; for (let i = 0; i < 3; i++){ const a = t*4 + i*2.1; ctx.font = `${T*.7}px system-ui`; ctx.textAlign='center'; ctx.fillText('★', P(max.x) + Math.cos(a)*T*.9, P(max.y) - T*.5 + Math.sin(a)*T*.3); } }
  } else {
    const idleMouth = (state === 'ready' || state === 'over' || state === 'title') ? .6 : max.mouth;
    drawMax(ctx, P(max.x), P(max.y), T*.8, max.face, idleMouth, t);
  }

  // crumbs flying
  for (const p of particles){ ctx.globalAlpha = Math.min(1, p.t*2); ctx.fillStyle = p.col; roundBlob(ctx, P(p.x), P(p.y), T*p.s*2); }
  ctx.globalAlpha = 1;

  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups){
    ctx.globalAlpha = Math.min(1, p.t*2);
    ctx.font = `400 ${T*.85}px Chewy, "Comic Sans MS", system-ui`;
    ctx.lineWidth = T*.18; ctx.strokeStyle = '#1B1E3D'; ctx.strokeText(p.text, P(p.x), P(p.y) - (1.3-p.t)*T);
    ctx.fillStyle = '#FFE066'; ctx.fillText(p.text, P(p.x), P(p.y) - (1.3-p.t)*T);
  }
  ctx.globalAlpha = 1;

  if (state === 'ready') banner(stateT < 1.2 ? 'READY?' : 'GO GO GO!', '#FFC73A');
  if (state === 'paused') banner('PAUSED', '#4DA9FF');

  if (bubble) drawBubble(bubble.text, P(max.x), P(max.y) - T*1.1, Math.min(1, (bubble.max - bubble.t)*8, bubble.t*4));
  ctx.restore();
}

function banner(text, col){
  ctx.font = `400 ${T*1.5}px Chewy, "Comic Sans MS", system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = T*.3; ctx.strokeStyle = '#1B1E3D'; ctx.strokeText(text, W*T/2, 17.5*T);
  ctx.fillStyle = col; ctx.fillText(text, W*T/2, 17.5*T);
}

function drawBubble(text, x, y, a){
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const fs = Math.max(11, T*.72);
  ctx.font = `800 ${fs}px "Baloo 2", system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tw = ctx.measureText(text).width, pw = tw + fs*1.1, ph = fs*1.7;
  let bx = Math.max(4, Math.min(W*T - pw - 4, x - pw/2));
  let by = y - ph, tailUp = false;
  if (by < 4){ by = y + T*2.2; tailUp = true; }
  const sc = .85 + .15*a;
  ctx.translate(x, tailUp ? by : by + ph); ctx.scale(sc, sc); ctx.translate(-x, -(tailUp ? by : by + ph));
  ctx.fillStyle = '#FFF4E2'; ctx.strokeStyle = '#1B1E3D'; ctx.lineWidth = Math.max(2, T*.12);
  ctx.beginPath(); ctx.roundRect(bx, by, pw, ph, ph/2); ctx.fill(); ctx.stroke();
  const tx = Math.max(bx + ph/2, Math.min(bx + pw - ph/2, x));
  ctx.beginPath();
  if (tailUp){ ctx.moveTo(tx - fs*.3, by + 1); ctx.lineTo(x, by - T*.7); ctx.lineTo(tx + fs*.3, by + 1); }
  else { ctx.moveTo(tx - fs*.3, by + ph - 1); ctx.lineTo(x, by + ph + T*.5); ctx.lineTo(tx + fs*.3, by + ph - 1); }
  ctx.fill(); ctx.stroke();
  ctx.fillRect(tx - fs*.28, tailUp ? by + 1 : by + ph - ctx.lineWidth*1.2, fs*.56, ctx.lineWidth*1.1);
  ctx.fillStyle = '#1B1E3D'; ctx.fillText(text, bx + pw/2, by + ph/2 + fs*.06);
  ctx.restore();
}

// ---------- HUD / overlay ----------
function updateHud(){
  $('score').textContent = score.toLocaleString();
  $('best').textContent = best.toLocaleString();
  $('room').textContent = `Room ${level} · ${room().name}`;
  const L = $('lives'); L.innerHTML = '';
  L.setAttribute('aria-label', `${lives} lives`);
  for (let i = 0; i < Math.min(lives, 6); i++){
    const cv = document.createElement('canvas'); cv.width = 44; cv.height = 44;
    const c = cv.getContext('2d'); drawMax(c, 22, 24, 15, DIRS.right, .5, i); L.appendChild(cv);
  }
}

function showOverlay(title, text, btn, cast){
  $('ovTitle').textContent = title; $('ovText').textContent = text; $('goBtn').textContent = btn;
  $('cast').hidden = !cast; $('overlay').hidden = false; $('goBtn').focus({preventScroll:true});
}

function buildCast(){
  const cast = $('cast');
  const add = (draw, name, blurb) => {
    const d = document.createElement('div'); const cv = document.createElement('canvas'); cv.width = 68; cv.height = 68;
    draw(cv.getContext('2d')); const s = document.createElement('span');
    const b = document.createElement('b'); b.textContent = name; s.appendChild(b); s.appendChild(document.createTextNode(blurb));
    d.appendChild(cv); d.appendChild(s); cast.appendChild(d);
  };
  add(c => drawMax(c, 34, 38, 22, DIRS.right, .7, 0), 'Max', 'Three. Messy. Always hungry.');
  add(c => drawCookie(c, 34, 34, 22), 'Cookie', 'Sugar rush! Chase the grown-up stuff.');
  GHOSTS.forEach((g, i) => add(c => drawGhost(c, {...g, idx:i, dir:DIRS.right}, 34, 42, 19, .3, 'normal'), g.name, g.blurb));
}

// ---------- sizing ----------
function fit(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  T = Math.max(8, Math.floor(Math.min(sw / W, sh / H)*4)/4);
  DPR = Math.min(3, window.devicePixelRatio || 1);
  canvas.style.width = W*T + 'px'; canvas.style.height = H*T + 'px';
  canvas.width = W*T*DPR; canvas.height = H*T*DPR;
  if (grid) renderWalls(state === 'clear' && flashT);
}

// ---------- input ----------
const KEYS = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
function steer(name){ if (max) max.want = {...DIRS[name]}; }
addEventListener('keydown', e => {
  if (KEYS[e.key]){ e.preventDefault(); steer(KEYS[e.key]); return; }
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape'){ togglePause(); }
  if (e.key === 'm' || e.key === 'M'){ toggleMute(); }
  if ((e.key === 'Enter' || e.key === ' ') && !$('overlay').hidden){ e.preventDefault(); $('goBtn').click(); }
});
let touch0 = null;
stage.addEventListener('touchstart', e => { const t = e.touches[0]; touch0 = {x:t.clientX, y:t.clientY}; }, {passive:true});
stage.addEventListener('touchmove', e => {
  if (!touch0) return; const t = e.touches[0], dx = t.clientX - touch0.x, dy = t.clientY - touch0.y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
  steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  touch0 = {x:t.clientX, y:t.clientY};
}, {passive:true});
document.querySelectorAll('.pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); ac(); steer(b.dataset.d); }));

function togglePause(){
  if (state === 'play'){ setState('paused'); $('pauseBtn').textContent = 'Resume'; }
  else if (state === 'paused'){ setState('play'); $('pauseBtn').textContent = 'Pause'; }
}
function toggleMute(){ muted = !muted; store.set('maxman-muted', muted ? '1' : '0'); $('muteBtn').textContent = muted ? 'Sound off' : 'Sound on'; if (!muted) ac(); }
$('pauseBtn').addEventListener('click', togglePause);
$('muteBtn').addEventListener('click', toggleMute);
$('muteBtn').textContent = muted ? 'Sound off' : 'Sound on';
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

$('goBtn').addEventListener('click', () => { ac(); $('overlay').hidden = true; idleT = 8; newGame(); });

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  if (state !== 'paused' && state !== 'title' && state !== 'over') update(dt);
  render(now/1000);
  requestAnimationFrame(frame);
}

// boot into a live-looking title screen
level = 1; score = 0; lives = 3; shake = 0; idleT = 8; flashT = false;
buildCast(); buildLevel(); resetActors(); state = 'title';
fit(); updateHud();
addEventListener('resize', fit);
if (document.fonts) document.fonts.ready.then(() => { updateHud(); });
requestAnimationFrame(frame);
})();
</script>
