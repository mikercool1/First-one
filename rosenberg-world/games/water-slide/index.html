<!doctype html>
<html lang="en">
<head>
<script src="../rw-bridge.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Splash Down</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root {
  --ink: #0B2240; --foam: #F4FBFF; --sun: #FFD23F; --sun-2: #FFB020; --coral: #FF6B6B;
  --glass: rgba(8, 34, 64, .55); --glass-edge: rgba(255, 255, 255, .22);
  --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --sans: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.rw-in-world .hud { left: 72px; }
html, body { height: 100%; margin: 0; }
body { background: #0B4A6F; color: var(--foam); font: 700 15px/1.35 var(--sans); overflow: hidden; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; -webkit-user-select: none; }
.stage { position: fixed; inset: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* HUD */
.hud { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 16px; right: 16px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; pointer-events: none; }
.chip { background: var(--glass); backdrop-filter: blur(12px) saturate(140%); -webkit-backdrop-filter: blur(12px) saturate(140%); border: 1px solid var(--glass-edge); border-radius: 16px; padding: 5px 12px 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); text-align: center; }
.chip small { display: block; font: 800 9.5px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--sun); }
.chip b { display: block; font: 400 22px/1.05 var(--display); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.left, .right { display: flex; gap: 8px; align-items: flex-start; }
#timeChip b { min-width: 58px; }
#timeChip.pen b { color: var(--coral); }
.icon-btn { pointer-events: auto; border: 1px solid var(--glass-edge); background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); color: #fff; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.progress { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 66px); left: 16px; right: 16px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.18); pointer-events: none; }
.progress i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 6px; background: linear-gradient(90deg, #7FE3FF, #fff); }
.progress span { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--coral); border: 2px solid #fff; left: 0; }
.progress::after { content: ""; position: absolute; right: -2px; top: -5px; width: 16px; height: 16px; border-radius: 50%; background: #35C6E8; border: 2px solid #fff; }
.speedo { position: absolute; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); pointer-events: none; text-align: right; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
.speedo b { display: block; font: 400 44px/.9 var(--display); font-variant-numeric: tabular-nums; }
.speedo small { font: 900 11px var(--sans); letter-spacing: .2em; color: var(--sun); }
.speedo.boost b { color: var(--sun); }
@media (hover: none), (pointer: coarse) { .speedo { right: auto; left: 50%; transform: translateX(-50%); text-align: center; } }

#lean { position: absolute; top: 38%; left: 50%; transform: translateX(-50%); font: 400 clamp(28px, 8vw, 44px)/1 var(--display); color: #fff; text-shadow: 0 3px 0 #C8282B, 0 6px 18px rgba(0,0,0,.4); pointer-events: none; white-space: nowrap; animation: throb .35s ease-in-out infinite alternate; }
@keyframes throb { to { transform: translateX(-50%) scale(1.12); } }

/* touch pads */
.pads { position: absolute; left: 0; right: 0; bottom: 0; top: 30%; display: grid; grid-template-columns: 1fr 1fr; }
.pad { border: 0; background: none; padding: 0 0 calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; align-items: flex-end; cursor: pointer; }
.pad span { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.14); border: 1.5px solid rgba(255,255,255,.35); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: transform .08s, background .12s; }
.pad svg { width: 26px; height: 26px; }
#padL { justify-content: flex-start; padding-left: 18px; }
#padR { justify-content: flex-end; padding-right: 18px; }
.pad.on span { transform: scale(.9); background: rgba(255,210,63,.55); }
@media (hover: hover) and (pointer: fine) { .pad span { display: none; } }

/* overlays */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; overflow-y: auto; background: radial-gradient(120% 80% at 50% 40%, rgba(4,20,40,.0), rgba(4,20,40,.5)); }
.panel { width: min(460px, 100%); text-align: center; background: rgba(6, 36, 66, .72); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border: 1px solid var(--glass-edge); border-radius: 30px; padding: 24px 20px 20px; box-shadow: 0 30px 80px rgba(0,0,0,.35); animation: rise .55s cubic-bezier(.2,.9,.3,1.1); }
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.kicker { margin: 0; font: 900 11px var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--sun); }
.logo { margin: 4px 0 4px; font: 400 clamp(52px, 15vw, 76px)/.92 var(--display); letter-spacing: .01em; color: #fff; text-shadow: 0 4px 0 #1C7FB8, 0 10px 30px rgba(0,0,0,.3); }
.logo span { display: block; color: var(--sun); text-shadow: 0 4px 0 #D98A00, 0 10px 30px rgba(0,0,0,.3); transform: rotate(-3deg); }
.sub { margin: 8px 0 16px; font: 700 15px/1.45 var(--sans); color: rgba(244,251,255,.86); }
.sub b { color: #fff; }
.slides { display: grid; gap: 10px; margin: 0 0 14px; }
.slide-card { position: relative; display: grid; grid-template-columns: 46px 1fr auto; align-items: center; gap: 12px; text-align: left; width: 100%; border: 1.5px solid rgba(255,255,255,.18); background: rgba(255,255,255,.07); color: #fff; border-radius: 20px; padding: 10px 14px 10px 10px; cursor: pointer; font: inherit; transition: transform .1s, background .15s, border-color .15s; }
.slide-card:hover:not(:disabled) { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.4); }
.slide-card:active:not(:disabled) { transform: scale(.98); }
.slide-card:disabled { cursor: default; opacity: .5; }
.slide-card .dot { width: 46px; height: 46px; border-radius: 14px; background: var(--c); display: grid; place-items: center; box-shadow: inset 0 -4px 0 rgba(0,0,0,.2); }
.slide-card .dot svg { width: 26px; height: 26px; }
.slide-card h3 { margin: 0; font: 400 21px/1.05 var(--display); letter-spacing: .01em; }
.slide-card p { margin: 2px 0 0; font: 700 12.5px/1.3 var(--sans); color: rgba(244,251,255,.72); }
.slide-card .lvl { display: block; font: 900 10px var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--c2); margin-bottom: 1px; }
.stars { font-size: 17px; letter-spacing: 1px; color: rgba(255,255,255,.22); white-space: nowrap; text-align: right; }
.stars .on { color: var(--sun); }
.stars small { display: block; font: 800 11px var(--sans); color: rgba(244,251,255,.6); letter-spacing: 0; }
.keys { margin: 0; font: 700 12.5px var(--sans); color: rgba(244,251,255,.6); }
kbd { font: 800 11px var(--sans); border: 1px solid rgba(255,255,255,.35); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }
.go { border: 0; cursor: pointer; font: 400 21px var(--display); letter-spacing: .04em; color: var(--ink); background: linear-gradient(180deg, #FFE580, var(--sun) 55%, var(--sun-2)); padding: 13px 34px 12px; border-radius: 999px; box-shadow: 0 6px 0 #C77F00, 0 14px 30px rgba(0,0,0,.25); transition: transform .08s, box-shadow .08s; }
.go:active { transform: translateY(4px); box-shadow: 0 2px 0 #C77F00, 0 8px 20px rgba(0,0,0,.25); }
button:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.row { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 6px; }
.link-btn { border: 0; background: none; color: rgba(244,251,255,.8); font: 800 14px var(--sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
h2 { margin: 2px 0 6px; font: 400 44px/1 var(--display); color: #fff; text-shadow: 0 4px 0 #1C7FB8; }
.big-stars { font-size: 46px; letter-spacing: 6px; margin: 4px 0 2px; color: rgba(255,255,255,.2); }
.big-stars span { display: inline-block; }
.big-stars .on { color: var(--sun); text-shadow: 0 3px 0 #D98A00; animation: starpop .5s cubic-bezier(.2,.9,.3,1.5) backwards; }
.big-stars .on:nth-child(2) { animation-delay: .18s; } .big-stars .on:nth-child(3) { animation-delay: .36s; }
@keyframes starpop { from { transform: scale(0) rotate(-40deg); } }
.stats { list-style: none; margin: 12px 0 14px; text-align: left; border-top: 1px solid var(--glass-edge); padding: 0; }
.stats li { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--glass-edge); font-weight: 800; }
.stats li span:first-child { color: rgba(244,251,255,.78); }
.stats b { font: 400 20px var(--display); color: #fff; font-variant-numeric: tabular-nums; }
.stats em { font: 800 12px var(--sans); font-style: normal; color: var(--sun); margin-left: 6px; }
.stats .miss { color: rgba(244,251,255,.5); }
.new-best { display: inline-block; margin-top: 2px; font: 900 11px var(--sans); letter-spacing: .18em; text-transform: uppercase; background: var(--coral); color: #fff; padding: 3px 10px; border-radius: 999px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv" aria-label="A rider on an inner tube racing down a water slide"></canvas>

  <div class="pads" id="pads" hidden>
    <button class="pad" id="padL" type="button" aria-label="Lean left"><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></span></button>
    <button class="pad" id="padR" type="button" aria-label="Lean right"><span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>
  </div>

  <div class="hud" id="hud" hidden>
    <div class="left">
      <div class="chip" id="timeChip"><small>Time</small><b id="time">0.0</b></div>
      <div class="chip"><small>Ducks</small><b id="ducks">0</b></div>
    </div>
    <div class="right">
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Sound"></button>
    </div>
  </div>
  <div class="progress" id="progress" hidden><i id="progFill"></i><span id="progDot"></span></div>
  <div class="speedo" id="speedo" hidden><b id="mph">0</b><small>MPH</small></div>
  <div id="lean" hidden></div>

  <div class="overlay" id="title">
    <div class="panel">
      <p class="kicker">Tidewater Falls Water Park</p>
      <h1 class="logo">Splash<span>Down!</span></h1>
      <p class="sub"><b>Lean into the turns</b> or the slide flings you over the edge. Grab rubber ducks, hit the boost pads, dodge beach balls.</p>
      <div class="slides" id="slideList"></div>
      <p class="keys" id="keysHint"><kbd>&larr;</kbd> <kbd>&rarr;</kbd> or <kbd>A</kbd> <kbd>D</kbd> to lean &middot; on a phone, hold the left or right side</p>
    </div>
  </div>

  <div class="overlay" id="paused" hidden>
    <div class="panel">
      <p class="kicker" id="pausedSlide"></p>
      <h2>Paused</h2>
      <div class="row">
        <button class="go" id="resumeBtn" type="button">KEEP SLIDING</button>
        <button class="link-btn" id="quitBtn" type="button">Back to the slides</button>
        <button class="link-btn" type="button" data-rw-back hidden>Back to Rosenberg World</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="results" hidden>
    <div class="panel">
      <p class="kicker" id="resSlide"></p>
      <h2>Splash!</h2>
      <div class="big-stars" id="resStars"></div>
      <div id="resBest"></div>
      <ul class="stats" id="resStats"></ul>
      <div class="row">
        <button class="go" id="nextBtn" type="button">NEXT SLIDE</button>
        <button class="link-btn" id="againBtn" type="button">Ride it again</button>
        <button class="link-btn" id="menuBtn" type="button">All slides</button>
        <button class="link-btn" type="button" data-rw-back hidden>Back to Rosenberg World</button>
      </div>
    </div>
  </div>
</div>

<script src="course.js"></script>
<script src="game.js"></script>
</body>
</html>
