<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../rw-bridge.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>360 Snowboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root { --ink: #16204A; --hot: #FF4F8B; --sky: #2F80ED; --gold: #FFC83D; --display: "Lilita One", "Fredoka", system-ui, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8FD0FF; font-family: Fredoka, system-ui, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }
#cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
[hidden] { display: none !important; }

/* HUD */
.hud { position: fixed; z-index: 4; pointer-events: none; font: 400 22px/1 var(--display); color: #FFFFFF; -webkit-text-stroke: 5px var(--ink); paint-order: stroke fill; letter-spacing: .03em; }
#hudTime { top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 16px); }
#hudScore { top: calc(env(safe-area-inset-top, 0px) + 14px); right: calc(env(safe-area-inset-right, 0px) + 16px); text-align: right; }
.hud small { display: block; font-size: 13px; -webkit-text-stroke: 4px var(--ink); opacity: .95; margin-bottom: 2px; }
.hud b { font-weight: 400; font-size: 34px; }
#hudSpeed { right: calc(env(safe-area-inset-right, 0px) + 14px); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: 150px; height: 96px; -webkit-text-stroke: 0; }
#hudSpeed canvas { width: 150px; height: 96px; }
#hudGates { left: calc(env(safe-area-inset-left, 0px) + 16px); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); font-size: 18px; }
#pauseBtn { position: fixed; z-index: 6; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%); width: 50px; height: 50px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); font-size: 20px; box-shadow: 0 6px 16px rgba(20,30,70,.25); }

/* centre call-outs */
#call { position: fixed; z-index: 5; left: 50%; top: 30%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; font: 400 clamp(46px, 9vw, 96px)/1 var(--display); color: #FFFFFF; -webkit-text-stroke: 9px var(--ink); paint-order: stroke fill; letter-spacing: .02em; white-space: nowrap; opacity: 0; }
#call small { display: block; font-size: .38em; -webkit-text-stroke: 5px var(--ink); margin-top: 6px; color: var(--gold); }
#call.show { animation: call 1.3s cubic-bezier(.2,1.4,.4,1) forwards; }
#call.gold { color: var(--gold); }
#call.pink { color: #FF7AB6; }
#call.blue { color: #7FD4FF; }
@keyframes call { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.3) rotate(-8deg); } 18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12) rotate(2deg); } 30% { transform: translate(-50%, -50%) scale(1) rotate(0); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -64%) scale(.96); } }
#section { position: fixed; z-index: 5; left: 50%; top: 16%; transform: translateX(-50%); pointer-events: none; text-align: center; font: 400 clamp(28px, 5vw, 48px)/1 var(--display); color: #FFFFFF; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; opacity: 0; transition: opacity .5s; white-space: nowrap; }
#section small { display: block; font-size: .45em; color: var(--gold); -webkit-text-stroke: 4px var(--ink); margin-bottom: 4px; letter-spacing: .12em; }
#section.show { opacity: 1; }
#hint { position: fixed; z-index: 5; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); transform: translateX(-50%); pointer-events: none; font: 600 20px/1.2 Fredoka, system-ui, sans-serif; background: rgba(22,32,74,.78); color: #FFFFFF; padding: 10px 20px; border-radius: 999px; white-space: nowrap; transition: opacity .5s; }

/* menus */
.screen { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2vh, 18px); padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 12px); background: linear-gradient(180deg, rgba(47,128,237,.55), rgba(143,208,255,.2) 60%, rgba(255,255,255,.1)); overflow-y: auto; touch-action: pan-y; }
.logo { font: 400 clamp(46px, 10vw, 112px)/.9 var(--display); color: #FFFFFF; -webkit-text-stroke: 12px var(--ink); paint-order: stroke fill; text-shadow: 0 10px 0 #0E1638; transform: rotate(-3deg); text-align: center; margin: 0; }
.logo em { font-style: normal; color: var(--gold); display: block; font-size: 1.25em; }
.pick { font: 400 clamp(22px, 3.4vw, 34px)/1 var(--display); color: var(--ink); background: rgba(255,255,255,.92); padding: 10px 24px; border-radius: 999px; box-shadow: 0 5px 0 rgba(22,32,74,.2); letter-spacing: .04em; }
.riders { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 1.6vw, 18px); width: min(980px, 100%); }
.rcard { border: 0; padding: 8px 8px 10px; border-radius: 22px; background: rgba(255,255,255,.9); box-shadow: 0 6px 0 rgba(22,32,74,.2); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 400 clamp(18px, 2.6vw, 28px)/1 var(--display); color: var(--ink); transition: transform .15s; }
.rcard canvas { width: 100%; aspect-ratio: 3 / 4; border-radius: 16px; background: linear-gradient(180deg, #CFEAFF, #FFFFFF); }
.rcard small { font: 600 13px/1 Fredoka, system-ui, sans-serif; color: #5A6490; }
.rcard.sel { outline: 5px solid var(--hot); transform: translateY(-4px) scale(1.03); }
.carousel { display: flex; align-items: center; gap: 14px; width: min(900px, 100%); }
.arrow { flex: none; width: 64px; height: 64px; border-radius: 50%; border: 0; background: #FFFFFF; font: 400 34px/1 var(--display); color: var(--ink); box-shadow: 0 5px 0 rgba(22,32,74,.2); cursor: pointer; }
#boardCv { flex: 1; min-width: 0; height: clamp(200px, 40vh, 340px); border-radius: 26px; background: radial-gradient(90% 80% at 50% 45%, #FFFFFF, #CFEAFF); box-shadow: 0 6px 0 rgba(22,32,74,.18); touch-action: pan-y; }
#boardName { font: 400 clamp(28px, 4.4vw, 46px)/1 var(--display); color: #FFFFFF; -webkit-text-stroke: 7px var(--ink); paint-order: stroke fill; }
.dots { display: flex; gap: 8px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.6); }
.dots i.on { background: var(--hot); }
.go { border: 0; cursor: pointer; font: 400 clamp(28px, 4vw, 40px)/1 var(--display); letter-spacing: .04em; color: #FFFFFF; padding: 16px 48px; border-radius: 999px; background: linear-gradient(180deg, #FF7AAE, var(--hot) 55%, #D92F6B); box-shadow: 0 8px 0 #9E1E4B, 0 14px 28px rgba(158,30,75,.35); }
.go:active { transform: translateY(5px); box-shadow: 0 3px 0 #9E1E4B; }
.go.ghost { background: #FFFFFF; color: var(--ink); box-shadow: 0 6px 0 rgba(22,32,74,.22); font-size: clamp(20px, 2.8vw, 26px); padding: 12px 26px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.panel { width: min(560px, 100%); background: rgba(255,255,255,.95); border-radius: 28px; padding: 18px 22px; box-shadow: 0 8px 0 rgba(22,32,74,.2); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats div { background: #EEF5FF; border-radius: 16px; padding: 10px 12px; text-align: center; }
.stats b { display: block; font: 400 30px/1 var(--display); color: var(--ink); }
.stats span { font: 600 13px/1.2 Fredoka, system-ui, sans-serif; color: #5A6490; letter-spacing: .04em; }
.stats .wide { grid-column: 1 / -1; }
#finishCv { width: 180px; height: 170px; }
@media (max-width: 700px) { .riders { grid-template-columns: repeat(2, 1fr); } .hud b { font-size: 26px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="hudTime" hidden><small>TIME</small><b id="tTime">0:00.0</b></div>
<div class="hud" id="hudScore" hidden><small>SCORE</small><b id="tScore">0</b></div>
<div class="hud" id="hudGates" hidden>🚩 <span id="tGates">0</span></div>
<div class="hud" id="hudSpeed" hidden><canvas id="speedCv" width="300" height="192"></canvas></div>
<button id="pauseBtn" type="button" aria-label="Pause" hidden>⏸</button>
<div id="call"></div>
<div id="section"></div>
<div id="hint" hidden>Drag left and right to steer · Tap to jump!</div>

<section class="screen" id="riderScreen">
  <h1 class="logo">360<em>SNOWBOARDING</em></h1>
  <div class="pick">SELECT RIDER</div>
  <div class="riders" id="riders"></div>
  <button class="go" id="riderNext" type="button">NEXT ›</button>
</section>

<section class="screen" id="boardScreen" hidden>
  <div class="pick">SELECT BOARD</div>
  <div id="boardName">FIRE BOARD</div>
  <div class="carousel">
    <button class="arrow" id="prevBoard" type="button" aria-label="Previous board">‹</button>
    <canvas id="boardCv"></canvas>
    <button class="arrow" id="nextBoard" type="button" aria-label="Next board">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="row"><button class="go ghost" id="boardBack" type="button">‹ RIDER</button><button class="go" id="rideBtn" type="button">RIDE!</button></div>
</section>

<section class="screen" id="pauseScreen" hidden>
  <div class="pick">PAUSED</div>
  <div class="row"><button class="go" id="resumeBtn" type="button">KEEP RIDING</button><button class="go ghost" id="quitBtn" type="button">CHANGE RIDER</button></div>
</section>

<section class="screen" id="finishScreen" hidden>
  <h1 class="logo" style="font-size:clamp(48px,9vw,96px)">FINISH!</h1>
  <canvas id="finishCv"></canvas>
  <div class="panel">
    <div class="stats">
      <div><b id="fTime">0:00.0</b><span>TIME</span></div>
      <div><b id="fScore">0</b><span>SCORE</span></div>
      <div><b id="fSpeed">0</b><span>TOP SPEED (MPH)</span></div>
      <div><b id="fGates">0</b><span>GATES HIT</span></div>
      <div class="wide"><b id="fTrick">—</b><span>BIGGEST TRICK</span></div>
    </div>
  </div>
  <div class="row">
    <button class="go" id="againBtn" type="button">RACE AGAIN</button>
    <button class="go ghost" id="changeRider" type="button">CHANGE RIDER</button>
    <button class="go ghost" id="changeBoard" type="button">CHANGE BOARD</button>
  </div>
  <button class="go ghost" data-rw-back hidden>BACK TO ROSENBERG WORLD</button>
</section>

<script src="../coco-party/art.js"></script>
<script src="riders.js"></script>
<script src="boards.js"></script>
<script src="game.js"></script>
</body>
</html>
