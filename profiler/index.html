<title>Profiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: sticky top bar with four views; profile = header, KPI strip, fact bar, tabbed body. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --sunk:#e9edef; --ink:#0f1b24; --ink-2:#4b5b67; --ink-3:#7b8994;
  --line:#dbe1e5; --accent:#0d6b6b; --accent-ink:#ffffff; --accent-soft:#dcefee; --warn:#9a5b00; --warn-soft:#fbecd2;
  --bad:#b3261e; --good:#1c7c3c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s0:#a3adb4;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body:"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1317; --surface:#141c22; --sunk:#1b252c; --ink:#e5ecf0; --ink-2:#9dadb8; --ink-3:#6f808c;
  --line:#26323b; --accent:#58b8b3; --accent-ink:#06201f; --accent-soft:#16312f; --warn:#e0a54a; --warn-soft:#33270f;
  --bad:#ef7b73; --good:#5cc27f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#56636c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1317; --surface:#141c22; --sunk:#1b252c; --ink:#e5ecf0; --ink-2:#9dadb8; --ink-3:#6f808c;
  --line:#26323b; --accent:#58b8b3; --accent-ink:#06201f; --accent-soft:#16312f; --warn:#e0a54a; --warn-soft:#33270f;
  --bad:#ef7b73; --good:#5cc27f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#56636c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{font:400 26px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand small{font:500 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:7px 12px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.secsel select{font-weight:600;padding:6px 28px 6px 10px;border-radius:999px;background:var(--surface);max-width:260px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.live{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--good)}
.dot.off{background:var(--bad)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font:400 44px/1.02 var(--f-display);letter-spacing:-.01em}
.page-h p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{padding:4px 10px;font-size:12px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.lock{background:var(--warn-soft);color:var(--warn);border:0;padding:2px 8px}
.pill.lock:hover{text-decoration:line-through}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1 1 240px;min-width:0}
.acwrap{position:relative}
.ac{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,27,36,.14)}
.ac li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 10px;border-radius:7px;cursor:pointer}
.ac li:hover,.ac li[aria-selected="true"]{background:var(--sunk)}
.ac-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-s{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{width:100%}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface);white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--sunk)}
.cname{font-weight:600}
.cname small{display:block;font-weight:400;color:var(--ink-3);font-size:12px;max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .x{opacity:0;border:0;background:none;color:var(--ink-3);padding:0 4px;font-size:16px;line-height:1}
tr:hover td .x,td .x:focus{opacity:1}
td .x:hover{color:var(--bad)}

/* editable */
[contenteditable]{border-radius:4px;outline:none;transition:background .12s}
[contenteditable]:hover{background:var(--sunk)}
[contenteditable]:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-3)}
td[contenteditable]{min-width:60px}

/* profile */
.crumb{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.crumb a{color:var(--ink-2);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.ph{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.ph-main{min-width:0;flex:1 1 420px}
.ph h1{font:400 52px/1 var(--f-display);letter-spacing:-.015em;display:inline-block;padding:0 4px;margin-left:-4px}
.ph .sub{color:var(--ink-2);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .val{font:500 26px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:6px;display:flex;align-items:baseline;gap:3px}
.kpi .val .u{font-size:13px;color:var(--ink-3)}
.kpi .val [contenteditable]{padding:0 3px}
.kpi .note{font-size:12px;color:var(--ink-3);margin-top:2px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(even){border-left:1px solid var(--line)}.ph h1{font-size:40px}.page-h h1{font-size:36px}}

.facts{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px dashed var(--line);border-radius:var(--r)}
.facts input{flex:1 1 280px;min-width:0}
.facts .lab{font-size:12px;font-weight:600;color:var(--ink-2);padding-inline:4px}

.run.warnrun{background:var(--warn-soft,#fbeee2)}
.run .sp{flex:1}
.run{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.run.err{background:var(--warn-soft)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:26px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 12px;color:var(--ink-2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{font:500 11px var(--f-mono);color:var(--ink-3);margin-left:4px}

.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:15px;font-weight:600}
.sec-h .sp{flex:1}
.lede{font-size:17px;line-height:1.5;max-width:70ch;padding:2px 4px;margin-left:-4px}
.take{margin-top:12px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0;max-width:78ch}
.take .eyebrow{margin-bottom:4px}

.pies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.pies{grid-template-columns:minmax(0,1fr)}}
.pie{padding:16px;min-width:0}
.pie h3{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:center;min-height:28px}
.pie-body{display:flex;gap:16px;align-items:center}
.pie svg{flex:0 0 132px;width:132px;height:132px}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:grid;gap:5px}
.legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;border-radius:4px;padding:1px 3px}
.legend li.hl{background:var(--sunk)}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.legend .pv{font-family:var(--f-mono);color:var(--ink)}
.pie .empty{color:var(--ink-3);font-size:13px;padding:30px 0;text-align:center}
@media (max-width:420px){.pie-body{flex-direction:column;align-items:stretch}.pie svg{align-self:center}}
path.sl{cursor:default;transition:opacity .12s}
svg:hover path.sl{opacity:.55}
svg path.sl:hover{opacity:1}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:800px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;padding:14px 16px}
.kv dt{color:var(--ink-3);font-size:12px;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd [contenteditable]{display:block;padding:0 4px;margin-left:-4px}
.md{max-width:74ch;color:var(--ink);padding:4px 0}
.md h3{font-size:16px;margin:18px 0 6px}
.md h4{font-size:14px;margin:14px 0 4px}
.md p{margin:0 0 10px}
.md ul{margin:0 0 10px;padding-left:20px}
.md li{margin-bottom:3px}
.basis{font-size:12px;color:var(--ink-3);max-width:80ch}
.basis b{color:var(--ink-2);font-weight:600}

/* empty profile */
.empty-hero{padding:40px 28px;text-align:left;max-width:720px}
.empty-hero h2{font:400 30px/1.15 var(--f-display);margin-bottom:8px}
.empty-hero textarea{width:100%;min-height:110px;margin:14px 0 12px;resize:vertical}

/* home */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:22px}
.stat .v{font:500 28px/1.1 var(--f-mono)}
.stat .l{font-size:12px;color:var(--ink-3)}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input{min-width:0;flex:1 1 220px}

/* targets */
.split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.tlist{max-height:70vh;overflow:auto;padding:4px}
.tlist button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;gap:8px;align-items:center;justify-content:space-between}
.tlist button:hover{background:var(--sunk)}
.tlist button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.tlist button[aria-current="true"] .faint{color:inherit;opacity:.7}
.tlist .t-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.detail{padding:20px}
.detail h2.tt{font:400 32px/1.1 var(--f-display);margin-bottom:4px}
.links{display:grid;gap:8px;margin-top:14px}
.lnk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.lnk .who{font-weight:600}
.lnk .who a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.lnk .who a:hover{border-color:var(--ink)}
.kind{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.k-acq{background:var(--accent-soft);color:var(--accent)}
.k-idea{background:var(--warn-soft);color:var(--warn)}
.k-buyer{background:var(--sunk);color:var(--ink-2)}

/* bars */
.bars{display:grid;gap:4px;padding:10px}
.brow{display:grid;grid-template-columns:28px minmax(120px,260px) minmax(0,1fr) 90px;gap:12px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.brow:hover{background:var(--sunk)}
.brow .rk{font:500 12px var(--f-mono);color:var(--ink-3)}
.brow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.brow .v{text-align:right;font-family:var(--f-mono)}
@media (max-width:600px){.brow{grid-template-columns:22px minmax(0,1fr) 70px}.brow .track{grid-column:2/4}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.note-box{padding:14px 16px;font-size:13px;color:var(--ink-2)}
.fact-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fact-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fact-list .when{font-size:11px;color:var(--ink-3)}

.cb{display:inline-flex;align-items:center;font:600 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;border-radius:4px;border:0;cursor:default;white-space:nowrap;vertical-align:middle}
button.cb{cursor:pointer}
button.cb:hover{outline:1px solid currentColor}
.cv{background:var(--accent);color:var(--accent-ink)}
.ch{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.cm{background:var(--warn-soft);color:var(--warn)}
.cl{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.cx{background:var(--sunk)}
td.confcell{font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;background:transparent}
td.confcell.ch{color:var(--good)} td.confcell.cm{color:var(--warn)} td.confcell.cl{color:var(--bad)} td.confcell.cv{color:var(--accent)}
.strength{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.sbar{display:flex;gap:2px;width:180px;height:8px;border-radius:4px;overflow:hidden}
.sbar span{height:100%}
.sbar .cv{background:var(--accent)}
.sbar .ch{background:var(--good)}
.sbar .cm{background:var(--warn)}
.sbar .cl{background:var(--bad)}
.btn.enh{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn.enh:hover{background:var(--accent-soft)}
.btn.enh::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.pill .spin{width:10px;height:10px;border-width:2px}
.kpi-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.kpi-foot .sp,.sec-h .sp{flex:1}
.sugg{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0 12px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);font-size:13px}
.sugg .mono{font-size:12px}
.sugg-a{display:flex;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:3px}
.t-lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.t-val{font:500 22px/1.25 var(--f-mono);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:3px;overflow-wrap:anywhere}
.t-val.txt{font:600 17px/1.3 var(--f-body)}
.t-val .u{font-size:12px;color:var(--ink-3)}
.t-sub{font-size:12px;color:var(--ink-3);min-height:18px}
.pbar{height:4px;border-radius:2px;background:var(--sunk);margin-top:6px;overflow:hidden}
.pbar div{height:100%;background:var(--accent);border-radius:2px}
.list-p{padding:4px 0}
.list-p .li{padding:9px 14px;border-bottom:1px solid var(--line)}
.list-p .li:last-child{border-bottom:0}
.list-p .who{font-weight:600}
.list-p .who a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.list-p .who a:hover{border-color:var(--ink)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:280px;line-height:1.35}

<script>

/* ---------- sectors ---------- */

  ["food", "Food & nutrition ingredients", "Food ingredients"], ["flavors", "Flavors & fragrances", "Flavors & fragrances"], ["coatings", "Coatings, adhesives & sealants", "Coatings"],

  ["oilfield", "Oilfield & energy chemicals", "Oilfield"], ["pulp", "Pulp & paper chemicals", "Pulp & paper"], ["pharma", "Pharma & life-science ingredients", "Pharma"],

  ["mining", "Mining & metals chemicals", "Mining"], ["inorganics", "Commodity & inorganic chemicals", "Inorganics"], ["specialty", "Specialty & intermediate chemicals", "Specialty"],

  id = id || primarySector(c);
  const order = memod("rank:" + id, () => list().filter(p => inSector(p, id) && sectorRev(p, id)).sort((a, b) => sectorRev(b, id) - sectorRev(a, id)).map(p => p.id));
  const i = order.indexOf(c.id); return i < 0 ? null : { rank: i + 1, of: order.length };

  if (!tot) { o[primarySector(c)] = 100; return o; }

}

function fmtM(v) {

}
const fmtPct = v => num(v) === null ? "—" : (+v).toFixed(+v < 10 && +v % 1 ? 1 : 0) + "%";
const fmtInt = v => num(v) === null ? "" : (+v).toLocaleString("en-US", { maximumFractionDigits: 1 });
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); } catch { return ""; } };
const yearOf = s => { const m = String(s || "").match(/(19|20)\d{2}/); return m ? +m[0] : 0; };
const dateKey = s => { const m = String(s || "").match(/((?:19|20)\d{2})(?:-(\d{1,2}))?(?:-(\d{1,2}))?/); return m ? +m[1] * 10000 + (+(m[2] || 0)) * 100 + (+(m[3] || 0)) : 0; };

/* ---------- state ---------- */
let db = null, sample = null;
const companies = new Map();
const details = {};                    // id -> detail doc (loaded on open)
let detailSub = null, detailId = null;
let meta = { deals: [], entities: [] };
let queueDocs = [];
let ver = 0; const memo = {};
const memod = (k, f) => (memo[k] && memo[k].v === ver) ? memo[k].x : (memo[k] = { v: ver, x: f() }).x;
let nameIndex = new Map(), entityIndex = new Map();
let loaded = false, dbState = "connecting", writable = true;
const runs = {};                       // id -> {phase, ctl, error}
const ui = { ac: -1, acOpen: false, sort: "secrev", dir: -1, q: "", scope: "", otype: "", emTax: "broad", tq: "", tsel: null, pq: "", psort: "year", pdir: -1, em: "Municipal drinking water", emMode: "pct", editMd: false, confirmDel: false };

const seeding = {};

function route() {
  const h = (location.hash || "#companies").slice(1);
  if (h.startsWith("c.")) { const [, id, tab] = h.split("."); return { view: "company", id, tab: tab || "snapshot" }; }

/* ---------- toast & tooltip ---------- */
let toastT;

function setLive() {

  const map = {
    connecting: ["", "Connecting"],
    live: ["on", `Saved · ${companies.size} ${companies.size === 1 ? "company" : "companies"}`],

/* ---------- derived data ---------- */
function getC(id) {

}
// Name variants a company is known by: full name, name before brackets, bracketed names, parts split on "/", and a
// distinctive first word when no other company shares it. Lets "Nalco (Ecolab)" or "Veolia" find the right profile.
const GENERIC = new Set(["water", "aqua", "chemical", "chemicals", "chem", "industrial", "american", "national", "united", "advanced", "global", "custom", "technical", "hydro", "environmental", "international", "specialty", "applied", "integrated", "precision", "premier", "southern", "northern", "western", "eastern", "pacific", "atlantic", "midwest", "great", "green", "clear", "pure", "total", "general", "universal", "superior", "quality", "process", "engineered", "delta", "alpha", "summit", "valley", "river", "coastal"]);

  const add = x => { let k = norm(x).replace(/^u s /, "united states ").replace(/^us /, "united states "); if (!k || k.length < 3) return; out.add(k); let core = k; while (SUFFIX.test(core)) core = core.replace(SUFFIX, ""); if (core.length >= 4) out.add(core); };

const list = () => [...companies.values()];
function segments(c) {

let tams = {};                         // sectorId -> tam doc
const tamBusy = {};
const REL_W = { High: 3, Medium: 2, Low: 1 };
const GEOS = ["US", "North America", "Global"];
// Starter profile from a name plus whatever Claude estimated. Used by sector build-outs and TAM suggestions.
async function createStarter(r, sid, how) {

  const others = (Array.isArray(r.other_sectors) ? r.other_sectors : []).filter(x => x !== sid && allSectors().some(z => z.id === x)).map(x => ({ sector: x, revenue_usd_m: null, pct: null }));
  const line = { sector: sid, revenue_usd_m: num(r.sector_revenue_usd_m), pct: num(r.sector_pct) };

    total_revenue_usd_m: num(r.total_revenue_usd_m), total_ebitda_usd_m: num(r.total_ebitda_usd_m), employees_total: num(r.employees_total), confidence: "Low", status: "ready",
    acquisitions: [], buyers: [], addon_ideas: [], competitors: [], locked: [], source_of_truth: [], created_at: now(), updated_at: now(), section_meta: {} };
  if (doc.total_revenue_usd_m && doc.total_ebitda_usd_m) doc.ebitda_margin_pct = +(doc.total_ebitda_usd_m / doc.total_revenue_usd_m * 100).toFixed(1);
  const det = { what_it_is: r.what_it_is || r.why || "", runs: [{ at: now(), kind: how, summary: `Added as a starter profile in ${sec?.name || sid}. Figures are estimates; use Enhance all to fill in the rest.` }], customers: [] };
  await db.doc("companies/" + id).set(doc); await db.doc("details/" + id).set(det);
  companies.set(id, { ...doc, id }); details[id] = det; ver++;
  return id;
}
async function saveTam(sid, patch) {
  const cur = tams[sid] || {}, next = { ...cur, ...patch, sector: sid, updated_at: now() };
  tams[sid] = next; ver++;
  try { await db.doc("tam/" + sid).set(next); } catch (e) { handleWriteError(e); }
}

// Bring every source to the base year with its own growth rate (or the median of the others), weight by
// reliability, and down-weight outliers far from the median.
function triangulate(t) {
  const geo = t?.geo || "US", base = +(t?.base_year || 2025);
  const src = (t?.sources || []).filter(x => num(x.value_usd_m));
  const cagrs = src.map(x => num(x.cagr_pct)).filter(x => x !== null);
  const medC = median(cagrs) ?? 4;
  const rows = src.map((x, i) => {
    const inGeo = (x.geography || "US") === geo, g = num(x.cagr_pct) ?? medC, yr = +(yearOf(x.year) || base);
    const adj = num(x.value_usd_m) * Math.pow(1 + g / 100, base - yr);
    return { ...x, i, inGeo, adj, g, w0: REL_W[x.reliability] || 1 };
  });
  const use = rows.filter(r => r.inGeo);
  const med = median(use.map(r => r.adj));
  for (const r of use) { r.outlier = med && (r.adj > 2.5 * med || r.adj < med / 2.5); r.w = r.w0 * (r.outlier ? 0.25 : 1); }
  const W = use.reduce((s, r) => s + r.w, 0);
  const tam = W ? use.reduce((s, r) => s + r.adj * r.w, 0) / W : null;
  const vals = use.map(r => r.adj);
  return { rows, tam, lo: vals.length ? Math.min(...vals) : null, hi: vals.length ? Math.max(...vals) : null, n: use.length, geo, base, medC };
}
const tamValue = t => num(t?.override_usd_m) ?? triangulate(t).tam;
function foundTam(sid) {
  return memod("found:" + sid, () => {
    const rows = list().filter(c => inSector(c, sid)).map(c => ({ c, r: sectorRev(c, sid) || 0 })).filter(x => x.r > 0).sort((a, b) => b.r - a.r);
    return { rows, total: rows.reduce((s, x) => s + x.r, 0) };
  });
}
// Simple database search: names that profiles in this sector mention but that have no profile yet.
function mentionedNotProfiled(sid) {
  return memod("mentioned:" + sid, () => {
    const m = new Map(), dismissed = new Set((tams[sid]?.dismissed || []).map(norm));
    const add = (name, how, from) => {
      const k = norm(name); if (!k || k.length < 3 || dismissed.has(k) || findCompanyByName(name)) return;
      if (/^(private equity|ipo|not a realistic|chinese |on-site|other)|->|sold to|\b(funds?|sponsors?|investors?|platforms|producers|private equity|pe firms?|regional|generation systems|backed|market)\b/i.test(name) || name.length > 60) return;
      const e = m.get(k) || { name, how: new Set(), from: new Set(), n: 0 }; e.n++; e.how.add(how); e.from.add(from); m.set(k, e);
    };
    // Deal targets are already owned by their acquirer, so only competitors, buyers and add-on ideas count.
    for (const c of list().filter(c => primarySector(c) === sid)) {
      for (const x of c.competitors || []) add(x.name, "competitor", c.name);
      for (const x of c.buyers || []) add(x.name, "buyer", c.name);
      for (const x of c.addon_ideas || []) add(x.target, "add-on idea", c.name);
    }
    return [...m.values()].sort((a, b) => b.n - a.n).slice(0, 25);
  });
}

function dbCandidates(q) {
  const lo = x => String(x || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(), k = lo(q);
  if (!k) return [];
  const hit = findCompanyByName(q), out = hit ? [hit] : [];
  for (const c of list()) { if (out.length >= 4) break; if (c !== hit && (lo(c.name).includes(k) || (k.length > 4 && k.includes(lo(c.name).split(" ")[0]) && lo(c.name).split(" ")[0].length > 4))) out.push(c); }
  return out;
}

    <div class="sec">${secHead(c, "revenue_by_product", "Products", "", "products", ["revenue_by_product"])}
    ${editTable(c, "revenue_by_product", [{ k: "product", label: "Product line" }, { k: "revenue_usd_m", label: "$M", t: "num", w: "90px" }, { k: "pct", label: "%", t: "num", w: "70px" }], prods, { empty: "No product split yet. Hit Enhance and Claude fills it in." })}</div>
    <div class="sec">${secHead(c, "product_em_map", "Where products go", `<span class="faint" style="font-size:12px">Each category's split across end markets. The end-market mix below is rolled up from this, weighted by category revenue.</span>`, "endmarkets", ["product_em_map"])}
    ${editTable(c, "product_em_map", [{ k: "category", label: "Product category", w: "220px" }, { k: "end_market", label: "End market", w: "220px" }, { k: "pct", label: "% of category", t: "num", w: "110px" }, { k: "customers", label: "Typical customers" }], tableRows(c, "product_em_map"), { empty: "Not mapped yet. Build the product catalog first, then Enhance end markets." })}</div>
    <div class="sec">${secHead(c, EM_FIELD, "End markets", `<span class="faint num" style="font-size:12px">Sum ${fmtPct(emSum)}</span>`)}
    ${editTable(c, EM_FIELD, [{ k: "name", label: "End market" }, { k: "pct", label: "% of revenue", t: "num", w: "120px" }, { k: "_d", label: "$M", t: "num", ro: true, w: "90px", fmt: r => rev !== null && num(r.pct) ? fmtM(rev * r.pct / 100) : "—" }], ems, { empty: "No end-market split yet. Hit Enhance and Claude fills it in." })}</div>`;
  }
  const E = what => `Nothing here yet. Hit Enhance and Claude fills in ${what}, or add rows yourself.`;
  if (tab === "customers") return `<div class="sec">${secHead(c, "customers", "Top customers", "", "customers")}${editTable(c, "customers", [{ k: "name", label: "Customer" }, { k: "what", label: "What they buy" }, { k: "share_pct", label: "% of rev", t: "num", w: "90px" }, { k: "source", label: "Basis", w: "200px" }, CONF_COL], tableRows(c, "customers"), { empty: E("the top customers") })}</div>`;
  if (tab === "products") {
    const legacy = !(c.products || []).length && (c.chemistries || []).length;
    const roll = productRollup(c);
    return `<div class="sec">${secHead(c, "products", "Product catalog", roll.length ? `<span class="faint" style="font-size:12px">${catalog(c).length} lines in ${roll.length} categories</span>` : "", "products", ["products"])}
      <p class="muted" style="margin:-4px 0 10px;font-size:13px">Category → product line → named products. ${legacy ? "This is the short list from the water index; Enhance turns it into a full catalog." : "Each Enhance goes one level deeper. End markets are built from where these categories go."}</p>
      ${editTable(c, "products", [{ k: "category", label: "Category", w: "150px" }, { k: "line", label: "Line / brand", w: "130px" }, { k: "named_products", label: "Named products", w: "170px" }, { k: "what_it_is", label: "What it is", w: "170px" }, { k: "applications", label: "Applications", w: "170px" }, { k: "end_markets", label: "End markets", w: "150px" }, { k: "made_or_resold", label: "Made / resold", w: "90px" }, { k: "share_pct", label: "% rev", t: "num", w: "64px" }, CONF_COL], tableRows(c, "products"), { empty: "No product catalog yet. Hit Enhance and Claude builds one from the overview and M&A history." })}</div>`;
  }
  if (tab === "competitors") {
    const rev = reverseLinks().comp.get(c.id) || [], named = new Set((c.competitors || []).map(x => findCompanyByName(x.name, c.id)?.id).filter(Boolean));
    const lc = likelyCompetitors(c).filter(x => !named.has(x.p.id));
    return `<div class="sec">${secHead(c, "competitors", "Top competitors", "", "competitors")}${editTable(c, "competitors", [{ k: "name", label: "Competitor", w: "240px" }, { k: "_m", label: "In Profiler", ro: true, w: "220px", fmt: r => mapCell(r.name, c.id) }, { k: "overlap", label: "Where they compete" }, CONF_COL], tableRows(c, "competitors"), { empty: E("the closest competitors") })}</div>
    <div class="sec"><div class="sec-h"><h2>Named as a competitor by</h2><span class="faint" style="font-size:12px">Profiles that list ${esc(c.name)} among their competitors</span></div>
      ${rev.length ? `<div class="tw"><table><thead><tr><th>Company</th><th class="r">${esc(sectorRevLabel(primarySector(c)))}</th><th>Where they compete</th></tr></thead><tbody>${rev.map(r => `<tr class="link" data-open="${esc(r.from.id)}"><td class="cname">${esc(r.from.name)}</td><td class="r num">${fmtM(sectorRev(r.from, primarySector(c)) ?? r.from.total_revenue_usd_m)}</td><td class="muted">${esc(r.note)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="faint">No other profile names ${esc(c.name)} as a competitor yet. This fills in as competitor lists are enhanced.</p>`}</div>
    <div class="sec"><div class="sec-h"><h2>Likely competitors from the index</h2><span class="faint" style="font-size:12px">Same business model or category, similar size and end markets, same state ranked higher</span></div>
      <div class="tw"><table><thead><tr><th>Company</th><th class="r">${esc(sectorRevLabel(primarySector(c)))}</th><th class="r">Similarity</th><th>State</th><th></th></tr></thead><tbody>${lc.map(x => `<tr><td class="cname"><a href="#c.${esc(x.p.id)}">${esc(x.p.name)}</a><small>${esc(x.p.business_model || "")}</small></td><td class="r num">${fmtM(x.r)}</td><td class="r num">${x.o.toFixed(0)}%</td><td class="muted">${esc(stateOf(x.p))}</td><td>${writable && db ? `<button class="btn sm ghost" data-act="savecomp" data-id="${esc(x.p.id)}">Save</button>` : ""}</td></tr>`).join("") || `<tr><td colspan="5" class="faint">No close match in the index.</td></tr>`}</tbody></table></div></div>`;
  }
  if (tab === "acquisitions") {
    const html = editTable(c, "acquisitions", [{ k: "date", label: "Date", w: "120px" }, { k: "target", label: "Target", w: "220px" }, { k: "what_it_does", label: "What it does" }, { k: "revenue_usd_m", label: "Rev $M", t: "num", w: "80px" }, { k: "value_usd_m", label: "Value $M", t: "num", w: "90px" }, { k: "source_url", label: "Source", link: true, w: "160px" }, CONF_COL], tableRows(c, "acquisitions"), { empty: "No deals logged. Hit Enhance to search for deals, or add one yourself." });
    return `<div class="sec">${secHead(c, "acquisitions", "M&A history", "", "deals")}<p class="muted" style="margin:-4px 0 10px;font-size:13px">Enhance looks for deals that aren't listed yet and adds them. Every deal here also shows up on Targets and Precedents.</p>${html}</div>
    ${c.rolled_in ? `<div class="sec basis"><p><b>Rolled into this platform.</b> ${esc(c.rolled_in)}</p></div>` : ""}
    ${c.addon_corrections ? `<div class="sec basis"><p><b>Notes on the deal list.</b> ${esc(c.addon_corrections)}</p></div>` : ""}`;
  }
  if (tab === "buyers") {
    const lb = likelyBuyers(c), sp = likelySponsors(c), saved = new Set((c.buyers || []).map(b => norm(b.name)));
    return `<div class="sec">${secHead(c, "buyers", "Top buyers", "", "buyers")}${editTable(c, "buyers", [{ k: "name", label: "Buyer", w: "200px" }, { k: "_m", label: "In Profiler", ro: true, w: "200px", fmt: r => mapCell(r.name, c.id) }, { k: "type", label: "Type", w: "110px" }, { k: "fit", label: "Fit", w: "70px" }, { k: "rationale", label: "Why they'd buy" }, CONF_COL], tableRows(c, "buyers"), { empty: "No buyer list saved yet. Hit Enhance and Claude ranks the best buyers, or save the likely buyers below." })}
      <p class="faint" style="font-size:12px;margin-top:8px">Every buyer that has a profile automatically lists ${esc(c.name)} on its Add-ons tab.</p></div>
    <div class="sec"><div class="sec-h"><h2>Likely buyers from the index</h2><span class="faint" style="font-size:12px">Bigger companies in Profiler with the most similar sectors and end markets, weighted toward active acquirers</span><span class="sp"></span>${writable && db && lb.length ? `<button class="btn sm ghost" data-act="savebuyers">Save top 5</button>` : ""}</div>
      <div class="tw"><table><thead><tr><th>Company</th><th>Type</th><th class="r">${esc(sectorRevLabel(primarySector(c)))}</th><th class="r">Similarity</th><th class="r">Deals</th><th></th></tr></thead><tbody>${lb.map((b, i) => `<tr><td class="cname"><a href="#c.${esc(b.p.id)}">${esc(b.p.name)}</a><small>${esc(b.p.primary_category || "")}</small></td><td class="muted">${b.p.pe_backed || b.p.owner_type === "PE-owned" ? "PE platform" : "Strategic"}</td><td class="r num">${fmtM(b.r)}</td><td class="r num">${b.o.toFixed(0)}%</td><td class="r num">${b.n}</td><td>${writable && db && !saved.has(norm(b.p.name)) ? `<button class="btn sm ghost" data-act="savebuyer" data-r="${i}">Save</button>` : saved.has(norm(b.p.name)) ? `<span class="faint" style="font-size:12px">Saved</span>` : ""}</td></tr>`).join("") || `<tr><td colspan="6" class="faint">No larger company in the index shares enough of its end markets.</td></tr>`}</tbody></table></div>
      ${sp.length ? `<p class="basis" style="margin-top:10px"><b>Sponsors to call.</b> ${sp.map(s => `${esc(s.name)} (owns <a href="#c.${esc(s.via.id)}">${esc(s.via.name)}</a>)`).join(" · ")}</p>` : ""}</div>`;
  }
  if (tab === "addons") {
    const al = addonList(c);
    const rows = al.map((x, j) => `<tr><td class="cname">${x.id ? `<a href="#c.${esc(x.id)}">${esc(x.name)}</a>` : esc(x.name)}</td><td><span class="kind ${SRC[x.src][0]}">${SRC[x.src][1]}</span></td><td class="muted" style="font-size:13px">${esc(x.why || "")}</td><td class="r num">${x.rev !== null && x.rev !== undefined ? fmtM(x.rev) : "—"}</td><td class="muted">${esc(x.state || "")}</td><td>${x.src === "saved" ? (writable && db ? `<button class="x" style="opacity:1" data-act="delrow" data-f="addon_ideas" data-r="${x.i}" aria-label="Remove">×</button>` : "") : writable && db ? `<button class="btn sm ghost" data-act="saveaddonx" data-j="${j}">Save</button>` : ""}</td></tr>`).join("");
    const nb = al.filter(x => x.src === "buyer").length;
    return `<div class="sec">${secHead(c, "", "Add-on list", `<span class="faint" style="font-size:12px">${al.length} targets${nb ? ` · ${nb} from buyer links` : ""}</span>${writable && db ? `<button class="btn sm ghost" data-act="addrow" data-f="addon_ideas">Add target</button>` : ""}`, "addons", ["addon_ideas"])}
      <p class="muted" style="margin:-4px 0 10px;font-size:13px">Companies ${esc(c.name)} could buy. <b>Saved</b> are yours or Claude's. <b>Named buyer</b> means another profile lists ${esc(c.name)} as its potential buyer. <b>Index match</b> is a smaller private company with similar end markets. Every entry also shows on Targets.</p>
      <div class="tw"><table><thead><tr><th style="width:240px">Target</th><th style="width:120px">Source</th><th>Why it fits</th><th class="r" style="width:90px">${esc(sectorRevLabel(primarySector(c)))}</th><th style="width:70px">State</th><th style="width:60px"></th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="faint">No add-on targets found. Hit Enhance and Claude suggests some.</td></tr>`}</tbody></table></div></div>
    ${(c.addon_ideas || []).length ? `<div class="sec"><div class="sec-h"><h2>Edit saved add-ons</h2></div>${editTable(c, "addon_ideas", [{ k: "target", label: "Target", w: "240px" }, { k: "rationale", label: "Why it fits" }, { k: "est_revenue_usd_m", label: "Est rev $M", t: "num", w: "100px" }, { k: "location", label: "Location", w: "150px" }], tableRows(c, "addon_ideas"))}</div>` : ""}`;
  }
  if (tab === "sources") {
    const facts = (c.source_of_truth || []).map((f, i) => `<li><div>${esc(f.text)}<div class="when">${fmtDate(f.at)}</div></div>${writable && db ? `<button class="x" style="opacity:1" data-act="delfact" data-r="${i}" aria-label="Remove fact">×</button>` : ""}</li>`).join("");
    const locked = (c.locked || []).filter(k => k !== "name");
    const runsH = [...(c.runs || [])].reverse().map(r => `<tr><td class="faint" style="white-space:nowrap">${fmtDate(r.at)}</td><td style="white-space:nowrap">${esc(r.kind)}</td><td>${esc(r.summary)}</td></tr>`).join("");
    const changes = (c.history || []).slice(0, 60).map(h => `<tr><td class="faint" style="white-space:nowrap">${fmtDate(h.at)}</td><td>${esc(label(h.field))}</td><td>${esc(h.by)}</td><td class="muted" style="font-size:12px">${esc(h.before || "—")}</td><td style="font-size:12px">${esc(h.after || "—")}</td></tr>`).join("");
    const ev = (c.evidence || []).map(e => `<tr><td>${esc(e.metric)}</td><td>${esc(e.value)}</td><td class="num">${esc(e.year)}</td><td>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.source_type || "Link")}</a>` : esc(e.source_type)}</td><td class="muted" style="font-size:12px">${e.quote ? "“" + esc(e.quote) + "”" : ""}</td></tr>`).join("");
    const qs = (queueDocs || []).filter(q => q.company_id === c.id).map(q => `<tr><td class="faint">${fmtDate(q.requested_at)}</td><td>${esc(q.status === "done" ? "Done" : q.status === "working" ? "In progress" : "Queued")}</td><td class="muted">${esc(q.result || "")}</td></tr>`).join("");
    return `
    <div class="sec grid2">
      <div><div class="sec-h"><h2>Your facts</h2></div>
        ${facts ? `<ul class="fact-list">${facts}</ul>` : `<p class="faint">No facts added yet. Use “Add a fact” above. Enhance treats your facts as the source of truth.</p>`}</div>
      <div><div class="sec-h"><h2>Overrides</h2></div>
        ${locked.length ? `<div class="chips" style="margin-top:0">${locked.map(f => `<button class="pill lock" data-act="unlock" data-f="${esc(f)}" title="Click to let Claude update it again">${esc(label(f))} ×</button>`).join("")}</div><p class="faint" style="font-size:12px">Enhance never replaces these. Click one to release it.</p>` : `<p class="faint">None. Type over any value in the profile and it becomes an override.</p>`}</div>
    </div>
    ${qs ? `<div class="sec"><div class="sec-h"><h2>Web research requests</h2></div><div class="tw"><table><thead><tr><th>Requested</th><th>Status</th><th>Result</th></tr></thead><tbody>${qs}</tbody></table></div></div>` : ""}
    ${c.open_questions ? `<div class="sec"><div class="sec-h"><h2>Open questions</h2></div><p class="muted" style="max-width:80ch">${esc(c.open_questions)}</p></div>` : ""}
    <div class="sec"><div class="sec-h"><h2>Change log</h2><span class="faint" style="font-size:12px">Every value Claude or you changed, with what it was before</span></div><div class="tw"><table><thead><tr><th>Date</th><th>Field</th><th>By</th><th>Before</th><th>After</th></tr></thead><tbody>${changes || `<tr><td colspan="5" class="faint">No changes yet.</td></tr>`}</tbody></table></div></div>
    <div class="sec"><div class="sec-h"><h2>Run history</h2></div><div class="tw"><table><thead><tr><th>Date</th><th>Run</th><th>What changed</th></tr></thead><tbody>${runsH || `<tr><td colspan="3" class="faint">No runs yet.</td></tr>`}</tbody></table></div></div>
    <div class="sec"><div class="sec-h"><h2>Evidence</h2></div><div class="tw"><table><thead><tr><th>Metric</th><th>Value</th><th>Year</th><th>Source</th><th>Quote</th></tr></thead><tbody>${ev || `<tr><td colspan="5" class="faint">No sourced evidence on file.</td></tr>`}</tbody></table></div></div>
    <div class="sec">${secHead(c, "key_sites", "Sites")}${editTable(c, "key_sites", [{ k: "type", label: "Type", w: "100px" }, { k: "address", label: "Address" }, { k: "city", label: "City", w: "180px" }, { k: "state", label: "State", w: "70px" }], tableRows(c, "key_sites"))}</div>`;
  }
  return "";
}

function viewTargets() {
  const q = ui.tq.toLowerCase();
  const sid = ui.sector, secOk = t => !sid || (t.company && inSector(t.company, sid)) || t.links.some(l => l.platformId && companies.has(l.platformId) && inSector(companies.get(l.platformId), sid));
  const ts = allTargets().filter(secOk).filter(t => !q || t.name.toLowerCase().includes(q) || t.links.some(l => String(l.platform).toLowerCase().includes(q) || String(l.what || "").toLowerCase().includes(q)))
    .sort((a, b) => b.links.length - a.links.length || a.name.localeCompare(b.name));
  if (!ts.find(t => t.key === ui.tsel)) ui.tsel = ts[0]?.key || null;
  const sel = ts.find(t => t.key === ui.tsel);
  const listHtml = ts.length ? ts.slice(0, 300).map(t => {
    const kinds = new Set(t.links.map(l => l.kind));
    return `<button data-tsel="${esc(t.key)}" aria-current="${t.key === ui.tsel}"><span class="t-n">${esc(t.name)}</span><span class="faint" style="font-size:12px;white-space:nowrap">${kinds.has("acq") || kinds.has("owned") ? "Acquired" : kinds.has("idea") ? "Idea" : "Has buyers"}</span></button>`;
  }).join("") : `<p class="faint" style="padding:12px">No targets match.</p>`;
  let detail = `<div class="detail faint">Pick a target on the left.</div>`;
  if (sel) {
    const K = { acq: ["k-acq", "Acquired by"], owned: ["k-acq", "Now part of"], idea: ["k-idea", "Add-on idea for"], buyer: ["k-buyer", "Potential buyer"] };
    const links = sel.links.map(l => `<div class="lnk"><span class="kind ${K[l.kind][0]}">${K[l.kind][1]}</span><div style="min-width:0"><div class="who">${l.platformId ? `<a href="#c.${esc(l.platformId)}.${l.kind === "idea" ? "addons" : l.kind === "acq" ? "acquisitions" : "overview"}">${esc(l.platform)}</a>` : esc(l.platform)}${l.btype ? ` <span class="faint" style="font-weight:400">· ${esc(l.btype)}</span>` : ""}</div><div class="muted" style="font-size:13px">${esc(l.what || "")}</div></div><div class="num faint" style="font-size:12px;text-align:right">${esc(l.date || "")}${l.rev !== null && l.rev !== undefined ? `<br>${fmtM(l.rev)} rev` : ""}${l.value ? `<br>${fmtM(l.value)} value` : ""}</div></div>`).join("");
    let fit = "";
    const base = sel.company || sel.entity;
    if (base) {
      const skip = new Set([sel.company?.id, sel.entity?.owner_id].filter(Boolean));
      const tsid = sel.company ? primarySector(sel.company) : "water";
      const tRev = (sel.company ? sectorRev(sel.company, tsid) : null) ?? num(sel.entity?.us_rev) ?? 0;
      const minRev = Math.max(2 * tRev, 10);
      const ranked = list().filter(p => !skip.has(p.id) && ((sectorRev(p, tsid) || 0) >= minRev || (num(p.total_revenue_usd_m) || 0) >= 3 * minRev))
        .map(p => { const o = overlap(base, p), n = (p.acquisitions || []).length; return { p, o, n, s: o * (0.6 + 0.4 * Math.min(1, n / 10)) }; })
        .filter(x => x.o > 0).sort((a, b) => b.s - a.s).slice(0, 8);
      fit = ranked.length ? `<div class="sec-h" style="margin-top:22px"><h2>Best-fit homes in Profiler</h2><span class="faint" style="font-size:12px">Companies at least twice its size, ranked by similarity in sector and end markets, boosted for active acquirers</span></div>
      <div class="panel bars" style="padding:6px">${ranked.map((x, i) => `<div class="brow" data-open="${esc(x.p.id)}" data-tip="${esc(x.p.name)}: ${x.o.toFixed(0)}% similarity · ${x.n} deals · ${fmtM(sectorRev(x.p, tsid) ?? x.p.total_revenue_usd_m)} ${esc(sectorRevLabel(tsid))}"><span class="rk">${i + 1}</span><span class="nm">${esc(x.p.name)} <span class="faint" style="font-weight:400;font-size:12px">${fmtM(sectorRev(x.p, tsid) ?? x.p.total_revenue_usd_m)} · ${x.n} deals</span></span><div class="track"><div class="fill" style="width:${Math.min(100, x.o)}%"></div></div><span class="v">${x.o.toFixed(0)}%</span></div>`).join("")}</div>` : "";
    }
    detail = `<div class="panel detail"><div class="eyebrow">Target</div><h2 class="tt">${sel.company ? `<a href="#c.${esc(sel.company.id)}" style="color:inherit;text-decoration:none">${esc(sel.name)}</a>` : esc(sel.name)}</h2>
      <div class="muted">${sel.company ? `Profiled · ${esc(sectorById(primarySector(sel.company))?.name || "")} · ${fmtM(sectorRev(sel.company))} ${esc(sectorRevLabel(primarySector(sel.company)).replace(/ rev$/, " revenue"))} · ${esc(sel.company.owner_type || "")}` : sel.entity ? esc([sel.entity.role, num(sel.entity.us_rev) ? fmtM(sel.entity.us_rev) + " US water revenue" : "", sel.entity.state].filter(Boolean).join(" · ")) : `Not profiled yet`}${!sel.company && writable && db ? ` · <button class="btn sm ghost" data-act="profile-target" data-name="${esc(sel.name)}">Create profile</button>` : ""}</div>
      ${sel.entity?.what ? `<p class="muted" style="max-width:70ch;margin:10px 0 0">${esc(sel.entity.what)}</p>` : ""}
      <div class="links">${links}</div>${fit}</div>`;
  }
  return `<div class="page-h"><div><div class="eyebrow">${esc(ui.sector ? sectorById(ui.sector)?.name : "All sectors")} · Reverse search</div><h1>Targets</h1><p>Every company that shows up as a past deal, an add-on already rolled into a platform, an add-on idea, or a company with named buyers. Pick a target to see who bought it, who wants it, and which platforms fit it best.</p></div></div>
  <div class="bar"><div class="grow"><input class="search" id="tq" type="search" placeholder="Search a target, a platform, or a keyword like Legionella" value="${esc(ui.tq)}" aria-label="Search targets"></div><span class="faint">${ts.length} targets</span></div>
  <div class="split"><div class="panel tlist">${listHtml}</div>${detail}</div>`;
}

function viewPrecedents() {
  const q = ui.pq.toLowerCase();
  const sid = ui.sector, secOk = d => !sid || [d.acquirerId, d.targetId].some(x => x && companies.has(x) && inSector(companies.get(x), sid)) || (d.water && sid === "water");
  let ds = allDeals().filter(secOk).filter(d => !q || [d.target, d.acquirer, d.what, d.date].join(" ").toLowerCase().includes(q));
  const k = ui.psort, dir = ui.pdir;
  ds.sort((a, b) => {
    if (k === "year") return dir * (dateKey(a.date) - dateKey(b.date));
    if (k === "mult") { const ma = a.value && a.rev ? a.value / a.rev : -1, mb = b.value && b.rev ? b.value / b.rev : -1; return dir * (ma - mb); }
    if (k === "value" || k === "rev") return dir * ((a[k] ?? -1) - (b[k] ?? -1));
    return dir * String(a[k] || "").localeCompare(String(b[k] || ""));
  });
  const th = (key, label, cls = "") => `<th class="sortable ${cls}" data-psort="${key}" aria-sort="${ui.psort === key ? (ui.pdir > 0 ? "ascending" : "descending") : "none"}">${label}${ui.psort === key ? (ui.pdir > 0 ? " ↑" : " ↓") : ""}</th>`;
  const withVal = ds.filter(d => d.value && d.rev);
  const med = arr => { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const medMult = med(withVal.map(d => d.value / d.rev));
  const rows = ds.map(d => {
    const tgt = d.targetId || findCompanyByName(d.target)?.id;
    return `<tr><td class="num" style="white-space:nowrap">${esc(d.date)}</td><td class="cname">${tgt ? `<a href="#c.${esc(tgt)}">${esc(d.target)}</a>` : esc(d.target)}</td><td>${d.acquirerId ? `<a href="#c.${esc(d.acquirerId)}.acquisitions">${esc(d.acquirer)}</a>` : esc(d.acquirer)}</td><td class="muted" style="font-size:13px;min-width:240px">${esc(d.what)}</td><td class="r num">${d.rev !== null ? fmtM(d.rev) : "—"}</td><td class="r num">${d.value ? fmtM(d.value) : "—"}</td><td class="r num">${d.value && d.rev ? (d.value / d.rev).toFixed(1) + "x" : "—"}</td><td>${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Source</a>` : ""}</td></tr>`;
  }).join("");
  return `<div class="page-h"><div><div class="eyebrow">${esc(sid ? sectorById(sid)?.name : "All sectors")} · Deal log</div><h1>Precedents</h1><p>Every acquisition from every profile, plus sponsor entries with a known EV. Add a deal on a company's Acquisitions tab and it lands here.</p></div></div>
  <div class="stats"><div class="stat"><div class="v">${ds.length}</div><div class="l">Deals</div></div><div class="stat"><div class="v">${ds.filter(d => d.value).length}</div><div class="l">With disclosed value</div></div><div class="stat"><div class="v">${medMult !== null ? medMult.toFixed(1) + "x" : "—"}</div><div class="l">Median EV / revenue</div></div></div>
  <div class="bar"><div class="grow"><input class="search" id="pq" type="search" placeholder="Search target, acquirer, year or description" value="${esc(ui.pq)}" aria-label="Search precedents"></div></div>
  <div class="tw"><table><thead><tr>${th("year", "Date")}${th("target", "Target")}${th("acquirer", "Acquirer")}<th>What it does</th>${th("rev", "Target rev", "r")}${th("value", "Value", "r")}${th("mult", "EV / Rev", "r")}<th>Source</th></tr></thead><tbody>${rows || `<tr><td colspan="8" class="faint">No deals match.</td></tr>`}</tbody></table></div>`;
}

function viewEndMarkets() {
  const sid = ui.sector, waterish = !sid || sid === "water", broad = waterish && ui.emTax === "broad";
  const pool = list().filter(c => inSector(c, sid));
  const names = new Set(broad ? BUCKETS : []);
  if (!broad) { const cnt = new Map(); pool.forEach(c => Object.keys(c[EM_FIELD] || {}).forEach(k => cnt.set(k, (cnt.get(k) || 0) + 1))); [...cnt.entries()].sort((a, b) => b[1] - a[1]).forEach(([k]) => names.add(k)); }
  if (!names.size) GENERIC_EM.forEach(n => names.add(n));
  if (!names.has(ui.em)) ui.em = [...names][0];
  const opts = [...names].map(n => `<option ${n === ui.em ? "selected" : ""}>${esc(n)}</option>`).join("");
  const rows = pool.map(c => { const p = num((broad ? buckets(c) : (c[EM_FIELD] || {}))[ui.em]) || 0; const rev = num(broad ? c.us_water_treatment_revenue_usd_m : c.total_revenue_usd_m); return { c, p, d: rev !== null ? rev * p / 100 : null }; }).filter(r => r.p > 0);
  const key = ui.emMode === "pct" ? "p" : "d";
  rows.sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1));
  const max = Math.max(...rows.map(r => r[key] || 0), 1);
  const total = rows.reduce((s, r) => s + (r.d || 0), 0);
  const top = rows.slice(0, 60);
  const bars = rows.length ? top.map((r, i) => `<div class="brow" data-open="${esc(r.c.id)}" data-tip="${esc(r.c.name)}: ${fmtPct(r.p)} of ${broad ? "US water revenue" : "platform revenue"} · ${fmtM(r.d)}"><span class="rk">${i + 1}</span><span class="nm">${esc(r.c.name)}</span><div class="track"><div class="fill" style="width:${((r[key] || 0) / max * 100).toFixed(1)}%"></div></div><span class="v">${key === "p" ? fmtPct(r.p) : fmtM(r.d)}</span></div>`).join("")
    : `<p class="faint" style="padding:16px">No profiled company has exposure to ${esc(ui.em)} yet.</p>`;
  return `<div class="page-h"><div><div class="eyebrow">${esc(sid ? sectorById(sid)?.name : "All sectors")} · Exposure screen</div><h1>End markets</h1><p>Pick an end market to rank companies by how much of their revenue comes from it, as a share or in dollars. The list shows the end markets companies in this sector report. ${waterish ? "For water, Broad uses the water index's eight buckets." : ""} Shows the top 60.</p></div></div>
  <div class="bar">${waterish ? `<div class="seg" role="group" aria-label="End-market detail"><button data-emtax="broad" aria-pressed="${broad}">Water buckets</button><button data-emtax="detailed" aria-pressed="${!broad}">Detailed</button></div>` : ""}
    <select id="em" aria-label="End market" style="min-width:240px">${opts}</select>
    <div class="seg" role="group" aria-label="Rank by"><button data-em="pct" aria-pressed="${ui.emMode === "pct"}">% of revenue</button><button data-em="usd" aria-pressed="${ui.emMode === "usd"}">$ revenue</button></div>
    <span class="faint">${rows.length} companies · ${fmtM(total)} combined exposure</span></div>
  <div class="panel bars">${bars}</div>`;
}

function render() {
  if (isEditing()) { pendingRender = true; return; }
  const r = route();
  document.querySelectorAll("#nav a").forEach(a => a.setAttribute("aria-current", (a.dataset.v === r.view || (r.view === "company" && a.dataset.v === "companies")) ? "page" : "false"));
  setLive();
  const ss = $("#secsel");
  if (ss && document.activeElement !== ss) {
    const counts = memod("seccounts", () => { const m = {}; for (const c of list()) for (const x of sectorsOf(c)) m[x.sector] = (m[x.sector] || 0) + 1; return m; });
    ss.innerHTML = `<option value="">All sectors</option>` + allSectors().map(x => `<option value="${esc(x.id)}" ${x.id === ui.sector ? "selected" : ""} title="${esc(x.name)}">${esc(x.short)}${counts[x.id] ? ` (${counts[x.id]})` : ""}</option>`).join("");
  }
  if (!loaded) {
    if (dbState === "off") app.innerHTML = `<div class="panel empty-hero"><h2>The repository isn't connected</h2><p class="muted">Profiler keeps its profiles in a shared database that only loads when this page is opened in Claude while signed in. Open it from your Claude artifacts to see and edit profiles.</p></div>`;
    return;
  }
  const y = scrollY;
  let html = "";
  if (r.view === "company") html = viewCompany(r.id, r.tab);
  else if (r.view === "targets") html = viewTargets();
  else if (r.view === "precedents") html = viewPrecedents();
  else if (r.view === "endmarkets") html = viewEndMarkets();
  else if (r.view === "sectors") html = viewSectors();
  else if (r.view === "tam") html = viewTam();
  else html = viewCompanies();
  const active = document.activeElement?.id, selS = document.activeElement?.selectionStart;
  app.innerHTML = html;
  if (active && ["q", "tq", "pq"].includes(active)) { const el = document.getElementById(active); el?.focus(); try { el.setSelectionRange(selS, selS); } catch {} }
  if (pendingFocus) { const el = app.querySelector(pendingFocus); pendingFocus = null; el?.focus(); }
  window.scrollTo(0, y);
}

  db.collection("tam").limit(200).onSnapshot(snap => { tams = {}; snap.docs.forEach(d => tams[d.id] = d.data()); ver++; if (loaded) render(); }, () => {});
  db.doc("meta/sectors").onSnapshot(d => { customSectors = d.exists ? (d.data().custom || []) : []; ver++; if (loaded) render(); }, () => {});
  db.doc("meta/deals").onSnapshot(d => { meta.deals = d.exists ? (d.data().deals || []) : []; ver++; if (loaded) render(); }, () => {});
  db.doc("meta/entities").onSnapshot(d => { meta.entities = d.exists ? (d.data().entities || []) : []; ver++; rebuildIndex(); if (loaded) render(); }, () => {});
  db.collection("companies").limit(1000).onSnapshot(snap => {
    companies.clear();
    snap.docs.forEach(doc => companies.set(doc.id, { ...doc.data(), id: doc.id }));
    loaded = true; ver++; rebuildIndex();
    watchDetails();
    render();
  }, err => {
    if (err?.code === "revoked" || err?.code === "not_granted") { dbState = "off"; }
    render();
  });
})();
})();
