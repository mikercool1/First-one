<title>Profiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: sticky top bar with four views; profile = header, KPI strip, fact bar, tabbed body. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --sunk:#e9edef; --ink:#0f1b24; --ink-2:#4b5b67; --ink-3:#7b8994;
  --line:#dbe1e5; --accent:#0d6b6b; --accent-ink:#ffffff; --accent-soft:#dcefee; --warn:#9a5b00; --warn-soft:#fbecd2;
  --bad:#b3261e; --good:#1c7c3c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s0:#a3adb4;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body:"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1317; --surface:#141c22; --sunk:#1b252c; --ink:#e5ecf0; --ink-2:#9dadb8; --ink-3:#6f808c;
  --line:#26323b; --accent:#58b8b3; --accent-ink:#06201f; --accent-soft:#16312f; --warn:#e0a54a; --warn-soft:#33270f;
  --bad:#ef7b73; --good:#5cc27f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#56636c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1317; --surface:#141c22; --sunk:#1b252c; --ink:#e5ecf0; --ink-2:#9dadb8; --ink-3:#6f808c;
  --line:#26323b; --accent:#58b8b3; --accent-ink:#06201f; --accent-soft:#16312f; --warn:#e0a54a; --warn-soft:#33270f;
  --bad:#ef7b73; --good:#5cc27f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#56636c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{font:400 26px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand small{font:500 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:7px 12px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.live{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--good)}
.dot.off{background:var(--bad)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font:400 44px/1.02 var(--f-display);letter-spacing:-.01em}
.page-h p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{padding:4px 10px;font-size:12px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.lock{background:var(--warn-soft);color:var(--warn);border:0;padding:2px 8px}
.pill.lock:hover{text-decoration:line-through}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1 1 240px;min-width:0}
.acwrap{position:relative}
.ac{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,27,36,.14)}
.ac li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 10px;border-radius:7px;cursor:pointer}
.ac li:hover,.ac li[aria-selected="true"]{background:var(--sunk)}
.ac-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-s{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{width:100%}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface);white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--sunk)}
.cname{font-weight:600}
.cname small{display:block;font-weight:400;color:var(--ink-3);font-size:12px;max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .x{opacity:0;border:0;background:none;color:var(--ink-3);padding:0 4px;font-size:16px;line-height:1}
tr:hover td .x,td .x:focus{opacity:1}
td .x:hover{color:var(--bad)}

/* editable */
[contenteditable]{border-radius:4px;outline:none;transition:background .12s}
[contenteditable]:hover{background:var(--sunk)}
[contenteditable]:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-3)}
td[contenteditable]{min-width:60px}

/* profile */
.crumb{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.crumb a{color:var(--ink-2);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.ph{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.ph-main{min-width:0;flex:1 1 420px}
.ph h1{font:400 52px/1 var(--f-display);letter-spacing:-.015em;display:inline-block;padding:0 4px;margin-left:-4px}
.ph .sub{color:var(--ink-2);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .val{font:500 26px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:6px;display:flex;align-items:baseline;gap:3px}
.kpi .val .u{font-size:13px;color:var(--ink-3)}
.kpi .val [contenteditable]{padding:0 3px}
.kpi .note{font-size:12px;color:var(--ink-3);margin-top:2px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(even){border-left:1px solid var(--line)}.ph h1{font-size:40px}.page-h h1{font-size:36px}}

.facts{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px dashed var(--line);border-radius:var(--r)}
.facts input{flex:1 1 280px;min-width:0}
.facts .lab{font-size:12px;font-weight:600;color:var(--ink-2);padding-inline:4px}

.run{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.run.err{background:var(--warn-soft)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:26px 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs a{padding:10px 12px;color:var(--ink-2);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .n{font:500 11px var(--f-mono);color:var(--ink-3);margin-left:4px}

.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:15px;font-weight:600}
.sec-h .sp{flex:1}
.lede{font-size:17px;line-height:1.5;max-width:70ch;padding:2px 4px;margin-left:-4px}
.take{margin-top:12px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0;max-width:78ch}
.take .eyebrow{margin-bottom:4px}

.pies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.pies{grid-template-columns:minmax(0,1fr)}}
.pie{padding:16px;min-width:0}
.pie h3{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:center;min-height:28px}
.pie-body{display:flex;gap:16px;align-items:center}
.pie svg{flex:0 0 132px;width:132px;height:132px}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:grid;gap:5px}
.legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;border-radius:4px;padding:1px 3px}
.legend li.hl{background:var(--sunk)}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.legend .pv{font-family:var(--f-mono);color:var(--ink)}
.pie .empty{color:var(--ink-3);font-size:13px;padding:30px 0;text-align:center}
@media (max-width:420px){.pie-body{flex-direction:column;align-items:stretch}.pie svg{align-self:center}}
path.sl{cursor:default;transition:opacity .12s}
svg:hover path.sl{opacity:.55}
svg path.sl:hover{opacity:1}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:800px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;padding:14px 16px}
.kv dt{color:var(--ink-3);font-size:12px;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd [contenteditable]{display:block;padding:0 4px;margin-left:-4px}
.md{max-width:74ch;color:var(--ink);padding:4px 0}
.md h3{font-size:16px;margin:18px 0 6px}
.md h4{font-size:14px;margin:14px 0 4px}
.md p{margin:0 0 10px}
.md ul{margin:0 0 10px;padding-left:20px}
.md li{margin-bottom:3px}
.basis{font-size:12px;color:var(--ink-3);max-width:80ch}
.basis b{color:var(--ink-2);font-weight:600}

/* empty profile */
.empty-hero{padding:40px 28px;text-align:left;max-width:720px}
.empty-hero h2{font:400 30px/1.15 var(--f-display);margin-bottom:8px}
.empty-hero textarea{width:100%;min-height:110px;margin:14px 0 12px;resize:vertical}

/* home */
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:22px}
.stat .v{font:500 28px/1.1 var(--f-mono)}
.stat .l{font-size:12px;color:var(--ink-3)}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input{min-width:0;flex:1 1 220px}

/* targets */
.split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.tlist{max-height:70vh;overflow:auto;padding:4px}
.tlist button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:8px;gap:8px;align-items:center;justify-content:space-between}
.tlist button:hover{background:var(--sunk)}
.tlist button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.tlist button[aria-current="true"] .faint{color:inherit;opacity:.7}
.tlist .t-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.detail{padding:20px}
.detail h2.tt{font:400 32px/1.1 var(--f-display);margin-bottom:4px}
.links{display:grid;gap:8px;margin-top:14px}
.lnk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.lnk .who{font-weight:600}
.lnk .who a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.lnk .who a:hover{border-color:var(--ink)}
.kind{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;white-space:nowrap}
.k-acq{background:var(--accent-soft);color:var(--accent)}
.k-idea{background:var(--warn-soft);color:var(--warn)}
.k-buyer{background:var(--sunk);color:var(--ink-2)}

/* bars */
.bars{display:grid;gap:4px;padding:10px}
.brow{display:grid;grid-template-columns:28px minmax(120px,260px) minmax(0,1fr) 90px;gap:12px;align-items:center;padding:6px 8px;border-radius:8px;cursor:pointer}
.brow:hover{background:var(--sunk)}
.brow .rk{font:500 12px var(--f-mono);color:var(--ink-3)}
.brow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.brow .v{text-align:right;font-family:var(--f-mono)}
@media (max-width:600px){.brow{grid-template-columns:22px minmax(0,1fr) 70px}.brow .track{grid-column:2/4}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.note-box{padding:14px 16px;font-size:13px;color:var(--ink-2)}
.fact-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.fact-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fact-list .when{font-size:11px;color:var(--ink-3)}

.btn.enh{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn.enh:hover{background:var(--accent-soft)}
.btn.enh::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.pill .spin{width:10px;height:10px;border-width:2px}
.kpi-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}
.kpi-foot .sp,.sec-h .sp{flex:1}
.sugg{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0 12px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);font-size:13px}
.sugg .mono{font-size:12px}
.sugg-a{display:flex;gap:6px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);padding:14px 16px;min-width:0;display:flex;flex-direction:column;gap:3px}
.t-lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.t-val{font:500 22px/1.25 var(--f-mono);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:3px;overflow-wrap:anywhere}
.t-val.txt{font:600 17px/1.3 var(--f-body)}
.t-val .u{font-size:12px;color:var(--ink-3)}
.t-sub{font-size:12px;color:var(--ink-3);min-height:18px}
.pbar{height:4px;border-radius:2px;background:var(--sunk);margin-top:6px;overflow:hidden}
.pbar div{height:100%;background:var(--accent);border-radius:2px}
.list-p{padding:4px 0}
.list-p .li{padding:9px 14px;border-bottom:1px solid var(--line)}
.list-p .li:last-child{border-bottom:0}
.list-p .who{font-weight:600}
.list-p .who a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.list-p .who a:hover{border-color:var(--ink)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:6px;max-width:280px;line-height:1.35}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:500}
.skeleton{padding:60px 0;color:var(--ink-3)}
</style>

<header class="top">
  <div class="top-in">
    <a class="brand" href="#companies">Profiler <small>Company repository</small></a>
    <nav class="nav" id="nav">
      <a href="#companies" data-v="companies">Companies</a>
      <a href="#targets" data-v="targets">Targets</a>
      <a href="#precedents" data-v="precedents">Precedents</a>
      <a href="#endmarkets" data-v="endmarkets">End markets</a>
    </nav>
    <div class="live" id="live"><span class="dot"></span><span>Connecting</span></div>
  </div>
</header>
<main id="app"><div class="skeleton">Loading the repository…</div></main>
<div id="tip" hidden></div>
<div id="toast" hidden></div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? null : +v;

async function save(id, patch, lockFields = [], quiet = false) {
  const c = companies.get(id); if (!c || !db) return;
  const locked = new Set(c.locked || []);
  lockFields.forEach(f => locked.add(f));
  const sum = { locked: [...locked], updated_at: now() }, det = {};
  for (const [k, v] of Object.entries(patch)) (DETAIL_KEYS.has(k) ? det : sum)[k] = v;
  // optimistic
  companies.set(id, { ...c, ...sum });
  if (Object.keys(det).length) details[id] = { ...(details[id] || {}), ...det };
  ver++;
  try {
    await db.doc("companies/" + id).update(sum);
    if (Object.keys(det).length) {
      try { await db.doc("details/" + id).update(det); }
      catch (e) { if (e?.code === "not_granted" || e?.code === "revoked" || e?.code === "quota_exceeded") throw e; await db.doc("details/" + id).set({ ...(details[id] || {}), ...det }); }
    }

  } catch (e) { handleWriteError(e); }
}
function handleWriteError(e) {
  if (e?.code === "not_granted" || e?.code === "revoked") { writable = false; dbState = "readonly"; setLive(); toast("You can view this repository but not edit it."); render(); return; }
  if (e?.code === "quota_exceeded") { toast("The repository is full. Delete a company to make room."); return; }

}

async function commit(el) {
  const r = route(); if (r.view !== "company") return;
  const c = getC(r.id); if (!c) return;
  const f = el.dataset.f, t = el.dataset.t, raw = el.innerText.replace(/ /g, " ").trim();
  const val = parseCell(t, raw);
  if (el.dataset.r !== undefined) {
    const rows = tableRows(c, f), i = +el.dataset.r, k = el.dataset.k;
    if (!rows[i]) return;
    const old = rows[i][k];
    if (String(old ?? "") === String(val ?? "")) return;
    rows[i][k] = val;
    const patch = { [f]: rowsToValue(f, rows) };
    if (f === "revenue_by_business" && k === "revenue_usd_m") recalcPct(rows, c, patch, f);
    if (f === "revenue_by_product" && k === "revenue_usd_m") recalcPct(rows, c, patch, f);
    await save(c.id, patch, [f]);

    if (f === "name" && !String(val).trim()) { el.textContent = c.name; return; }
    const patch = { [f]: val };
    const locks = [f];

      const rv = f === "total_revenue_usd_m" ? val : num(c.total_revenue_usd_m), eb = f === "total_ebitda_usd_m" ? val : num(c.total_ebitda_usd_m);

async function enhance(id, key) {

  runs[runKey(id, key)] = { ctl };

    if (!res || typeof res !== "object") throw { code: "invalid_json" };
    const cur = getC(id) || c;

    const patch = {}, sugg = { ...(cur.suggestions || {}) }, hist = [];
    let added = 0, suggested = 0;
    for (const f of sec.fields) {
      if (res[f] === undefined || res[f] === null) continue;
      let v = res[f];
      if (sec.append && Array.isArray(v)) {
        const have = new Set((cur[f] || []).map(a => norm(a.target)));
        const fresh = v.filter(a => a && a.target && !have.has(norm(a.target))).map(a => ({ ...a, added_by: "Claude", added_at: now() }));
        added = fresh.length;
        if (!fresh.length) continue;
        v = [...fresh, ...(cur[f] || [])].sort((a, b) => dateKey(b.date) - dateKey(a.date));
      }
      if (JSON.stringify(v) === JSON.stringify(cur[f])) continue;
      if (locked.has(f)) { sugg[f] = { value: v, at: now(), section: key }; suggested++; continue; }
      patch[f] = v;
      hist.push({ at: now(), field: f, by: "Claude", before: short(cur[f]), after: short(v) });
    }
    const rv = num(patch.total_revenue_usd_m ?? cur.total_revenue_usd_m), eb = num(patch.total_ebitda_usd_m ?? cur.total_ebitda_usd_m);
    if ((("total_revenue_usd_m" in patch) || ("total_ebitda_usd_m" in patch)) && !locked.has("ebitda_margin_pct") && rv && eb !== null) patch.ebitda_margin_pct = +(eb / rv * 100).toFixed(1);
    const note = String(res.note || "").slice(0, 300) || (Object.keys(patch).length ? "Section updated." : "No changes.");
    const summary = sec.append ? (added ? `Added ${added} new deal${added > 1 ? "s" : ""}. ${note}` : "No new deals found.") : note;
    patch.section_meta = { ...(cur.section_meta || {}), [key]: { at: now(), by: "Claude", note: summary } };
    patch.suggestions = sugg;
    patch.history = [...hist, ...(cur.history || [])].slice(0, 200);
    patch.runs = [...(cur.runs || []), { at: now(), kind: "Enhanced: " + sec.label, summary: summary + (suggested ? ` ${suggested} suggestion${suggested > 1 ? "s" : ""} held for your overrides.` : "") }].slice(-60);
    if (cur.status === "empty" || cur.status === "researching") patch.status = "ready";
    delete runs[runKey(id, key)];
    await save(id, patch, [], true);
    toast(`${sec.label}: ${sec.append ? (added ? `${added} new deal${added > 1 ? "s" : ""} added` : "no new deals") : suggested && !Object.keys(patch).some(k => sec.fields.includes(k)) ? "suggestion ready for your override" : "updated"}`);
  } catch (e) {
    delete runs[runKey(id, key)];
    if (e?.code === "cancelled") { render(); return; }
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") sample = null;
    runs[runKey(id, key)] = { error: ERRMSG[e?.code] || `${sec.label} didn't finish. Try again.` };
    render();
  }
}

function short(v) {
  if (v === null || v === undefined) return "";

  if (typeof v === "string") return v.length > 120 ? v.slice(0, 117) + "…" : v;

/* ---------- buyers and add-ons from the index ---------- */
function likelyBuyers(c) {
  return memod("buyers:" + c.id, () => {
    const size = num(c.us_water_treatment_revenue_usd_m) || 0, tot = num(c.total_revenue_usd_m) || size;
    const out = [];
    for (const p of list()) {
      if (p.id === c.id) continue;
      const ps = num(p.us_water_treatment_revenue_usd_m) || 0, pt = num(p.total_revenue_usd_m) || 0;
      if (!(ps >= Math.max(1.5 * size, 5) || pt >= Math.max(3 * tot, 50))) continue;
      const o = overlap(c, p); if (o < 20) continue;
      const n = (p.acquisitions || []).length;
      const s = o * (0.55 + 0.45 * Math.min(1, n / 10)) * (p.primary_category && p.primary_category === c.primary_category ? 1.15 : 1) * (p.pe_rollup ? 1.1 : 1);
      out.push({ p, o, n, s });
    }
    return out.sort((a, b) => b.s - a.s).slice(0, 12);
  });
}
function likelySponsors(c) {
  const seen = new Map();
  for (const b of likelyBuyers(c)) {
    const sp = String(b.p.pe_sponsor || "").split(/[;(]/)[0].trim();
    if (sp && (b.p.pe_backed || b.p.owner_type === "PE-owned") && !seen.has(sp)) seen.set(sp, b);
  }
  return [...seen.entries()].slice(0, 4).map(([name, b]) => ({ name, via: b.p }));
}
function likelyAddons(c) {
  return memod("addons:" + c.id, () => {
    const size = num(c.us_water_treatment_revenue_usd_m) || 0, st = stateOf(c);
    const owned = new Set((c.acquisitions || []).map(a => norm(a.target)));
    const pool = list().filter(p => p.id !== c.id && !owned.has(norm(p.name)) && num(p.us_water_treatment_revenue_usd_m) && p.owner_type !== "Public" && p.owner_type !== "Subsidiary of strategic");
    const pick = (maxRev, minO) => pool.map(p => {
      const r = num(p.us_water_treatment_revenue_usd_m); if (r > maxRev) return null;
      const o = overlap(c, p); if (o < minO) return null;
      const same = st && stateOf(p) === st;
      return { name: p.name, id: p.id, what: p.primary_category, rev: r, state: stateOf(p), o, s: o * Math.log10(2 + r) * (same ? 1.25 : 1) };
    }).filter(Boolean);
    let cands = pick(Math.max(size * 0.5, 2), 30);
    if (cands.length < 8) cands = pick(Math.max(size, 3), 15);   // small companies: merger-of-equals and tuck-ins
    return cands.sort((a, b) => b.s - a.s).slice(0, 15);
  });
}

function addonList(c) {

// Search autofill: companies whose name, parent, sponsor or rolled-in brands match what's typed.
function acMatches() {
  const lo = x => String(x || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const q = lo(ui.q); if (!q) return [];
  const out = [], seen = new Set();
  const cut = x => { x = String(x || "").trim(); return x.length > 60 ? x.slice(0, 57) + "…" : x; };
  for (const c of list()) {
    const n = lo(c.name);
    let score = 0, why = "";
    if (n.startsWith(q)) score = 100;
    else if (n.split(" ").some(w => w.startsWith(q))) score = 80;
    else if (n.includes(q)) score = 60;
    else if (lo(c.platform_name).includes(q)) { score = 45; why = cut(c.platform_name); }
    else if (lo(c.pe_sponsor).includes(q)) { score = 40; why = "Sponsor: " + cut(String(c.pe_sponsor).split(/[;(]/)[0]); }
    else if (lo(c.rolled_in).includes(q)) { score = 35; why = "Owns " + cut((String(c.rolled_in).split(";").find(x => lo(x).includes(q)) || "").replace(/\(.*?\)/g, "")); }
    if (score) { out.push({ c, score: score + Math.min(20, Math.log10(1 + (num(c.us_water_treatment_revenue_usd_m) || 0)) * 6), why }); seen.add(c.id); }
  }
  for (const e of meta.entities || []) {

function viewTargets() {
  const q = ui.tq.toLowerCase();
  const ts = allTargets().filter(t => !q || t.name.toLowerCase().includes(q) || t.links.some(l => String(l.platform).toLowerCase().includes(q) || String(l.what || "").toLowerCase().includes(q)))
    .sort((a, b) => b.links.length - a.links.length || a.name.localeCompare(b.name));
  if (!ts.find(t => t.key === ui.tsel)) ui.tsel = ts[0]?.key || null;
  const sel = ts.find(t => t.key === ui.tsel);
  const listHtml = ts.length ? ts.slice(0, 300).map(t => {
    const kinds = new Set(t.links.map(l => l.kind));
    return `<button data-tsel="${esc(t.key)}" aria-current="${t.key === ui.tsel}"><span class="t-n">${esc(t.name)}</span><span class="faint" style="font-size:12px;white-space:nowrap">${kinds.has("acq") || kinds.has("owned") ? "Acquired" : kinds.has("idea") ? "Idea" : "Has buyers"}</span></button>`;
  }).join("") : `<p class="faint" style="padding:12px">No targets match.</p>`;
  let detail = `<div class="detail faint">Pick a target on the left.</div>`;
  if (sel) {
    const K = { acq: ["k-acq", "Acquired by"], owned: ["k-acq", "Now part of"], idea: ["k-idea", "Add-on idea for"], buyer: ["k-buyer", "Potential buyer"] };
    const links = sel.links.map(l => `<div class="lnk"><span class="kind ${K[l.kind][0]}">${K[l.kind][1]}</span><div style="min-width:0"><div class="who">${l.platformId ? `<a href="#c.${esc(l.platformId)}.${l.kind === "idea" ? "addons" : l.kind === "acq" ? "acquisitions" : "overview"}">${esc(l.platform)}</a>` : esc(l.platform)}${l.btype ? ` <span class="faint" style="font-weight:400">· ${esc(l.btype)}</span>` : ""}</div><div class="muted" style="font-size:13px">${esc(l.what || "")}</div></div><div class="num faint" style="font-size:12px;text-align:right">${esc(l.date || "")}${l.rev !== null && l.rev !== undefined ? `<br>${fmtM(l.rev)} rev` : ""}${l.value ? `<br>${fmtM(l.value)} value` : ""}</div></div>`).join("");
    let fit = "";
    const base = sel.company || sel.entity;
    if (base && Object.keys(buckets(base)).length) {
      const skip = new Set([sel.company?.id, sel.entity?.owner_id].filter(Boolean));
      const tRev = num(sel.company?.us_water_treatment_revenue_usd_m) ?? num(sel.entity?.us_rev) ?? 0;
      const minRev = Math.max(2 * tRev, 10);
      const ranked = list().filter(p => !skip.has(p.id) && (num(p.us_water_treatment_revenue_usd_m) || 0) >= minRev)
        .map(p => { const o = overlap(base, p), n = (p.acquisitions || []).length; return { p, o, n, s: o * (0.6 + 0.4 * Math.min(1, n / 10)) }; })
        .filter(x => x.o > 0).sort((a, b) => b.s - a.s).slice(0, 8);
      fit = ranked.length ? `<div class="sec-h" style="margin-top:22px"><h2>Best-fit homes in Profiler</h2><span class="faint" style="font-size:12px">Platforms at least twice its size, ranked by shared end-market mix and boosted for active acquirers</span></div>
      <div class="panel bars" style="padding:6px">${ranked.map((x, i) => `<div class="brow" data-open="${esc(x.p.id)}" data-tip="${esc(x.p.name)}: ${x.o.toFixed(0)}% end-market overlap · ${x.n} deals · ${fmtM(x.p.us_water_treatment_revenue_usd_m)} US water revenue"><span class="rk">${i + 1}</span><span class="nm">${esc(x.p.name)} <span class="faint" style="font-weight:400;font-size:12px">${fmtM(x.p.us_water_treatment_revenue_usd_m)} · ${x.n} deals</span></span><div class="track"><div class="fill" style="width:${Math.min(100, x.o)}%"></div></div><span class="v">${x.o.toFixed(0)}%</span></div>`).join("")}</div>` : "";
    }
    detail = `<div class="panel detail"><div class="eyebrow">Target</div><h2 class="tt">${sel.company ? `<a href="#c.${esc(sel.company.id)}" style="color:inherit;text-decoration:none">${esc(sel.name)}</a>` : esc(sel.name)}</h2>
      <div class="muted">${sel.company ? `Profiled · ${fmtM(sel.company.us_water_treatment_revenue_usd_m)} US water revenue · ${esc(sel.company.owner_type || "")}` : sel.entity ? esc([sel.entity.role, num(sel.entity.us_rev) ? fmtM(sel.entity.us_rev) + " US water revenue" : "", sel.entity.state].filter(Boolean).join(" · ")) : `Not profiled yet`}${!sel.company && writable && db ? ` · <button class="btn sm ghost" data-act="profile-target" data-name="${esc(sel.name)}">Create profile</button>` : ""}</div>
      ${sel.entity?.what ? `<p class="muted" style="max-width:70ch;margin:10px 0 0">${esc(sel.entity.what)}</p>` : ""}
      <div class="links">${links}</div>${fit}</div>`;
  }
  return `<div class="page-h"><div><div class="eyebrow">Reverse search</div><h1>Targets</h1><p>Every company that shows up as a past deal, an add-on already rolled into a platform, an add-on idea, or a company with named buyers. Pick a target to see who bought it, who wants it, and which platforms fit it best.</p></div></div>
  <div class="bar"><div class="grow"><input class="search" id="tq" type="search" placeholder="Search a target, a platform, or a keyword like Legionella" value="${esc(ui.tq)}" aria-label="Search targets"></div><span class="faint">${ts.length} targets</span></div>
  <div class="split"><div class="panel tlist">${listHtml}</div>${detail}</div>`;
}

function viewPrecedents() {
  const q = ui.pq.toLowerCase();
  let ds = allDeals().filter(d => !q || [d.target, d.acquirer, d.what, d.date].join(" ").toLowerCase().includes(q));
  const k = ui.psort, dir = ui.pdir;
  ds.sort((a, b) => {
    if (k === "year") return dir * (dateKey(a.date) - dateKey(b.date));
    if (k === "mult") { const ma = a.value && a.rev ? a.value / a.rev : -1, mb = b.value && b.rev ? b.value / b.rev : -1; return dir * (ma - mb); }
    if (k === "value" || k === "rev") return dir * ((a[k] ?? -1) - (b[k] ?? -1));
    return dir * String(a[k] || "").localeCompare(String(b[k] || ""));
  });
  const th = (key, label, cls = "") => `<th class="sortable ${cls}" data-psort="${key}" aria-sort="${ui.psort === key ? (ui.pdir > 0 ? "ascending" : "descending") : "none"}">${label}${ui.psort === key ? (ui.pdir > 0 ? " ↑" : " ↓") : ""}</th>`;
  const withVal = ds.filter(d => d.value && d.rev);
  const med = arr => { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const medMult = med(withVal.map(d => d.value / d.rev));
  const rows = ds.map(d => {
    const tgt = d.targetId || findCompanyByName(d.target)?.id;
    return `<tr><td class="num" style="white-space:nowrap">${esc(d.date)}</td><td class="cname">${tgt ? `<a href="#c.${esc(tgt)}">${esc(d.target)}</a>` : esc(d.target)}</td><td>${d.acquirerId ? `<a href="#c.${esc(d.acquirerId)}.acquisitions">${esc(d.acquirer)}</a>` : esc(d.acquirer)}</td><td class="muted" style="font-size:13px;min-width:240px">${esc(d.what)}</td><td class="r num">${d.rev !== null ? fmtM(d.rev) : "—"}</td><td class="r num">${d.value ? fmtM(d.value) : "—"}</td><td class="r num">${d.value && d.rev ? (d.value / d.rev).toFixed(1) + "x" : "—"}</td><td>${d.url ? `<a href="${esc(d.url)}" target="_blank" rel="noopener">Source</a>` : ""}</td></tr>`;
  }).join("");
  return `<div class="page-h"><div><div class="eyebrow">Deal log</div><h1>Precedents</h1><p>Every acquisition from every profile, plus sponsor entries with a known EV. Add a deal on a company's Acquisitions tab and it lands here.</p></div></div>
  <div class="stats"><div class="stat"><div class="v">${ds.length}</div><div class="l">Deals</div></div><div class="stat"><div class="v">${ds.filter(d => d.value).length}</div><div class="l">With disclosed value</div></div><div class="stat"><div class="v">${medMult !== null ? medMult.toFixed(1) + "x" : "—"}</div><div class="l">Median EV / revenue</div></div></div>
  <div class="bar"><div class="grow"><input class="search" id="pq" type="search" placeholder="Search target, acquirer, year or description" value="${esc(ui.pq)}" aria-label="Search precedents"></div></div>
  <div class="tw"><table><thead><tr>${th("year", "Date")}${th("target", "Target")}${th("acquirer", "Acquirer")}<th>What it does</th>${th("rev", "Target rev", "r")}${th("value", "Value", "r")}${th("mult", "EV / Rev", "r")}<th>Source</th></tr></thead><tbody>${rows || `<tr><td colspan="8" class="faint">No deals match.</td></tr>`}</tbody></table></div>`;
}

function viewEndMarkets() {
  const broad = ui.emTax === "broad";
  const names = new Set(broad ? BUCKETS : END_MARKETS);
  if (!broad) list().forEach(c => Object.keys(c[EM_FIELD] || {}).forEach(k => names.add(k)));
  if (!names.has(ui.em)) ui.em = [...names][0];
  const opts = [...names].map(n => `<option ${n === ui.em ? "selected" : ""}>${esc(n)}</option>`).join("");
  const rows = list().map(c => { const p = num((broad ? buckets(c) : (c[EM_FIELD] || {}))[ui.em]) || 0; const rev = num(broad ? c.us_water_treatment_revenue_usd_m : c.total_revenue_usd_m); return { c, p, d: rev !== null ? rev * p / 100 : null }; }).filter(r => r.p > 0);
  const key = ui.emMode === "pct" ? "p" : "d";
  rows.sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1));
  const max = Math.max(...rows.map(r => r[key] || 0), 1);
  const total = rows.reduce((s, r) => s + (r.d || 0), 0);
  const top = rows.slice(0, 60);
  const bars = rows.length ? top.map((r, i) => `<div class="brow" data-open="${esc(r.c.id)}" data-tip="${esc(r.c.name)}: ${fmtPct(r.p)} of ${broad ? "US water revenue" : "platform revenue"} · ${fmtM(r.d)}"><span class="rk">${i + 1}</span><span class="nm">${esc(r.c.name)}</span><div class="track"><div class="fill" style="width:${((r[key] || 0) / max * 100).toFixed(1)}%"></div></div><span class="v">${key === "p" ? fmtPct(r.p) : fmtM(r.d)}</span></div>`).join("")
    : `<p class="faint" style="padding:16px">No profiled company has exposure to ${esc(ui.em)} yet.</p>`;
  return `<div class="page-h"><div><div class="eyebrow">Exposure screen</div><h1>End markets</h1><p>Pick an end market to rank companies by how much of their revenue comes from it, as a share or in dollars. Broad uses the workbook's eight buckets, which every company has. Detailed uses the finer split, where one exists. Shows the top 60.</p></div></div>
  <div class="bar"><div class="seg" role="group" aria-label="End-market detail"><button data-emtax="broad" aria-pressed="${broad}">Broad</button><button data-emtax="detailed" aria-pressed="${!broad}">Detailed</button></div>
    <select id="em" aria-label="End market" style="min-width:240px">${opts}</select>
    <div class="seg" role="group" aria-label="Rank by"><button data-em="pct" aria-pressed="${ui.emMode === "pct"}">% of revenue</button><button data-em="usd" aria-pressed="${ui.emMode === "usd"}">$ revenue</button></div>
    <span class="faint">${rows.length} companies · ${fmtM(total)} combined exposure</span></div>
  <div class="panel bars">${bars}</div>`;
}

/* ---------- render ---------- */
function render() {
  if (isEditing()) { pendingRender = true; return; }
  const r = route();
  document.querySelectorAll("#nav a").forEach(a => a.setAttribute("aria-current", (a.dataset.v === r.view || (r.view === "company" && a.dataset.v === "companies")) ? "page" : "false"));
  setLive();
  if (!loaded) {
    if (dbState === "off") app.innerHTML = `<div class="panel empty-hero"><h2>The repository isn't connected</h2><p class="muted">Profiler keeps its profiles in a shared database that only loads when this page is opened in Claude while signed in. Open it from your Claude artifacts to see and edit profiles.</p></div>`;
    return;
  }
  const y = scrollY;
  let html = "";
  if (r.view === "company") html = viewCompany(r.id, r.tab);
  else if (r.view === "targets") html = viewTargets();
  else if (r.view === "precedents") html = viewPrecedents();
  else if (r.view === "endmarkets") html = viewEndMarkets();
  else html = viewCompanies();
  const active = document.activeElement?.id, selS = document.activeElement?.selectionStart;
  app.innerHTML = html;
  if (active && ["q", "tq", "pq"].includes(active)) { const el = document.getElementById(active); el?.focus(); try { el.setSelectionRange(selS, selS); } catch {} }
  if (pendingFocus) { const el = app.querySelector(pendingFocus); pendingFocus = null; el?.focus(); }
  window.scrollTo(0, y);
}

/* ---------- events ---------- */
let lastRouteKey = "";
addEventListener("hashchange", () => {
  const r = route(), k = r.view + (r.id || "");
  if (k !== lastRouteKey) { ui.confirmDel = false; ui.editMd = false; window.scrollTo(0, 0); }
  lastRouteKey = k;
  if (isEditing() && !document.activeElement.isContentEditable) document.activeElement.blur();
  watchDetails();
  render();
});

app.addEventListener("input", e => {
  const id = e.target.id;
  if (id === "q") { ui.q = e.target.value; ui.limit = 150; ui.acOpen = true; ui.ac = -1; render(); }
  if (id === "tq") { ui.tq = e.target.value; ui.tsel = null; render(); }
  if (id === "pq") { ui.pq = e.target.value; render(); }
});
app.addEventListener("change", e => {
  const id = e.target.id;
  if (id === "em") ui.em = e.target.value;
  else if (id === "fscope") { ui.scope = e.target.value; ui.limit = 150; }
  else if (id === "fotype") { ui.otype = e.target.value; ui.limit = 150; }
  else return;
  e.target.blur(); render();
});

app.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "addForm") {
    const name = $("#addName").value.trim(); if (!name) return;
    const existing = findCompanyByName(name);
    if (existing) { location.hash = "c." + existing.id; return; }
    await createCompany(name);
  }
  if (e.target.id === "factForm") {
    const inp = $("#factText"), text = inp.value.trim(); if (!text) return;
    const c = getC(route().id); if (!c) return;
    inp.value = "";
    await save(c.id, { source_of_truth: [...(c.source_of_truth || []), { text, at: now() }] });
    render();
  }
});

async function createCompany(name, facts = "") {
  let id = slugify(name); let n = 2; while (companies.has(id)) id = slugify(name) + "-" + n++;
  const doc = { name, status: "empty", created_at: now(), updated_at: now(), locked: [], source_of_truth: facts ? [{ text: facts, at: now() }] : [], acquisitions: [], buyers: [], addon_ideas: [] };
  const det = { runs: [], customers: [], competitors: [] };
  try { await db.doc("companies/" + id).set(doc); await db.doc("details/" + id).set(det); companies.set(id, { id, ...doc }); details[id] = det; ver++; rebuildIndex(); location.hash = "c." + id; }
  catch (e) { handleWriteError(e); }
}

app.addEventListener("click", async e => {
  const t = e.target;
  const sortTh = t.closest("[data-sort]");
  if (sortTh) { const k = sortTh.dataset.sort; if (ui.sort === k) ui.dir *= -1; else { ui.sort = k; ui.dir = ["name", "rank", "owner_type"].includes(k) ? 1 : -1; } render(); return; }
  const psTh = t.closest("[data-psort]");
  if (psTh) { const k = psTh.dataset.psort; if (ui.psort === k) ui.pdir *= -1; else { ui.psort = k; ui.pdir = ["target", "acquirer"].includes(k) ? 1 : -1; } render(); return; }
  const ts = t.closest("[data-tsel]"); if (ts) { ui.tsel = ts.dataset.tsel; render(); return; }
  const em = t.closest("[data-em]"); if (em) { ui.emMode = em.dataset.em; render(); return; }
  const et = t.closest("[data-emtax]"); if (et) { ui.emTax = et.dataset.emtax; render(); return; }
  if (t.closest("a")) return;
  const open = t.closest("[data-open]"); if (open && !t.closest("[contenteditable]")) { location.hash = "c." + open.dataset.open; return; }
  const btn = t.closest("[data-act]"); if (!btn) return;
  const act = btn.dataset.act, r = route(), c = getC(r.id);
  if (act === "profile-target") { await createCompany(btn.dataset.name); return; }
  if (act === "more") { ui.limit = (ui.limit || 150) + 150; render(); return; }
  if (!c) return;
  if (act === "enhance") enhance(c.id, btn.dataset.k);
  if (act === "enhanceall") enhanceAll(c.id);
  if (act === "stopsec") runs[runKey(c.id, btn.dataset.k)]?.ctl?.abort();
  if (act === "dismisssec") { delete runs[runKey(c.id, btn.dataset.k)]; render(); }
  if (act === "firstdive") {
    const f = $("#seedFacts")?.value.trim();
    if (f) await save(c.id, { source_of_truth: [...(c.source_of_truth || []), { text: f, at: now() }] }, [], true);
    enhanceAll(c.id);
  }
  if (act === "queue") {
    try { await db.collection("queue").add({ company_id: c.id, name: c.name, section: "all", status: "queued", requested_at: now() }); toast("Web research requested"); }
    catch (err) { handleWriteError(err); }
  }
  if (act === "acceptsug") {
    const f = btn.dataset.f, sg = { ...(c.suggestions || {}) }, v = sg[f]?.value; delete sg[f];
    const cc = companies.get(c.id); companies.set(c.id, { ...cc, locked: (cc.locked || []).filter(x => x !== f) });
    await save(c.id, { [f]: v, suggestions: sg, history: [{ at: now(), field: f, by: "You (accepted Claude's)", before: short(c[f]), after: short(v) }, ...(c.history || [])].slice(0, 200) }); render();
  }
  if (act === "dismisssug") { const sg = { ...(c.suggestions || {}) }; delete sg[btn.dataset.f]; await save(c.id, { suggestions: sg }, [], true); render(); }
  if (act === "savebuyer" || act === "savebuyers") {
    const lb = likelyBuyers(c), pick = act === "savebuyer" ? [lb[+btn.dataset.r]] : lb.slice(0, 5);
    const have = new Set((c.buyers || []).map(b => norm(b.name)));
    const add = pick.filter(b => b && !have.has(norm(b.p.name))).map(b => ({ name: b.p.name, type: b.p.pe_backed || b.p.owner_type === "PE-owned" ? "PE platform" : "Strategic", fit: b.o >= 70 ? "High" : b.o >= 45 ? "Medium" : "Low", rationale: `${b.o.toFixed(0)}% end-market overlap; ${b.n} deals; ${fmtM(b.p.us_water_treatment_revenue_usd_m)} US water revenue` }));
    if (add.length) { await save(c.id, { buyers: [...(c.buyers || []), ...add] }, ["buyers"]); render(); }
  }
  if (act === "saveaddonx") {
    const x = addonList(c)[+btn.dataset.j];
    if (x && x.src !== "saved") { await save(c.id, { addon_ideas: [...(c.addon_ideas || []), { target: x.name, rationale: x.why, est_revenue_usd_m: x.rev ?? null, location: x.state || "" }] }, ["addon_ideas"]); render(); }
  }
  if (act === "savecomp") {
    const p = companies.get(btn.dataset.id);
    if (p) { await save(c.id, { competitors: [...(c.competitors || []), { name: p.name, overlap: `${overlap(c, p).toFixed(0)}% end-market overlap; ${p.business_model || ""}` }] }, ["competitors"]); render(); }
  }
  if (act === "manual") { await save(c.id, { status: "ready" }); render(); }
  if (act === "askdel") { ui.confirmDel = true; render(); }
  if (act === "nodel") { ui.confirmDel = false; render(); }
  if (act === "del") {
    try { await db.doc("companies/" + c.id).delete(); db.doc("details/" + c.id).delete().catch(() => {}); companies.delete(c.id); ver++; ui.confirmDel = false; toast(`Deleted ${c.name}`); location.hash = "companies"; }
    catch (err) { handleWriteError(err); }
  }
  if (act === "unlock") { const cc = companies.get(c.id); companies.set(c.id, { ...cc, locked: (cc.locked || []).filter(f => f !== btn.dataset.f) }); await save(c.id, {}); render(); }
  if (act === "addrow") {
    const f = btn.dataset.f, rows = tableRows(c, f); rows.push(clone(BLANK[f] || {}));
    const firstKey = f === EM_FIELD ? "name" : Object.keys(BLANK[f] || { x: 1 })[0];
    pendingFocus = `[data-f="${f}"][data-r="${rows.length - 1}"][data-k="${firstKey}"]`;
    await save(c.id, { [f]: rowsToValue(f, rows) }, [f]); render();
  }
  if (act === "delrow") {
    const f = btn.dataset.f, rows = tableRows(c, f); rows.splice(+btn.dataset.r, 1);
    await save(c.id, { [f]: rowsToValue(f, rows) }, [f]); render();
  }
  if (act === "delfact") { const s = [...(c.source_of_truth || [])]; s.splice(+btn.dataset.r, 1); await save(c.id, { source_of_truth: s }); render(); }
  if (act === "editmd") { ui.editMd = !ui.editMd; render(); }
  if (act === "savemd") { const v = $("#mdEdit").value; ui.editMd = false; await save(c.id, { profile_md: v }, ["profile_md"]); render(); }
});

function watchDetails() {
  const r = route(), id = r.view === "company" ? r.id : null;
  if (!db || id === detailId) return;
  if (detailSub) { detailSub(); detailSub = null; }
  detailId = id;
  if (!id) return;
  detailSub = db.doc("details/" + id).onSnapshot(d => { details[id] = d.exists ? d.data() : {}; render(); }, () => {});
}

/* ---------- boot ---------- */
render();
(async () => {
  if (!window.claude?.use) { dbState = "off"; render(); return; }
  const [d, s] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("sample").catch(() => null)]);
  db = d; sample = s;
  if (!db) { dbState = "off"; render(); return; }
  try {
    const u = await window.claude.use("user").catch(() => null);
    if (u?.can) { const w = await u.can("data.write"); if (w === false) { writable = false; } }
  } catch {}
  dbState = writable ? "live" : "readonly";
  db.collection("queue").limit(500).onSnapshot(snap => { queueDocs = snap.docs.map(d => ({ ...d.data(), id: d.id })); if (loaded) render(); }, () => {});
  db.doc("meta/deals").onSnapshot(d => { meta.deals = d.exists ? (d.data().deals || []) : []; ver++; if (loaded) render(); }, () => {});
  db.doc("meta/entities").onSnapshot(d => { meta.entities = d.exists ? (d.data().entities || []) : []; ver++; rebuildIndex(); if (loaded) render(); }, () => {});
  db.collection("companies").limit(1000).onSnapshot(snap => {
    companies.clear();
    snap.docs.forEach(doc => companies.set(doc.id, { ...doc.data(), id: doc.id }));
    loaded = true; ver++; rebuildIndex();
    watchDetails();
    render();
  }, err => {
    if (err?.code === "revoked" || err?.code === "not_granted") { dbState = "off"; }
    render();
  });
})();
})();
</script>
