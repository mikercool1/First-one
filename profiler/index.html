<title>Profiler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: sticky top bar with four views; profile = header, KPI strip, fact bar, tabbed body. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --sunk:#e9edef; --ink:#0f1b24; --ink-2:#4b5b67; --ink-3:#7b8994;
  --line:#dbe1e5; --accent:#0d6b6b; --accent-ink:#ffffff; --accent-soft:#dcefee; --warn:#9a5b00; --warn-soft:#fbecd2;
  --bad:#b3261e; --good:#1c7c3c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s0:#a3adb4;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body:"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1317; --surface:#141c22; --sunk:#1b252c; --ink:#e5ecf0; --ink-2:#9dadb8; --ink-3:#6f808c;
  --line:#26323b; --accent:#58b8b3; --accent-ink:#06201f; --accent-soft:#16312f; --warn:#e0a54a; --warn-soft:#33270f;
  --bad:#ef7b73; --good:#5cc27f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#56636c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1317; --surface:#141c22; --sunk:#1b252c; --ink:#e5ecf0; --ink-2:#9dadb8; --ink-3:#6f808c;
  --line:#26323b; --accent:#58b8b3; --accent-ink:#06201f; --accent-soft:#16312f; --warn:#e0a54a; --warn-soft:#33270f;
  --bad:#ef7b73; --good:#5cc27f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#56636c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{font:400 26px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand small{font:500 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:7px 12px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.secsel select{font-weight:600;padding:6px 28px 6px 10px;border-radius:999px;background:var(--surface);max-width:260px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.live{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--good)}
.dot.off{background:var(--bad)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font:400 44px/1.02 var(--f-display);letter-spacing:-.01em}
.page-h p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{padding:4px 10px;font-size:12px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.lock{background:var(--warn-soft);color:var(--warn);border:0;padding:2px 8px}
.pill.lock:hover{text-decoration:line-through}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1 1 240px;min-width:0}
.acwrap{position:relative}
.ac{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,27,36,.14)}
.ac li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 10px;border-radius:7px;cursor:pointer}
.ac li:hover,.ac li[aria-selected="true"]{background:var(--sunk)}
.ac-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-s{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{width:100%}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface);white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--sunk)}
.cname{font-weight:600}
.cname small{display:block;font-weight:400;color:var(--ink-3);font-size:12px;max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .x{opacity:0;border:0;background:none;color:var(--ink-3);padding:0 4px;font-size:16px;line-height:1}
tr:hover td .x,td .x:focus{opacity:1}
td .x:hover{color:var(--bad)}

/* editable */
[contenteditable]{border-radius:4px;outline:none;transition:background .12s}
[contenteditable]:hover{background:var(--sunk)}
[contenteditable]:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-3)}
td[contenteditable]{min-width:60px}

/* profile */
.crumb{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.crumb a{color:var(--ink-2);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.ph{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.ph-main{min-width:0;flex:1 1 420px}
.ph h1{font:400 52px/1 var(--f-display);letter-spacing:-.015em;display:inline-block;padding:0 4px;margin-left:-4px}
.ph .sub{color:var(--ink-2);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .val{font:500 26px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:6px;display:flex;align-items:baseline;gap:3px}
.kpi .val .u{font-size:13px;color:var(--ink-3)}
.kpi .val [contenteditable]{padding:0 3px}
.kpi .note{font-size:12px;color:var(--ink-3);margin-top:2px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(even){border-left:1px solid var(--line)}.ph h1{font-size:40px}.page-h h1{font-size:36px}}

.facts{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px dashed var(--line);border-radius:var(--r)}
.facts input{flex:1 1 280px;min-width:0}
.facts .lab{font-size:12px;font-weight:600;color:var(--ink-2);padding-inline:4px}

/* chat dock */
.chat-fab.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.chat-fab.live{animation:none}}
.chat-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;border-radius:999px;padding:12px 18px;box-shadow:0 8px 24px rgba(15,27,36,.22)}
.chat{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:45;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-12px 0 30px rgba(15,27,36,.14);padding-top:env(safe-area-inset-top,0px)}
.chat[hidden]{display:none}
.chat-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-m{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;overflow-wrap:anywhere}
.msg.cu{align-self:flex-end;background:var(--accent-soft);padding:9px 12px;border-radius:12px 12px 2px 12px;max-width:88%}
.msg.ca{line-height:1.5}
.msg.cu.cstep{background:var(--sunk);font-weight:600;font-size:13px}
.msg .act{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.msg .act span::before{content:"› ";color:var(--accent)}
.msg .saved{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--sunk)}
.msg .saved div{margin:2px 0}
.msg .saved .no{color:var(--warn)}
.msg a{color:var(--accent)}
.chat-f{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.chat-f textarea{flex:1;min-height:44px;max-height:160px;resize:none}
.chat-hint{font-size:12px;color:var(--ink-3);padding:0 14px 8px}
@media (max-width:760px){.chat{width:100vw;border-left:0}}
@media (min-width:900px){body.chat-open main,body.chat-open .top-in{margin-right:440px;margin-left:max(0px,calc((100vw - 440px - 1180px)/2))}}
/* sponsors, in market, logos, valuation, segments */
.logo{display:inline-block;object-fit:contain;vertical-align:middle;background:#fff;border-radius:4px}
.logo.sm{height:20px;max-width:64px;margin-right:8px}
.logo.lg{height:44px;max-width:180px;padding:3px 6px;border:1px solid var(--line)}
.logo-row{display:flex;gap:8px;align-items:center;min-height:0;margin-bottom:6px}
.logo-row:empty{display:none}
a.pill.pe{background:var(--accent-soft);color:var(--accent);text-decoration:none;font-weight:600}
a.pill.pe:hover{text-decoration:underline}
.valrow{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:14px}
.valrow b{font-weight:600}
.run.im{background:var(--accent-soft);margin-top:10px}
.imform{padding:14px 16px;margin-top:10px}
.imgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.imgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-3)}
.imgrid .wide{grid-column:1/-1}
.spgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
.spg{padding:12px 14px;max-height:420px;overflow:auto}
.gt{width:100%;border-collapse:collapse}.gt td{padding:5px 6px;border-bottom:1px solid var(--line);font-size:13px}
table.spt tr.yr th{background:var(--sunk);text-align:left;padding:10px 12px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink)}
table.spt tr.yr th span{margin-right:12px;display:inline-block}
@media (max-width:700px){table.spt tr.yr th span{display:block;white-space:normal}}
table.spt td.cname a{color:inherit;text-decoration:none;font-weight:600}table.spt td.cname a:hover{text-decoration:underline}
.gt tr.on td{background:var(--accent-soft)}
.hb{display:inline-block;width:90px;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;vertical-align:middle}
.hb i{display:block;height:100%;background:var(--accent)}
td.warnc{color:var(--warn);font-weight:600}
.stg{display:inline-flex;gap:3px;vertical-align:middle}.stg i{width:10px;height:6px;border-radius:2px;background:var(--sunk)}.stg i.on{background:var(--accent)}
.seggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.seg{padding:12px 14px}.seg h3{margin:0;font-size:16px}.seg .hb{width:100%}
.segdl{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:6px 0 0;font-size:13px}.segdl dt{color:var(--ink-3)}.segdl dd{margin:0}
@media (max-width:900px){.spgrid,.seggrid,.imgrid{grid-template-columns:1fr}}
/* navigation redesign */
.ph.compact{align-items:flex-start;margin-bottom:6px}
.ph.compact h1{font-size:44px;margin:0}
.ph-name{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph.compact .sub{max-width:900px}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 57px);z-index:15;background:var(--bg);display:flex;flex-wrap:wrap;gap:6px;padding:10px 0;margin:10px 0 18px;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;text-decoration:none;color:var(--ink-2);font-size:14px}
.tabs a[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs a[aria-current="true"] .n{color:var(--bg);opacity:.7}
.tabs a{font-weight:500}
.bstrip{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.xbtn{display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
a.xbtn:hover{border-color:var(--accent);box-shadow:0 2px 10px rgba(15,27,36,.08)}
.xbtn small{color:var(--ink-3);font-size:12px}
.xbtn.static{background:var(--sunk)}
@media (max-width:900px){.grid3{grid-template-columns:1fr}.ph.compact h1{font-size:34px}}
@media (max-width:700px){
  .top{position:static}
  .top-in{gap:8px;padding-block:6px}
  .nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;width:100%}
  .nav a{text-align:center;padding:7px 2px;font-size:13px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs{position:static;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .tabs a{text-align:center;padding:9px 6px}
}
/* tables become cards on phones: no sideways scrolling */
@media (max-width:700px){
  .tw{overflow:visible;border:0;background:transparent}
  .tw table,.tw tbody,.tw tr,.tw td,.tw tfoot{display:block;width:100%}
  .tw thead{display:none}
  .tw tr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;padding:8px 12px}
  .tw tr.yr{background:var(--sunk)}
  .tw tr.yr th{display:block;border:0;padding:4px 0}
  .tw td{border:0;padding:3px 0;text-align:left!important;min-width:0!important;white-space:normal!important}
  .tw td[data-label]:not(:first-child)::before{content:attr(data-label);display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
  .tw td:empty{display:none}
}
.run.warnrun{background:var(--warn-soft,#fbeee2)}
.run .sp{flex:1}
.run{margin-top:14px;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--ink);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.run.err{background:var(--warn-soft)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

.tabs a:hover{color:var(--ink)}
.tabs .n{font:500 11px var(--f-mono);color:var(--ink-3);margin-left:4px}

.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sec-h h2{font-size:15px;font-weight:600}
.sec-h .sp{flex:1}
.lede{font-size:17px;line-height:1.5;max-width:70ch;padding:2px 4px;margin-left:-4px}
.take{margin-top:12px;padding:12px 14px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 8px 8px 0;max-width:78ch}
.take .eyebrow{margin-bottom:4px}

.pies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:900px){.pies{grid-template-columns:minmax(0,1fr)}}
.pie{padding:16px;min-width:0}
.pie h3{font-size:13px;font-weight:600;margin-bottom:12px;display:flex;gap:8px;align-items:center;min-height:28px}
.pie-body{display:flex;gap:16px;align-items:center}
.pie svg{flex:0 0 132px;width:132px;height:132px}
.legend{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:grid;gap:5px}
.legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px;border-radius:4px;padding:1px 3px}
.legend li.hl{background:var(--sunk)}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.legend .pv{font-family:var(--f-mono);color:var(--ink)}
.pie .empty{color:var(--ink-3);font-size:13px;padding:30px 0;text-align:center}
@media (max-width:420px){.pie-body{flex-direction:column;align-items:stretch}.pie svg{align-self:center}}
path.sl{cursor:default;transition:opacity .12s}
svg:hover path.sl{opacity:.55}
svg path.sl:hover{opacity:1}

.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:800px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;padding:14px 16px}
.kv dt{color:var(--ink-3);font-size:12px;padding-top:2px}

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? null : +v;
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const slugify = s => String(s).toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-").slice(0, 60) || ("co-" + Date.now());
const norm = s => String(s || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/\b(inc|llc|ltd|co|corp|corporation|company|group|the|holdings?)\b\.?/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const now = () => new Date().toISOString();

const BUCKETS = ["Municipal","Energy & chemicals","Heavy industry","Commercial & institutional","Light industry & high-purity","Pool & spa","Agriculture & farm","Other"];
// Heavy fields live in details/<id> and load when a profile opens; everything else sits in companies/<id>.
const DETAIL_KEYS = new Set(["segment_profiles","dossier","products","product_em_map","history","suggestions","what_it_is","bluntly","profile_md","total_revenue_basis","ebitda_basis","employees_basis","us_water_treatment_arithmetic","open_questions","addon_corrections","what_changed_vs_prior","evidence","key_sites","chemistries","customers","runs","prior_owners"]);
const END_MARKETS = ["Municipal drinking water","Municipal wastewater","Power generation","Oil & gas / refining","Chemicals & petrochem","Pulp & paper","Food & beverage","Mining & metals","Primary metals/steel","Commercial HVAC / buildings","Healthcare & institutional","Data centers","Pharma/life sciences","Microelectronics/semis","Manufacturing (general industrial)","Pools & spa","Agriculture & farm","Consumer / retail","Other"];

/* ---------- sectors ---------- */
// Profiler covers chemicals broadly. Each company has business lines in one or more sectors; one is primary.
const BASE_SECTORS = [
  ["water", "Water treatment", "Water"], ["lubricants", "Lubricants & metalworking fluids", "Lubricants"], ["personal-care", "Personal care & professional beauty", "Personal care"],
  ["food", "Food & nutrition ingredients", "Food ingredients"], ["flavors", "Flavors & fragrances", "Flavors & fragrances"], ["coatings", "Coatings, adhesives & sealants", "Coatings"],
  ["cleaning", "Cleaning & hygiene", "Cleaning"], ["pool", "Pool & spa", "Pool & spa"], ["agchem", "Crop protection & ag chemicals", "Ag chem"],
  ["oilfield", "Oilfield & energy chemicals", "Oilfield"], ["pulp", "Pulp & paper chemicals", "Pulp & paper"], ["pharma", "Pharma & life-science ingredients", "Pharma"],
  ["electronic", "Electronic & high-purity chemicals", "Electronic"], ["polymers", "Plastics, polymers & additives", "Polymers"], ["construction", "Construction chemicals", "Construction"],
  ["mining", "Mining & metals chemicals", "Mining"], ["inorganics", "Commodity & inorganic chemicals", "Inorganics"], ["specialty", "Specialty & intermediate chemicals", "Specialty"],
  ["distribution", "Chemical distribution", "Distribution"], ["equipment", "Equipment, media & membranes", "Equipment"],
].map(([id, name, short]) => ({ id, name, short }));
let customSectors = [];
const allSectors = () => [...BASE_SECTORS, ...customSectors];
const sectorById = id => allSectors().find(s => s.id === id) || (id ? { id, name: id.replace(/-/g, " "), short: id.replace(/-/g, " ") } : null);
function sectorFromName(n) {
  const k = norm(n); if (!k) return null;
  return allSectors().find(s => s.id === n || norm(s.name) === k || norm(s.short) === k) || allSectors().find(s => catToSector(n) === s.id) || null;
}
const GENERIC_EM = ["Automotive & transportation", "Industrial manufacturing", "Construction & infrastructure", "Consumer & retail", "Personal care & cosmetics", "Professional salons & spas", "Food & beverage", "Pharma & healthcare", "Agriculture", "Oil & gas", "Power & utilities", "Municipal water", "Mining & metals", "Pulp & paper", "Electronics & semiconductors", "Packaging", "Commercial & institutional", "Marine & aerospace", "Chemicals & petrochem", "Other"];
const CAT_SECTOR = [[/water treatment/i, "water"], [/pool/i, "pool"], [/agricult|farm|crop/i, "agchem"], [/oilfield|production chem/i, "oilfield"], [/pulp|paper/i, "pulp"], [/cleaning|hygiene|sanitation/i, "cleaning"], [/distribut/i, "distribution"], [/media|membrane|equipment/i, "equipment"], [/bleach|hypochlorite|chlor-alkali|inorganic|commodity|lime/i, "inorganics"], [/lubric|metalworking/i, "lubricants"], [/coating|adhesive|sealant/i, "coatings"], [/food|nutrition/i, "food"], [/flavor|fragrance/i, "flavors"], [/personal care|beauty|cosmetic|hair|salon/i, "personal-care"], [/pharma|life science/i, "pharma"], [/electronic|semicon|high-purity/i, "electronic"], [/polymer|plastic|additive/i, "polymers"], [/construction/i, "construction"], [/mining|metal/i, "mining"], [/specialty|intermediate/i, "specialty"]];
function catToSector(cat) { for (const [re, id] of CAT_SECTOR) if (re.test(cat || "")) return id; return null; }
// Saved `sectors` wins. Otherwise derive from the segment split, with water from the water index.
function sectorsOf(c) {
  return memod("sec:" + c.id, () => {
    if (Array.isArray(c.sectors) && c.sectors.length) return c.sectors.map(s => ({ ...s, sector: s.sector ?? (sectorFromName(s.name)?.id || "") }));
    const tot = num(c.total_revenue_usd_m), m = new Map();
    const add = (id, rev, pct) => { if (!id) return; const e = m.get(id) || { sector: id, revenue_usd_m: 0, pct: 0 }; e.revenue_usd_m += rev || 0; e.pct += pct || 0; m.set(id, e); };
    for (const s of c.revenue_by_business || []) { const r = num(s.revenue_usd_m); add(catToSector(s.category || s.business), r, num(s.pct) ?? (tot && r ? r / tot * 100 : 0)); }
    const usw = num(c.us_water_treatment_revenue_usd_m);
    if ((c.imported_from || usw) && !m.has("water")) add("water", usw, tot && usw ? usw / tot * 100 : 0);
    if (c.primary_sector && !m.has(c.primary_sector)) add(c.primary_sector, null, 0);
    return [...m.values()].map(e => ({ ...e, revenue_usd_m: e.revenue_usd_m ? +e.revenue_usd_m.toFixed(1) : null, pct: e.pct ? +e.pct.toFixed(1) : null }));
  });
}
function primarySector(c) {
  if (c.primary_sector) return c.primary_sector;
  if (c.imported_from) return "water";
  return sectorsOf(c).slice().sort((a, b) => (b.revenue_usd_m || 0) - (a.revenue_usd_m || 0))[0]?.sector || "specialty";
}
const inSector = (c, id) => !id || primarySector(c) === id || sectorsOf(c).some(s => s.sector === id);
// Revenue in one sector. Water reads the index's US water treatment revenue.
function sectorRev(c, id) {
  id = id || primarySector(c);
  if (id === "water" && num(c.us_water_treatment_revenue_usd_m) !== null) return num(c.us_water_treatment_revenue_usd_m);
  const s = sectorsOf(c).find(x => x.sector === id);
  if (s && num(s.revenue_usd_m) !== null) return num(s.revenue_usd_m);
  if (id === primarySector(c) && sectorsOf(c).length <= 1) return num(c.total_revenue_usd_m);
  return null;
}
const sectorShort = id => sectorById(id)?.short || "Sector";
const sectorRevLabel = id => id === "water" ? "US water rev" : sectorShort(id) + " rev";
function sectorRank(c, id) {
  id = id || primarySector(c);
  const order = memod("rank:" + id, () => list().filter(p => inSector(p, id) && sectorRev(p, id)).sort((a, b) => sectorRev(b, id) - sectorRev(a, id)).map(p => p.id));
  const i = order.indexOf(c.id); return i < 0 ? null : { rank: i + 1, of: order.length };
}
function shareMap(c) {
  const s = sectorsOf(c), tot = s.reduce((t, x) => t + (num(x.pct) || 0), 0), o = {};
  if (!tot) { o[primarySector(c)] = 100; return o; }
  for (const x of s) o[x.sector] = (num(x.pct) || 0) / tot * 100;
  return o;
}
const sectorChips = (c, link = true) => {
  const p = primarySector(c);
  return sectorsOf(c).filter(s => s.sector).sort((a, b) => (a.sector === p ? -1 : b.sector === p ? 1 : (b.pct || 0) - (a.pct || 0))).map(s => {
    const cls = s.sector === p ? "pill accent" : "pill";
    return link ? `<a class="${cls}" href="#companies" data-setsector="${esc(s.sector)}" title="Show ${esc(sectorById(s.sector)?.name || s.sector)}">${esc(sectorShort(s.sector))}${s.pct ? ` · ${Math.round(s.pct)}%` : ""}</a>` : `<span class="${cls}">${esc(sectorShort(s.sector))}</span>`;
  }).join("");
};

function fmtM(v) {
  v = num(v); if (v === null) return "—";
  const a = Math.abs(v);
  if (a >= 1000) return "$" + (v / 1000).toFixed(a >= 10000 ? 0 : 1) + "B";
  if (a >= 100) return "$" + Math.round(v) + "M";
  return "$" + v.toFixed(1).replace(/\.0$/, "") + "M";
}
const fmtPct = v => num(v) === null ? "—" : (+v).toFixed(+v < 10 && +v % 1 ? 1 : 0) + "%";
const fmtInt = v => num(v) === null ? "" : (+v).toLocaleString("en-US", { maximumFractionDigits: 1 });
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); } catch { return ""; } };
const yearOf = s => { const m = String(s || "").match(/(19|20)\d{2}/); return m ? +m[0] : 0; };
const dateKey = s => { const m = String(s || "").match(/((?:19|20)\d{2})(?:-(\d{1,2}))?(?:-(\d{1,2}))?/); return m ? +m[1] * 10000 + (+(m[2] || 0)) * 100 + (+(m[3] || 0)) : 0; };

/* ---------- state ---------- */
let db = null, sample = null;
const companies = new Map();
const details = {};                    // id -> detail doc (loaded on open)

    } else {

  return `<div class="panel pie"><h3>${esc(title)} ${lock}</h3><div class="pie-body"><svg viewBox="0 0 132 132" role="img" aria-label="${esc(title)} breakdown">${paths}${center}</svg><ul class="legend">${legend}</ul></div></div>`;
}

/* ---------- markdown (small) ---------- */
function md(src) {
  const lines = String(src || "").split("\n"); let out = "", inList = false;
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g, "$1<em>$2</em>");
  for (let l of lines) {
    const t = l.trim();
    if (/^[-*] |^\d+\. /.test(t)) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(t.replace(/^[-*] |^\d+\. /, ""))}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (!t) continue;
    if (t.startsWith("### ")) out += `<h4>${inline(t.slice(4))}</h4>`;
    else if (t.startsWith("## ")) out += `<h3>${inline(t.slice(3))}</h3>`;
    else if (t.startsWith("# ")) out += `<h3>${inline(t.slice(2))}</h3>`;
    else out += `<p>${inline(t)}</p>`;
  }
  if (inList) out += "</ul>";
  return out;
}

function addonList(c) {

// Search autofill: companies whose name, parent, sponsor or rolled-in brands match what's typed.
function acMatches() {
  const lo = x => String(x || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const q = lo(ui.q); if (!q) return [];
  const out = [], seen = new Set();
  const cut = x => { x = String(x || "").trim(); return x.length > 60 ? x.slice(0, 57) + "…" : x; };
  for (const c of list()) {
    const n = lo(c.name);
    let score = 0, why = "";
    if (n.startsWith(q)) score = 100;
    else if (n.split(" ").some(w => w.startsWith(q))) score = 80;
    else if (n.includes(q)) score = 60;
    else if (lo(c.platform_name).includes(q)) { score = 45; why = cut(c.platform_name); }
    else if (lo(c.pe_sponsor).includes(q)) { score = 40; why = "Sponsor: " + cut(String(c.pe_sponsor).split(/[;(]/)[0]); }
    else if (lo(c.rolled_in).includes(q)) { score = 35; why = "Owns " + cut((String(c.rolled_in).split(";").find(x => lo(x).includes(q)) || "").replace(/\(.*?\)/g, "")); }
    if (score) { out.push({ c, score: score + Math.min(20, Math.log10(1 + (num(c.total_revenue_usd_m) || 0)) * 5), why }); seen.add(c.id); }
  }
  for (const e of meta.entities || []) {
    if (!e.owner_id || !companies.has(e.owner_id) || !lo(e.name).includes(q)) continue;
    const c = companies.get(e.owner_id);
    out.push({ c, score: (lo(e.name).startsWith(q) ? 70 : 30), why: `${cut(e.name)} is part of ${c.name}` });
  }
  const best = new Map();
  for (const m of out) if (!best.has(m.c.id) || best.get(m.c.id).score < m.score) best.set(m.c.id, m);
  return [...best.values()].sort((a, b) => b.score - a.score).slice(0, 8);
}

  if (!ui.acOpen || !ui.q) return "";
  const ms = acMatches(); if (!ms.length) return "";

// Bring every source to the base year with its own growth rate (or the median of the others), weight by
// reliability, and down-weight outliers far from the median.
function triangulate(t) {
  const geo = t?.geo || "US", base = +(t?.base_year || 2025);
  const src = (t?.sources || []).filter(x => num(x.value_usd_m));
  const cagrs = src.map(x => num(x.cagr_pct)).filter(x => x !== null);
  const medC = median(cagrs) ?? 4;
  const rows = src.map((x, i) => {
    const inGeo = (x.geography || "US") === geo, g = num(x.cagr_pct) ?? medC, yr = +(yearOf(x.year) || base);
    const adj = num(x.value_usd_m) * Math.pow(1 + g / 100, base - yr);
    return { ...x, i, inGeo, adj, g, w0: REL_W[x.reliability] || 1 };
  });
  const use = rows.filter(r => r.inGeo);
  const med = median(use.map(r => r.adj));
  for (const r of use) { r.outlier = med && (r.adj > 2.5 * med || r.adj < med / 2.5); r.w = r.w0 * (r.outlier ? 0.25 : 1); }
  const W = use.reduce((s, r) => s + r.w, 0);
  const tam = W ? use.reduce((s, r) => s + r.adj * r.w, 0) / W : null;
  const vals = use.map(r => r.adj);
  return { rows, tam, lo: vals.length ? Math.min(...vals) : null, hi: vals.length ? Math.max(...vals) : null, n: use.length, geo, base, medC };
}
const tamValue = t => num(t?.override_usd_m) ?? triangulate(t).tam;
function foundTam(sid) {
  return memod("found:" + sid, () => {
    const rows = list().filter(c => inSector(c, sid)).map(c => ({ c, r: sectorRev(c, sid) || 0 })).filter(x => x.r > 0).sort((a, b) => b.r - a.r);
    return { rows, total: rows.reduce((s, x) => s + x.r, 0) };
  });
}
// Simple database search: names that profiles in this sector mention but that have no profile yet.
function mentionedNotProfiled(sid) {
  return memod("mentioned:" + sid, () => {
    const m = new Map(), dismissed = new Set((tams[sid]?.dismissed || []).map(norm));
    const add = (name, how, from) => {
      const k = norm(name); if (!k || k.length < 3 || dismissed.has(k) || findCompanyByName(name)) return;
      if (/^(private equity|ipo|not a realistic|chinese |on-site|other)|->|sold to|\b(funds?|sponsors?|investors?|platforms|producers|private equity|pe firms?|regional|generation systems|backed|market)\b/i.test(name) || name.length > 60) return;
      const e = m.get(k) || { name, how: new Set(), from: new Set(), n: 0 }; e.n++; e.how.add(how); e.from.add(from); m.set(k, e);
    };
    // Deal targets are already owned by their acquirer, so only competitors, buyers and add-on ideas count.
    for (const c of list().filter(c => primarySector(c) === sid)) {
      for (const x of c.competitors || []) add(x.name, "competitor", c.name);
      for (const x of c.buyers || []) add(x.name, "buyer", c.name);
      for (const x of c.addon_ideas || []) add(x.target, "add-on idea", c.name);
    }
    return [...m.values()].sort((a, b) => b.n - a.n).slice(0, 25);
  });
}

function dbCandidates(q) {
  const lo = x => String(x || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(), k = lo(q);
  if (!k) return [];
  const hit = findCompanyByName(q), out = hit ? [hit] : [];
  for (const c of list()) { if (out.length >= 4) break; if (c !== hit && (lo(c.name).includes(k) || (k.length > 4 && k.includes(lo(c.name).split(" ")[0]) && lo(c.name).split(" ")[0].length > 4))) out.push(c); }
  return out;
}
async function startAdd(q, sector) {
  q = String(q || "").trim(); if (!q) return;
  ui.addFlow = { q, sector: sector || ui.sector || "specialty", status: sample ? "searching" : "pick", cands: [], db: dbCandidates(q) };
  if (location.hash !== "#companies") location.hash = "companies"; else render();
  if (!sample) return;
  const prompt = `Someone typed "${q}" to add a company to a chemicals M&A database (sector hint: ${sectorById(ui.addFlow.sector)?.name || "any"}).

Which real companies could this mean? List up to 5, most likely first. Include a company only if you are confident it exists. Correct obvious typos (for example "Lubriction" means "Lubrication"). If you don't recognise any real company by this name, return an empty list; do not make one up.

Reply with ONLY JSON:
{"candidates":[{"name":"official company name","one_line":"what it does, under 15 words","hq":"City, ST or City, Country","website":"domain.com or empty","parent":"owner or parent if any","sector":"one of: ${allSectors().map(x => x.id).join(", ")}","confidence":"High | Medium | Low"}]}`;
  try {
    const web = webOK && await webSetup();
    const r = await sample.json(web ? prompt.replace("Which real companies could this mean?", "Search the web first (search_web, one call with 2-3 queries such as the name plus \"company\" and the name plus the sector), then answer from what you find. Which real companies could this mean?") : prompt, web ? { modelTier: "default", tools: webTools(null) } : { modelTier: "default", cache: false });
    if (ui.addFlow?.q !== q) return;
    ui.addFlow.cands = (r?.candidates || []).filter(x => x?.name && x?.one_line).slice(0, 5);
    ui.addFlow.status = "pick";
  } catch (e) {
    if (ui.addFlow?.q !== q) return;
    if (e?.code === "not_granted" || e?.code === "sampling_disabled") sample = null;
    ui.addFlow.status = "pick"; ui.addFlow.error = ERRMSG[e?.code] || "Couldn't look this name up. You can still add it as typed.";
  }
  render();
}

function viewTargets() {

        .map(p => { const o = overlap(base, p), n = (p.acquisitions || []).length; return { p, o, n, s: o * (0.6 + 0.4 * Math.min(1, n / 10)) }; })
        .filter(x => x.o > 0).sort((a, b) => b.s - a.s).slice(0, 8);
      fit = ranked.length ? `<div class="sec-h" style="margin-top:22px"><h2>Best-fit homes in Profiler</h2><span class="faint" style="font-size:12px">Companies at least twice its size, ranked by similarity in sector and end markets, boosted for active acquirers</span></div>
      <div class="panel bars" style="padding:6px">${ranked.map((x, i) => `<div class="brow" data-open="${esc(x.p.id)}" data-tip="${esc(x.p.name)}: ${x.o.toFixed(0)}% similarity · ${x.n} deals · ${fmtM(sectorRev(x.p, tsid) ?? x.p.total_revenue_usd_m)} ${esc(sectorRevLabel(tsid))}"><span class="rk">${i + 1}</span><span class="nm">${esc(x.p.name)} <span class="faint" style="font-weight:400;font-size:12px">${fmtM(sectorRev(x.p, tsid) ?? x.p.total_revenue_usd_m)} · ${x.n} deals</span></span><div class="track"><div class="fill" style="width:${Math.min(100, x.o)}%"></div></div><span class="v">${x.o.toFixed(0)}%</span></div>`).join("")}</div>` : "";

/* ---------- sponsors, in market, logos, multiples ---------- */
const isPE = c => c.owner_type === "PE-owned" || !!c.pe_backed;
function sponsorOf(c) {
  const raw = String(c.pe_sponsor || (isPE(c) ? c.ultimate_parent : "") || "");
  const n = raw.split(/[;(]| \+ |, | and |\//)[0].replace(/\b(L\.?P\.?|LLC|Inc\.?|Ltd\.?)\b\.?/gi, "").replace(/\s+/g, " ").replace(/[,.\s]+$/, "").trim();
  return n || "Sponsor not named";
}
const subIndustry = c => { const sec = sectorShort(primarySector(c)), cat = String(c.primary_category || "").split(/[(;]/)[0].trim(); return cat ? `${sec}: ${cat}` : sec; };
const entryYear = c => { const y = yearOf(c.pe_entry_year); return y && y > 1980 && y <= new Date().getFullYear() ? y : null; };
const holdYears = c => { const y = entryYear(c); return y ? new Date().getFullYear() - y : null; };
function entryMult(c) {
  const x = num(c.pe_entry_ev_ebitda_x); if (x) return x;
  const m = String(c.pe_entry_multiple || "").match(/(\d+(?:\.\d+)?)\s*(?:[-–]\s*\d+(?:\.\d+)?)?\s*x\b/i); return m ? +m[1] : null;
}
const evEbitda = c => num(c.ev_ebitda_x) ?? (num(c.ev_usd_m) && num(c.total_ebitda_usd_m) ? c.ev_usd_m / c.total_ebitda_usd_m : null);
const dealEvx = d => num(d.evx) ?? (d.value && num(d.ebitda) ? d.value / d.ebitda : null);
const fmtX = v => num(v) === null ? "—" : (+v).toFixed(1) + "x";
const IM_STAGES = ["Rumored", "Preparing (bank hired)", "Launched / teasers out", "First round", "Second round / management meetings", "Final bids / exclusivity", "Signed", "Pulled"];
const inMarket = c => c.in_market && c.in_market.stage && c.in_market.stage !== "Pulled" ? c.in_market : null;
const logos = new Map();
const logoImg = (c, cls = "sm") => logos.get(c.id) ? `<img class="logo ${cls}" src="${esc(logos.get(c.id))}" alt="">` : "";
// Shrink an uploaded logo to at most 320×160 so it stores in one small document and loads fast on strips.
function logoData(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 320 / img.width, 160 / img.height), cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k)); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL("image/png")); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Not an image")); };
    img.src = url;
  });
}
const bar = (v, max) => `<span class="hb"><i style="width:${max ? Math.max(2, Math.round(v / max * 100)) : 0}%"></i></span>`;
function viewSponsors(r) {
  const all = list().filter(isPE);
  const f = r.fk, v = r.fv;
  const match = c => !f || (f === "o" && sponsorOf(c) === v) || (f === "y" && String(entryYear(c) || "Not known") === v) || (f === "s" && subIndustry(c) === v);
  const rows = all.filter(match).sort((a, b) => (num(b.total_revenue_usd_m) || 0) - (num(a.total_revenue_usd_m) || 0));
  const group = (keyFn, labelFn) => { const m = new Map(); for (const c of all) { const k = keyFn(c); const g = m.get(k) || { k, n: 0, rev: 0, names: [] }; g.n++; g.rev += num(c.total_revenue_usd_m) || 0; g.names.push(c.name); m.set(k, g); } return [...m.values()].map(g => ({ ...g, label: labelFn(g.k) })); };
  const byYear = group(c => String(entryYear(c) || "Not known"), k => k).sort((a, b) => (b.k === "Not known") - (a.k === "Not known") || String(b.k).localeCompare(String(a.k)));
  const bySec = group(c => subIndustry(c), k => k).sort((a, b) => b.n - a.n);
  const byOwner = group(c => sponsorOf(c), k => k).sort((a, b) => b.n - a.n || b.rev - a.rev);
  const panel = (title, gs, key) => { const mx = Math.max(...gs.map(g => g.n), 1); return `<div class="panel spg"><div class="sec-h"><h2>${title}</h2></div><table class="gt"><tbody>${gs.map(g => `<tr class="${f === key && v === String(g.k) ? "on" : ""}"><td><a href="#sponsors~${key}~${encodeURIComponent(g.k)}" title="${esc(g.names.slice(0, 12).join(", "))}">${esc(g.label)}</a></td><td class="r num">${g.n}</td><td>${bar(g.n, mx)}</td><td class="r num faint">${g.rev ? fmtM(g.rev) : ""}</td></tr>`).join("")}</tbody></table></div>`; };
  const holds = all.map(holdYears).filter(x => x !== null).sort((a, b) => a - b);
  const medHold = holds.length ? holds[Math.floor(holds.length / 2)] : null;
  const fLabel = f === "o" ? v : f === "y" ? "Entry year " + v : f === "s" ? v : "";
  const tr = c => { const h = holdYears(c), im = inMarket(c); return `<tr class="link" data-open="${esc(c.id)}"><td class="cname"><a href="#c.${esc(c.id)}">${logoImg(c)}${esc(c.name)}</a>${im ? ` <span class="pill accent">In market</span>` : ""}<small>${esc([subIndustry(c), c.hq_address].filter(Boolean).join(" · "))}</small></td><td><a href="#sponsors~o~${encodeURIComponent(sponsorOf(c))}">${esc(sponsorOf(c))}</a></td><td class="r num">${fmtM(c.total_ebitda_usd_m)}</td><td class="r num">${fmtM(c.total_revenue_usd_m)}</td><td class="r num ${h >= 5 ? "warnc" : ""}">${h !== null ? h + " yrs" : "—"}</td><td class="r num">${fmtX(entryMult(c))}</td><td class="r num">${fmtX(evEbitda(c))}</td></tr>`; };
  // Year, then every sponsor-owned company bought that year.
  const years = new Map();
  for (const c of rows) { const y = String(entryYear(c) || "Entry year not known"); if (!years.has(y)) years.set(y, []); years.get(y).push(c); }
  const order = [...years.keys()].sort((x, y) => (x === "Entry year not known") - (y === "Entry year not known") || y.localeCompare(x));
  const body = order.map(y => { const cs = years.get(y).sort((a, b) => (num(b.total_ebitda_usd_m) || 0) - (num(a.total_ebitda_usd_m) || 0)); const eb = cs.reduce((t, c) => t + (num(c.total_ebitda_usd_m) || 0), 0); return `<tr class="yr"><th colspan="7"><span>${esc(y)}</span><span class="faint">${cs.length} ${cs.length === 1 ? "company" : "companies"}${eb ? " · EBITDA " + fmtM(eb) : ""}</span></th></tr>${cs.map(tr).join("")}`; }).join("");
  return `<div class="page-h"><div><div class="eyebrow">All sectors · Private equity</div><h1>Sponsor owned</h1><p>Every PE-owned company in Profiler by the year its sponsor bought it. Holds of five years or more are highlighted: those are the likeliest sellers. Click a company to open it, or a sponsor to see its portfolio.</p></div></div>

  const locked = new Set(cur.locked || []), conf = { ...(cur.conf || {}) }, patch = {}, hist = [], saved = [], rejected = [], lockF = [], ev = [], secs = new Set();
  const before = {};
  const remember = f => { if (!(f in before)) before[f] = cur[f] === undefined ? null : clean(cur[f] ?? null); };
  for (const a of actions.slice(0, 40)) {
    const src = ["web", "user", "knowledge"].includes(a.source) ? a.source : "knowledge";
    const urls = [].concat(a.source_urls || []).map(String).filter(u => seen.has(u));
    const what = a.type === "set_field" ? label(a.field) : a.type === "user_fact" ? "fact" : `${a.list} row “${rowName(a.row) || a.match || ""}”`;
    if (src === "web" && !urls.length) { rejected.push(`${what}: no source page found this turn`); continue; }
    const level = src === "user" ? "Verified" : src === "knowledge" ? "Low" : (a.confidence === "High" ? "High" : a.confidence === "Low" ? "Low" : "Medium");
    const basis = (String(a.basis || "") + (urls.length ? " · " + urls.slice(0, 2).join(" ") : src === "user" ? " · you said so in chat" : "")).trim().slice(0, 400);
    if (a.type === "user_fact") {
      if (src !== "user" || !a.text) { rejected.push("fact: only things you tell me are saved as facts"); continue; }
      remember("source_of_truth"); patch.source_of_truth = [...(patch.source_of_truth || cur.source_of_truth || []), { text: String(a.text).slice(0, 500), at: now() }]; saved.push("Your fact: " + String(a.text).slice(0, 80)); continue;
    }
    if (a.type === "set_field") {
      const f = a.field;
      if (!CHAT_FIELDS.includes(f)) { rejected.push(`${f}: not a field chat can set`); continue; }
      const v = coerce(f, a.value); if (v === null || v === "") { rejected.push(`${label(f)}: empty value`); continue; }
      const old = confOf(cur, f).level;
      if (src !== "user" && locked.has(f)) { rejected.push(`${label(f)}: you verified the current value`); continue; }
      if (src !== "user" && has(cur[f]) && lvl(level) < lvl(old)) { rejected.push(`${label(f)}: current value is better supported (${old})`); continue; }
      remember(f); remember("conf"); patch[f] = v;
      if (src === "user") lockF.push(f); else conf[f] = { level, basis, at: now(), by: "Chat" };
      hist.push({ at: now(), field: f, by: src === "user" ? "You (chat)" : "Chat", before: short(cur[f]), after: short(v), level });
      saved.push(`${label(f)} → ${short(v)} (${level})`); secs.add(sectionOfField(f));
    } else if (CHAT_LISTS[a.list]) {
      const L = a.list;
      if (!(L in patch)) { remember(L); patch[L] = clean(L === "products" ? catalog(cur) : (cur[L] || [])); }
      const arr = patch[L], key = x => norm(x), m = a.match || rowName(a.row);
      const idx = m ? arr.findIndex(r => key(rowName(r)) === key(m) || (L === "products" && (key(r.line) === key(m) || key(r.category) === key(m)))) : -1;
      const row = cleanRow(L, a.row);
      if (a.type === "remove_row") { if (idx < 0) { rejected.push(`${L}: no row called “${m}”`); continue; } arr.splice(idx, 1); saved.push(`Removed ${L.replace(/_/g, " ")} row “${m}”`); }
      else {
        if (!rowName(row) && idx < 0) { rejected.push(`${L}: row has no name`); continue; }
        const tagged = { ...row, confidence: level, source: urls[0] || (src === "user" ? "You (chat)" : "Claude's knowledge"), added_by: "Chat", added_at: now() };
        if (idx >= 0) { arr[idx] = { ...arr[idx], ...tagged }; saved.push(`Updated ${L.replace(/_/g, " ")}: ${rowName(arr[idx])} (${level})`); }
        else if (a.type === "update_row") { rejected.push(`${L}: no row called “${m}” to update`); continue; }
        else { arr.push(tagged); saved.push(`Added ${L.replace(/_/g, " ")}: ${rowName(tagged)} (${level})`); }
      }
      if (!conf[L] || lvl(conf[L].level) < lvl(level)) { remember("conf"); conf[L] = { level: level === "Verified" ? "High" : level, basis: "Updated in chat", at: now(), by: "Chat" }; }
      hist.push({ at: now(), field: L, by: "Chat", before: short(cur[L]), after: short(arr), level });
      secs.add(CHAT_LISTS[L]);
    } else { rejected.push(`${a.type}: unknown action`); continue; }
    for (const u of urls) ev.push({ metric: what, value: String(a.basis || "").slice(0, 200), year: "", source_type: domainOf(u), url: u, quote: "", at: now(), by: "Chat" });
  }
  if (!saved.length) return { saved, rejected };
  if (patch.acquisitions) patch.acquisitions.sort((a, b) => dateKey(b.date) - dateKey(a.date));
  if (patch.products) { remember("revenue_by_product"); patch.revenue_by_product = productRollup({ ...cur, products: patch.products }); }
  remember("section_meta"); remember("locked");
  patch.conf = conf;
  patch.history = [...hist, ...(cur.history || [])].slice(0, 200);
  if (ev.length) patch.evidence = [...ev, ...(cur.evidence || [])].slice(0, 300);
  const mat = [...secs].filter(Boolean);
  if (mat.length) patch.section_meta = markStale(cur, mat, cur.section_meta);
  patch.runs = [...(cur.runs || []), { at: now(), kind: "Chat", summary: saved.join("; ").slice(0, 400) }].slice(-60);
  if (cur.status === "empty") patch.status = "ready";
  const ok = await save(id, patch, lockF, true);
  if (!ok) return { saved: [], rejected: ["Couldn't save: " + (lastSaveError || "database error")] };
  return { saved, rejected, undo: { id, before } };
}
// Reruns build on the profile: catalog-type lists merge (matching rows update, new rows add, rows not mentioned
// stay). Mix splits that must add to 100% (segments, sectors, where products go) are replaced as a whole.
const MERGE_KEYS = { segment_profiles: r => norm(r.name), products: r => norm(r.category) + "|" + norm(r.line), customers: r => norm(r.name), competitors: r => norm(r.name), buyers: r => norm(r.name), addon_ideas: r => norm(r.target) };
function mergeLists(c, v) {
  for (const [f, key] of Object.entries(MERGE_KEYS)) {
    if (!Array.isArray(v[f])) continue;
    const base = clean(f === "products" ? catalog(c) : (c[f] || [])), out = base.slice(), idx = new Map(base.map((r, i) => [key(r), i]));
    for (const r of v[f]) {
      if (!r || typeof r !== "object") continue;
      const k = key(r), keep = Object.fromEntries(Object.entries(r).filter(([, x]) => x !== null && x !== "" && !(Array.isArray(x) && !x.length)));
      if (idx.has(k)) out[idx.get(k)] = { ...out[idx.get(k)], ...keep }; else { idx.set(k, out.length); out.push(keep); }
    }
    v[f] = out;
  }
  return v;
}
// A whole builder step proposed in chat: same checks, then merged by the normal rules (weaker never beats stronger).
async function applySteps(id, acts, seen, msg) {
  const saved = [], rejected = [], before = {};
  for (const a of acts.slice(0, 11)) {
    const key = a.step, c = getC(id), sec = c && sectionDef(c, key);
    if (!sec || !a.value || typeof a.value !== "object") { rejected.push(`step ${key || "?"}: missing step or value`); continue; }
    const src = ["web", "user", "knowledge"].includes(a.source) ? a.source : "knowledge";
    const urls = [].concat(a.source_urls || []).map(String).filter(u => seen.has(u));
    if (src === "web" && !urls.length) { rejected.push(`${sec.label}: no source page found this turn`); continue; }
    const v = mergeLists(c, clean(a.value));
    if (src === "knowledge") v.confidence = Object.fromEntries(sec.fields.map(f => [f, "Low"]));
    for (const f of [...sec.fields, "conf", "section_meta", "suggestions", "revenue_by_product", EM_FIELD, "ebitda_margin_pct", "status"]) if (!(f in before)) before[f] = c[f] === undefined ? null : clean(c[f]);
    try {
      await applyResult(id, key, v, { by: "Chat", web: urls.length > 0, sources: urls.map(u => ({ url: u, title: domainOf(u), publisher: domainOf(u), supports: sec.label })) });
      saved.push(`${sec.label} step (${src === "web" ? urls.length + " source" + (urls.length > 1 ? "s" : "") : src === "user" ? "from you" : "from memory, rated Low"})`);
      if (msg) msg.stepApplied = true;
    } catch (e) { rejected.push(`${sec.label}: ${e?.code === "save_failed" ? "couldn't save" : "error"}`); }
  }
  return { saved, rejected, before };
}
async function chatUndo(i) {
  const S = cst(chat.id), m = S.msgs[i]; if (!m?.undo || m.undone) return;
  const b = { ...m.undo.before }; if (b.locked == null) b.locked = [];
  const ok = await save(m.undo.id, b, [], true);
  if (ok) { m.undone = true; chatMsgs(); toast("Undone"); chatSave(chat.id); }
}

  if (act === "savecomp") {
    const p = companies.get(btn.dataset.id);
    if (p) { await save(c.id, { competitors: [...(c.competitors || []), { name: p.name, overlap: `${overlap(c, p).toFixed(0)}% similarity; ${p.business_model || ""}` }] }, ["competitors"]); render(); }
  }
  if (act === "manual") { await save(c.id, { status: "ready" }); render(); }
  if (act === "askdel") { ui.confirmDel = true; render(); }
  if (act === "nodel") { ui.confirmDel = false; render(); }
  if (act === "del") { await deleteCompany(c.id); location.hash = "companies"; }
  if (act === "unlock") { const cc = companies.get(c.id); companies.set(c.id, { ...cc, locked: (cc.locked || []).filter(f => f !== btn.dataset.f) }); await save(c.id, {}); render(); }
  if (act === "addrow") {
    const f = btn.dataset.f, rows = tableRows(c, f); rows.push(clone(BLANK[f] || {}));
    const firstKey = f === EM_FIELD ? "name" : Object.keys(BLANK[f] || { x: 1 })[0];
    pendingFocus = `[data-f="${f}"][data-r="${rows.length - 1}"][data-k="${firstKey}"]`;
    await save(c.id, { [f]: rowsToValue(f, rows) }, [f]); render();
  }
  if (act === "delrow") {
    const f = btn.dataset.f, rows = tableRows(c, f); rows.splice(+btn.dataset.r, 1);
    await save(c.id, { [f]: rowsToValue(f, rows) }, [f]); render();
  }
  if (act === "delfact") { const s = [...(c.source_of_truth || [])]; s.splice(+btn.dataset.r, 1); await save(c.id, { source_of_truth: s }); render(); }
  if (act === "editmd") { ui.editMd = !ui.editMd; render(); }
  if (act === "savemd") { const v = $("#mdEdit").value; ui.editMd = false; await save(c.id, { profile_md: v }, ["profile_md"]); render(); }
});

function watchDetails() {
  const r = route(), id = r.view === "company" ? r.id : null;
  if (!db || id === detailId) return;
  if (detailSub) { detailSub(); detailSub = null; }
  detailId = id;
  if (!id) return;
  detailSub = db.doc("details/" + id).onSnapshot(d => { details[id] = d.exists ? d.data() : {}; render(); }, () => {});
}

$("#secsel").addEventListener("change", e => { setSector(e.target.value); e.target.blur(); const r = route(); if (r.view === "sectors" || r.view === "company") location.hash = "companies"; else render(); });

/* ---------- boot ---------- */
render();
(async () => {
  if (!window.claude?.use) { dbState = "off"; render(); return; }
  const [d, s] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("sample").catch(() => null)]);
  db = d; sample = s; if (!s) sampleIssue = "Claude not granted to this view";
  if (!db) { dbState = "off"; render(); return; }
  try {
    const u = await window.claude.use("user").catch(() => null);
    if (u?.can) { const w = await u.can("data.write"); if (w === false) { writable = false; } }
  } catch {}
  dbState = writable ? "live" : "readonly";
  window.claude.use("mcp").then(async m => {
    mcp = m; if (!m) return;
    try { const l = await m.listTools(WEBSRV); webOK = (l.servers || []).some(x => x.server === WEBSRV); } catch { webOK = false; }
    if (loaded) render();
  }).catch(() => {});
  db.collection("logos").limit(1000).onSnapshot(snap => { logos.clear(); snap.docs.forEach(d => { const x = d.data(); if (x?.data) logos.set(d.id, x.data); }); if (loaded) render(); }, () => {});
  db.collection("research").limit(500).onSnapshot(snap => { researchDocs = snap.docs.map(d => ({ ...d.data(), id: d.id })); if (loaded) render(); }, () => {});
  db.collection("webresults").limit(1000).onSnapshot(snap => { webDocs = snap.docs.map(d => ({ ...d.data(), id: d.id })); drainWeb(); if (loaded) render(); }, () => {});
  db.collection("queue").limit(500).onSnapshot(snap => { queueDocs = snap.docs.map(d => ({ ...d.data(), id: d.id })); if (loaded) render(); }, () => {});
  db.collection("tam").limit(200).onSnapshot(snap => { tams = {}; snap.docs.forEach(d => tams[d.id] = d.data()); ver++; if (loaded) render(); }, () => {});
  db.doc("meta/sectors").onSnapshot(d => { customSectors = d.exists ? (d.data().custom || []) : []; ver++; if (loaded) render(); }, () => {});
  db.doc("meta/deals").onSnapshot(d => { meta.deals = d.exists ? (d.data().deals || []) : []; ver++; if (loaded) render(); }, () => {});
  db.doc("meta/entities").onSnapshot(d => { meta.entities = d.exists ? (d.data().entities || []) : []; ver++; rebuildIndex(); if (loaded) render(); }, () => {});
  db.collection("companies").limit(1000).onSnapshot(snap => {
    companies.clear();
    snap.docs.forEach(doc => companies.set(doc.id, { ...doc.data(), id: doc.id }));
    loaded = true; ver++; rebuildIndex();
    watchDetails(); drainWeb();
    render();
  }, err => {
    if (err?.code === "revoked" || err?.code === "not_granted") { dbState = "off"; }
    render();
  });
})();
})();
</script>
