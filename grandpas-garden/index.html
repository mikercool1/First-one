<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8CCB5E">
<title>Grandpa's Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
:root {
  --ink: #2B2340; --muted: #6C6488; --card: #FFFDF6; --line: #EADFC8;
  --leaf: #3F9A3A; --leaf-d: #2C7A2A; --tomato: #E5372B; --tomato-d: #B8261F; --sun: #FFD23F;
  --font: "Fredoka", "Baloo 2", ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #8CCB5E; color: var(--ink); font: 600 16px/1.3 var(--font); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #2F5BEA; outline-offset: 2px; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }

/* ---------- HUD ---------- */
.hud { position: fixed; inset: 0 0 auto 0; padding: max(10px, env(safe-area-inset-top)) 16px 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.hud-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hud-right { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.pill { background: rgba(255,253,246,.92); border: 2px solid rgba(43,35,64,.12); border-radius: 999px; padding: 5px 12px; font-size: 15px; box-shadow: 0 3px 0 rgba(43,35,64,.12); white-space: nowrap; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(43,35,64,.12); background: rgba(255,253,246,.92); box-shadow: 0 3px 0 rgba(43,35,64,.12); display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 20px; height: 20px; }
.timer { min-width: 92px; text-align: center; background: var(--card); border: 3px solid #fff; border-radius: 20px; padding: 2px 14px 4px; box-shadow: 0 4px 0 rgba(43,35,64,.18); font: 700 40px/1.05 var(--font); font-variant-numeric: tabular-nums; }
.timer small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.timer.hurry { color: #D12D22; animation: throb .5s ease-in-out infinite alternate; }
@keyframes throb { to { transform: scale(1.07); } }
.goal { display: flex; align-items: center; gap: 8px; background: var(--card); border: 3px solid #fff; border-radius: 20px; padding: 4px 14px 4px 8px; box-shadow: 0 4px 0 rgba(43,35,64,.18); }
.goal .tom { width: 34px; height: 34px; }
.goal b { font: 700 32px/1 var(--font); font-variant-numeric: tabular-nums; }
.goal span { font-size: 18px; color: var(--muted); white-space: nowrap; }
.goal.done { background: #E4F8D8; }
.goal.bump { animation: bump .25s ease; }
@keyframes bump { 50% { transform: scale(1.12); } }
.race { grid-column: 1 / -1; justify-self: end; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.chip { display: flex; align-items: center; gap: 5px; background: rgba(255,253,246,.9); border-radius: 999px; padding: 2px 10px 2px 2px; font-size: 14px; border: 2px solid transparent; font-variant-numeric: tabular-nums; }
.chip canvas { width: 26px; height: 26px; border-radius: 50%; }
.chip.me { border-color: var(--ink); }
.chip b { font-weight: 700; }
@media (max-width: 560px) {
  .timer { font-size: 32px; min-width: 76px; }
  .hud { gap: 6px; }
  .goal { gap: 4px; padding: 3px 10px 3px 5px; }
  .goal b { font-size: 24px; }
  .goal span { font-size: 15px; }
  .goal .tom { width: 24px; height: 24px; }
  .icon-btn { width: 36px; height: 36px; }
  .pill { font-size: 13px; padding: 4px 10px; }
  .race { justify-self: stretch; justify-content: center; }
  .chip { font-size: 15px; padding-right: 8px; gap: 4px; }
  .chip .nm { display: none; }
}

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top)) 16px 16px; background: rgba(40,70,30,.35); overflow-y: auto; }
.card { width: min(560px, 100%); background: var(--card); border-radius: 28px; padding: 22px 20px; box-shadow: 0 10px 0 rgba(43,35,64,.18), 0 20px 50px rgba(20,40,10,.3); text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; }
h1 { margin: 0; font: 700 clamp(34px, 9vw, 52px)/1 var(--font); color: var(--leaf-d); letter-spacing: -.01em; text-shadow: 0 3px 0 #D7EFC6; }
h1 .red { color: var(--tomato); text-shadow: 0 3px 0 #F8D0CB; }
h2 { margin: 0; font: 700 26px/1.1 var(--font); }
p { margin: 0; }
.lead { font-size: 18px; color: var(--muted); max-width: 34ch; }
.rules { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.rule { background: #F4EEDD; border-radius: 16px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; }
.rule canvas { width: 44px; height: 44px; }
.rule b { font-size: 16px; }
.label { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.kids { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; width: 100%; }
.kid { border: 3px solid var(--line); background: #fff; border-radius: 18px; padding: 6px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.kid canvas { width: 100%; max-width: 88px; aspect-ratio: 1; border-radius: 50%; }
.kid[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); transform: translateY(-2px); }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%; }
.lvl { border: 3px solid var(--line); background: #fff; border-radius: 18px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 0; }
.lvl b { font-size: 20px; }
.lvl span { font-size: 13px; color: var(--muted); }
.lvl .best { font-size: 12px; color: var(--leaf-d); min-height: 1.3em; }
.lvl[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 4px 0 var(--ink); transform: translateY(-2px); }
.btn { border: 0; border-radius: 18px; padding: 14px 28px; font: 700 22px/1 var(--font); background: var(--tomato); color: #fff; box-shadow: 0 5px 0 var(--tomato-d); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--tomato-d); }
.btn.alt { background: #fff; color: var(--ink); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line); font-size: 18px; padding: 11px 20px; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.grandpa { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; }
.grandpa canvas { width: 96px; height: 96px; border-radius: 50%; flex: none; }
.say { position: relative; background: #fff; border: 3px solid var(--ink); border-radius: 20px; padding: 10px 14px; font-size: 20px; line-height: 1.25; }
.say::before { content: ""; position: absolute; left: -12px; top: 50%; margin-top: -9px; border: 9px solid transparent; border-right-color: var(--ink); border-left: 0; }
.say b { color: var(--tomato); font-size: 1.25em; }
.standings { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.stand { display: flex; align-items: center; gap: 10px; background: #F4EEDD; border-radius: 14px; padding: 5px 12px 5px 6px; font-size: 18px; }
.stand.me { background: #FFE9A8; }
.stand canvas { width: 36px; height: 36px; border-radius: 50%; }
.stand .place { width: 32px; font-weight: 700; color: var(--muted); }
.stand .n { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
.stats { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.stats span { background: #F4EEDD; border-radius: 999px; padding: 3px 10px; }
.bowl { width: 180px; height: 110px; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Grandpa's tomato garden"></canvas>

<div class="hud" id="hud" hidden>
  <div class="hud-left">
    <button class="icon-btn" id="home" aria-label="Back to menu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 10 3.5l7 6M5 8v8.5h10V8"/></svg></button>
    <span class="pill" id="lvlName">Level 1 · Easy</span>
  </div>
  <div class="timer" id="timer">60<small>seconds</small></div>
  <div class="hud-right">
    <div class="goal" id="goal"><canvas class="tom" id="goalTom" width="68" height="68"></canvas><b id="count">0</b><span>/ <span id="target">20</span></span></div>
    <button class="icon-btn" id="mute" aria-label="Sound on"></button>
  </div>
  <div class="race" id="race"></div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>Grandpa's <span class="red">Garden</span></h1>
    <p class="lead">Grandpa Simon's tomatoes grow super fast. Race to fill your basket before the minute is up!</p>
    <div class="rules">
      <div class="rule"><canvas width="88" height="88" data-rule="green"></canvas><b>Green?</b>Let it grow</div>
      <div class="rule"><canvas width="88" height="88" data-rule="red"></canvas><b>Red?</b>Pick it!</div>
      <div class="rule"><canvas width="88" height="88" data-rule="fall"></canvas><b>Too slow?</b>It falls off</div>
    </div>
    <div class="label">Who's picking?</div>
    <div class="kids" id="kids"></div>
    <div class="label">Level</div>
    <div class="levels" id="levels"></div>
    <button class="btn" id="start">Go to the garden</button>
  </div>
</div>

<div class="overlay" id="brief" hidden>
  <div class="card">
    <div class="label" id="briefLvl">Level 1 · Easy</div>
    <div class="grandpa"><canvas width="192" height="192" id="briefFace"></canvas><div class="say" id="briefSay"></div></div>
    <p class="lead" id="briefTip"></p>
    <button class="btn" id="go">Let's pick!</button>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="card">
    <h2 id="resTitle">Grandma's salad is ready!</h2>
    <canvas class="bowl" id="bowl" width="360" height="220"></canvas>
    <div class="grandpa"><canvas width="192" height="192" id="resFace"></canvas><div class="say" id="resSay"></div></div>
    <div class="standings" id="standings"></div>
    <div class="stats" id="stats"></div>
    <div class="btns">
      <button class="btn" id="next">Next level</button>
      <button class="btn alt" id="again">Play again</button>
      <button class="btn alt" id="menuBtn">Menu</button>
    </div>
    <button class="btn alt" data-rw-back hidden>BACK TO ROSENBERG WORLD</button>
  </div>
</div>

<script src="chars.js"></script>
<script src="game.js"></script>
</body>
</html>
