<title>Home Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap">
<style>
/* Layout: sticky top bar with four views; profile = header, KPI strip, fact bar, tabbed body. */
:root{
  --bg:#f2f4f5; --surface:#ffffff; --sunk:#e9edef; --ink:#0f1b24; --ink-2:#4b5b67; --ink-3:#7b8994;
  --line:#dbe1e5; --accent:#0d6b6b; --accent-ink:#ffffff; --accent-soft:#dcefee; --warn:#9a5b00; --warn-soft:#fbecd2;
  --bad:#b3261e; --good:#1c7c3c;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s0:#a3adb4;
  --f-display:"Instrument Serif", Georgia, "Times New Roman", serif;
  --f-body:"Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --f-mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1317; --surface:#141c22; --sunk:#1b252c; --ink:#e5ecf0; --ink-2:#9dadb8; --ink-3:#6f808c;
  --line:#26323b; --accent:#58b8b3; --accent-ink:#06201f; --accent-soft:#16312f; --warn:#e0a54a; --warn-soft:#33270f;
  --bad:#ef7b73; --good:#5cc27f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#56636c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1317; --surface:#141c22; --sunk:#1b252c; --ink:#e5ecf0; --ink-2:#9dadb8; --ink-3:#6f808c;
  --line:#26323b; --accent:#58b8b3; --accent-ink:#06201f; --accent-soft:#16312f; --warn:#e0a54a; --warn-soft:#33270f;
  --bad:#ef7b73; --good:#5cc27f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s0:#56636c;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-inline:16px;display:flex;align-items:center;gap:20px;min-height:56px;flex-wrap:wrap}
.brand{font:400 26px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand small{font:500 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.wsw{display:none!important}
.pbback{font:600 12px/1 var(--f-body);text-decoration:none;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:6px 10px;white-space:nowrap}
.pbback:hover{color:var(--ink);border-color:var(--ink-3)}
details.addons-x summary{cursor:pointer;padding:8px 0}
.modsw{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.modsw a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:13px;white-space:nowrap}
.modsw a[aria-selected="true"]{background:var(--ink);color:var(--bg)}
#navpe{display:none}
body.mod-pe #navpe{display:flex}
body.mod-pe #nav,body.mod-pe .secsel,body.mod-pe .wsw{display:none}
body.mod-pe .top{border-bottom-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.nav a.navpe{border:1px solid var(--line);margin-left:6px}
.spbar{display:inline-block;width:90px;height:8px;border-radius:99px;background:var(--sunk);vertical-align:middle;overflow:hidden}.spbar span{display:block;height:100%;background:var(--accent);border-radius:99px}.spbar.hi span{background:var(--warn)}
.spclock{margin:4px 0 18px}.spclock .hcard p{margin:6px 0 0;font-size:14px}
.sptl{padding:14px 16px}.sptl-ax{position:relative;height:18px;margin-left:190px;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink-3)}.sptl-ax span{position:absolute;transform:translateX(-50%)}.sptl-ax .now{position:absolute;top:0;width:2px;height:calc(100% + 9999px);max-height:none;background:var(--ink);opacity:.35}
.sptl{overflow:hidden}.sptl-row{display:flex;align-items:center;height:24px}.sptl-l{width:190px;flex:0 0 190px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sptl-t{position:relative;flex:1;height:12px}.sptl-t b{position:absolute;height:12px;border-radius:6px;background:var(--accent-soft);border:1px solid var(--accent)}.sptl-t b.hv{background:var(--ink-3);border-color:var(--ink-3)}.sptl-t b.fr{background:var(--accent)}
.spvint{display:flex;align-items:flex-end;gap:6px;height:170px;padding:14px 14px 8px}.spv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px}.spv span{display:block;width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:1px}.spv b{font-weight:600;margin-top:3px}.spv small{color:var(--ink-3)}
table.heat td{min-width:70px}
.pgrid.sppies{grid-template-columns:repeat(3,minmax(0,1fr))}
.sppies .pie-body{flex-direction:column;align-items:stretch}.sppies .pie svg{align-self:center;width:150px;height:150px;flex-basis:150px}.sppies .legend{display:block;columns:2;column-gap:16px}.sppies .legend li{break-inside:avoid}
@media (max-width:900px){.pgrid.sppies{grid-template-columns:1fr}}
.pie path.sl.on{stroke:var(--ink);stroke-width:2.5}
.pie .legend li.on{font-weight:700}
.pie .legend li[data-pk]:hover,.pie path[data-pk]:hover{opacity:.8}
.spdrill{margin-top:12px;border-color:var(--accent)}
.sptabs td small{display:block;color:var(--ink-3);font-size:12px;font-weight:400;margin-top:2px}
@media (max-width:600px){.sptl-ax{margin-left:110px}.sptl-l{width:110px;flex-basis:110px}}
table.pet td{vertical-align:middle}
.ib.sm{width:22px;height:22px;font-size:9px}
.linkbtn{border:0;background:none;padding:0 2px;cursor:pointer;color:inherit;font:inherit}
.top:has(.wsmenu:not([hidden])){z-index:60}
.wsbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:5px 26px 5px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;position:relative;font:inherit;text-align:left}
.wsbtn:hover{border-color:var(--ink-3)}
.wsbtn small{font:500 9px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.wsbtn b{font-size:13px;line-height:1.1;font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wsbtn span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--ink-3)}
.wsmenu{position:absolute;left:0;top:calc(100% + 6px);z-index:40;width:min(680px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);padding:14px}
.wsmenu .wsh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 2px 10px}
.wsmenu .wsh b{font-size:15px}
.wsmenu .wsh span{font-size:12px;color:var(--ink-3)}
.wsv{border-top:1px solid var(--line);padding:10px 2px}
.wsv:first-of-type{border-top:0}
.wsv h3{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center;gap:8px}
.wsv .wsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.wsv button{font:inherit;text-align:left;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wsv button:hover{border-color:var(--ink-3)}
.wsv button small{color:var(--ink-3);font-size:11px}
.wsv button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wsv button[aria-current="true"] small{color:inherit;opacity:.7}
.wsv h3 button{padding:3px 8px;font-size:11px;letter-spacing:0;text-transform:none}
@media (max-width:600px){.wsw{margin-left:0}.wsmenu{position:fixed;left:16px;right:16px;top:64px;width:auto}}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav a{padding:7px 12px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.secsel select{font-weight:600;padding:6px 28px 6px 10px;border-radius:999px;background:var(--surface);max-width:260px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.live{margin-left:auto;font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--good)}
.dot.off{background:var(--bad)}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font:400 44px/1.02 var(--f-display);letter-spacing:-.01em}
.page-h p{margin:6px 0 0;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{padding:4px 10px;font-size:12px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.lock{background:var(--warn-soft);color:var(--warn);border:0;padding:2px 8px}
.pill.lock:hover{text-decoration:line-through}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1 1 240px;min-width:0}
.acwrap{position:relative}
.ac{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(15,27,36,.14)}
.ac li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:8px 10px;border-radius:7px;cursor:pointer}
.ac li:hover,.ac li[aria-selected="true"]{background:var(--sunk)}
.ac-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac-s{color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search{width:100%}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--surface);white-space:nowrap}
th.sortable{cursor:pointer}
th.sortable:hover{color:var(--ink)}
td.r,th.r{text-align:right}
td.num{white-space:nowrap}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--sunk)}
.cname{font-weight:600}
.cname small{display:block;font-weight:400;color:var(--ink-3);font-size:12px;max-width:44ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td .x{opacity:0;border:0;background:none;color:var(--ink-3);padding:0 4px;font-size:16px;line-height:1}
tr:hover td .x,td .x:focus{opacity:1}
td .x:hover{color:var(--bad)}

/* editable */
[contenteditable]{border-radius:4px;outline:none;transition:background .12s}
[contenteditable]:hover{background:var(--sunk)}
[contenteditable]:focus{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
[contenteditable]:empty::before{content:attr(data-ph);color:var(--ink-3)}
td[contenteditable]{min-width:60px}

/* profile */
.crumb{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.crumb a{color:var(--ink-2);text-decoration:none}
.crumb a:hover{color:var(--ink)}
.ph{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.ph-main{min-width:0;flex:1 1 420px}
.ph h1{font:400 52px/1 var(--f-display);letter-spacing:-.015em;display:inline-block;padding:0 4px;margin-left:-4px}
.ph .sub{color:var(--ink-2);margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .val{font:500 26px/1.2 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:6px;display:flex;align-items:baseline;gap:3px}
.kpi .val .u{font-size:13px;color:var(--ink-3)}
.kpi .val [contenteditable]{padding:0 3px}
.kpi .note{font-size:12px;color:var(--ink-3);margin-top:2px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-left:0;border-top:1px solid var(--line)}.kpi:nth-child(-n+2){border-top:0}.kpi:nth-child(even){border-left:1px solid var(--line)}.ph h1{font-size:40px}.page-h h1{font-size:36px}}

.facts{margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px dashed var(--line);border-radius:var(--r)}
.facts input{flex:1 1 280px;min-width:0}
.facts .lab{font-size:12px;font-weight:600;color:var(--ink-2);padding-inline:4px}

/* chat dock */
.chat-fab.live{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.chat-fab.live{animation:none}}
.chat-fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;border-radius:999px;padding:12px 18px;box-shadow:0 8px 24px rgba(15,27,36,.22)}
.chat{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:45;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-12px 0 30px rgba(15,27,36,.14);padding-top:env(safe-area-inset-top,0px)}
.chat[hidden]{display:none}
.chat-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-h b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-m{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:100%;overflow-wrap:anywhere}
.msg.cu{align-self:flex-end;background:var(--accent-soft);padding:9px 12px;border-radius:12px 12px 2px 12px;max-width:88%}
.msg.ca{line-height:1.5}
.msg.cu.cstep{background:var(--sunk);font-weight:600;font-size:13px}
.msg .act{font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.msg .act span::before{content:"› ";color:var(--accent)}
.msg .saved{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;background:var(--sunk)}
.msg .saved div{margin:2px 0}
.msg .saved .no{color:var(--warn)}
.msg a{color:var(--accent)}
.chat-f{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;align-items:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.chat-f textarea{flex:1;min-height:44px;max-height:160px;resize:none}
.chat-hint{font-size:12px;color:var(--ink-3);padding:0 14px 8px}
@media (max-width:760px){.chat{width:100vw;border-left:0}}
@media (min-width:900px){body.chat-open main,body.chat-open .top-in{margin-right:440px;margin-left:max(0px,calc((100vw - 440px - 1180px)/2))}}
/* sponsors, in market, logos, valuation, segments */
.logo{display:inline-block;object-fit:contain;vertical-align:middle;background:#fff;border-radius:4px}
.logo.sm{height:20px;max-width:64px;margin-right:8px}
.logo.lg{height:44px;max-width:180px;padding:3px 6px;border:1px solid var(--line)}
.logo-row{display:flex;gap:8px;align-items:center;min-height:0;margin-bottom:6px}
.logo-row:empty{display:none}
a.pill.pe{background:var(--accent-soft);color:var(--accent);text-decoration:none;font-weight:600}
a.pill.pe:hover{text-decoration:underline}
.valrow{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin-top:10px;padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:14px}
.valrow b{font-weight:600}
.run.im{background:var(--accent-soft);margin-top:10px}
.imform{padding:14px 16px;margin-top:10px}
.dealform{padding:14px 16px;margin-top:14px}
.flag{color:var(--warn);cursor:help}
.imgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.imgrid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-3)}
.imgrid .wide{grid-column:1/-1}
.spgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:18px 0}
.spg{padding:12px 14px;max-height:420px;overflow:auto}
.gt{width:100%;border-collapse:collapse}.gt td{padding:5px 6px;border-bottom:1px solid var(--line);font-size:13px}
table.spt tr.yr th{background:var(--sunk);text-align:left;padding:10px 12px;font-size:15px;text-transform:none;letter-spacing:0;color:var(--ink)}
table.spt tr.yr th span{margin-right:12px;display:inline-block}
@media (max-width:700px){table.spt tr.yr th span{display:block;white-space:normal}}
table.spt td.cname a{color:inherit;text-decoration:none;font-weight:600}table.spt td.cname a:hover{text-decoration:underline}
.gt tr.on td{background:var(--accent-soft)}
.hb{display:inline-block;width:90px;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;vertical-align:middle}
.hb i{display:block;height:100%;background:var(--accent)}
td.warnc{color:var(--warn);font-weight:600}
.stg{display:inline-flex;gap:3px;vertical-align:middle}.stg i{width:10px;height:6px;border-radius:2px;background:var(--sunk)}.stg i.on{background:var(--accent)}
.seggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.seg{padding:12px 14px}.seg h3{margin:0;font-size:16px}.seg .hb{width:100%}

<script>
(() => {
"use strict";
// Opened inside Probrands at #hb/<route>: start on that route, and keep Probrands' address in step.
try { const h = window.parent.location.hash.replace(/^#hb\/?/, ""); if (h && location.hash.slice(1) !== h) location.hash = h; } catch {}
// Database, Claude and connectors all come through the Probrands page this frame sits in.
const CLAUDE = (() => { try { if (window.parent !== window && window.parent.claude?.use) return window.parent.claude; } catch {} return window.claude; })();
// This page has no address of its own, so "#route" links would resolve against Probrands' address and load it in
// here. Links that nothing else handled change the route in place instead.
addEventListener("click", e => {
  const a = e.target.closest?.('a[href^="#"]');
  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  const h = a.getAttribute("href").slice(1);
  if (h && location.hash.slice(1) !== h) location.hash = h;
});
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? null : +v;
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const slugify = s => String(s).toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").replace(/-+/g, "-").slice(0, 60) || ("co-" + Date.now());
const norm = s => String(s || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/\b(inc|llc|ltd|co|corp|corporation|company|group|the|holdings?)\b\.?/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const now = () => new Date().toISOString();

// End markets are the market map's (filled from Probrands when the data arrives).
const BUCKETS = [];
// Heavy fields live in details/<id> and load when a profile opens; everything else sits in companies/<id>.
const DETAIL_KEYS = new Set(["management","segment_profiles","dossier","products","product_em_map","history","suggestions","what_it_is","bluntly","profile_md","total_revenue_basis","employees_basis","open_questions","addon_corrections","what_changed_vs_prior","evidence","key_sites","chemistries","customers","runs","prior_owners"]);
const END_MARKETS = [];

/* ---------- one vertical: Pro brands. Its sectors are the market map's segments. ---------- */
const DEFAULT_WS = "probrands/pro";
const VERTICALS = [["probrands", "Pro brands", [["pro", "Pro brands", null]]]]
  .map(([id, name, groups]) => ({ id, name, groups: groups.map(([gid, gname, secs]) => ({ id: gid, key: id + "/" + gid, name: gname, sectors: secs ? secs.map(s => ({ id: gid + "-" + slugify(s), name: s, short: s.length > 24 ? s.split(/[ ,&/]/)[0] : s, g: id + "/" + gid })) : null })) }));
const verticalById = id => VERTICALS.find(v => v.id === id);
const groupByKey = k => { const [v, g] = String(k || "").split("/"); return verticalById(v)?.groups.find(x => x.id === g) || null; };
// The workspace is a group ("industrials/chemicals") or a whole vertical ("industrials").
let WS = DEFAULT_WS;
const wsName = (w = WS) => groupByKey(w)?.name || ("All " + (verticalById(w)?.name || "").toLowerCase());
const wsPath = () => "Pro brands";
// Pro brands: US brand owners of handheld chemical products (lubricants, sealants, cleaners, adhesives and the like)
// sold to tradespeople and maintenance pros through distributors.
const wsNoun = () => "US professional-brand";
const wsHas = (w, key) => key === w || key.startsWith(w + "/");
/* ---------- sectors ---------- */
// Home Base covers chemicals broadly. Each company has business lines in one or more sectors; one is primary.
// Sectors are the market map's segments, filled from Probrands when its data arrives.
const BASE_SECTORS = [];
let customSectors = [];
const OTHER_SECTORS = VERTICALS.flatMap(v => v.groups.flatMap(g => g.sectors || []));
const allSectors = () => [...BASE_SECTORS, ...OTHER_SECTORS, ...customSectors.map(x => ({ ...x, g: x.g || DEFAULT_WS }))];
// Sectors of the workspace you are in.
const wsSectors = () => allSectors().filter(x => wsHas(WS, x.g));
// Sector ids of one company's group, for prompts.
const groupSectorIds = c => allSectors().filter(x => x.g === groupOf(c)).map(x => `${x.id} (${x.name})`).join(", ");
// Default sector for a new company in this workspace.
const defSector = () => (ui.sector && !ui.sector.startsWith("grp:") ? ui.sector : null) || (wsSectors()[0]?.id || "");
// <option>s for a sector picker, grouped when they span several groups.
function sectorOptions(secs, sel) {
  const by = new Map(); for (const x of secs) { if (!by.has(x.g)) by.set(x.g, []); by.get(x.g).push(x); }
  const opt = x => `<option value="${esc(x.id)}" ${x.id === sel ? "selected" : ""} title="${esc(x.name)}">${esc(x.short)}</option>`;
  return by.size < 2 ? secs.map(opt).join("") : [...by].map(([g, xs]) => `<optgroup label="${esc(groupByKey(g)?.name || g)}">${xs.map(opt).join("")}</optgroup>`).join("");
}
const sectorById = id => allSectors().find(s => s.id === id) || (id ? { id, name: id.replace(/-/g, " "), short: id.replace(/-/g, " ") } : null);
function sectorFromName(n) {
  const k = norm(n); if (!k) return null;
  return allSectors().find(s => s.id === n || norm(s.name) === k || norm(s.short) === k) || allSectors().find(s => catToSector(n) === s.id) || null;
}
const GENERIC_EM = END_MARKETS;
const CAT_SECTOR = [];
function catToSector(cat) { const sg = base.segOf[cat]; return sg && !PB_SKIP_SEG.test(sg) ? pbSector(sg) : null; }
// Saved `sectors` wins (the market map sets them from SKU segments). Otherwise derive from the business split.
function sectorsOf(c) {
  return memod("sec:" + c.id, () => {
    if (Array.isArray(c.sectors) && c.sectors.length) return c.sectors.map(s => ({ ...s, sector: s.sector ?? (sectorFromName(s.name)?.id || "") }));
    const tot = num(c.total_revenue_usd_m), m = new Map();
    const add = (id, rev, pct) => { if (!id) return; const e = m.get(id) || { sector: id, revenue_usd_m: 0, pct: 0 }; e.revenue_usd_m += rev || 0; e.pct += pct || 0; m.set(id, e); };
    for (const s of c.revenue_by_business || []) { const r = num(s.revenue_usd_m); add(catToSector(s.category || s.business), r, num(s.pct) ?? (tot && r ? r / tot * 100 : 0)); }
    if (c.primary_sector && !m.has(c.primary_sector)) add(c.primary_sector, null, 0);
    return [...m.values()].map(e => ({ ...e, revenue_usd_m: e.revenue_usd_m ? +e.revenue_usd_m.toFixed(1) : null, pct: e.pct ? +e.pct.toFixed(1) : null }));
  });
}
function primarySector(c) {
  if (c.primary_sector) return c.primary_sector;
  return sectorsOf(c).slice().sort((a, b) => (b.revenue_usd_m || 0) - (a.revenue_usd_m || 0))[0]?.sector || BASE_SECTORS[0]?.id || "";
}
// A company's group: set on the company, else the group its primary sector belongs to. Everything already here is chemicals.
const groupOf = c => (c.group && groupByKey(c.group) ? c.group : null) || sectorById(primarySector(c))?.g || DEFAULT_WS;
// Every group a company shows up in: its home group, any extra groups set on it, and the group of each sector it sells into.
// Cross-links: other sectors a company also belongs in, with the reason ({sector, why, conf}).
const crossOf = c => Array.isArray(c.cross) ? c.cross.filter(x => x && sectorById(x.sector)?.g) : [];
const groupsOf = c => memod("grps:" + c.id, () => [...new Set([groupOf(c), ...(Array.isArray(c.groups) ? c.groups.filter(groupByKey) : []), ...sectorsOf(c).map(x => sectorById(x.sector)?.g).filter(Boolean), ...crossOf(c).map(x => sectorById(x.sector).g)])]);
const inWs = c => groupsOf(c).some(g => wsHas(WS, g));
// "grp:<key>" filters to a whole group when you are working across a vertical.
const inSector = (c, id) => !id || (id.startsWith("grp:") ? groupsOf(c).includes(id.slice(4)) : primarySector(c) === id || sectorsOf(c).some(s => s.sector === id) || crossOf(c).some(x => x.sector === id));
// Revenue in one sector: total revenue times the sector's share of the SKU mix.
function sectorRev(c, id) {
  id = id || primarySector(c);
  const s = sectorsOf(c).find(x => x.sector === id);
  if (s && num(s.revenue_usd_m) !== null) return num(s.revenue_usd_m);
  if (id === primarySector(c) && sectorsOf(c).length <= 1) return num(c.total_revenue_usd_m);
  return null;
}
const sectorShort = id => sectorById(id)?.short || "Sector";
const sectorRevLabel = id => sectorShort(id) + " rev";
function sectorRank(c, id) {
  id = id || primarySector(c);
  const order = memod("rank:" + id, () => list().filter(p => inSector(p, id) && sectorRev(p, id)).sort((a, b) => sectorRev(b, id) - sectorRev(a, id)).map(p => p.id));
  const i = order.indexOf(c.id); return i < 0 ? null : { rank: i + 1, of: order.length };
}
function shareMap(c) {
  const s = sectorsOf(c), tot = s.reduce((t, x) => t + (num(x.pct) || 0), 0), o = {};
  if (!tot) { o[primarySector(c)] = 100; return o; }
  for (const x of s) o[x.sector] = (num(x.pct) || 0) / tot * 100;
  return o;
}
const sectorChips = (c, link = true) => {
  const p = primarySector(c);
  return sectorsOf(c).filter(s => s.sector).sort((a, b) => (a.sector === p ? -1 : b.sector === p ? 1 : (b.pct || 0) - (a.pct || 0))).map(s => {
    const cls = s.sector === p ? "pill accent" : "pill";
    return link ? `<a class="${cls}" href="#companies" data-setsector="${esc(s.sector)}" title="Show ${esc(sectorById(s.sector)?.name || s.sector)}">${esc(sectorShort(s.sector))}${s.pct ? ` · ${Math.round(s.pct)}%` : ""}</a>` : `<span class="${cls}">${esc(sectorShort(s.sector))}</span>`;
  }).join("");
};

function fmtM(v) {
  v = num(v); if (v === null) return "—";
  const a = Math.abs(v);
  if (a >= 1000) return "$" + (v / 1000).toFixed(a >= 10000 ? 0 : 1) + "B";
  if (a >= 100) return "$" + Math.round(v) + "M";
  return "$" + v.toFixed(1).replace(/\.0$/, "") + "M";
}
const fmtPct = v => num(v) === null ? "—" : (+v).toFixed(+v < 10 && +v % 1 ? 1 : 0) + "%";
const fmtInt = v => num(v) === null ? "" : (+v).toLocaleString("en-US", { maximumFractionDigits: 1 });
const fmtDate = iso => { try { return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }); } catch { return ""; } };
const yearOf = s => { const m = String(s || "").match(/(19|20)\d{2}/); return m ? +m[0] : 0; };
const dateKey = s => { const m = String(s || "").match(/((?:19|20)\d{2})(?:-(\d{1,2}))?(?:-(\d{1,2}))?/); return m ? +m[1] * 10000 + (+(m[2] || 0)) * 100 + (+(m[3] || 0)) : 0; };

/* ---------- state ---------- */
let db = null, sample = null;
const companies = new Map();
const details = {};                    // id -> detail doc (loaded on open)
let detailSub = null, detailId = null;
let meta = { deals: [], entities: [] };
let queueDocs = [];
let ver = 0; const memo = {};
const memod = (k, f) => (memo[k] && memo[k].v === ver) ? memo[k].x : (memo[k] = { v: ver, x: f() }).x;
let nameIndex = new Map(), entityIndex = new Map();
let loaded = false, dbState = "connecting", writable = true;
const runs = {};                       // id -> {phase, ctl, error}
const ui = { ac: -1, acOpen: false, sort: "secrev", dir: -1, q: "", scope: "", otype: "", emTax: "broad", tq: "", tsel: null, pq: "", psort: "year", pdir: -1, em: "", emMode: "pct", editMd: false, confirmDel: false };
let pendingRender = false, pendingFocus = null;
// The sector filter is remembered per workspace.
const secKey = () => "pbhb.sector";
function loadSector() { let v = null; try { v = localStorage.getItem(secKey()); } catch {} if (v === null) v = ""; ui.sector = v && (v.startsWith("grp:") ? wsHas(WS, v.slice(4)) && WS !== v.slice(4) : wsHas(WS, sectorById(v)?.g || DEFAULT_WS)) ? v : ""; }
loadSector();
function setSector(id) { ui.sector = id || ""; ui.limit = 150; ui.tsel = null; try { localStorage.setItem(secKey(), ui.sector); } catch {} ver++; }
// Switching vertical is its own action. It is remembered, so the app reopens where you left it.
function setWs(w) { if (!(groupByKey(w) || verticalById(w))) return; WS = w; try { localStorage.setItem("homebase.ws", w); } catch {} loadSector(); ui.limit = 150; ui.tsel = null; ui.addFlow = null; ui.wsOpen = false; ver++; }
const seeding = {};

function route() {
  const h = (location.hash || "#home").slice(1);
  if (h.startsWith("c.")) { const [, id, tab] = h.split("."); return { view: "company", id, tab: ({ snapshot: "overview", sources: "notes" })[tab] || tab || "overview" }; }
  if (h.startsWith("d.")) return { view: "deal", id: decodeURIComponent(h.slice(2)) };
  if (h.startsWith("s.")) { const [slug, tab] = h.slice(2).split("."); return { view: "sponsor", id: decodeURIComponent(slug), tab: tab || "" }; }
  if (h.startsWith("precedents")) { const [, forId] = h.split("~"); return { view: "precedents", forId: forId ? decodeURIComponent(forId) : "" }; }
  if (h.startsWith("sponsors")) { const [, fk, fv] = h.split("~"); return { view: "sponsors", fk: fk || "", fv: fv ? decodeURIComponent(fv) : "" }; }
  if (["home", "sectors", "companies", "targets", "endmarkets", "tam", "inmarket", "campaign", "crosslinks"].includes(h)) return { view: h };
  if (h === "pe" || h.startsWith("pe~")) return { view: "pe", sub: h.split("~")[1] || "" };
  return { view: "home" };
}

/* ---------- toast & tooltip ---------- */
let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const el = e.target.closest?.("[data-tip]");
  if (!el) { tip.hidden = true; document.querySelectorAll(".legend li.hl").forEach(n => n.classList.remove("hl")); return; }
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px";
  if (el.dataset.li) { const li = document.getElementById(el.dataset.li); document.querySelectorAll(".legend li.hl").forEach(n => n !== li && n.classList.remove("hl")); li?.classList.add("hl"); }
});

/* ---------- live status ---------- */
function setLive() {
  const el = $("#live");
  const map = {
    connecting: ["", "Connecting"],

async function commit(el) {

    const sid = primarySector(c), size = sectorRev(c, sid) || num(c.total_revenue_usd_m) || 0, st = stateOf(c);
    const owned = new Set((c.acquisitions || []).map(a => norm(a.target)));
    const pool = list().filter(p => p.id !== c.id && !owned.has(norm(p.name)) && p.owner_type !== "Public" && p.owner_type !== "Subsidiary of strategic" && (sectorRev(p, sid) || (inSector(p, sid) && num(p.total_revenue_usd_m))));
    const pick = (maxRev, minO) => pool.map(p => {
      const r = sectorRev(p, sid) || num(p.total_revenue_usd_m); if (r > maxRev) return null;
      const o = overlap(c, p); if (o < minO) return null;
      const same = st && stateOf(p) === st;
      return { name: p.name, id: p.id, what: p.primary_category, rev: r, state: stateOf(p), o, s: o * Math.log10(2 + r) * (same ? 1.25 : 1) };
    }).filter(Boolean);
    let cands = pick(Math.max(size * 0.5, 2), 30);
    if (cands.length < 8) cands = pick(Math.max(size, 3), 15);   // small companies: merger-of-equals and tuck-ins
    return cands.sort((a, b) => b.s - a.s).slice(0, 15);
  });
}
// The full add-on list: saved ideas, companies that name this one as a buyer, then index matches.
function addonList(c) {
  const out = [], seen = new Set();
  const add = x => { const k = norm(x.name); if (!k || seen.has(k)) return; seen.add(k); out.push(x); };
  (c.addon_ideas || []).forEach((a, i) => add({ name: a.target, id: findCompanyByName(a.target, c.id)?.id, why: a.rationale, rev: num(a.est_revenue_usd_m), state: a.location, src: "saved", i }));
  for (const r of reverseLinks().buyerOf.get(c.id) || []) add({ name: r.target.name, id: r.target.id, why: `${r.target.name}'s profile lists ${c.name} as a potential buyer${r.note ? ": " + r.note : ""}`, rev: sectorRev(r.target, primarySector(c)) ?? num(r.target.total_revenue_usd_m), state: stateOf(r.target), src: "buyer" });
  for (const b of likelyAddons(c)) add({ name: b.name, id: b.id, why: `${b.o.toFixed(0)}% similarity · ${b.what || sectorShort(primarySector(companies.get(b.id) || {}))}`, rev: b.rev, state: b.state, src: "index" });
  return out;
}

// Search autofill: companies whose name, parent, sponsor or rolled-in brands match what's typed.
function acMatches() {
  const lo = x => String(x || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const q = lo(ui.q); if (!q) return [];
  const out = [], seen = new Set();
  const cut = x => { x = String(x || "").trim(); return x.length > 60 ? x.slice(0, 57) + "…" : x; };
  for (const c of list()) {
    const n = lo(c.name);
    let score = 0, why = "";
    if (n.startsWith(q)) score = 100;
    else if (n.split(" ").some(w => w.startsWith(q))) score = 80;
    else if (n.includes(q)) score = 60;
    else if (lo(c.platform_name).includes(q)) { score = 45; why = cut(c.platform_name); }
    else if (lo(c.pe_sponsor).includes(q)) { score = 40; why = "Sponsor: " + cut(String(c.pe_sponsor).split(/[;(]/)[0]); }
    else if (lo(c.rolled_in).includes(q)) { score = 35; why = "Owns " + cut((String(c.rolled_in).split(";").find(x => lo(x).includes(q)) || "").replace(/\(.*?\)/g, "")); }
    if (score) { out.push({ c, score: score + Math.min(20, Math.log10(1 + (num(c.total_revenue_usd_m) || 0)) * 5), why }); seen.add(c.id); }
  }
  for (const e of meta.entities || []) {
    if (!e.owner_id || !companies.has(e.owner_id) || !lo(e.name).includes(q)) continue;
    const c = companies.get(e.owner_id);
    out.push({ c, score: (lo(e.name).startsWith(q) ? 70 : 30), why: `${cut(e.name)} is part of ${c.name}` });
  }
  const best = new Map();
  for (const m of out) if (!best.has(m.c.id) || best.get(m.c.id).score < m.score) best.set(m.c.id, m);
  return [...best.values()].sort((a, b) => b.score - a.score).slice(0, 8);
}

  if (!ui.acOpen || !ui.q) return "";

// Bring every source to the base year with its own growth rate (or the median of the others), weight by
// reliability, and down-weight outliers far from the median.
function triangulate(t) {
  const geo = t?.geo || "US", base = +(t?.base_year || 2025);
  const src = (t?.sources || []).filter(x => num(x.value_usd_m));
  const cagrs = src.map(x => num(x.cagr_pct)).filter(x => x !== null);
  const medC = median(cagrs) ?? 4;
  const rows = src.map((x, i) => {
    const inGeo = (x.geography || "US") === geo, g = num(x.cagr_pct) ?? medC, yr = +(yearOf(x.year) || base);
    const adj = num(x.value_usd_m) * Math.pow(1 + g / 100, base - yr);
    return { ...x, i, inGeo, adj, g, w0: REL_W[x.reliability] || 1 };
  });
  const use = rows.filter(r => r.inGeo);
  const med = median(use.map(r => r.adj));
  for (const r of use) { r.outlier = med && (r.adj > 2.5 * med || r.adj < med / 2.5); r.w = r.w0 * (r.outlier ? 0.25 : 1); }
  const W = use.reduce((s, r) => s + r.w, 0);
  const tam = W ? use.reduce((s, r) => s + r.adj * r.w, 0) / W : null;
  const vals = use.map(r => r.adj);
  return { rows, tam, lo: vals.length ? Math.min(...vals) : null, hi: vals.length ? Math.max(...vals) : null, n: use.length, geo, base, medC };
}
const tamValue = t => num(t?.override_usd_m) ?? triangulate(t).tam;

    return { rows, total: rows.reduce((s, x) => s + x.r, 0) };

}
// Simple database search: names that profiles in this sector mention but that have no profile yet.
function mentionedNotProfiled(sid) {
  return memod("mentioned:" + sid, () => {
    const m = new Map(), dismissed = new Set((tams[sid]?.dismissed || []).map(norm));
    const add = (name, how, from) => {
      const k = norm(name); if (!k || k.length < 3 || dismissed.has(k) || findCompanyByName(name)) return;
      if (/^(private equity|ipo|not a realistic|chinese |on-site|other)|->|sold to|\b(funds?|sponsors?|investors?|platforms|producers|private equity|pe firms?|regional|generation systems|backed|market)\b/i.test(name) || name.length > 60) return;
      const e = m.get(k) || { name, how: new Set(), from: new Set(), n: 0 }; e.n++; e.how.add(how); e.from.add(from); m.set(k, e);
    };
    // Deal targets are already owned by their acquirer, so only competitors, buyers and add-on ideas count.
    for (const c of list().filter(c => primarySector(c) === sid)) {
      for (const x of c.competitors || []) add(x.name, "competitor", c.name);
      for (const x of c.buyers || []) add(x.name, "buyer", c.name);
      for (const x of c.addon_ideas || []) add(x.target, "add-on idea", c.name);
    }
    return [...m.values()].sort((a, b) => b.n - a.n).slice(0, 25);
  });
}

function viewTargets() {
  const q = ui.tq.toLowerCase();
  const sid = ui.sector, secOk = t => !sid || (t.company && inSector(t.company, sid)) || t.links.some(l => l.platformId && companies.has(l.platformId) && inSector(companies.get(l.platformId), sid));

  if (!ts.find(t => t.key === ui.tsel)) ui.tsel = ts[0]?.key || null;
  const sel = ts.find(t => t.key === ui.tsel);

  if (sel) {

    let fit = "";
    const base = sel.company || sel.entity;
    if (base) {
      const skip = new Set([sel.company?.id, sel.entity?.owner_id].filter(Boolean));
      const tsid = sel.company ? primarySector(sel.company) : (ui.sector || BASE_SECTORS[0]?.id || "");
      const tRev = (sel.company ? sectorRev(sel.company, tsid) : null) ?? num(sel.entity?.us_rev) ?? 0;
      const minRev = Math.max(2 * tRev, 10);
      const ranked = list().filter(p => !skip.has(p.id) && ((sectorRev(p, tsid) || 0) >= minRev || (num(p.total_revenue_usd_m) || 0) >= 3 * minRev))
        .map(p => { const o = overlap(base, p), n = (p.acquisitions || []).length; return { p, o, n, s: o * (0.6 + 0.4 * Math.min(1, n / 10)) }; })
        .filter(x => x.o > 0).sort((a, b) => b.s - a.s).slice(0, 8);
      fit = ranked.length ? `<div class="sec-h" style="margin-top:22px"><h2>Best-fit homes in Home Base</h2><span class="faint" style="font-size:12px">Companies at least twice its size, ranked by similarity in sector and end markets, boosted for active acquirers</span></div>
      <div class="panel bars" style="padding:6px">${ranked.map((x, i) => `<div class="brow" data-open="${esc(x.p.id)}" data-tip="${esc(x.p.name)}: ${x.o.toFixed(0)}% similarity · ${x.n} deals · ${fmtM(sectorRev(x.p, tsid) ?? x.p.total_revenue_usd_m)} ${esc(sectorRevLabel(tsid))}"><span class="rk">${i + 1}</span><span class="nm">${esc(x.p.name)} <span class="faint" style="font-weight:400;font-size:12px">${fmtM(sectorRev(x.p, tsid) ?? x.p.total_revenue_usd_m)} · ${x.n} deals</span></span><div class="track"><div class="fill" style="width:${Math.min(100, x.o)}%"></div></div><span class="v">${x.o.toFixed(0)}%</span></div>`).join("")}</div>` : "";
    }
    detail = `<div class="panel detail"><div class="eyebrow">Target</div><h2 class="tt">${sel.company ? `<a href="#c.${esc(sel.company.id)}" style="color:inherit;text-decoration:none">${esc(sel.name)}</a>` : esc(sel.name)}</h2>
      <div class="muted">${sel.company ? `Profiled · ${esc(sectorById(primarySector(sel.company))?.name || "")} · ${fmtM(sectorRev(sel.company))} ${esc(sectorRevLabel(primarySector(sel.company)).replace(/ rev$/, " revenue"))} · ${esc(sel.company.owner_type || "")}` : sel.entity ? esc([sel.entity.role, num(sel.entity.us_rev) ? fmtM(sel.entity.us_rev) + " revenue" : "", sel.entity.state].filter(Boolean).join(" · ")) : `Not profiled yet`}${!sel.company && writable && db ? ` · <button class="btn sm ghost" data-act="profile-target" data-name="${esc(sel.name)}">Create profile</button>` : ""}</div>
      ${sel.entity?.what ? `<p class="muted" style="max-width:70ch;margin:10px 0 0">${esc(sel.entity.what)}</p>` : ""}
      <div class="links">${links}</div>${fit}</div>`;
  }
  return `<div class="page-h"><div><div class="eyebrow">${esc(ui.sector ? sectorById(ui.sector)?.name : "All sectors")} · Who would buy it?</div><h1>Buyer finder</h1><p>Type any company, including ones that are only mentioned in other profiles, to see <b>who already bought it</b>, <b>who has named it as an add-on</b>, and <b>which platforms in Home Base are the best fit to buy it</b>, ranked by shared end markets and size. Use it to build a buyer list for a sell-side pitch in seconds.</p></div></div>

  <div class="split"><div class="panel tlist">${listHtml}</div>${detail}</div>`;
}

/* ---------- sponsors, in market, logos ---------- */
const isPE = c => /^(PE-owned|Private equity owned)$/i.test(String(c.owner_type || "")) || !!c.pe_backed;
function sponsorOf(c) {
  const raw = String(c.pe_sponsor || (isPE(c) ? c.ultimate_parent : "") || "");
  const n = raw.split(/[;(]| \+ |, | and |\//)[0].replace(/\b(L\.?P\.?|LLC|Inc\.?|Ltd\.?)\b\.?/gi, "").replace(/\s+/g, " ").replace(/[,.\s]+$/, "").trim();
  return n || "Sponsor not named";
}
const subIndustry = c => { const sec = sectorShort(primarySector(c)), cat = String(c.primary_category || "").split(/[(;]/)[0].trim(); return cat ? `${sec}: ${cat}` : sec; };
const entryYear = c => { const y = yearOf(c.pe_entry_year); return y && y > 1980 && y <= new Date().getFullYear() ? y : null; };
const holdYears = c => { const y = entryYear(c); return y ? new Date().getFullYear() - y : null; };
const fmtX = v => num(v) === null ? "—" : (+v).toFixed(1) + "x";
const IM_STAGES = ["Rumored", "Preparing (bank hired)", "Launched / teasers out", "First round", "Second round / management meetings", "Final bids / exclusivity", "Signed", "Pulled"];
const inMarket = c => c.in_market && c.in_market.stage && c.in_market.stage !== "Pulled" ? c.in_market : null;
const logos = new Map();
const logoImg = (c, cls = "sm") => logos.get(c.id) ? `<img class="logo ${cls}" src="${esc(logos.get(c.id))}" alt="">` : "";
// Shrink an uploaded logo to at most 320×160 so it stores in one small document and loads fast on strips.
function logoData(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 320 / img.width, 160 / img.height), cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k)); cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL("image/png")); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Not an image")); };
    img.src = url;
  });
}
const bar = (v, max) => `<span class="hb"><i style="width:${max ? Math.max(2, Math.round(v / max * 100)) : 0}%"></i></span>`;
function viewSponsors(r) {
  const all = list().filter(isHolding), addons = list().filter(c => isPE(c) && addonOf(c));
  const f = r.fk, v = r.fv;
  const match = c => !f || (f === "o" && sponsorOf(c) === v) || (f === "y" && String(entryYear(c) || "Not known") === v) || (f === "s" && subIndustry(c) === v);
  const rows = all.filter(match).sort((a, b) => (num(b.total_revenue_usd_m) || 0) - (num(a.total_revenue_usd_m) || 0));
  const group = (keyFn, labelFn) => { const m = new Map(); for (const c of all) { const k = keyFn(c); const g = m.get(k) || { k, n: 0, rev: 0, names: [] }; g.n++; g.rev += num(c.total_revenue_usd_m) || 0; g.names.push(c.name); m.set(k, g); } return [...m.values()].map(g => ({ ...g, label: labelFn(g.k) })); };

function viewEndMarkets() {
  const sid = ui.sector, waterish = false, broad = false;
  const pool = list().filter(c => inSector(c, sid));
  const names = new Set(broad ? BUCKETS : []);
  if (!broad) { const cnt = new Map(); pool.forEach(c => Object.keys(c[EM_FIELD] || {}).forEach(k => cnt.set(k, (cnt.get(k) || 0) + 1))); [...cnt.entries()].sort((a, b) => b[1] - a[1]).forEach(([k]) => names.add(k)); }
  if (!names.size) GENERIC_EM.forEach(n => names.add(n));
  if (!names.has(ui.em)) ui.em = [...names][0];
  const opts = [...names].map(n => `<option ${n === ui.em ? "selected" : ""}>${esc(n)}</option>`).join("");
  const rows = pool.map(c => { const p = num((broad ? buckets(c) : (c[EM_FIELD] || {}))[ui.em]) || 0; const rev = num(broad ? c.us_water_treatment_revenue_usd_m : c.total_revenue_usd_m); return { c, p, d: rev !== null ? rev * p / 100 : null }; }).filter(r => r.p > 0);
  const key = ui.emMode === "pct" ? "p" : "d";
  rows.sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1));
  const max = Math.max(...rows.map(r => r[key] || 0), 1);
  const total = rows.reduce((s, r) => s + (r.d || 0), 0);
  const top = rows.slice(0, 60);
  const bars = rows.length ? top.map((r, i) => `<div class="brow" data-open="${esc(r.c.id)}" data-tip="${esc(r.c.name)}: ${fmtPct(r.p)} of ${broad ? "US water revenue" : "platform revenue"} · ${fmtM(r.d)}"><span class="rk">${i + 1}</span><span class="nm">${esc(r.c.name)}</span><div class="track"><div class="fill" style="width:${((r[key] || 0) / max * 100).toFixed(1)}%"></div></div><span class="v">${key === "p" ? fmtPct(r.p) : fmtM(r.d)}</span></div>`).join("")
    : `<p class="faint" style="padding:16px">No profiled company has exposure to ${esc(ui.em)} yet.</p>`;
  return `<div class="page-h"><div><div class="eyebrow">${esc(sid ? sectorById(sid)?.name : "All sectors")} · Exposure screen</div><h1>End markets</h1><p>Pick an end market to rank companies by how much of their revenue comes from it, as a share or in dollars. The list shows the end markets companies in this sector report. ${waterish ? "For water, Broad uses the water index's eight buckets." : ""} Shows the top 60.</p></div></div>
  <div class="bar">${waterish ? `<div class="seg" role="group" aria-label="End-market detail"><button data-emtax="broad" aria-pressed="${broad}">Water buckets</button><button data-emtax="detailed" aria-pressed="${!broad}">Detailed</button></div>` : ""}
    <select id="em" aria-label="End market" style="min-width:240px">${opts}</select>
    <div class="seg" role="group" aria-label="Rank by"><button data-em="pct" aria-pressed="${ui.emMode === "pct"}">% of revenue</button><button data-em="usd" aria-pressed="${ui.emMode === "usd"}">$ revenue</button></div>
    <span class="faint">${rows.length} companies · ${fmtM(total)} combined exposure</span></div>
  <div class="panel bars">${bars}</div>`;
}

const chatStore = new Map();
const cst = id => { if (!chatStore.has(id)) chatStore.set(id, { msgs: [], busy: null, loaded: false }); return chatStore.get(id); };
async function chatLoad(id) {
  const S = cst(id); if (S.loaded) return S; S.loaded = true;
  try { const d = await db.doc("chats/" + id).get(); if (d.exists && !S.msgs.length) S.msgs = d.data().messages || []; } catch {}
  if (chat.id === id) chatMsgs();

// Saved chats stay well under the 256 KB document limit: undo is kept for the latest replies only, and the
// oldest messages drop off first.
function chatSave(id) {
  const all = cst(id).msgs.slice(-40), n = all.length;
  let msgs = all.map((m, i) => { const o = { ...m, pending: false, text: String(m.text || "").slice(0, 6000), activity: (m.activity || []).slice(-12) }; if (i < n - 6) delete o.undo; return o; });
  while (msgs.length > 2 && JSON.stringify(msgs).length > 180000) msgs = msgs.slice(2);

  }
  if (act === "acceptsug") {
    const f = btn.dataset.f, sg = { ...(c.suggestions || {}) }, v = sg[f]?.value; delete sg[f];
    const cc = companies.get(c.id); companies.set(c.id, { ...cc, locked: (cc.locked || []).filter(x => x !== f) });
    const lv0 = (c.suggestions || {})[f]?.level || "Medium";
    await save(c.id, { [f]: v, suggestions: sg, conf: { ...(c.conf || {}), [f]: { level: lv0, basis: (c.suggestions || {})[f]?.basis || "Accepted Claude's suggestion", at: now(), by: "Claude" } }, section_meta: markStale(c, [sectionOfField(f)].filter(Boolean)), history: [{ at: now(), field: f, by: "You (accepted Claude's)", before: short(c[f]), after: short(v) }, ...(c.history || [])].slice(0, 200) }); render();
  }
  if (act === "dismisssug") { const sg = { ...(c.suggestions || {}) }; delete sg[btn.dataset.f]; await save(c.id, { suggestions: sg }, [], true); render(); }

    const have = new Set((c.buyers || []).map(b => norm(b.name)));
    const add = pick.filter(b => b && !have.has(norm(b.p.name))).map(b => ({ name: b.p.name, type: b.p.pe_backed || b.p.owner_type === "PE-owned" ? "PE platform" : "Strategic", fit: b.o >= 70 ? "High" : b.o >= 45 ? "Medium" : "Low", rationale: `${b.o.toFixed(0)}% similarity; ${b.n} deals; ${fmtM(b.r)} ${sectorRevLabel(primarySector(c)).replace(/ rev$/, " revenue")}` }));

  }
  if (act === "saveaddonx") {

    if (x && x.src !== "saved") { await save(c.id, { addon_ideas: [...(c.addon_ideas || []), { target: x.name, rationale: x.why, est_revenue_usd_m: x.rev ?? null, location: x.state || "" }] }, ["addon_ideas"]); render(); }
  }
  if (act === "savecomp") {
    const p = companies.get(btn.dataset.id);
    if (p) { await save(c.id, { competitors: [...(c.competitors || []), { name: p.name, overlap: `${overlap(c, p).toFixed(0)}% similarity; ${p.business_model || ""}` }] }, ["competitors"]); render(); }
  }

    await save(c.id, { conf: { ...(cc.conf || {}), [f]: { level: "Low", basis: "Unverified by you: was wrong or out of date", at: now(), by: "You" } }, section_meta: meta, history: [{ at: now(), field: f, by: "You", before: "Verified", after: "Unverified", level: "Low" }, ...(cc.history || [])].slice(0, 200) }, [], true);

    const f = btn.dataset.f, rows = tableRows(c, f); rows.splice(+btn.dataset.r, 1);

  if (act === "editmd") { ui.editMd = !ui.editMd; render(); }
  if (act === "savemd") { const v = $("#mdEdit").value; ui.editMd = false; await save(c.id, { profile_md: v }, ["profile_md"]); render(); }

function watchDetails() {

  if (!id) return;

$("#secsel").addEventListener("change", e => { setSector(e.target.value); e.target.blur(); const r = route(); if (r.view === "sectors" || r.view === "company") location.hash = "companies"; else render(); });

/* ---------- Probrands data ---------- */
// Home Base runs on the market map of the Probrands app it sits in: one profile per company, its brands and SKU
// mix as the product catalog, its deals in the deal book. Nothing comes from anywhere else. What you change here is
// saved over that base in this artifact's own hb_* collections, so the market map itself is never touched.
const PBW = (() => { try { return window.parent !== window ? window.parent.PBHB || null : null; } catch { return null; } })();
const base = { segOf: {}, v: -1, companies: new Map(), details: new Map(), deals: new Map(), entities: [], sectors: [], ems: [], source: "" };
const savedCos = new Map(), savedDeals = new Map();
let savedEntities = [];
const pslug = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const pbSector = seg => "pb-" + pslug(seg);
const PB_OWNER = { pe: "PE-owned", public: "Public", family: "Family/founder-owned", sub_private: "Subsidiary of strategic", esop: "ESOP" };
const PB_SKIP_SEG = /^(Out of scope|Unclassified)/;
function pctMap(o, skip) {
  const e = Object.entries(o || {}).filter(([k, v]) => v > 0 && !(skip && skip.test(k))), t = e.reduce((a, [, v]) => a + v, 0);
  return t ? Object.fromEntries(e.sort((a, b) => b[1] - a[1]).map(([k, v]) => [k, +(v / t * 100).toFixed(1)])) : {};
}
// Deal types in the market map are free text; the deal book has a fixed list.
function pbDealType(t, kind) {
  t = String(t || "");
  if (/minority/i.test(t)) return "Minority";
  if (/carve|divest|spin/i.test(t)) return "Carve-out";
  if (/merger/i.test(t)) return "Merger";
  if (kind === "addon" || /add-?on|bolt|tuck|asset/i.test(t)) return "Add-on";
  if (/lbo|buyout|recap|secondary|sponsor|growth|majority|platform/i.test(t)) return "Sponsor entry";
  return kind === "ownership" ? "Platform" : "Add-on";
}
function pbBuild() {
  const R = PBW?.raw?.(); if (!R) return false;
  if (R.ver === base.v) return true;
  base.v = R.ver; base.source = R.SRC || ""; base.segOf = R.SEGOF || {}; base.companies.clear(); base.details.clear(); base.deals.clear();
  const segN = new Map(), emN = new Map();
  for (const c of R.CO.values()) {
    for (const [k, n] of Object.entries(c.mix?.seg || {})) if (!PB_SKIP_SEG.test(k)) segN.set(k, (segN.get(k) || 0) + n);
    for (const [k, n] of Object.entries(c.mix?.mkt || {})) if (k !== "Other") emN.set(k, (emN.get(k) || 0) + n);
  }
  base.sectors = [...segN].sort((a, b) => b[1] - a[1]).map(([k]) => ({ id: pbSector(k), name: k, short: k.replace(/ \/ .*$/, ""), g: DEFAULT_WS }));
  base.ems = [...emN].sort((a, b) => b[1] - a[1]).map(([k]) => k);
  const brandsOf = new Map();
  for (const b of R.BR.values()) { if (!b.owner_id) continue; if (!brandsOf.has(b.owner_id)) brandsOf.set(b.owner_id, []); brandsOf.get(b.owner_id).push(b); }
  base.entities = [];
  for (const c of R.CO.values()) {
    const t = R.DT.get(c.id) || {}, mix = c.mix || {}, rev = num(c.rev);
    const segs = pctMap(mix.seg, PB_SKIP_SEG), cats = pctMap(mix.cat, /^Unclassified/), em = pctMap(mix.mkt);
    const sectors = Object.entries(segs).map(([k, p]) => ({ sector: pbSector(k), name: k, pct: p, revenue_usd_m: rev ? +(rev * p / 100).toFixed(1) : null }));
    const owner = c.oclass === "public" && /subsidiary/i.test(c.otype || "") ? "Subsidiary of strategic" : PB_OWNER[c.oclass] || "Other";
    base.companies.set(c.id, clean({
      name: c.name, imported_from: "Probrands market map", total_revenue_usd_m: rev, employees_total: num(c.emp),
      owner_type: owner, pe_backed: c.oclass === "pe" ? true : undefined, pe_sponsor: c.sponsor || "", pe_entry_year: num(c.pe_year), ultimate_parent: c.parent || "",
      business_model: c.model || "", primary_category: c.category || "", hq_address: c.hq || "", website: c.web || "",
      primary_sector: sectors[0]?.sector || "", sectors, end_market_buckets: em, end_markets_total_platform: em,
      revenue_by_product: Object.entries(cats).map(([k, p]) => ({ product: k, pct: p, revenue_usd_m: rev ? +(rev * p / 100).toFixed(1) : null })),
      revenue_by_business: sectors.map(x => ({ business: x.name, category: x.name, pct: x.pct, revenue_usd_m: x.revenue_usd_m })),
      acquisitions: (t.acq || []).filter(a => a?.target).map(a => ({ date: String(a.date || ""), target: a.target, deal_type: pbDealType(a.deal_type, "addon"), what_it_does: a.what_it_does || "", what_it_added: a.what_it_added || "", value_usd_m: num(a.value_usd_m), source_url: a.source_url || "" })),
      buyers: [], addon_ideas: [], competitors: [], source_of_truth: [], locked: [],
      conf: Object.fromEntries([["total_revenue_usd_m", c.rev_basis], ["employees_total", c.size_basis]].filter(([, b]) => b).map(([k, b]) => [k, { level: /high/i.test(b) ? "High" : /low/i.test(b) ? "Low" : "Medium", basis: "Probrands market map: " + b }])),
      pb_channel: c.ch_class || "", pb_brands: c.brands || [], pb_skus: c.skus || 0, pb_trade: c.trade || "",
    }));
    // The brand list is the product catalog: one line per category, the brands sold in it, share by SKU count.
    const byCat = new Map();
    for (const b of t.brands || brandsOf.get(c.id) || []) { const k = b.ncat || b.cat || "Other"; if (!byCat.has(k)) byCat.set(k, { brands: [], heroes: [], forms: new Set() }); const e = byCat.get(k); e.brands.push(b.name); if (b.hero) e.heroes.push(b.hero); if (b.form) e.forms.add(b.form); }
    const catKeys = Object.keys(cats).length ? Object.keys(cats) : [...byCat.keys()];
    const products = catKeys.map(k => { const e = byCat.get(k) || { brands: [], heroes: [], forms: new Set() }; return { category: k, line: [...new Set(e.brands)].join(", "), named_products: [...new Set(e.heroes)].join(", "), what_it_is: e.forms.size ? "Formats: " + [...e.forms].join(", ") : "", applications: "", end_markets: [], made_or_resold: "", share_pct: cats[k] ?? null, revenue_usd_m: rev && cats[k] ? +(rev * cats[k] / 100).toFixed(1) : null }; });
    for (const [k, e] of byCat) if (!catKeys.includes(k)) products.push({ category: k, line: [...new Set(e.brands)].join(", "), named_products: [...new Set(e.heroes)].join(", "), what_it_is: e.forms.size ? "Formats: " + [...e.forms].join(", ") : "", applications: "", end_markets: [], made_or_resold: "", share_pct: null, revenue_usd_m: null });
    base.details.set(c.id, clean({
      what_it_is: t.what || c.blunt || "", bluntly: c.blunt || "", profile_md: t.profile || "", total_revenue_basis: c.rev_basis || "", employees_basis: c.size_basis || "",
      evidence: (t.evidence || []).map(e => ({ metric: e.metric || "", value: e.value ?? "", year: e.year || "", url: e.url || "", quote: e.quote || "", source_type: "Source" })),
      products,
    }));
    for (const b of brandsOf.get(c.id) || []) if (norm(b.name) !== norm(c.name)) base.entities.push({ name: b.name, owner_id: c.id, kind: "brand" });
  }
  for (const d of R.DEALS || []) {
    if (!d?.target) continue;
    const id = dealKey(d.target, d.date || d.year), acq = d.acq_id && R.CO.get(d.acq_id), sponsorBuy = !acq && /lbo|buyout|recap|secondary|sponsor|growth|private equity|majority investment/i.test(d.type || "");
    base.deals.set(id, clean({ id, target: d.target, target_id: d.tgt_id || undefined, acquirer: d.acquirer || "", acquirer_id: d.acq_id || undefined, date: String(d.date || d.year || ""), year: yearOf(d.date || d.year) || undefined,
      deal_type: pbDealType(d.type, d.kind), status: "Closed", buyer_type: sponsorBuy ? "Sponsor" : acq && acq.oclass === "pe" ? "PE platform" : "Strategic",
      ev_usd_m: num(d.value), source_url: d.url || "", origin: ["Probrands market map"], ws: DEFAULT_WS }));
  }
  return true;
}
function mergeCompanies() {
  companies.clear();
  for (const [id, c] of base.companies) companies.set(id, { ...c, id });
  for (const [id, c] of savedCos) { if (c.deleted) { companies.delete(id); continue; } companies.set(id, { ...(base.companies.get(id) || {}), ...c, id }); }
  loaded = loaded || base.v >= 0 || savedCos.size > 0; ver++; rebuildIndex();
}
function mergeDeals() {
  dealbook.clear();
  for (const [k, v] of base.deals) dealbook.set(k, v);
  for (const [k, v] of savedDeals) dealbook.set(k, { ...(base.deals.get(k) || {}), ...v, id: k });
  ver++;
}
const baseDetail = id => base.details.get(id) || null;
// Base data arrives from Probrands (now, and again whenever its market map reloads).
function pbStart() {
  const pull = () => { if (!pbBuild()) return; BASE_SECTORS.splice(0, BASE_SECTORS.length, ...base.sectors); END_MARKETS.splice(0, END_MARKETS.length, ...base.ems); BUCKETS.splice(0, BUCKETS.length, ...base.ems); if (!ui.em) ui.em = base.ems[0] || ""; meta.entities = [...base.entities, ...savedEntities]; mergeDeals(); mergeCompanies(); watchDetails(); render(); };
  PBW?.subscribe?.(pull); pull();
}
// This artifact's database, with Home Base's collections kept apart under hb_*. A profile that so far only exists in
// the market map has no saved document yet, so the first edit creates one.
function hbDb(d) {
  if (!d) return null;
  const doc = p => {
    const r = d.doc("hb_" + p);
    return {
      get: () => r.get(), set: x => r.set(x), delete: () => r.delete(), onSnapshot: (...a) => r.onSnapshot(...a),
      update: async x => {
        try { await r.update(x); }
        catch (e) { if (e?.code !== "invalid_argument" || !/^(companies|details|dealbook|sponsors)\//.test(p) || (await r.get()).exists) throw e; await r.set(x); }   // nulls kept: a cleared field must hide the market-map value
      },
    };
  };
  return { doc, collection: n => d.collection("hb_" + n) };
}

/* ---------- boot ---------- */
render();
(async () => {
  pbStart();
  if (!CLAUDE?.use) { dbState = "off"; render(); return; }
  const [d, s] = await Promise.all([CLAUDE.use("db").catch(() => null), CLAUDE.use("sample").catch(() => null)]);
  db = hbDb(d); sample = s; if (!s) sampleIssue = "Claude not granted to this view";
  if (!db) { dbState = "off"; render(); return; }
  try {
    const u = await CLAUDE.use("user").catch(() => null);
    if (u?.can) { const w = await u.can("data.write"); if (w === false) { writable = false; } }
  } catch {}
  dbState = writable ? "live" : "readonly";
  CLAUDE.use("mcp").then(async m => {
    mcp = m; if (!m) return;
    try { const l = await m.listTools(WEBSRV); webOK = (l.servers || []).some(x => x.server === WEBSRV); } catch { webOK = false; }
    if (loaded) render();
  }).catch(() => {});
  db.collection("logos").limit(1000).onSnapshot(snap => { logos.clear(); snap.docs.forEach(d => { const x = d.data(); if (x?.data) logos.set(d.id, x.data); }); if (loaded) render(); }, () => {});
  db.collection("research").limit(500).onSnapshot(snap => { researchDocs = snap.docs.map(d => ({ ...d.data(), id: d.id })); if (loaded) render(); }, () => {});
  db.collection("webresults").limit(1000).onSnapshot(snap => { webDocs = snap.docs.map(d => ({ ...d.data(), id: d.id })); drainWeb(); if (loaded) render(); }, () => {});
  db.collection("queue").limit(500).onSnapshot(snap => { queueDocs = snap.docs.map(d => ({ ...d.data(), id: d.id })); if (loaded) render(); }, () => {});
  db.collection("tam").limit(200).onSnapshot(snap => { tams = {}; snap.docs.forEach(d => tams[d.id] = d.data()); ver++; if (loaded) render(); }, () => {});
  db.doc("meta/sectors").onSnapshot(d => { customSectors = d.exists ? (d.data().custom || []) : []; ver++; if (loaded) render(); }, () => {});
  db.collection("sponsors").limit(1000).onSnapshot(snap => { sponsorDocs.clear(); snap.docs.forEach(d => sponsorDocs.set(d.id, d.data())); ver++; if (loaded) render(); }, () => {});
  db.collection("dealbook").limit(64).onSnapshot(snap => { savedDeals.clear(); snap.docs.forEach(d => { const x = d.data()?.deals || {}; for (const [k, v] of Object.entries(x)) if (v && v.target) savedDeals.set(k, { ...v, id: k }); }); mergeDeals(); if (loaded) render(); }, () => {});
  db.doc("meta/entities").onSnapshot(d => { savedEntities = d.exists ? (d.data().entities || []) : []; meta.entities = [...base.entities, ...savedEntities]; ver++; rebuildIndex(); if (loaded) render(); }, () => {});
  db.collection("companies").limit(2000).onSnapshot(snap => {
    savedCos.clear();
    snap.docs.forEach(doc => savedCos.set(doc.id, doc.data() || {}));
    mergeCompanies();
    watchDetails(); drainWeb();
    render();
  }, err => {
    if (err?.code === "revoked" || err?.code === "not_granted") { dbState = "off"; }
    render();
  });
})();
})();
