/* Layout: a left control rail (stencilled brand plate, nav, ownership filter) beside the work area.
   Shop-floor palette: gunmetal, galvanised steel, safety yellow used sparingly; DNA bands are green / amber / red. */
:root{
  --bg:#121311; --rail:#0b0c0a; --panel:#1b1c19; --panel-2:#22231f; --sunk:#0f100e; --line:#33342e; --line-2:#45463f;
  --ink:#ece7da; --ink-2:#aaa596; --ink-3:#77736a; --accent:#f2b705; --accent-ink:#141209; --accent-text:#f2b705;
  --good:#46b35f; --mid:#e8860c; --bad:#d9472f; --good-soft:#1c3122; --mid-soft:#3a2a12; --bad-soft:#3b1d17;

  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --hazard:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--accent-ink) 10px 20px);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){

dEventListener(\"click\", e => {\n  const a = e.target.closest?.('a[href^=\"#\"]');\n  if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;\n  e.preventDefault();\n  const h = a.getAttribute(\"href\").slice(1);\n  if (h && location.hash.slice(1) !== h) location.hash = h;\n});\nconst $ = (s, r = document) => r.querySelector(s);\nconst app = $(\"#app\");\nconst esc = s => String(s ?? \"\").replace(/[&\u003c>\"']/g, c => ({ \"&\": \"&amp;\", \"\u003c\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\" }[c]));\nconst num = v => (v === null || v === undefined || v === \"\" || isNaN(+v)) ? null : +v;\nconst clone = o => JSON.parse(JSON.stringify(o ?? null));\nconst slugify = s => String(s).toLowerCase().normalize(\"NFKD\").replace(/[^\\w\\s-]/g, \"\").trim().replace(/[\\s_]+/g, \"-\").replace(/-+/g, \"-\").slice(0, 60) || (\"co-\" + Date.now());\nconst norm = s => String(s || \"\").toLowerCase().replace(/\\(.*?\\)/g, \"\").replace(/\\b(inc|llc|ltd|co|corp|corporation|company|group|the|holdings?)\\b\\.?/g, \"\").replace(/[^a-z0-9]+/g, \" \").trim();\nconst now = () => new Date().toISOString();\n\n// End markets are the market map's (filled from Probrands when the data arrives).\nconst BUCKETS = [];\n// Heavy fields live in details/\u003cid> and load when a profile opens; everything else sits in companies/\u003cid>.\nconst DETAIL_KEYS = new Set([\"management\",\"segment_profiles\",\"dossier\",\"products\",\"product_em_map\",\"history\",\"suggestions\",\"what_it_is\",\"bluntly\",\"profile_md\",\"total_revenue_basis\",\"employees_basis\",\"open_questions\",\"addon_corrections\",\"what_changed_vs_prior\",\"evidence\",\"key_sites\",\"chemistries\",\"customers\",\"runs\",\"prior_owners\"]);\nconst END_MARKETS = [];\n\n/* ---------- one vertical: Pro brands. Its sectors are the market map's segments. ---------- */\nconst DEFAULT_WS = \"probrands/pro\";\nconst VERTICALS = [[\"probrands\", \"Pro brands\", [[\"pro\", \"Pro brands\", (wsSectors()[0]?.id || \"\");\n// \u003coption>s for a sector picker, grouped when they span several groups.\nfunction sectorOptions(secs, sel) {\n  const by = new Map(); for (const x of secs) { if (!by.has(x.g)) by.set(x.g, []); by.get(x.g).push(x); }\n  const opt = x => `\u003coption value=\"${esc(x.id)}\" ${x.id === sel ? \"selected\" : \"\"} title=\"${esc(x.name)}\">${esc(x.short)}\u003c/option>`;\n  return by.size \u003c 2 ? secs.map(opt).join(\"\") : [...by].map(([g, xs]) => `\u003coptgroup label=\"${esc(groupByKey(g)?.name || g)}\">${xs.map(opt).join(\"\")}\u003c/optgroup>`).join(\"\");\n}\nconst sectorById = id => allSectors().find(s => s.id === id) || (id ? { id, name: id.replace(/-/g, \" \"), short: id.replace(/-/g, \" \") } : null);\nfunction sectorFromName(n) {\n  const k = norm(n); if (!k) return null;\n  return allSectors().find(s => s.id === n || norm(s.name) === k || norm(s.short) === k) || allSectors().find(s => catToSector(n) === s.id) || null;\n}\nconst GENERIC_EM = END_MARKETS;\nconst CAT_SECTOR = [];\nfunction catToSector(cat) { const sg = base.segOf[cat]; return sg && !PB_SKIP_SEG.test(sg) ? pbSector(sg) : null; }\n// Saved `sectors` wins (the market map sets them from SKU segments). Otherwise derive from the business split.\nfunction sectorsOf(c) {\n  return memod(\"sec:\" + c.id, () => {\n    if (Array.isArray(c.sectors) && c.sectors.length) return c.sectors.map(s => ({ ...s, sector: s.sector ?? (sectorFromName(s.name)?.id || \"\") }));\n    const tot = num(c.total_revenue_usd_m), m = new Map();\n    const add = (id, rev, pct) => { if (!id) return; const e = m.get(id) || { sector: id, revenue_usd_m: 0, pct: 0 }; e.revenue_usd_m += rev || 0; e.pct += pct || 0; m.set(id, e); };\n    for (const s of c.revenue_by_business || []) { const r = num(s.revenue_usd_m); add(catToSector(s.category || s.business), r, num(s.pct) ?? (tot && r ? r / tot * 100 : 0)); }\n    if (c.primary_sector && !m.has(c.primary_sector)) add(c.primary_sector, null, 0);\n    return [...m.values()].map(e => ({ ...e, revenue_usd_m: e.revenue_usd_m ? +e.revenue_usd_m.toFixed(1) : null, pct: e.pct ? +e.pct.toFixed(1) : null }));\n  });\n}\nfunction primarySector(c) {\n  if (c.primary_sector) return c.primary_sector;\n  return sectorsOf(c).slice().sort((a, b) => (b.revenue_usd_m || 0) - (a.revenue_usd_m || 0))[0]?.sector || BASE_SECTORS[0]?.id || \"\";\n}\n// A company's group: set on the company, else the group its primary sector belongs to. Everything already here is chemicals.\nconst groupOf = c => (c.group && groupByKey(c.group) ? c.group : null) || sectorById(primarySector(c))?.g || DEFAULT_WS;\n// Every group a company shows up in: its home group, any extra groups set on it, and the group of each sector it sells into.\n// Cross-links: other sectors a company also belongs in, with the reason ({sector, why, conf}).\nconst crossOf = c => Array.isArray(c.cross) ? c.cross.filter(x => x && sectorById(x.sector)?.g) : [];\nconst groupsOf = c => memod(\"grps:\" + c.id, () => [...new Set([groupOf(c), ...(Array.isArray(c.groups) ? c.groups.filter(groupByKey) : []), ...sectorsOf(c).map(x => sectorById(x.sector)?.g).filter(Boolean), ...crossOf(c).map(x => sectorById(x.sector).g)])]);\nconst inWs = c => groupsOf(c).some(g => wsHas(WS, g));\n// \"grp:\u003ckey>\" filters to a whole group when you are working across a vertical.\nconst inSector = (c, id) => !id || (id.startsWith(\"grp:\") ? groupsOf(c).includes(id.slice(4)) : primarySector(c) === id || sectorsOf(c).some(s => s.sector === id) || crossOf(c).some(x => x.sector === id));\n// Revenue in one sector: total revenue times the sector's share of the SKU mix.\nfunction sectorRev(c, id) {\n  id = id || primarySector(c);\n  const s = sectorsOf(c).find(x => x.sector === id);\n  if (s && num(s.revenue_usd_m) !== null) return num(s.revenue_usd_m);\n  if (id === primarySector(c) && sectorsOf(c).length \u003c= 1) return num(c.total_revenue_usd_m);\n  return null;\n}\nconst sectorShort = id => sectorById( enue_usd_m\") recalcPct(rows, c, patch, f);\n    if (f === \"revenue_by_product\" && k === \"revenue_usd_m\") recalcPct(rows, c, patch, f);\n    await save(c.id, patch, [f]);\n  } else {\n    const old = c[f];\n    if (String(old ?? \"\") === String(val ?? \"\") || (t === \"num\" && num(old) === val)) return;\n    if (f === \"name\" && !String(val).trim()) { el.textContent = c.name; return; }\n    const patch = { [f]: val };\n    const locks = [f];\n    await save(c.id, patch, locks);\n  }\n}\nfunction recalcPct(rows, c, patch, f) {\n  const tot = rows.reduce((s, r) => s + (num(r.revenue_usd_m) || 0), 0);\n  if (tot) rows.forEach(r => { if (num(r.revenue_usd_m) !== null) r.pct = +(r.revenue_usd_m / tot * 100).toFixed(1); });\n  patch[f] = rows;\n}\n\napp.addEventListener(\"focusout\", e => {\n  const el = e.target;\n  if (el?.isContentEditable && (el.dataset.tam || el.dataset.tamov)) {\n    const sid = el.dataset.tam || el.dataset.tamov, t = tams[sid] || {}, val = parseCell(el.dataset.t, el.innerText.replace(/\\u00a0/g, \" \").trim());\n    if (el.dataset.tamov) { const tri = triangulate(t).tam; if (val === null || (tri !== null && Math.round(val) === Math.round(tri))) { if (num(t.override_usd_m) !== null) saveTam(sid, { override_usd_m: null }).then(render); } else if (val !== num(t.override_usd_m)) saveTam(sid, { override_usd_m: val }).then(render); return; }\n    const src = (t.sources || []).map(x => ({ ...x })), row = src[+el.dataset.r]; if (!row) return;\n    if (String(row[el.dataset.k] ?? \"\") === String(val ?? \"\")) return;\n    row[el.dataset.k] = val; saveTam(sid, { sources: src }).then(() => setTimeout(() => { if (!isEditing()) render(); }, 30)); return;\n  }\n  if (el.id === \"q\" && ui.acOpen) setTimeout(() => { if (document.activeElement?.id !== \"q\" && ui.acOpen) { ui.acOpen = false; render(); } }, 150);\n  if (el?.isContentEditable && el.dataset.f) commit(el).finally(() => setTimeout(() => { if (pendingRender && !isEditing()) { pendingRender = false; render(); } }, 30));\n});\napp.addEventListener(\"keydown\", e => {\n  const el = e.target;\n  if (el.id === \"q\" && ui.acOpen && ui.q) {\n    const ms = acMatches();\n    if (e.key === \"ArrowDown\" && ms.length) { e.preventDefault(); ui.ac = Math.min(ms.length - 1, ui.ac + 1); render(); return; }\n    if (e.key === \"ArrowUp\" && ms.length) { e.preventDefault(); ui.ac = Math.max(-1, ui.ac - 1); render(); return; }\n    if (e.key === \"Enter\" && ms.length && ui.ac >= 0) { e.preventDefault(); const id = ms[ui.ac].c.id; ui.acOpen = false; location.hash = \"c.\" + id; return; }\n    if (e.key === \"Enter\") { e.preventDefault(); ui.acOpen = false; render(); return; }\n    if (e.key === \"Escape\") { ui.acOpen = false; render(); return; }\n  }\n  if (el?.isContentEditable && e.key === \"Enter\" && !e.shiftKey && el.tagName !== \"DIV\") { e.preventDefault(); el.blur(); }\n  if (el?.isContentEditable && e.key === \"Escape\") { el.blur(); }\n});\napp.addEventListener(\"paste\", e => {\n  const el = e.target;\n  if (!el?.isContentEditable) return;\n  e.preventDefault();\n  const text = (e.clipboardData || window.clipboardData).getData(\"text/plain\");\n  document.execCommand(\"insertText\", false, text);\n});\nconst isEditing = () => { const a = document.activeElement; return !!(a && app.contains(a) && (a.isContentEditable || a.tagName === \"TEXTAREA\" || ((a.id === \"addName\" || a.id === \"factText\") && a.value) || (!!a.closest?.(\"#imForm, #dealForm, #spForm, #spRelForm, #ctwForm, #spAddForm\") && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))); };\n\n/* ---------- deep dive ---------- */\n/* ---------- enhance: one focused Claude run per section ---------- */\n/* ---------- profile builder: sections, playbooks, build order ---------- */\n// Each step has a data shape, a detailed playbook (what good looks like, how deep, what not to do) and a\n// \"go deeper\" instruction used when the step already has content.\nconst SECTIONS = {\n  overview: { label: \"Overview\", fields: [\"what_it_is\", \"bluntly\", \"profile_md\", \"owner_type\", \"ultimate_parent\", \"pe_sponsor\", \"pe_entry_year\", \"prior_owners\", \"hq_address\", \"website\", \"business_model\"],\n    shape: `{\"what_it_is\":\"1-2 sentences\",\"bluntly\":\"2-3 plain-spoken sentences\",\"profile_md\":\"markdown, 250-450 words\",\"business_model\":\"Manufacturer | Formulator/blender | Distributor | Service route business | Toll/private label | Mixed: ...\",\"owner_type\":\"\",\"ultimate_parent\":\"\",\"pe_sponsor\":\"\",\"pe_entry_year\":\"\",\"prior_owners\":\"\",\"hq_address\":\"\",\"website\":\"\"}`,\n    rules: \"Identity and business model only. No revenue numbers unless they are already in the known facts.\" },\n  deals: { label: \"M&A history\", fields: [\"acquisitions\"], append: true,\n    shape: `{\"acquisitions\":[{\"date\":\"YYYY or YYYY-MM\",\"target\":\"legal or trading name\",\"deal_type\":\"Add-on | Platform | Merger | Divestiture | Ownership change\",\"what_it_does\":\"target's products, end markets and geography\",\"what_it_added\":\"what the deal added to this company: product line, geography, end market, capability\",\"closed_date\":\"YYYY-MM when it closed\",\"revenue_usd_m\":null,\"employees\":null,\"value_usd_m\":null,\"source_url\":\"\",\"confidence\":\"High | Medium | Low\"}]}`,\n    rules: \"Only deals NOT already in the current list, newest first.\" },\n  products: { label: \"Products\", fields: [\"products\"],\n    shape: `{\"products\":[{\"category\":\"product category, e.g. Industrial gear oils\",\"line\":\"brand family or product line, e.g. Duolec\",\"named_products\":\"named products or grades, comma separated\",\"what_it_is\":\"chemistry, base and form\",\"applications\":\"what it is used for\",\"end_markets\":[\"end markets it goes into\"],\"made_or_resold\":\"Made | Resold | Toll-made | Service | Equipment\",\"share_pct\":0,\"revenue_usd_m\":null,\"confidence\":\"High | Medium | Low\"}]}`,\n    rules: \"share_pct across all lines sums to about 100. revenue_usd_m = share of total revenue where total revenue is known.\" },\n  sectors: { label: \"Business lines & sectors\", fields: [\"sectors\", \"primary_sector\"],\n    shape: `{\"primary_sector\":\"\u003csector id>\",\"sectors\":[{\"sector\":\"\u003csector id>\",\"revenue_usd_m\":0,\"pct\":0,\"what\":\"which product categories and brands\"}]}`,\n    rules: \"\" },\n  endmarkets: { label: \"End-market mix\", fields: [\"product_em_map\", EM_FIELD, \"end_market_buckets\"],\n    shape: `{\"product_em_map\":[{\"category\":\"product category exactly as in the catalog\",\"end_market\":\"end market name\",\"pct\":0,\"customers\":\"typical customer types in this end market\"}],\"end_market_buckets\":{\"\u003cbucket>\":0}}`,\n    rules: \"\" },\n  segments: { label: \"Segment mix\", fields: [\"revenue_by_business\"],\n    shape: `{\"revenue_by_business\":[{\"business\":\"\",\"category\":\"product category or sector it maps to\",\"revenue_usd_m\":0,\"pct\":0}]}`,\n    rules: \"3 to 8 segments whose revenue sums to total revenue.\" },\n  financials: { label: \"Revenue & size\", fields: [\"total_revenue_usd_m\", \"total_revenue_year\", \"total_revenue_basis\", \"employees_total\", \"employees_basis\", \"ev_usd_m\", \"fin_history\"],\n    shape: `{\"total_revenue_usd_m\":0,\"total_revenue_year\":\"\",\"total_revenue_basis\":\"reported figure, period, source and date, then the pro forma bridge and headcount check\",\"employees_total\":0,\"employees_basis\":\"pro forma headcount: sources and dates\",\"ev_usd_m\":null,\"fin_history\":[{\"year\":\"2024\",\"revenue_usd_m\":0,\"basis\":\"Reported | Estimate | Pro forma\",\"source\":\"\"}]}`,\n    rules: \"USD millions, latest full year.\" },\n  customers: { label: \"Top customers\", fields: [\"customers\"],\n    shape: `{\"customers\":[{\"name\":\"named account, or a specific customer type\",\"end_market\":\"\",\"what\":\"which products they buy\",\"share_pct\":null,\"source\":\"basis in a few words\",\"confidence\":\"High | Medium | Low\"}]}`,\n    rules: \"Up to 15, largest first.\" },\n  competitors: { label: \"Top competitors\", fields: [\"competitors\"],\n    shape: `{\"competitors\":[{\"name\":\"\",\"overlap\":\"which product categories and end markets they compete in\",\"size\":\"rough size or scale\",\"confidence\":\"High | Medium | Low\"}]}`,\n    rules: \"Up to 12, most direct first.\" },\n  buyers: { label: \"Potential buyers\", fields: [\"buyers\"],\n    shape: `{\"buyers\":[{\"name\":\"\",\"type\":\"Strategic | Financial\",\"fit\":\"High | Medium | Low\",\"rationale\":\"why, tied to specific product categories, end markets or geography\",\"confidence\":\"High | Medium | Low\"}]}`,\n    rules: \"Up to 12, best fit first.\" },\n  addons: { label: \"Add-on ideas\", fields: [\"addon_ideas\"],\n    shape: `{\"addon_ideas\":[{\"target\":\"\",\"rationale\":\"which gap it fills: product, end market or geography\",\"est_revenue_usd_m\":null,\"location\":\"\",\"confidence\":\"High | Medium | Low\"}]}`,\n    rules: \"Up to 12, best first.\" },\n};\n// Build order: understand the company, then what it sells, then where that goes, then everyone around it.\nconst SECTION_ORDER = [\"overview\", \"deals\", \"products\", \"sectors\", \"endmarkets\", \"segments\", \"financials\", \"customers\", \"competitors\", \"buyers\", \"addons\"];\n\nconst PLAYBOOK = {\n  overview: `GOAL: a precise description of what this company is and how it makes money. Every later step builds on this, so accuracy matters more than length.\nCOVER: the name it trades under and its main brands; founding year and founders; ownership history with years (founder, family, PE, strategic, ESOP); headquarters and main plants, blending sites or branches; what it sells in one sentence; business model (manufacturer, formulator/blender, distributor, service route business, toll or private label); how it goes to market (direct reps, distributors, OEMs, dealers, e-commerce); geographic reach; headcount if known.\nprofile_md: use these headings: ## Business, ## History & ownership, ## Go-to-market & footprint, ## What sets it apart, ## Open questions. Facts you are sure of go in plainly; anything uncertain goes under Open questions.\nbluntly: what the business really is, without the marketing.\nDON'T: invent owners, deals or numbers. If you are unsure who owns it, say so and leave owner fields empty.`,\n  deals: `GOAL: every acquisition, merger, divestiture and ownership change in the company's history. Acquired businesses define what the company owns today, so later steps use this list to find product lines, end markets and geographies.\nFOR EACH DEAL: date, the target's name, deal type, what the target did (products, end markets, geography), what it added to this company, target revenue at the time and deal value if disclosed.\nInclude divestitures (deal_type Divestiture) and changes of the company's own ownership (deal_type Ownership change, target = this company, naming the new owner in what_it_added).\nDON'T: list a deal unless you are confident it happened. Never claim the company itself was acquired unless you are certain; a wrong ownership change corrupts the whole profile. An empty list is better than a wrong one.\nSIZE EVERY DEAL: for each acquisition find the target's revenue (revenue_usd_m) and headcount (employees) at the time, and the close date. Deal announcements, sponsor and law-firm releases and trade press usually state them; otherwise estimate from the target's headcount and say so. The revenue step uses these to build pro forma revenue.`,\n  products: `GOAL: a real product catalog built from actual products, not generic chemistry words.\nSTRUCTURE: category (for example \"Industrial gear oils\", \"Food-grade greases\", \"Cooling-tower biocides\", \"Salon hair color\") \u2192 product line or brand family (for example \"Duolec\", \"Quinplex\") \u2192 named products or grades. For each line give what it is (chemistry, base, form), what it does and key applications, the end markets it is sold into, whether it is made in-house, resold, toll-made, a service or equipment, and its share of company revenue.\nDEPTH: a mid-size company should have 8 to 25 lines across 3 to 8 categories. Use the company's own brand names where you know them. Put services (testing, lab, route service) and equipment in their own categories. Include product lines that came with acquisitions.\nCHECK: shares sum to about 100; the categories match the overview and the M&A history.\nDON'T: write \"specialty chemicals\" or other generic filler. If you don't know a brand name, describe the line plainly and rate it Low. Never invent brand names.`,\n  sectors: `GOAL: map the product catalog onto sectors so the company shows up in the right markets.\nMETHOD: assign each product category to one sector, then add up the category shares by sector. Say which categories and brands sit in each sector.\nSector ids to use where they fit: {SECTOR_IDS}. If nothing fits, use a short new lowercase id with hyphens. pct values sum to 100. primary_sector is the largest.`,\n  endmarkets: `GOAL: build the end-market mix bottom-up from where each product category is sold.\nMETHOD: for every category in the product catalog, split it across the end markets it is sold into (pct of that category, summing to 100 per category), and name the typical customer types. The CRM weights these by each category's share of revenue to get the company's end-market mix, so be precise category by category. Use the applications, customers and deals already known.\nEND-MARKET NAMES: use these where they fit: {EM_NAMES}.\nDON'T: give one company-wide guess; work category by category. Every catalog category must appear.`,\n  segments: `GOAL: the business segments the company reports or is organized into, each with revenue.\nMETHOD: start from how the company itself describes its divisions; otherwise group product categories and acquired businesses into 3 to 8 segments. Revenue sums to total revenue; tie each segment to its product categories in \"category\".`,\n  financials: `GOAL: pro forma revenue (today's business, including every acquisition) and headcount, each with its date and the arithmetic shown.\nREVENUE, IN THIS ORDER:\n1. Find the latest REPORTED revenue number and WHEN it was reported and for what period. Search the company name with \"revenue\", \"sales\", \"$ million\", \"annual revenue\"; press releases and deal announcements (sponsor, lender and law-firm releases often state it); trade press; industry lists (Inc. 5000, ICIS, C&EN, Coatings World, Adhesives Magazine and similar top-company lists); and executive bios on LinkedIn and company or sponsor pages (\"led growth to $X million\", \"grew revenue from $A to $B\"), which often state revenue. Note the source, the period and the reported date for each number.\n2. Make it PRO FORMA. Take the M&A history and add every acquisition that closed AFTER the period of the reported figure, using each target's revenue (search it: deal announcements usually state it; otherwise estimate from the target's headcount). Subtract anything divested since. A figure reported before an acquisition is not pro forma: say so and adjust it.\n3. Cross-check with headcount: pro forma employees (the company's own count plus acquired companies' staff; LinkedIn, the company site, deal releases) \u00d7 revenue per employee for this business model (brand owners and formulators of pro chemical products typically $300-600K per employee, contract-filled brands more). Also check against the product catalog and plant capacity where known.\n4. Pick the best-supported figure and show the bridge in total_revenue_basis: \"Reported $X for \u003cperiod> (\u003csource>, reported \u003cdate>) + \u003cacquisition> $Y (closed \u003cdate>) + \u2026 \u2212 \u003cdivestiture> = pro forma $Z; headcount check: N employees \u00d7 $K = $W.\" Use the pro forma year for total_revenue_year (e.g. \"2026 pro forma\").\nHISTORY: give fin_history, one row per fiscal year for the last 3-5 years (revenue), each marked Reported, Estimate or Pro forma with its source. Filings, earnings releases, lender and rating-agency notes, press (\"grew to $X in 2023\"), Inc. 5000 growth figures and executive bios are the usual sources.\nEMPLOYEES: pro forma headcount with its sources and date in employees_basis (company count plus acquired staff).\nVALUATION: if an enterprise value has been reported (sponsor entry, deal release, public market cap plus net debt), give ev_usd_m with the source in basis. Leave it null rather than guess.\nCONFIDENCE: High only if a source states the pro forma number; a reported figure adjusted with sourced deal sizes is Medium; a headcount-only estimate is Low-Medium.\nDON'T: present an old or pre-acquisition figure as current, or state a figure as disclosed unless it is.`,\n  customers: `GOAL: who actually buys the products, by end market.\nFOR EACH: a named account where you know it (utilities, OEMs, distributors, retailers, industrial plants), otherwise a specific customer type with examples; its end market; which product categories it buys; share of revenue if known.\nDON'T: invent named accounts. A specific customer type is better than a made-up name.`,\n  competitors: `GOAL: the companies this business actually competes with, category by category.\nMETHOD: for each product category in the catalog, name the real companies selling competing products into the same end markets and regions. Merge into one list, most direct first; say which categories and end markets overlap and roughly how big each competitor is.\nDON'T: list only the global giants when regional or mid-market companies are the real day-to-day competitors.`,\n  buyers: `GOAL: the most likely acquirers of this whole business.\nMETHOD: strategics that sell adjacent products into the same end markets, or want its channel or geography; PE sponsors with related platforms that would add it on; larger sponsors for a standalone platform deal if it is big enough. Tie every rationale to specific product categories, end markets or geography from the profile. Prefer companies with a record of doing deals like this.`,\n  addons: `GOAL: real companies this business could buy to fill specific gaps.\nMETHOD: find the gaps in the profile (missing product categories, thin end markets, regions without coverage), then name real companies that fill each one and are a sensible size for this company to buy. Say which gap each fills.\nDON'T: suggest companies much larger than the buyer, or ones that are already owned by a major strategic.`,\n};\nconst DEEPEN = {\n  overview: \"Tighten the description, fill the missing history and ownership years, add the footprint (plants, branches) and go-to-market detail, and move anything uncertain to Open questions.\",\n  deals: \"Look for deals the list is missing: smaller tuck-ins, older deals, divestitures and ownership changes. Add what each deal contributed.\",\n  products: \"Keep every correct line, then go one level deeper: split broad categories into specific product lines, add the named products or grades under each line, fill in applications and end markets for every line, add service and equipment lines, and reconcile shares to 100.\",\n  sectors: \"Re-check each category's sector against the latest product catalog and fix the shares.\",\n  endmarkets: \"Cover every category in the latest catalog, split end markets more finely where a category serves several, and name customer types for each.\",\n  segments: \"Re-align segments with the latest product catalog and deals.\",\n  financials: \"Search again for a newer reported revenue figure and its date (press releases, deal announcements, executive LinkedIn bios, top-company lists), re-check every acquisition closed since it for the pro forma bridge, and re-run the headcount cross-check.\",\n  customers: \"Add more named accounts and cover every major end market.\",\n  competitors: \"Cover every product category and add the regional and mid-market competitors.\",\n  buyers: \"Refine the list against the latest products, end markets and deals, and add sponsors with related platforms.\",\n  addons: \"Target the specific gaps visible in the latest catalog and end markets.\",\n};\n\n// Water companies carry extra water-index fields; other sectors use the generic shape.\nfunction sectionDef(c, key) {\n  const base = SECTIONS[key]; if (!base) return null;\n  const water = inSector(c, \"water\");\n  if (key === \"endmarkets\" && !water) return { ...base, fields: [\"product_em_map\", EM_FIELD],\n    shape: `{\"product_em_map\":[{\"category\":\"product category exactly as in the catalog\",\"end_market\":\"end market name\",\"pct\":0,\"customers\":\"typical customer types in this end market\"}]}` };\n  return base;\n}\n// Product catalog helpers. Older profiles only have a flat \"chemistries\" list; treat each item as a line.\nfunction catalog(c) {\n  if ((c.products || []).length) return c.products;\n  return (c.chemistries || []).map(x => ({ category: x.product_line, line: x.brands || \"\", named_products: \"\", what_it_is: \"\", applications: \"\", end_markets: [], made_or_resold: x.made_or_resold || \"\", share_pct: null, revenue_usd_m: null }));\n}\nfunction categoryShares(c) {\n  const m = new Map(), tot = num(c.total_revenue_usd_m);\n  for (const p of catalog(c)) { const k = String(p.category || p.line || \"Other\").trim(); const s = num(p.share_pct) ?? (tot && num(p.revenue_usd_m) ? p.revenue_usd_m / tot * 100 : 0); m.set(k, (m.get(k) || 0) + (s || 0)); }\n  return m;\n}\n// Revenue by product category, for the product pie.\nfunction productRollup(c) {\n  const tot = num(c.total_revenue_usd_m), out = [];\n  for (const [k, s] of categoryShares(c)) if (s) out.push({ product: k, pct: +s.toFixed(1), revenue_usd_m: tot ? +(tot * s / 100).toFixed(1) : null });\n  return out;\n}\n// End-market mix from the product map: each category's split, weighted by the category's revenue share.\nfunction em
