\u003c/td>\u003ctd class=\"muted\">${esc(x.state || \"\")}\u003c/td>\u003ctd>${x.src === \"saved\" ? (writable && db ? `\u003cbutton class=\"x\" style=\"opacity:1\" data-act=\"delrow\" data-f=\"addon_ideas\" data-r=\"${x.i}\" aria-label=\"Remove\">\u00d7\u003c/button>` : \"\") : writable && db ? `\u003cbutton class=\"btn sm ghost\" data-act=\"saveaddonx\" data-j=\"${j}\">Save\u003c/button>` : \"\"}\u003c/td>\u003c/tr>`).join(\"\");\n    const nb = al.filter(x => x.src === \"buyer\").length;\n    return `\u003cdiv class=\"sec\">${secHead(c, \"\", \"Add-on list\", `\u003cspan class=\"faint\" style=\"font-size:12px\">${al.length} targets${nb ? ` \u00b7 ${nb} from buyer links` : \"\"}\u003c/span>${writable && db ? `\u003cbutton class=\"btn sm ghost\" data-act=\"addrow\" data-f=\"addon_ideas\">Add target\u003c/button>` : \"\"}`, \"addons\", [\"addon_ideas\"])}\n      \u003cp class=\"muted\" style=\"margin:-4px 0 10px;font-size:13px\">Companies ${esc(c.name)} could buy. \u003cb>Saved\u003c/b> are yours or Claude's. \u003cb>Named buyer\u003c/b> means another profile lists ${esc(c.name)} as its potential buyer. \u003cb>Market-map match\u003c/b> is a smaller private company with similar end markets. Every entry also shows in Buyer finder.\u003c/p>\n      \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth style=\"width:240px\">Target\u003c/th>\u003cth style=\"width:120px\">Source\u003c/th>\u003cth>Why it fits\u003c/th>\u003cth class=\"r\" style=\"width:90px\">${esc(sectorRevLabel(primarySector(c)))}\u003c/th>\u003cth style=\"width:70px\">State\u003c/th>\u003cth style=\"width:60px\">\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows || `\u003ctr>\u003ctd colspan=\"6\" class=\"faint\">No add-on targets found. Hit Enhance and Claude suggests some.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n    ${(c.addon_ideas || []).length ? `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Edit saved add-ons\u003c/h2>\u003c/div>${editTable(c, \"addon_ideas\", [{ k: \"target\", label: \"Target\", w: \"240px\" }, { k: \"rationale\", label: \"Why it fits\" }, { k: \"est_revenue_usd_m\", label: \"Est rev $M\", t: \"num\", w: \"100px\" }, { k: \"location\", label: \"Location\", w: \"150px\" }], tableRows(c, \"addon_ideas\"))}\u003c/div>` : \"\"}`;\n  }\n  if (tab === \"sources\") {\n    const facts = (c.source_of_truth || []).map((f, i) => `\u003cli>\u003cdiv>${esc(f.text)}\u003cdiv class=\"when\">${fmtDate(f.at)}\u003c/div>\u003c/div>${writable && db ? `\u003cbutton class=\"x\" style=\"opacity:1\" data-act=\"delfact\" data-r=\"${i}\" aria-label=\"Remove fact\">\u00d7\u003c/button>` : \"\"}\u003c/li>`).join(\"\");\n    const locked = (c.locked || []).filter(k => k !== \"name\");\n    const runsH = [...(c.runs || [])].reverse().map(r => `\u003ctr>\u003ctd class=\"faint\" style=\"white-space:nowrap\">${fmtDate(r.at)}\u003c/td>\u003ctd style=\"white-space:nowrap\">${esc(r.kind)}\u003c/td>\u003ctd>${esc(r.summary)}\u003c/td>\u003c/tr>`).join(\"\");\n    const changes = (c.history || []).slice(0, 60).map(h => `\u003ctr>\u003ctd class=\"faint\" style=\"white-space:nowrap\">${fmtDate(h.at)}\u003c/td>\u003ctd>${esc(label(h.field))}\u003c/td>\u003ctd>${esc(h.by)}\u003c/td>\u003ctd class=\"muted\" style=\"font-size:12px\">${esc(h.before || \"\u2014\")}\u003c/td>\u003ctd style=\"font-size:12px\">${esc(h.after || \"\u2014\")}\u003c/td>\u003c/tr>`).join(\"\");\n    const ev = (c.evidence || []).map(e => `\u003ctr>\u003ctd>${esc(e.metric)}\u003c/td>\u003ctd>${esc(e.value)}\u003c/td>\u003ctd class=\"num\">${esc(e.year)}\u003c/td>\u003ctd>${e.url ? `\u003ca href=\"${esc(e.url)}\" target=\"_blank\" rel=\"noopener\">${esc(e.source_type || \"Link\")}\u003c/a>` : esc(e.source_type)}\u003c/td>\u003ctd class=\"muted\" style=\"font-size:12px\">${e.quote ? \"\u201c\" + esc(e.quote) + \"\u201d\" : \"\"}\u003c/td>\u003c/tr>`).join(\"\");\n    const qs = researchDocs.filter(q => q.company_id === c.id).sort((a, b) => String(b.requested_at).localeCompare(String(a.requested_at))).map(q => `\u003ctr>\u003ctd class=\"faint\">${fmtDate(q.requested_at)}\u003c/td>\u003ctd>${esc({ done: \"Done\", running: \"Running\", starting: \"Starting\", error: \"Stopped\", dismissed: \"Stopped\" }[q.status] || q.status)}\u003c/td>\u003ctd class=\"muted\">${esc((q.steps || []).map(k => SECTIONS[k]?.label || k).join(\", \"))}${q.summary || q.error ? \" \u00b7 \" + esc(q.summary || q.error) : \"\"}\u003c/td>\u003c/tr>`).join(\"\");\n    return `\n    \u003cdiv class=\"sec grid2\">\n      \u003cdiv>\u003cdiv class=\"sec-h\">\u003ch2>Your facts\u003c/h2>\u003c/div>\n        ${facts ? `\u003cul class=\"fact-list\">${facts}\u003c/ul>` : `\u003cp class=\"faint\">No facts added yet. Use \u201cAdd a fact\u201d above. Enhance treats your facts as the source of truth.\u003c/p>`}\u003c/div>\n      \u003cdiv>\u003cdiv class=\"sec-h\">\u003ch2>Overrides\u003c/h2>\u003c/div>\n        ${locked.length ? `\u003cdiv class=\"chips\" style=\"margin-top:0\">${locked.map(f => `\u003cbutton class=\"pill lock\" data-act=\"unlock\" data-f=\"${esc(f)}\" title=\"Click to let Claude update it again\">${esc(label(f))} \u00d7\u003c/button>`).join(\"\")}\u003c/div>\u003cp class=\"faint\" style=\"font-size:12px\">Enhance never replaces these. Click one to release it.\u003c/p>` : `\u003cp class=\"faint\">None. Type over any value in the profile and it becomes an override.\u003c/p>`}\u003c/div>\n    \u003c/div>\n    ${qs ? `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Web research requests\u003c/h2>\u003c/div>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Requested\u003c/th>\u003cth>Status\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${qs}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>` : \"\"}\n    ${c.open_questions ? `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Open questions\u003c/h2>\u003c/div>\u003cp class=\"muted\" style=\"max-width:80ch\">${esc(c.open_questions)}\u003c/p>\u003c/div>` : \"\"}\n    \u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Change log\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">Every value Claude or you changed, with what it was before\u003c/span>\u003c/div>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Date\u003c/th>\u003cth>Field\u003c/th>\u003cth>By\u003c/th>\u003cth>Before\u003c/th>\u003cth>After\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${changes || `\u003ctr>\u003ctd colspan=\"5\" class=\"faint\">No changes yet.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n    \u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Run history\u003c/h2>\u003c/div>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Date\u003c/th>\u003cth>Run\u003c/th>\u003cth>What changed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${runsH || `\u003ctr>\u003ctd colspan=\"3\" class=\"faint\">No runs yet.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n    \u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Evidence\u003c/h2>\u003c/div>\u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metric\u003c/th>\u003cth>Value\u003c/th>\u003cth>Year\u003c/th>\u003cth>Source\u003c/th>\u003cth>Quote\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${ev || `\u003ctr>\u003ctd colspan=\"5\" class=\"faint\">No sourced evidence on file.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n    \u003cdiv class=\"sec\">${secHead(c, \"key_sites\", \"Sites\")}${editTable(c, \"key_sites\", [{ k: \"type\", label: \"Type\", w: \"100px\" }, { k: \"address\", label: \"Address\" }, { k: \"city\", label: \"City\", w: \"180px\" }, { k: \"state\", label: \"State\", w: \"70px\" }], tableRows(c, \"key_sites\"))}\u003c/div>`;\n  }\n  return \"\";\n}\n\nfunction viewTargets() {\n  const q = ui.tq.toLowerCase();\n  const sid = ui.sector, secOk = t => !sid || (t.company && inSector(t.company, sid)) || t.links.some(l => l.platformId && companies.has(l.platformId) && inSector(companies.get(l.platformId), sid));\n  const ts = allTargets().filter(secOk).filter(t => !q || t.name.toLowerCase().includes(q) || t.links.some(l => String(l.platform).toLowerCase().includes(q) || String(l.what || \"\").toLowerCase().includes(q)))\n    .sort((a, b) => b.links.length - a.links.length || a.name.localeCompare(b.name));\n  if (!ts.find(t => t.key === ui.tsel)) ui.tsel = ts[0]?.key || null;\n  const sel = ts.find(t => t.key === ui.tsel);\n  const listHtml = ts.length ? ts.slice(0, 300).map(t => {\n    const kinds = new Set(t.links.map(l => l.kind));\n    return `\u003cbutton data-tsel=\"${esc(t.key)}\" aria-current=\"${t.key === ui.tsel}\">\u003cspan class=\"t-n\">${esc(t.name)}\u003c/span>\u003cspan class=\"faint\" style=\"font-size:12px;white-space:nowrap\">${kinds.has(\"acq\") || kinds.has(\"owned\") ? \"Acquired\" : kinds.has(\"idea\") ? \"Idea\" : \"Has buyers\"}\u003c/span>\u003c/button>`;\n  }).join(\"\") : `\u003cp class=\"faint\" style=\"padding:12px\">No targets match.\u003c/p>`;\n  let detail = `\u003cdiv class=\"detail faint\">Pick a target on the left.\u003c/div>`;\n  if (sel) {\n    const K = { acq: [\"k-acq\", \"Acquired by\"], owned: [\"k-acq\", \"Now part of\"], idea: [\"k-idea\", \"Add-on idea for\"], buyer: [\"k-buyer\", \"Potential buyer\"] };\n    const links = sel.links.map(l => `\u003cdiv class=\"lnk\">\u003cspan class=\"kind ${K[l.kind][0]}\">${K[l.kind][1]}\u003c/span>\u003cdiv style=\"min-width:0\">\u003cdiv class=\"who\">${l.platformId ? `\u003ca href=\"#c.${esc(l.platformId)}.${l.kind === \"idea\" ? \"addons\" : l.kind === \"acq\" ? \"acquisitions\" : \"overview\"}\">${esc(l.platform)}\u003c/a>` : esc(l.platform)}${l.btype ? ` \u003cspan class=\"faint\" style=\"font-weight:400\">\u00b7 ${esc(l.btype)}\u003c/span>` : \"\"}\u003c/div>\u003cdiv class=\"muted\" style=\"font-size:13px\">${esc(l.what || \"\")}\u003c/div>\u003c/div>\u003cdiv class=\"num faint\" style=\"font-size:12px;text-align:right\">${esc(l.date || \"\")}${l.rev !== null && l.rev !== undefined ? `\u003cbr>${fmtM(l.rev)} rev` : \"\"}${l.value ? `\u003cbr>${fmtM(l.value)} value` : \"\"}\u003c/div>\u003c/div>`).join(\"\");\n    let fit = \"\";\n    const base = sel.company || sel.entity;\n    if (base) {\n      const skip = new Set([sel.company?.id, sel.entity?.owner_id].filter(Boolean));\n      const tsid = sel.company ? primarySector(sel.company) : (ui.sector || BASE_SECTORS[0]?.id || \"\");\n      const tRev = (sel.company ? sectorRev(sel.company, tsid) : null) ?? num(sel.entity?.us_rev) ?? 0;\n      const minRev = Math.max(2 * tRev, 10);\n      const ranked = list().filter(p => !skip.has(p.id) && ((sectorRev(p, tsid) || 0) >= minRev || (num(p.total_revenue_usd_m) || 0) >= 3 * minRev))\n        .map(p => { const o = overlap(base, p), n = (p.acquisitions || []).length; return { p, o, n, s: o * (0.6 + 0.4 * Math.min(1, n / 10)) }; })\n        .filter(x => x.o > 0).sort((a, b) => b.s - a.s).slice(0, 8);\n      fit = ranked.length ? `\u003cdiv class=\"sec-h\" style=\"margin-top:22px\">\u003ch2>Best-fit homes in the CRM\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">Companies at least twice its size, ranked by similarity in sector and end markets, boosted for active acquirers\u003c/span>\u003c/div>\n      \u003cdiv class=\"panel bars\" style=\"padding:6px\">${ranked.map((x, i) => `\u003cdiv class=\"brow\" data-open=\"${esc(x.p.id)}\" data-tip=\"${esc(x.p.name)}: ${x.o.toFixed(0)}% similarity \u00b7 ${x.n} deals \u00b7 ${fmtM(sectorRev(x.p, tsid) ?? x.p.total_revenue_usd_m)} ${esc(sectorRevLabel(tsid))}\">\u003cspan class=\"rk\">${i + 1}\u003c/span>\u003cspan class=\"nm\">${esc(x.p.name)} \u003cspan class=\"faint\" style=\"font-weight:400;font-size:12px\">${fmtM(sectorRev(x.p, tsid) ?? x.p.total_revenue_usd_m)} \u00b7 ${x.n} deals\u003c/span>\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"width:${Math.min(100, x.o)}%\">\u003c/div>\u003c/div>\u003cspan class=\"v\">${x.o.toFixed(0)}%\u003c/span>\u003c/div>`).join(\"\")}\u003c/div>` : \"\";\n    }\n    detail = `\u003cdiv class=\"panel detail\">\u003cdiv class=\"eyebrow\">Target\u003c/div>\u003ch2 class=\"tt\">${sel.company ? `\u003ca href=\"#c.${esc(sel.company.id)}\" style=\"color:inherit;text-decoration:none\">${esc(sel.name)}\u003c/a>` : esc(sel.name)}\u003c/h2>\n      \u003cdiv class=\"muted\">${sel.company ? `Profiled \u00b7 ${esc(sectorById(primarySector(sel.company))?.name || \"\")} \u00b7 ${fmtM(sectorRev(sel.company))} ${esc(sectorRevLabel(primarySector(sel.company)).replace(/ rev$/, \" revenue\"))} \u00b7 ${esc(sel.company.owner_type || \"\")}` : sel.entity ? esc([sel.entity.role, num(sel.entity.us_rev) ? fmtM(sel.entity.us_rev) + \" revenue\" : \"\", sel.entity.state].filter(Boolean).join(\" \u00b7 \")) : `Not profiled yet`}${!sel.company && writable && db ? ` \u00b7 \u003cbutton class=\"btn sm ghost\" data-act=\"profile-target\" data-name=\"${esc(sel.name)}\">Create profile\u003c/button>` : \"\"}\u003c/div>\n      ${sel.entity?.what ? `\u003cp class=\"muted\" style=\"max-width:70ch;margin:10px 0 0\">${esc(sel.entity.what)}\u003c/p>` : \"\"}\n      \u003cdiv class=\"links\">${links}\u003c/div>${fit}\u003c/div>`;\n  }\n  return `\u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">${esc(ui.sector ? sectorById(ui.sector)?.name : \"All sectors\")} \u00b7 Who would buy it?\u003c/div>\u003ch1>Buyer finder\u003c/h1>\u003cp>Type any company, including ones that are only mentioned in other profiles, to see \u003cb>who already bought it\u003c/b>, \u003cb>who has named it as an add-on\u003c/b>, and \u003cb>which platforms in the CRM are the best fit to buy it\u003c/b>, ranked by shared end markets and size. Use it to build a buyer list for a sell-side pitch in seconds.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"bar\">\u003cdiv class=\"grow\">\u003cinput class=\"search\" id=\"tq\" type=\"search\" placeholder=\"Search a target, a platform, or a keyword like Legionella\" value=\"${esc(ui.tq)}\" aria-label=\"Search targets\">\u003c/div>\u003cspan class=\"faint\">${ts.length} targets\u003c/span>\u003c/div>\n  \u003cdiv class=\"split\">\u003cdiv class=\"panel tlist\">${listHtml}\u003c/div>${detail}\u003c/div>`;\n}\n\n/* ---------- sponsors, in market, logos ---------- */\nconst isPE = c => /^(PE-owned|Private equity owned)$/i.test(String(c.owner_type || \"\")) || !!c.pe_backed;\nfunction sponsorOf(c) {\n  const raw = String(c.pe_sponsor || (isPE(c) ? c.ultimate_parent : \"\") || \"\");\n  const n = raw.split(/[;(]| \\+ |, | and |\\//)[0].replace(/\\b(L\\.?P\\.?|LLC|Inc\\.?|Ltd\\.?)\\b\\.?/gi, \"\").replace(/\\s+/g, \" \").replace(/[,.\\s]+$/, \"\").trim();\n  return n || \"Sponsor not named\";\n}\nconst subIndustry = c => { const sec = sectorShort(primarySector(c)), cat = String(c.primary_category || \"\").split(/[(;]/)[0].trim(); return cat ? `${sec}: ${cat}` : sec; };\nconst entryYear = c => { const y = yearOf(c.pe_entry_year); return y && y > 1980 && y \u003c= new Date().getFullYear() ? y : null; };\nconst holdYears = c => { const y = entryYear(c); return y ? new Date().getFullYear() - y : null; };\nconst fmtX = v => num(v) === null ? \"\u2014\" : (+v).toFixed(1) + \"x\";\nconst IM_STAGES = [\"Rumored\", \"Preparing (bank hired)\", \"Launched / teasers out\", \"First round\", \"Second round / management meetings\", \"Final bids / exclusivity\", \"Signed\", \"Pulled\"];\nconst inMarket = c => c.in_market && c.in_market.stage && c.in_market.stage !== \"Pulled\" ? c.in_market : null;\nconst logos = new Map();\nconst logoImg = (c, cls = \"sm\") => logos.get(c.id) ? `\u003cimg class=\"logo ${cls}\" src=\"${esc(logos.get(c.id))}\" alt=\"\">` : \"\";\n// Shrink an uploaded logo to at most 320\u00d7160 so it stores in one small document and loads fast on strips.\nfunction logoData(file) {\n  return new Promise((res, rej) => {\n    const img = new Image(), url = URL.createObjectURL(file);\n    img.onload = () => { const k = Math.min(1, 320 / img.width, 160 / img.height), cv = document.createElement(\"canvas\"); cv.width = Math.max(1, Math.round(img.width * k)); cv.height = Math.max(1, Math.round(img.height * k)); cv.getContext(\"2d\").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL(\"image/png\")); };\n    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error(\"Not an image\")); };\n    img.src = url;\n  });\n}\nconst bar = (v, max) => `\u003cspan class=\"hb\">\u003ci style=\"width:${max ? Math.max(2, Math.round(v / max * 100)) : 0}%\">\u003c/i>\u003c/span>`;\nfunction viewSponsors(r) {\n  const all = list().filter(isHolding), addons = list().filter(c => isPE(c) && addonOf(c));\n  const f = r.fk, v = r.fv;\n  const match = c => !f || (f === \"o\" && sponsorOf(c) === v) || (f === \"y\" && String(entryYear(c) || \"Not known\") === v) || (f === \"s\" && subIndustry(c) === v);\n  const rows = all.filter(match).sort((a, b) => (num(b.total_revenue_usd_m) || 0) - (num(a.total_revenue_usd_m) || 0));\n  const group = (keyFn, labelFn) => { const m = new Map(); for (const c of all) { const k = keyFn(c); const g = m.get(k) || { k, n: 0, rev: 0, names: [] }; g.n++; g.rev += num(c.total_revenue_usd_m) || 0; g.names.push(c.name); m.set(k, g); } return [...m.values()].map(g => ({ ...g, label: labelFn(g.k) })); };\n  const byYear = group(c => String(entryYear(c) || \"Not known\"), k => k).sort((a, b) => (b.k === \"Not known\") - (a.k === \"Not known\") || String(b.k).localeCompare(String(a.k)));\n  const bySec = group(c => subIndustry(c), k => k).sort((a, b) => b.n - a.n);\n  const byOwner = group(c => sponsorOf(c), k => k).sort((a, b) => b.n - a.n || b.rev - a.rev);\n  const panel = (title, gs, key) => { const mx = Math.max(...gs.map(g => g.n), 1); return `\u003cdiv class=\"panel spg\">\u003cdiv class=\"sec-h\">\u003ch2>${title}\u003c/h2>\u003c/div>\u003ctable class=\"gt\">\u003ctbody>${gs.map(g => `\u003ctr class=\"${f === key && v === String(g.k) ? \"on\" : \"\"}\">\u003ctd>\u003ca href=\"#sponsors~${key}~${encodeURIComponent(g.k)}\" title=\"${esc(g.names.slice(0, 12).join(\", \"))}\">${esc(g.label)}\u003c/a>${key === \"o\" ? ` \u003ca class=\"faint\" style=\"font-size:11px\" href=\"#s.${esc(spSlug(g.k))}\">profile\u003c/a>` : \"\"}\u003c/td>\u003ctd class=\"r num\">${g.n}\u003c/td>\u003ctd>${bar(g.n, mx)}\u003c/td>\u003ctd class=\"r num faint\">${g.rev ? fmtM(g.rev) : \"\"}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/tbody>\u003c/table>\u003c/div>`; };\n  const holds = all.map(holdYears).filter(x => x !== null).sort((a, b) => a - b);\n  const medHold = holds.length ? holds[Math.floor(holds.length / 2)] : null;\n  const fLabel = f === \"o\" ? v : f === \"y\" ? \"Entry year \" + v : f === \"s\" ? v : \"\";\n  const tr = c => { const h = holdYears(c), im = inMarket(c); return `\u003ctr class=\"link\" data-open=\"${esc(c.id)}\">\u003ctd class=\"cname\">\u003ca href=\"#c.${esc(c.id)}\">${logoBadge(c, \"sm\")} ${esc(c.name)}\u003c/a>${im ? ` \u003cspan class=\"pill accent\">In market\u003c/span>` : \"\"}\u003csmall>${esc([subIndustry(c), c.hq_address].filter(Boolean).join(\" \u00b7 \"))}\u003c/small>\u003c/td>\u003ctd>\u003ca href=\"#s.${esc(spSlug(sponsorOf(c)))}\">${esc(sponsorOf(c))}\u003c/a>${fundOf(c) ? `\u003csmall>${esc(fundOf(c))}\u003c/small>` : \"\"}\u003c/td>\u003ctd class=\"r num\">${fmtM(c.total_revenue_usd_m)}\u003c/td>\u003ctd class=\"r num ${h >= 5 ? \"warnc\" : \"\"}\">${h !== null ? h + \" yrs\" : \"\u2014\"}\u003c/td>\u003ctd class=\"r num\">${entryYear(c) || \"\u2014\"}\u003c/td>\u003ctd class=\"r num\">${(c.pb_brands || []).length || \"\u2014\"}\u003c/td>\u003c/tr>`; };\n  // Year, then every sponsor-owned company bought that year.\n  const years = new Map();\n  for (const c of rows) { const y = String(entryYear(c) || \"Entry year not known\"); if (!years.has(y)) years.set(y, []); years.get(y).push(c); }\n  const order = [...years.keys()].sort((x, y) => (x === \"Entry year not known\") - (y === \"Entry year not known\") || y.localeCompare(x));\n  const body = order.map(y => { const cs = years.get(y).sort((a, b) => (num(b.total_revenue_usd_m) || 0) - (num(a.total_revenue_usd_m) || 0)); const rv = cs.reduce((t, c) => t + (num(c.total_revenue_usd_m) || 0), 0); return `\u003ctr class=\"yr\">\u003cth colspan=\"6\">\u003cspan>${esc(y)}\u003c/span>\u003cspan class=\"faint\">${cs.length} ${cs.length === 1 ? \"company\" : \"companies\"}${rv ? \" \u00b7 revenue \" + fmtM(rv) : \"\"}\u003c/span>\u003c/th>\u003c/tr>${cs.map(tr).join(\"\")}`; }).join(\"\");\n  return `\u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">${esc(wsPath())} \u00b7 Private equity\u003c/div>\u003ch1>Sponsor owned\u003c/h1>\u003cp>Every PE-owned company in ${esc(wsName())} by the year its sponsor bought it. Holds of five years or more are highlighted: those are the likeliest sellers. Click a company to open it, or a sponsor to see its page.\u003c/p>\u003c/div>\u003cdiv class=\"add\">\u003ca class=\"btn\" href=\"#pe~firms\">Private equity module: all firms \u2192\u003c/a>\u003c/div>\u003c/div>\n  \u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cdiv class=\"v\">${all.length}\u003c/div>\u003cdiv class=\"l\">PE-owned companies\u003c/div>\u003c/div>\u003cdiv class=\"stat\">\u003cdiv class=\"v\">${byOwner.length}\u003c/div>\u003cdiv class=\"l\">Sponsors\u003c/div>\u003c/div>\u003cdiv class=\"stat\">\u003cdiv class=\"v\">${fmtM(all.reduce((t, c) => t + (num(c.total_revenue_usd_m) || 0), 0))}\u003c/div>\u003cdiv class=\"l\">Combined revenue\u003c/div>\u003c/div>\u003cdiv class=\"stat\">\u003cdiv class=\"v\">${medHold !== null ? medHold + \" yrs\" : \"\u2014\"}\u003c/div>\u003cdiv class=\"l\">Median hold\u003c/div>\u003c/div>\u003cdiv class=\"stat\">\u003cdiv class=\"v\">${holds.filter(h => h >= 5).length}\u003c/div>\u003cdiv class=\"l\">Held 5+ years\u003c/div>\u003c/div>\u003cdiv class=\"stat\">\u003cdiv class=\"v\">${all.filter(inMarket).length}\u003c/div>\u003cdiv class=\"l\">In market\u003c/div>\u003c/div>\u003c/div>\n  \u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>${fLabel ? esc(fLabel) : \"By entry year\"}\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">${rows.length} companies\u003c/span>${fLabel ? `\u003ca class=\"btn sm ghost\" href=\"#sponsors\">Show all\u003c/a>` : \"\"}\u003c/div>\n  \u003cdiv class=\"tw\">\u003ctable class=\"spt\">\u003cthead>\u003ctr>\u003cth>Company\u003c/th>\u003cth>Owner\u003c/th>\u003cth class=\"r\">Revenue\u003c/th>\u003cth class=\"r\">Hold\u003c/th>\u003cth class=\"r\">Entry year\u003c/th>\u003cth class=\"r\">Brands\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${body || `\u003ctr>\u003ctd colspan=\"6\" class=\"faint\">No sponsor-owned companies match.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n  \u003cdiv class=\"sec-h\" style=\"margin-top:26px\">\u003ch2>Filter\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">Click a year, sub-industry or owner to narrow the list above.\u003c/span>\u003c/div>\n  \u003cdiv class=\"spgrid\">${panel(\"Entry year\", byYear, \"y\")}${panel(\"Sub-industry\", bySec, \"s\")}${panel(\"Owner\", byOwner.slice(0, 60), \"o\")}\u003c/div>\n  ${addons.length ? `\u003cdetails class=\"sec addons-x\">\u003csummary>\u003cb>${addons.length} add-on${addons.length > 1 ? \"s\" : \"\"} held through platforms\u003c/b> \u003cspan class=\"faint\" style=\"font-size:12px\">Not counted as holdings above\u003c/span>\u003c/summary>\u003cdiv class=\"panel list-p\">${addons.map(c => `\u003ca class=\"hrow\" href=\"#c.${esc(c.id)}\">${logoBadge(c)}\u003cspan>\u003cb>${esc(c.name)}\u003c/b>\u003csmall>Add-on of ${esc(addonOf(c))} \u00b7 ${esc(sponsorOf(c))}\u003c/small>\u003c/span>\u003c/a>`).join(\"\")}\u003c/div>\u003c/details>` : \"\"}`;\n}\nfunction viewInMarket() {\n  const rows = list().filter(inMarket).sort((a, b) => IM_STAGES.indexOf(b.in_market.stage) - IM_STAGES.indexOf(a.in_market.stage) || (num(b.total_revenue_usd_m) || 0) - (num(a.total_revenue_usd_m) || 0));\n  const steps = st => { const i = IM_STAGES.indexOf(st), n = 6; return `\u003cspan class=\"stg\" title=\"${esc(st)}\">${Array.from({ length: n }, (_, k) => `\u003ci class=\"${k \u003c= i - 1 || (i === 0 && k === 0) ? \"on\" : \"\"}\">\u003c/i>`).join(\"\")}\u003c/span>`; };\n  const cnt = IM_STAGES.slice(0, 7).map(st => [st, rows.filter(c => c.in_market.stage === st).length]).filter(x => x[1]);\n  return `\u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">Live processes\u003c/div>\u003ch1>In market\u003c/h1>\u003cp>Companies currently for sale: who is selling, the sell-side advisor and where the process stands. Mark a company on its profile with \u201cIn market\u201d.\u003c/p>\u003c/div>\u003c/div>\n  \u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cdiv class=\"v\">${rows.length}\u003c/div>\u003cdiv class=\"l\">In market\u003c/div>\u003c/div>${cnt.map(([st, n]) => `\u003cdiv class=\"stat\">\u003cdiv class=\"v\">${n}\u003c/div>\u003cdiv class=\"l\">${esc(st)}\u003c/div>\u003c/div>`).join(\"\")}\u003c/div>\n  \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Company\u003c/th>\u003cth>Seller\u003c/th>\u003cth>Sell-side advisor\u003c/th>\u003cth>Stage\u003c/th>\u003cth>Launched\u003c/th>\u003cth class=\"r\">Revenue\u003c/th>\u003cth class=\"r\">Guided multiple\u003c/th>\u003cth>Notes\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows.map(c => { const m = c.in_market; return `\u003ctr class=\"link\" data-open=\"${esc(c.id)}\">\u003ctd class=\"cname\">${logoBadge(c, \"sm\")} ${esc(c.name)}\u003csmall>${esc(sectorShort(primarySector(c)))}\u003c/small>\u003c/td>\u003ctd>${esc(m.seller || \"\")}\u003c/td>\u003ctd>${esc(m.advisor || \"\")}\u003c/td>\u003ctd>${steps(m.stage)} \u003cspan style=\"font-size:13px\">${esc(m.stage)}\u003c/span>\u003c/td>\u003ctd class=\"num\">${esc(m.launched || \"\")}\u003c/td>\u003ctd class=\"r num\">${fmtM(c.total_revenue_usd_m)}\u003c/td>\u003ctd class=\"r num\">${esc(m.multiple || \"\")}\u003c/td>\u003ctd class=\"muted\" style=\"font-size:13px\">${esc(m.notes || \"\")}\u003c/td>\u003c/tr>`; }).join(\"\") || `\u003ctr>\u003ctd colspan=\"9\" class=\"faint\">Nothing marked in market yet. Open a company and click \u201cIn market\u201d.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>`;\n}\nfunction inMarketPanel(c) {\n  const m = c.in_market || {}, editing = ui.imEdit === c.id;\n  if (!editing) return inMarket(c) ? `\u003cdiv class=\"run im\" role=\"status\">\u003cspan>\u003cb>In market\u003c/b> \u00b7 ${esc(m.stage)}${m.seller ? \" \u00b7 Seller: \" + esc(m.seller) : \"\"}${m.advisor ? \" \u00b7 Advisor: \" + esc(m.advisor) : \"\"}${m.launched ? \" \u00b7 Launched \" + esc(m.launched) : \"\"}${m.multiple ? \" \u00b7 Guided \" + esc(m.multiple) : \"\"}${m.notes ? `\u003cdiv class=\"faint\" style=\"font-size:12px;margin-top:2px\">${esc(m.notes)}\u003c/div>` : \"\"}\u003c/span>\u003cspan class=\"sp\">\u003c/span>${writable && db ? `\u003cbutton class=\"btn sm ghost\" data-act=\"imedit\">Edit\u003c/button>` : \"\"}\u003ca class=\"btn sm ghost\" href=\"#inmarket\">All in market\u003c/a>\u003c/div>` : \"\";\n  const seller = m.seller || (isPE(c) ? sponsorOf(c) : c.ultimate_parent || c.owner_type || \"\");\n  return `\u003cform class=\"panel imform\" id=\"imForm\">\u003cdiv class=\"sec-h\">\u003ch2>In market\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cbutton type=\"button\" class=\"btn sm ghost\" data-act=\"imcancel\">Cancel\u003c/button>\u003c/div>\n    \u003cdiv class=\"imgrid\">\u003clabel>Stage\u003cselect id=\"imStage\">${IM_STAGES.map(st => `\u003coption ${st === (m.stage || \"Launched / teasers out\") ? \"selected\" : \"\"}>${esc(st)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n    \u003clabel>Seller\u003cinput id=\"imSeller\" value=\"${esc(seller)}\" placeholder=\"Who is selling\">\u003c/label>\n    \u003clabel>Sell-side advisor\u003cinput id=\"imAdvisor\" value=\"${esc(m.advisor || \"\")}\" placeholder=\"e.g. Harris Williams\">\u003c/label>\n    \u003clabel>Launched\u003cinput id=\"imLaunched\" value=\"${esc(m.launched || \"\")}\" placeholder=\"e.g. Sep 2026\">\u003c/label>\n    \u003clabel>Guided multiple\u003cinput id=\"imMult\" value=\"${esc(m.multiple || \"\")}\" placeholder=\"e.g. 2.0-2.5x revenue\">\u003c/label>\n    \u003clabel class=\"wide\">Notes\u003cinput id=\"imNotes\" value=\"${esc(m.notes || \"\")}\" placeholder=\"Process notes, bidders, timing\">\u003c/label>\u003c/div>\n    \u003cdiv class=\"add\" style=\"margin-top:10px\">\u003cbutton class=\"btn primary\" type=\"submit\">Save\u003c/button>${c.in_market ? `\u003cbutton type=\"button\" class=\"btn danger\" data-act=\"imremove\">No longer in market\u003c/button>` : \"\"}\u003c/div>\u003c/form>`;\n}\n/* ---------- financial history and management ---------- */\nconst FH_BRIEF = `FINANCIAL HISTORY: find revenue for each of the last 3-5 fiscal years. Search filings and earnings releases (public), lender, rating-agency and deal releases, press (\"revenue grew to $X million in 2023\"), Inc. 5000 and similar growth lists, and executive LinkedIn or bio pages. Mark each year Reported (a source states it), Pro forma (adjusted for acquisitions) or Estimate (show the math in source). Save each year with add_row / update_row to list \"fin_history\" (match = the year). Then summarise the trend and growth rate in a few lines with links.`;\nconst MGMT_BRIEF = `MANAGEMENT: find the current leadership team: CEO, CFO, COO, president, heads of the main businesses, founders still involved, and the board chair. For each: name, title, since (year they started in the role), a one-line background (prior companies, sponsor affiliation), and their LinkedIn URL if public. Search the company's leadership page, press releases (appointments), the sponsor's portfolio page and LinkedIn. Save each person with add_row / update_row to list \"management\" (source \"web\" with the page URL). Note anyone who left recently. Then summarise the team in a few lines with links.`;\nfunction finHistory(c) {\n  const rows = [...(c.fin_history || [])].filter(r => r && r.year).sort((a, b) => (yearOf(a.year) || 0) - (yearOf(b.year) || 0)).slice(-7);\n  const S = cst(c.id), W = writable && db;\n  const btns = `${canEnhance() ? `\u003cbutton class=\"btn sm enh\" data-act=\"fhfind\" ${S.busy ? \"disabled\" : \"\"}>${rows.length ? \"Update history\" : \"Find history\"}\u003c/button>` : \"\"}${W ? `\u003cbutton class=\"btn sm ghost\" data-act=\"fhedit\">${ui.fhEdit === c.id ? \"Done\" : \"Edit\"}\u003c/button>` : \"\"}`;\n  if (ui.fhEdit === c.id) return `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Financial history\u003c/h2>\u003cspan class=\"sp\">\u003c/span>${btns}\u003cbutton class=\"btn sm ghost\" data-act=\"addrow\" data-f=\"fin_history\">Add year\u003c/button>\u003c/div>${editTable(c, \"fin_history\", [{ k: \"year\", label: \"Year\", w: \"90px\" }, { k: \"revenue_usd_m\", label: \"Revenue $M\", t: \"num\", w: \"120px\" }, { k: \"basis\", label: \"Basis\", w: \"130px\" }, { k: \"source\", label: \"Source\" }], tableRows(c, \"fin_history\"))}\u003c/div>`;\n  if (!rows.length) return `\u003cdiv class=\"bstrip\">\u003cspan>\u003cb>Financial history\u003c/b> \u003cspan class=\"faint\">No history yet: 3-5 years of revenue.\u003c/span>\u003c/span>\u003cspan class=\"sp\">\u003c/span>${btns}\u003c/div>`;\n  const rv = rows.map(r => num(r.revenue_usd_m));\n  const f = rows.findIndex((r, i) => rv[i]), l = rv.length - 1 - [...rv].reverse().findIndex(x => x);\n  const cagr = f >= 0 && l > f && rv[f] && rv[l] ? (Math.pow(rv[l] / rv[f], 1 / ((yearOf(rows[l].year) || l) - (yearOf(rows[f].year) || f) || 1)) - 1) * 100 : null;\n  const cell = (v, i, fn) => `\u003ctd class=\"r num\">${fn(v, i)}\u003c/td>`;\n  return `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Financial history\u003c/h2>${cagr !== null ? `\u003cspan class=\"pill\">Revenue CAGR ${cagr.toFixed(1)}%\u003c/span>` : \"\"}\u003cspan class=\"sp\">\u003c/span>${btns}\u003c/div>\n  \u003cdiv class=\"fhw\">\u003ctable class=\"fh\">\u003cthead>\u003ctr>\u003cth>\u003c/th>${rows.map(r => `\u003cth class=\"r\">${esc(String(r.year))}\u003c/th>`).join(\"\")}\u003c/tr>\u003c/thead>\u003ctbody>\n    \u003ctr>\u003cth>Revenue\u003c/th>${rv.map((v, i) => cell(v, i, x => fmtM(x))).join(\"\")}\u003c/tr>\n    \u003ctr>\u003cth>Growth\u003c/th>${rv.map((v, i) => cell(v, i, (x, j) => j && x && rv[j - 1] ? ((x / rv[j - 1] - 1) * 100).toFixed(1) + \"%\" : \"\u2014\")).join(\"\")}\u003c/tr>\n    \u003ctr class=\"faint\">\u003cth>Basis\u003c/th>${rows.map(r => `\u003ctd class=\"r\" style=\"font-size:12px\" title=\"${esc(r.source || \"\")}\">${esc(r.basis || \"\")}\u003c/td>`).join(\"\")}\u003c/tr>\n  \u003c/tbody>\u003c/table>\u003c/div>\u003c/div>`;\n}\nfunction viewPeople(c) {\n  const ppl = c.management || [], S = cst(c.id), W = writable && db;\n  const cards = ppl.map(p => `\u003cdiv class=\"panel person\">\u003cdiv class=\"who\">${esc(p.name || \"\")}\u003c/div>\u003cdiv class=\"muted\">${esc(p.title || \"\")}${p.since ? ` \u00b7 since ${esc(p.since)}` : \"\"}\u003c/div>${p.background ? `\u003cp style=\"margin:6px 0 0;font-size:13px\">${esc(p.background)}\u003c/p>` : \"\"}${p.linkedin ? `\u003ca style=\"font-size:12px\" href=\"${esc(p.linkedin)}\" target=\"_blank\" rel=\"noopener\">LinkedIn \u2197\u003c/a>` : \"\"}\u003c/div>`).join(\"\");\n  return `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Management\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">Leadership team and board chair.\u003c/span>\u003cspan class=\"sp\">\u003c/span>${canEnhance() ? `\u003cbutton class=\"btn sm enh\" data-act=\"mgmtfind\" ${S.busy ? \"disabled\" : \"\"}>${S.busy ? \"Working in chat\u2026\" : ppl.length ? \"Update management\" : \"Find management team\"}\u003c/button>` : \"\"}${W ? `\u003cbutton class=\"btn sm ghost\" data-act=\"addrow\" data-f=\"management\">Add person\u003c/button>` : \"\"}\u003c/div>\n    ${cards ? `\u003cdiv class=\"pgrid\">${cards}\u003c/div>` : `\u003cp class=\"faint\">No management on file yet.${canEnhance() ? \" Find the team from the company's site, press releases and LinkedIn, or add people by hand.\" : \"\"}\u003c/p>`}\u003c/div>\n  ${ppl.length ? `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Edit management\u003c/h2>\u003c/div>${editTable(c, \"management\", [{ k: \"name\", label: \"Name\", w: \"180px\" }, { k: \"title\", label: \"Title\", w: \"180px\" }, { k: \"since\", label: \"Since\", w: \"80px\" }, { k: \"background\", label: \"Background\" }, { k: \"linkedin\", label: \"LinkedIn\", link: false }], tableRows(c, \"management\"))}\u003c/div>` : \"\"}`;\n}\nfunction viewSegments(c) {\n  const segs = c.segment_profiles || [], S = cst(c.id);\n  const mx = Math.max(...segs.map(x => num(x.revenue_usd_m) || 0), 1);\n  const cards = segs.map(x => `\u003cdiv class=\"panel seg\">\u003cdiv class=\"sec-h\">\u003ch3>${esc(x.name || \"Segment\")}\u003c/h3>\u003cspan class=\"sp\">\u003c/span>\u003cspan class=\"num\">${fmtM(x.revenue_usd_m)}\u003c/span>\u003c/div>${num(x.revenue_usd_m) ? bar(num(x.revenue_usd_m), mx) : \"\"}${x.description ? `\u003cp style=\"margin:8px 0 6px\">${esc(x.description)}\u003c/p>` : \"\"}\u003cdl class=\"segdl\">${x.products ? `\u003cdt>Products\u003c/dt>\u003cdd>${esc(x.products)}\u003c/dd>` : \"\"}${x.end_markets ? `\u003cdt>End markets\u003c/dt>\u003cdd>${esc([].concat(x.end_markets).join(\", \"))}\u003c/dd>` : \"\"}${x.competitors ? `\u003cdt>Competitors\u003c/dt>\u003cdd>${esc([].concat(x.competitors).join(\", \"))}\u003c/dd>` : \"\"}\u003c/dl>\u003c/div>`).join(\"\");\n  return `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Segment profiles\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">A profile per reported business segment: most useful for public companies.\u003c/span>\u003cspan class=\"sp\">\u003c/span>${canEnhance() ? `\u003cbutton class=\"btn sm enh\" data-act=\"segbuild\" ${S.busy ? \"disabled\" : \"\"}>${S.busy ? \"Working in chat\u2026\" : segs.length ? \"Update segment profiles\" : \"Build segment profiles\"}\u003c/button>` : \"\"}${writable && db ? `\u003cbutton class=\"btn sm ghost\" data-act=\"addrow\" data-f=\"segment_profiles\">Add segment\u003c/button>` : \"\"}\u003c/div>\n    ${cards ? `\u003cdiv class=\"seggrid\">${cards}\u003c/div>` : `\u003cp class=\"faint\">No segment profiles yet. ${canEnhance() ? \"Build them from the company's filings and investor materials, or add one by hand.\" : \"\"}\u003c/p>`}\u003c/div>\n  ${segs.length ? `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Edit segments\u003c/h2>\u003c/div>${editTable(c, \"segment_profiles\", [{ k: \"name\", label: \"Segment\", w: \"180px\" }, { k: \"revenue_usd_m\", label: \"Rev $M\", t: \"num\", w: \"90px\" }, { k: \"products\", label: \"Products\" }, { k: \"end_markets\", label: \"End markets\" }, { k: \"competitors\", label: \"Competitors\" }, { k: \"description\", label: \"Description\" }], tableRows(c, \"segment_profiles\"))}\u003c/div>` : \"\"}`;\n}\nconst SEG_BRIEF = `SEGMENT PROFILES: build one profile per business segment this company reports (10-K/annual report segment note, investor presentations, earnings releases). For each: name exactly as reported, latest full-year revenue, the main products and brands, end markets, main competitors in that segment, and a one-line description. For private companies, use the segments they describe publicly, or skip if there are none. Save each with add_row / update_row to list \"segment_profiles\" (source \"web\" with the filing or release URL). Then summarise the segment mix in a few lines with links.`;\n/* ---------- precedent relevance: product, mix, sector, size and recency overlap ---------- */\nconst STOPW = new Set(\"the and of for to in with a an by on its from as at or inc llc ltd co company companies corp group holding holdings product products service services solution solutions chemical chemicals chemistry industrial industry specialty other various including include based north america american global business provider manufacturer maker supplier distributor leading line lines range brand brands market markets end use used\".split(\" \"));\nfunction kwSet(t) { return new Set(String(t || \"\").toLowerCase().replace(/[^a-z0-9 ]/g, \" \").split(/\\s+/).filter(w => w.length > 2 && !STOPW.has(w) && !/^\\d+$/.test(w)).map(w => w.replace(/ies$/, \"y\").replace(/([^s])s$/, \"$1\"))); }\nfunction profileKw(c) {\n  return memod(\"kw:\" + c.id, () => kwSet([c.what_it_is, c.business_model, c.primary_category,\n    ...catalog(c).map(p => [p.category, p.line, p.applications, [].concat(p.end_markets || []).join(\" \")].join(\" \")),\n    ...(c.revenue_by_business || []).map(x => [x.business, x.category].join(\" \")),\n    ...Object.keys(c[EM_FIELD] || {}), ...Object.keys(buckets(c) || {}), ...sectorsOf(c).map(x => sectorById(x.sector)?.name || \"\")].join(\" \")));\n}\nfunction precedentScore(c, d, ck) {\n  const tp = d.targetId ? companies.get(d.targetId) : findCompanyByName(d.target);\n  const ov = tp && tp.id !== c.id ? overlap(c, tp) / 100 : null;\n  const dk = new Set([...kwSet(d.what + \" \" + d.target), ...(tp ? profileKw(tp) : [])]);\n  const shared = [...dk].filter(w => ck.has(w));\n  const text = Math.min(1, shared.length / 5);\n  const ap = d.acquirerId ? companies.get(d.acquirerId) : null, ps = primarySector(c);\n  const sameSec = (tp && inSector(tp, ps)) || (ap && inSector(ap, ps)) || (d.water && ps === \"water\");\n  const yr = yearOf(d.date), now = new Date().getFullYear();\n  const rec = yr ? Math.max(0, 1 - (now - yr) / 15) : 0.3;\n  const crev = num(c.total_revenue_usd_m), size = d.rev && crev ? 1 - Math.min(1, Math.abs(Math.log(d.rev / crev)) / 3) : 0.3;\n  const hasVal = !!(d.value && d.rev);\n  const score = 100 * ((ov !== null ? 0.3 * ov + 0.3 * text : 0.55 * text + (0.05 * (shared.length > 0))) + 0.15 * (sameSec ? 1 : 0) + 0.12 * rec + 0.08 * size + 0.05 * (hasVal ? 1 : 0));\n  const own = d.acquirerId === c.id;\n  const why = [...(own ? [\"its own deal\"] : []), ...(ov !== null && ov > 0.15 ? [Math.round(ov * 100) + \"% mix overlap\"] : []), ...shared.slice(0, 4), ...(sameSec ? [\"same sector\"] : []), ...(d.rev && crev && size > 0.6 ? [\"similar size\"] : [])];\n  return { score: score - (own ? 12 : 0), why, tp };\n}\n/* ---------- sponsor profiles ---------- */\nconst sponsorDocs = new Map();\n// One key per firm, so \"The Carlyle Group\", \"Carlyle\" and \"Bain Capital Private Equity\" / \"Bain Capital\" land on the same page.\nconst spSlug = n => { let x = String(n || \"\").replace(/\\b(L\\.?P\\.?|LLC|Inc\\.?|Ltd\\.?)\\b\\.?/gi, \" \").replace(/^\\s*the\\s+/i, \"\").replace(/[,.]/g, \" \").trim(); let y; do { y = x; x = x.replace(/\\s+(private equity|global management|management|funds?|group|partners|investors|holdings|& co|fund [ivx]+|[ivx]+)\\s*$/i, \"\").trim(); } while (x !== y && x.split(/\\s+/).length > 1); return slugify(x); };\n// Split \"Bain Capital and Cinven\" or \"Platinum Equity; Bain Capital\" into firm names.\nconst splitFirms = str => String(str || \"\").replace(/\\([^)]*\\)/g, \" \").replace(/\\b(prior sponsor|previously|formerly|financing from|exited)\\b[^;]*/gi, \" \").split(/\\s*(?:;|\\+|\\/|,|\\band\\b|\\bwith\\b)\\s*/).map(x => x.replace(/\\b(L\\.?P\\.?|LLC|Inc\\.?|Ltd\\.?)\\b\\.?/gi, \"\").replace(/\\s+(majority|minority|lead|control|co-?investor).*$/i, \"\").replace(/\\s+/g, \" \").replace(/[,.\\s]+$/, \"\").trim()).filter(x => x.length > 2 && /^[A-Z0-9]/.test(x) && !SP_DROP.test(x) && !/\\d{4}|[$:]/.test(x) && !x.split(/\\s+/).slice(1).some(w => /^[a-z]/.test(w) && !/^(of|and|de|la|du|the|&)$/.test(w)));\n// A name that only shows up as a buyer in the deal book counts as a firm when it reads like one.\nconst FIRMISH = /capital|partners|equity|invest|fund|holdings|advisors|associates|ventures|infrastructure|private/i;\n// Every firm a company names as owner: the lead sponsor first, then co-investors.\nconst SP_DROP = /\\b(prior|previously|formerly|financing|family|founder|management team|via|from|exited|continuation|operating)\\b/i;\n// An add-on is owned through one of the sponsor's platforms (\"Gryphon Investors (via Vessco Water)\"). It is not a holding of the firm.\nfunction addonOf(c) {\n  if (c.addon_of) return String(c.addon_of);\n  const m = String(c.pe_sponsor || \"\").match(/\\bvia\\s+([^;),]+)/i) || String(c.ultimate_parent || \"\").match(/\\bvia\\s+([^;),]+)/i);\n  return m ? m[1].replace(/,?\\s*(acquired|since|majority|minority)\\b.*$/i, \"\").trim() : \"\";\n}\nconst isHolding = c => isPE(c) && !addonOf(c);\nfunction sponsorsOf(c) {\n  return memod(\"spo:\" + c.id, () => {\n    // Fall back to the parent only when it isn't the company itself (or its own parent brand).\n    const par = String(c.ultimate_parent || \"\"), self = norm(c.name).split(\" \")[0];\n    const raw = String(c.pe_sponsor || (isPE(c) && par && !norm(par).startsWith(self) ? par : \"\") || \"\");\n    if (/^venture/i.test(raw)) return [];\n    const out = []; for (const seg of splitFirms(raw)) if (!out.some(x => spSlug(x) === spSlug(seg))) out.push(seg);\n    return out;\n  });\n}\n// One entry per firm across every vertical: companies it owns (lead or co-investor), plus firms named only in the deal book or saved by hand.\nfunction spIndex() {\n  return memod(\"spidx\", () => {\n    const m = new Map(), get = (n, k = spSlug(n)) => { if (!k) return null; if (!m.has(k)) m.set(k, { slug: k, name: n, cos: [], deals: 0 }); const e = m.get(k); if (n.length \u003c e.name.length && !e.doc) e.name = n; return e; };\n    for (const c of allList()) if (isPE(c)) sponsorsOf(c).forEach((n, i) => { const e = get(n); if (!e) return; if (addonOf(c)) (e.addons || (e.addons = [])).push({ c, platform: addonOf(c) }); else e.cos.push({ c, lead: i === 0 }); });\n    for (const d of allDealsRaw()) if (/Sponsor entry/i.test(d.type || \"\") || /^Sponsor$/i.test(d.btype || \"\")) for (const n of splitFirms(d.acquirer)) { if (!m.has(spSlug(n)) && !FIRMISH.test(n)) continue; const e = get(n); if (e) e.deals++; }\n    for (const [k, v] of sponsorDocs) { const e = get(v.name || k, k); if (v.name) e.name = v.name; e.doc = v; }\n    return m;\n  });\n}\nasync function ensureSponsorDocs(c) {\n  if (!db || !writable || !c || !isPE(c)) return;\n  for (const n of sponsorsOf(c)) { const k = spSlug(n); if (k && !sponsorDocs.has(k)) await db.doc(\"sponsors/\" + k).set({ name: n, created_at: now(), added_by: \"Auto (portfolio company)\" }); }\n}\nfunction knownSponsors() { return memod(\"sponsors\", () => new Map([...spIndex()].map(([k, e]) => [k, e.name]))); }\n// The fund a sponsor invested out of, when known (lead sponsor first).\nconst fundOf = c => (c.sponsor_stakes || []).find(x => x.fund_name)?.fund_name.replace(/^Bain Capital /, \"Bain \") || \"\";\nconst spRag = doc => { const d = daysSince(doc?.last_contact); return d === null ? { k: \"r9\", l: \"No contact logged\", d } : d \u003c= 30 ? { k: \"g\", l: \"Green\", d } : d \u003c= 60 ? { k: \"y\", l: \"Yellow\", d } : d \u003c= 90 ? { k: \"r\", l: \"Red\", d } : { k: \"r9\", l: \"Red (90+)\", d }; };\nconst groupChips = cos => { const n = new Map(); for (const { c } of cos) { const g = groupOf(c); n.set(g, (n.get(g) || 0) + 1); } return [...n].sort((a, b) => b[1] - a[1]).map(([g, k]) => `\u003cspan class=\"pill\" title=\"${esc(wsPath(g))}\">${esc(groupByKey(g)?.name || g)}${k > 1 ? \" \" + k : \"\"}\u003c/span>`).join(\" \"); };\n\n/* ---------- private equity: a directory of every firm, across all verticals ---------- */\n// What kind of firm this is for us: leads deals, only co-invests, or only appears in the deal book.\nconst spRole = e => (e.doc?.portfolio?.length || e.cos.some(x => x.lead)) ? \"lead\" : e.cos.length ? \"co\" : \"deals\";\nfunction viewPE() {\n  const all = [...spIndex().values()];\n  const q = norm(ui.peq || \"\"), f = ui.pef ?? \"lead\";\n  const stat = e => { const H = spHoldings(e.s ..ys) - 1, hi = Math.max(new Date().getFullYear() + 3, Math.max(...ys) + 6), span = hi - lo, x = y => ((y - lo) / span * 100).toFixed(2), now = new Date().getFullYear() + new Date().getMonth() / 12;\n  return `\u003cdiv class=\"panel sptl\">\u003cdiv class=\"sptl-ax\">${Array.from({ length: span + 1 }, (_, i) => lo + i).filter(y => y % 2 === 0).map(y => `\u003cspan style=\"left:${x(y)}%\">${y}\u003c/span>`).join(\"\")}\u003ci class=\"now\" style=\"left:${x(now)}%\" title=\"Today\">\u003c/i>\u003c/div>${funds.filter(f => f.vintage).map(f => `\u003cdiv class=\"sptl-row\">\u003cspan class=\"sptl-l\">${esc(f.name.replace(/^Bain Capital /, \"\"))}\u003c/span>\u003cspan class=\"sptl-t\">\u003cb class=\"${/fundrais/i.test(f.status) ? \"fr\" : /harvest|fully|late/i.test(f.status) ? \"hv\" : \"\"}\" style=\"left:${x(+f.vintage)}%;width:${(5 / span * 100).toFixed(2)}%\" title=\"${esc(f.name)}: ${esc(f.status)} \u00b7 investment period ~${f.vintage}-${+f.vintage + 5}\">\u003c/b>\u003c/span>\u003c/div>`).join(\"\")}\u003cp class=\"faint\" style=\"font-size:11px;margin:8px 0 0\">Bars show a ~5-year investment period from vintage. Dark = harvesting, accent = fundraising. Today is the vertical line.\u003c/p>\u003c/div>`;\n}\nfunction spTab(tab, x) {\n  const { slug, doc, H, funds, deals, cand, coLink, W, yr } = x;\n  const fr = doc.fundraising || {};\n  const clock = (fr.last_final_close || fr.in_market || fr.next_flagship) ? `\u003cdiv class=\"hgrid spclock\">\u003csection class=\"hcard\">\u003cdiv class=\"eyebrow\">Last fundraise\u003c/div>\u003cp>${esc(fr.last_final_close || \"\u2014\")}\u003c/p>\u003c/section>\u003csection class=\"hcard\">\u003cdiv class=\"eyebrow\">In market now\u003c/div>\u003cp>${esc(fr.in_market || \"Nothing reported\")}\u003c/p>\u003c/section>\u003csection class=\"hcard\">\u003cdiv class=\"eyebrow\">Next flagship\u003c/div>\u003cp>${esc(fr.next_flagship || \"\u2014\")}\u003c/p>\u003c/section>\u003c/div>` : \"\";\n  const byGroup = new Map(); for (const h udes(k))));\n    keep.sources = [].concat(r?.sources || []).map(String).filter(u => seen.has(u) || /^https?:/.test(u)).slice(0, 12);\n    await db.doc(\"sponsors/\" + slug).set(clean({ ...(sponsorDocs.get(slug) || {}), ...keep, name: sponsorDocs.get(slug)?.name || keep.name || name, researched_at: now(), error: \"\" }));\n    toast(\"Sponsor profile updated\");\n  } catch (e) {\n    await db.doc(\"sponsors/\" + slug).set(clean({ ...(sponsorDocs.get(slug) || {}), name, error: \"Research didn't finish\" + (e?.code ? \" (\" + e.code + \")\" : \"\") + \". Try again.\" })).catch(() => {});\n  } finally { delete spBusy[slug]; render(); }\n}\nfunction viewDeal(id) {\n  const d = dealbook.get(id);\n  if (!d) return `\u003cdiv class=\"crumb\">\u003ca href=\"#precedents\">Precedents\u003c/a>\u003c/div>\u003cdiv class=\"panel empty-hero\">\u003ch2>No deal record \u201c${esc(id)}\u201d\u003c/h2>\u003cp class=\"muted\">It may have been deleted or merged.\u003c/p>\u003c/div>`;\n  const W = writable && db;\n  const f = (k, lab, t = \"text\", ph = \"\") => `\u003clabel>${lab}\u003cinput data-deal=\"${esc(k)}\" ${t === \"num\" ? 'inputmode=\"decimal\"' : \"\"} value=\"${esc(d[k] ?? \"\")}\" placeholder=\"${esc(ph)}\" ${W ? \"\" : \"disabled\"}>\u003c/label>`;\n  const sel = (k, lab, opts) => `\u003clabel>${lab}\u003cselect data-deal=\"${esc(k)}\" ${W ? \"\" : \"disabled\"}>\u003coption value=\"\">\u003c/option>${opts.map(o => `\u003coption ${d[k] === o ? \"selected\" : \"\"}>${esc(o)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>`;\n  const ev = num(d.ev_usd_m), rev = num(d.revenue_usd_m);\n  const tgt = d.target_id && getC(d.target_id), acq = d.acquirer_id && getC(d.acquirer_id);\n  return `\u003cdiv class=\"crumb\">\u003ca href=\"#precedents\">Precedents\u003c/a> / Deal\u003c/div>\n  \u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">${esc([d.status, d.deal_type, d.buyer_type].filter(Boolean).join(\" \u00b7 \"))}\u003c/div>\u003ch1 style=\"font-size:40px\">$ el class=\"wide\">What it added to the buyer\u003cinput data-deal=\"what_it_added\" value=\"${esc(d.what_it_added || \"\")}\" ${W ? \"\" : \"disabled\"}>\u003c/label>\n    \u003clabel class=\"wide\">Notes\u003cinput data-deal=\"notes\" value=\"${esc(d.notes || \"\")}\" ${W ? \"\" : \"disabled\"}>\u003c/label>\u003c/div>\n    ${W ? `\u003cdiv class=\"add\" style=\"margin-top:12px\">\u003cbutton class=\"btn primary\" type=\"submit\">Save deal\u003c/button>\u003ca class=\"btn ghost\" href=\"#precedents${d.target_id ? \"~\" + encodeURIComponent(d.target_id) : \"\"}\">${d.target_id ? \"Precedents for this target\" : \"Back to precedents\"}\u003c/a>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"btn danger\" type=\"button\" data-act=\"dealdel\">Delete deal\u003c/button>\u003c/div>` : \"\"}\n  \u003c/form>\n  \u003cp class=\"faint\" style=\"font-size:12px;margin-top:10px\">Record ${esc(d.id)} \u00b7 from ${esc((d.origin || [\"added here\"]).join(\"; \"))}${d.updated_at ? \" \u00b7 updated \" + fmtDate(d.updated_at) : \"\"}${d.edited ? \" \u00b7 edited by hand (company M&A tabs won't overwrite it)\" : \"\"}\u003c/p>`;\n}\n/* ---------- home ---------- */\n// One search box for companies, sponsors and deals.\nfunction searchAll(q) {\n  q = norm(q); if (q.length \u003c 2) return null;\n  const hit = t => { const n = norm(t); return n.startsWith(q) || n.includes(\" \" + q) || (q.length >= 5 && n.includes(q)); };\n  const cos = list().filter(c => hit(c.name) || hit(c.platform_name)).sort((a, b) => (norm(a.name).startsWith(q) ? 0 : 1) - (norm(b.name).startsWith(q) ? 0 : 1) || (num(b.total_revenue_usd_m) || 0) - (num(a.total_revenue_usd_m) || 0)).slice(0, 6);\n  if (cos.length \u003c 6) cos.push(...allList().filter(c => !inWs(c) && (hit(c.name) || hit(c.platform_name))).slice(0, 6 - cos.length));\n  const sps = [...knownSponsors()].filter(([, n]) => hit(n)).slice(0, 4);\n  const ds = wsDealRecs().filter(d => hit(d.target) || hit(d.acquirer)).sort((a, b) => dateKey(b.date) - dateKey(a.date)).slice(0, 5);\n  return { cos, sps, ds };\n}\nfunction homeSearch() {\n  const r = searchAll(ui.hq || \"\");\n  const res = r ? (r.cos.length + r.sps.length + r.ds.length ? `\u003cdiv class=\"hres\">\n    ${r.cos.length ? `\u003cdiv class=\"hgrp\">Companies\u003c/div>${r.cos.map(c => `\u003ca class=\"hrow\" href=\"#c.${esc(c.id)}\">${logoBadge(c)}\u003cspan>\u003cb>${esc(c.name)}\u003c/b>\u003csmall>${esc([isPE(c) ? \"PE \u00b7 \" + sponsorOf(c) : c.owner_type, sectorShort(primarySector(c)), inWs(c) ? \"\" : \"In \" + (groupByKey(groupOf(c))?.name || \"another vertical\")].filter(Boolean).join(\" \u00b7 \"))}\u003c/small>\u003c/span>\u003cspan class=\"num faint\">${fmtM(c.total_revenue_usd_m)}\u003c/span>\u003c/a>`).join(\"\")}` : \"\"}\n    ${r.sps.length ? `\u003cdiv class=\"hgrp\">Sponsors\u003c/div>${r.sps.map(([k, n]) => `\u003ca class=\"hrow\" href=\"#s.${esc(k)}\">\u003cspan class=\"ib\">${esc(initials(n))}\u003c/span>\u003cspan>\u003cb>${esc(n)}\u003c/b>\u003csmall>Sponsor profile\u003c/small>\u003c/span>\u003c/a>`).join(\"\")}` : \"\"}\n    ${r.ds.length ? `\u003cdiv class=\"hgrp\">Deals\u003c/div>${r.ds.map(d => `\u003ca class=\"hrow\" href=\"#d.${esc(d.id)}\">\u003cspan class=\"ib deal\">M&amp;A\u003c/span>\u003cspan>\u003cb>${esc(d.target)}\u003c/b>\u003csmall>${esc([d.acquirer, String(d.date || \"\").slice(0, 7)].filter(Boolean).join(\" \u00b7 \"))}\u003c/small>\u003c/span>\u003cspan class=\"num faint\">${fmtM(num(d.ev_usd_m))}\u003c/span>\u003c/a>`).join(\"\")}` : \"\"}\n  \u003c/div>` : `\u003cdiv class=\"hres\">\u003cdiv class=\"faint\" style=\"padding:10px 12px\">Nothing matches \u201c${esc(ui.hq)}\u201d.\u003c/div>\u003c/div>`) : \"\";\n  return `\u003cdiv class=\"hsearch\">\u003cinput id=\"hq\" class=\"search\" type=\"search\" placeholder=\"Search companies, sponsors and deals\u2026\" value=\"${esc(ui.hq || \"\")}\" autocomplete=\"off\" aria-label=\"Search everything\">${res}\u003c/div>`;\n}\nconst initials = n => String(n || \"?\").replace(/\\(.*?\\)/g, \"\").split(/\\s+/).filter(w => /^[A-Za-z0-9]/.test(w) && !/^(inc|llc|the|of|and|&)$/i.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join(\"\") || \"?\";\nconst logoBadge = (c, size = \"\") => logos.get(c.id) ? `\u003cimg class=\"logo sm ${size === \"sm\" ? \"xs\" : \"\"}\" src=\"${esc(logos.get(c.id))}\" alt=\"\">` : `\u003cspan class=\"ib ${size}\">${esc(initials(c.name))}\u003c/span>`;\nfunction viewHome() {\n  const all = list(), pe = all.filter(isHolding), im = all.filter(inMarket);\n  const deals = wsDealRecs().filter(d => yearOf(d.date)).sort((a, b) => dateKey(b.date) - dateKey(a.date)).slice(0, 8);\n  const longHolds = pe.filter(c => (holdYears(c) || 0) >= 5).sort((a, b) => (holdYears(b) || 0) - (holdYears(a) || 0) || (num(b.total_revenue_usd_m) || 0) - (num(a.total_revenue_usd_m) || 0)).slice(0, 8);\n  // \"Recently updated\" skips the bulk-import timestamp that most profiles share.\n  const stamps = new Map(); for (const c of all) stamps.set(c.updated_at, (stamps.get(c.updated_at) || 0) + 1);\n  const bulk = [...stamps].sort((a, b) => b[1] - a[1])[0]?.[0];\n  const recent = all.filter(c => c.updated_at && c.updated_at !== bulk).sort((a, b) => String(b.updated_at).localeCompare(String(a.updated_at))).slice(0, 8);\n  const secs = wsSectors().map(x => ({ x, n: all.filter(c => inSector(c, x.id)).length, tam: tamValue(tams[x.id] || {}) })).filter(r => r.n).sort((a, b) => b.n - a.n).slice(0, 8);\n  const card = (title, href, rows, empty) => `\u003csection class=\"hcard\">\u003cdiv class=\"hcard-h\">\u003ch2>${title}\u003c/h2>${href ? `\u003ca href=\"${href}\">See all\u003c/a>` : \"\"}\u003c/div>${rows || `\u003cp class=\"faint\" style=\"margin:6px 0\">${empty}\u003c/p>`}\u003c/section>`;\n  const coRow = (c, right, sub) => `\u003ca class=\"hrow\" href=\"#c.${esc(c.id)}\">${logoBadge(c)}\u003cspan>\u003cb>${esc(c.name)}\u003c/b>\u003csmall>${esc(sub)}\u003c/small>\u003c/span>\u003cspan class=\"num\">${right}\u003c/span>\u003c/a>`;\n  return `\u003cdiv class=\"home\">\n  \u003cdiv class=\"hhero\">\u003ch1>CRM\u003c/h1>\u003cp>${esc(wsPath())}: companies, deals and sponsors for M&amp;A work.\u003c/p>${homeSearch()}\u003c/div>\n  \u003cdiv class=\"hstats\">\n    \u003ca href=\"#companies\">\u003cb>${all.length}\u003c/b>\u003cspan>Companies\u003c/span>\u003c/a>\n    \u003ca href=\"#precedents\">\u003cb>${allDeals().length}\u003c/b>\u003cspan>Deals\u003c/span>\u003c/a>\n    \u003ca href=\"#sponsors\">\u003cb>${pe.length}\u003c/b>\u003cspan>PE-owned\u003c/span>\u003c/a>\n    \u003ca href=\"#inmarket\">\u003cb>${im.length}\u003c/b>\u003cspan>In market\u003c/span>\u003c/a>\n    \u003ca href=\"#sponsors\">\u003cb>${pe.filter(c => (holdYears(c) || 0) >= 5).length}\u003c/b>\u003cspan>Held 5+ years\u003c/span>\u003c/a>\n  \u003c/div>\n  \u003cdiv class=\"hgrid\">\n    ${card(\"Campaign: follow up\", \"#campaign\", all.filter(onCampaign).sort((a, b) => (rag(b).d ?? 1e9) - (rag(a).d ?? 1e9)).slice(0, 6).map(c => coRow(c, `\u003cspan class=\"ragdot ${rag(c).k}\">\u003c/span> ${rag(c).d === null ? \"never\" : rag(c).d + \"d\"}`, `Exit ${c.ctw.exit_timing || \"?\"} \u00b7 fee ${c.ctw.est_fee_usd_m ? fmtM(c.ctw.est_fee_usd_m) : \"\u2014\"}`)).join(\"\"), \"No companies on the campaign list yet.\")}\n    ${card(\"In market\", \"#inmarket\", im.slice(0, 6).map(c => coRow(c, esc(c.in_market.stage.split(\" /\")[0]), [c.in_market.seller, c.in_market.advisor].filter(Boolean).join(\" \u00b7 advised by \"))).join(\"\"), \"Nothing marked in market. Open a company and click \u201cMark in market\u201d.\")}\n    ${card(\"Likely sellers\", \"#sponsors\", longHolds.map(c => coRow(c, `${holdYears(c)} yrs`, `${sponsorOf(c)} since ${entryYear(c)} \u00b7 revenue ${fmtM(c.total_revenue_usd_m)}`)).join(\"\"), \"No PE holds of five years or more.\")}\n    ${card(\"Latest deals\", \"#precedents\", deals.map(d => `\u003ca class=\"hrow\" href=\"#d.${esc(d.id)}\">\u003cspan class=\"ib deal\">M&amp;A\u003c/span>\u003cspan>\u003cb>${esc(d.target)}\u003c/b>\u003csmall>${esc([d.acquirer, String(d.date || \"\").slice(0, 7)].filter(Boolean).join(\" \u00b7 \"))}\u003c/small>\u003c/span>\u003cspan class=\"num\">${num(d.ev_usd_m) ? fmtM(d.ev_usd_m) : \"\"}\u003c/span>\u003c/a>`).join(\"\"), \"No deals yet.\")}\n    ${card(\"Recently updated\", \"#companies\", recent.map(c => coRow(c, fmtM(c.total_revenue_usd_m), `Updated ${fmtDate(c.updated_at)}`)).join(\"\"), \"No recent updates.\")}\n  \u003c/div>\n  \u003csection class=\"hcard\">\u003cdiv class=\"hcard-h\">\u003ch2>Sectors\u003c/h2>\u003ca href=\"#sectors\">All sectors\u003c/a>\u003c/div>\u003cdiv class=\"hsecs\">${secs.map(r => `\u003ca href=\"#companies\" data-setsector=\"${esc(r.x.id)}\">\u003cb>${esc(r.x.name)}\u003c/b>\u003csmall>${r.n} companies${r.tam ? \" \u00b7 TAM \" + fmtM(r.tam) : \"\"}\u003c/small>\u003c/a>`).join(\"\")}\u003c/div>\u003c/section>\n  \u003cdiv class=\"hlinks\">\u003ca href=\"#precedents\">\u003cb>Precedents\u003c/b>\u003csmall>Deals ranked for any company\u003c/small>\u003c/a>\u003ca href=\"#targets\">\u003cb>Buyer finder\u003c/b>\u003csmall>Who would buy a company\u003c/small>\u003c/a>\u003ca href=\"#sponsors\">\u003cb>PE owned\u003c/b>\u003csmall>By entry year and sponsor\u003c/small>\u003c/a>\u003ca href=\"#tam\">\u003cb>Market size\u003c/b>\u003csmall>TAM by sector\u003c/small>\u003c/a>\u003c/div>\n  \u003c/div>`;\n}\n/* ---------- campaign to win ---------- */\nconst onCampaign = c => !!(c.ctw && c.ctw.on);\nconst daysSince = d => { const t = Date.parse(d); return isNaN(t) ? null : Math.max(0, Math.floor((Date.now() - t) / 864e5)); };\n// Green: spoke in the last 30 days. Yellow: 31-60. Red: 61-90. Red with a ring: over 90, or never logged.\nconst rag = c => { const d = daysSince(c.ctw?.last_contact); return d === null ? { k: \"r9\", l: \"No contact logged\", d } : d \u003c= 30 ? { k: \"g\", l: \"Green\", d } : d \u003c= 60 ? { k: \"y\", l: \"Yellow\", d } : d \u003c= 90 ? { k: \"r\", l: \"Red\", d } : { k: \"r9\", l: \"Red (90+)\", d }; };\nconst EXIT_OPTS = (() => { const y = new Date().getFullYear(); const o = []; for (let i = 0; i \u003c 4; i++) for (const h of [\"H1\", \"H2\"]) o.push(`${h} ${y + i}`); o.push(\"2030+\", \"Unknown\"); return o; })();\nconst todayISO = () => new Date().toISOString().slice(0, 10);\nfunction campaignPanel(c) {\n  const m = c.ctw || {}, editing = ui.ctwEdit === c.id, W = writable && db;\n  if (!editing) {\n    if (!onCampaign(c)) return \"\";\n    const g = rag(c);\n    return `\u003cdiv class=\"run ctwbar\" role=\"status\">\u003cspan class=\"ragdot ${g.k}\" title=\"${esc(g.l)}\">\u003c/span>\u003cspan>\u003cb>Campaign to win\u003c/b> \u00b7 exit ${esc(m.exit_timing || \"timing unknown\")} \u00b7 est. fee ${m.est_fee_usd_m ? fmtM(m.est_fee_usd_m) : \"\u2014\"} \u00b7 last contact ${m.last_contact ? `${esc(m.last_contact)} (${g.d} days ago)` : \"never logged\"}${m.contact ? \" with \" + esc(m.contact) : \"\"}${m.notes ? `\u003cdiv class=\"faint\" style=\"font-size:12px;margin-top:2px\">${esc(m.notes)}\u003c/div>` : \"\"}\u003c/span>\u003cspan class=\"sp\">\u003c/span>${W ? `\u003cbutton class=\"btn sm\" data-act=\"ctwlog\">Log contact today\u003c/button>\u003cbutton class=\"btn sm ghost\" data-act=\"ctwedit\">Edit\u003c/button>` : \"\"}\u003ca class=\"btn sm ghost\" href=\"#campaign\">Campaign list\u003c/a>\u003c/div>`;\n  }\n  return `\u003cform class=\"panel imform\" id=\"ctwForm\">\u003cdiv class=\"sec-h\">\u003ch2>Campaign to win\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003cbutton type=\"button\" class=\"btn sm ghost\" data-act=\"ctwcancel\">Cancel\u003c/button>\u003c/div>\n    \u003cdiv class=\"imgrid\">\u003clabel>Estimated exit timing\u003cselect id=\"ctwExit\">${EXIT_OPTS.map(o => `\u003coption ${o === (m.exit_timing || \"\") ? \"selected\" : \"\"}>${o}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n    \u003clabel>Estimated fee ($M)\u003cinput id=\"ctwFee\" inputmode=\"decimal\" value=\"${esc(m.est_fee_usd_m ?? \"\")}\" placeholder=\"e.g. 6.5\">\u003c/label>\n    \u003clabel>Last contact\u003cinput id=\"ctwLast\" type=\"date\" value=\"${esc(m.last_contact || todayISO())}\">\u003c/label>\n    \u003clabel>Who we spoke to\u003cinput id=\"ctwWho\" value=\"${esc(m.contact || \"\")}\" placeholder=\"e.g. CEO, deal partner at the sponsor\">\u003c/label>\n    \u003clabel>Relationship lead\u003cinput id=\"ctwLead\" value=\"${esc(m.lead || \"\")}\" placeholder=\"Banker who owns it\">\u003c/label>\n    \u003clabel>Next step\u003cinput id=\"ctwNext\" value=\"${esc(m.next_step || \"\")}\" placeholder=\"e.g. Send buyer universe by Oct 15\">\u003c/label>\n    \u003clabel class=\"wide\">Notes\u003cinput id=\"ctwNotes\" value=\"${esc(m.notes || \"\")}\" placeholder=\"What we know about their exit plans\">\u003c/label>\u003c/div>\n    \u003cdiv class=\"add\" style=\"margin-top:10px\">\u003cbutton class=\"btn primary\" type=\"submit\">Save\u003c/button>${onCampaign(c) ? `\u003cbutton type=\"button\" class=\"btn danger\" data-act=\"ctwremove\">Take off the campaign list\u003c/button>` : \"\"}\u003c/div>\u003c/form>`;\n}\nfunction viewCampaign() {\n  const f = ui.ctwFilter || \"\";\n  const all = list().filter(onCampaign);\n  const rows = all.filter(c => !f || rag(c).k === f).sort((a, b) => (rag(b).d ?? 1e9) - (rag(a).d ?? 1e9));\n  const cnt = k => all.filter(c => rag(c).k === k).length;\n  const fees = all.reduce((t, c) => t + (num(c.ctw.est_fee_usd_m) || 0), 0);\n  const byYear = {}; for (const c of all) { const y = (String(c.ctw.exit_timing || \"\").match(/\\d{4}/) || [\"Unknown\"])[0]; byYear[y] = (byYear[y] || 0) + (num(c.ctw.est_fee_usd_m) || 0); }\n  const chip = (k, lab, n) => `\u003cbutton class=\"ragchip ${f === k ? \"on\" : \"\"}\" data-ctwf=\"${k}\">\u003cspan class=\"ragdot ${k || \"all\"}\">\u003c/span>${lab} \u003cb>${n}\u003c/b>\u003c/button>`;\n  const demo = all.filter(c => c.demo).length;\n  return `\u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">Coverage\u003c/div>\u0 rEach(k => cnt.set(k, (cnt.get(k) || 0) + 1))); [...cnt.entries()].sort((a, b) => b[1] - a[1]).forEach(([k]) => names.add(k)); }\n  if (!names.size) GENERIC_EM.forEach(n => names.add(n));\n  if (!names.has(ui.em)) ui.em = [...names][0];\n  const opts = [...names].map(n => `\u003coption ${n === ui.em ? \"selected\" : \"\"}>${esc(n)}\u003c/option>`).join(\"\");\n  const rows = pool.map(c => { const p = num((broad ? buckets(c) : (c[EM_FIELD] || {}))[ui.em]) || 0; const rev = num(broad ? c.us_water_treatment_revenue_usd_m : c.total_revenue_usd_m); return { c, p, d: rev !== null ? rev * p / 100 : null }; }).filter(r => r.p > 0);\n  const key = ui.emMode === \"pct\" ? \"p\" : \"d\";\n  rows.sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1));\n  const max = Math.max(...rows.map(r => r[key] || 0), 1);\n  const total = rows.reduce((s, r) => s + (r.d || 0), 0);\n  const top = rows.slice(0, 60);\n  const bars = rows.length ? top.map((r, i) => `\u003cdiv class=\"brow\" data-open=\"${esc(r.c.id)}\" data-tip=\"${esc(r.c.name)}: ${fmtPct(r.p)} of ${broad ? \"US water revenue\" : \"platform revenue\"} \u00b7 ${fmtM(r.d)}\">\u003cspan class=\"rk\">${i + 1}\u003c/span>\u003cspan class=\"nm\">${esc(r.c.name)}\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"width:${((r[key] || 0) / max * 100).toFixed(1)}%\">\u003c/div>\u003c/div>\u003cspan class=\"v\">${key === \"p\" ? fmtPct(r.p) : fmtM(r.d)}\u003c/span>\u003c/div>`).join(\"\")\n    : `\u003cp class=\"faint\" style=\"padding:16px\">No profiled company has exposure to ${esc(ui.em)} yet.\u003c/p>`;\n  return `\u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">${esc(sid ? sectorById(sid)?.name : \"All sectors\")} \u00b7 Exposure screen\u003c/div>\u003ch1>End markets\u003c/h1>\u003cp>Pick an end market to rank companies by how much of their revenue comes from it, as a share or in dollars. The list shows the end markets companies in this sector report. ${waterish ? \"For water, Broad uses the water index's ...by.values()];\n});\nconst firmCell = h => `${firmLink(h.slug, h.firm)}${h.co?.length ? `\u003csmall>with ${h.co.map(x => esc(x.firm)).join(\", \")}\u003c/small>` : \"\"}`;\nconst allSpFunds = () => memod(\"allspf\", () => [...sponsorDocs].flatMap(([slug, d]) => (d.funds || []).map(f => ({ ...f, firm: d.name || slug, slug }))));\nconst firmLink = (slug, name) => `\u003ca href=\"#s.${esc(slug)}\">${esc(name)}\u003c/a>`;\nconst peHead = (eyebrow, title, sub, extra = \"\") => `\u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">${eyebrow}\u003c/div>\u003ch1>${title}\u003c/h1>\u003cp>${sub}\u003c/p>\u003c/div>${extra}\u003c/div>`;\nfunction viewPEMod(sub) {\n  if (sub === \"firms\") return viewPE();\n  if (sub === \"funds\" || sub === \"fundraising\") return viewPEFunds(sub);\n  if (sub === \"portfolio\") return viewPEPortfolio();\n  if (sub === \"exits\") return viewPEExits();\n  if (sub === \"people\") return viewPEPeople();\n  if (sub === \"coverage\") return viewPECoverage();\n  return viewPEHome();\n}\nfunction viewPEHome() {\n  const firms = [...spIndex().values()], H = allSpHoldings(), F = allSpFunds(), yr = new Date().getFullYear();\n  const dry = F.reduce((t, f) => t + (num(f.dry_powder_usd_bn_est) || 0), 0);\n  const raising = F.filter(f => /fundrais/i.test(f.status || \"\"));\n  const closed = F.filter(f => f.final_close && dateKey(f.final_close) >= dateKey((yr - 1) + \"-01\")).sort((a, b) => dateKey(b.final_close) - dateKey(a.final_close));\n  const ex = H.map(h => ({ h, ...exitCase(h) })).filter(x => x.s >= 3).sort((a, b) => b.s - a.s || (b.h.hold || 0) - (a.h.hold || 0));\n  const newP = H.filter(h => h.year >= yr - 1).sort((a, b) => b.year - a.year);\n  const due = firms.map(e => ({ e, g: spRag(e.doc) })).filter(x => spRole(x.e) === \"lead\").sort((a, b) => (b.g.d ?? 1e9) - (a.g.d ?? 1e9) || spHoldings(b.e.slug).length - spHoldings(a.e.slug).length);\n  const card = (title, href, rows, empty) => `\u003csection class=\"hcard\">\u003cdiv class=\"hcard-h\">\u003ch2>${title}\u003c/h2>${href ? `\u003ca href=\"${href}\">See all\u003c/a>` : \"\"}\u003c/div>${rows || `\u003cp class=\"faint\" style=\"margin:6px 0\">${empty}\u003c/p>`}\u003c/section>`;\n  const hRow = (h, right, sub) => `\u003ca class=\"hrow\" href=\"${h.c ? \"#c.\" + esc(h.c.id) : \"#s.\" + esc(h.slug) + \".portfolio\"}\">\u003cspan class=\"ib\">${esc(initials(h.company))}\u003c/span>\u003cspan>\u003cb>${esc(h.company)}\u003c/b>\u003csmall>${esc(sub)}\u003c/small>\u003c/span>\u003cspan class=\"num\">${right}\u003c/span>\u003c/a>`;\n  return `\u003cdiv class=\"home\">\n  \u003cdiv class=\"hhero\">\u003ch1>Private equity\u003c/h1>\u003cp>Sponsors, their funds, holdings and exits, across every industry in the CRM.\u003c/p>\n    \u003cdiv class=\"hsearch\">\u003cinput id=\"peq\" class=\"search\" type=\"search\" placeholder=\"Search firms, holdings or people\u2026\" value=\"${esc(ui.peq || \"\")}\" autocomplete=\"off\" aria-label=\"Search private equity\">${peSearch()}\u003c/div>\u003c/div>\n  \u003cdiv class=\"hstats\">\n    \u003ca href=\"#pe~firms\">\u003cb>${firms.length}\u003c/b>\u003cspan>Firms\u003c/span>\u003c/a>\n    \u003ca href=\"#pe~portfolio\">\u003cb>${H.length}\u003c/b>\u003cspan>Holdings\u003c/span>\u003c/a>\n    \u003ca href=\"#pe~funds\">\u003cb>${F.length}\u003c/b>\u003cspan>Funds tracked\u003c/span>\u003c/a>\n    \u003ca href=\"#pe~funds\">\u003cb>${dry ? \"~\" + fmtBn(dry) : \"\u2014\"}\u003c/b>\u003cspan>Dry powder (est.)\u003c/span>\u003c/a>\n    \u003ca href=\"#pe~exits\">\u003cb>${ex.length}\u003c/b>\u003cspan>Exit candidates\u003c/span>\u003c/a>\n  \u003c/div>\n  \u003cdiv class=\"hgrid\">\n    ${card(\"Coverage: who to call\", \"#pe~coverage\", due.slice(0, 6).map(({ e, g }) => `\u003ca class=\"hrow\" href=\"#s.${esc(e.slug)}\">\u003cspan class=\"ib\">${esc(initials(e.name))}\u003c/span>\u003cspan>\u003cb>${esc(e.name)}\u003c/b>\u003csmall>${e.doc?.rel_lead ? \"Lead: \" + esc(e.doc.rel_lead) + \" \u00b7 \" : \"\"}${spHoldings(e.slug).length} holding${spHoldings(e.slug).length === 1 ? \"\" : \"s\"}\u003c/small>\u003c/span>\u003cspan class=\"num\">\u003cspan class=\"ragdot ${g.k}\">\u003c/span> ${g.d === null ? \"never\" : g.d + \"d\"}\u003c/span>\u003c/a>`).join(\"\"), \"No firms yet.\")}\n    ${card(\"Top exit candidates\", \"#pe~exits\", ex.slice(0, 6).map(({ h, why }) => hRow(h, (h.hold ?? \"\u2014\") + \" yrs\", h.firm + \" \u00b7 \" + why.slice(0, 2).join(\" \u00b7 \"))).join(\"\"), \"None flagged yet.\")}\n    ${card(\"Raising now\", \"#pe~fundraising\", raising.map(f => `\u003ca class=\"hrow\" href=\"#s.${esc(f.slug)}.funds\">\u003cspan class=\"ib deal\">LP\u003c/span>\u003cspan>\u003cb>${esc(f.name)}\u003c/b>\u003csmall>${esc(f.firm)} \u00b7 ${esc(f.note || f.strategy || \"\")}\u003c/small>\u003c/span>\u003cspan class=\"num\">${fmtBn(f.target_usd_bn || f.size_usd_bn)}\u003c/span>\u003c/a>`).join(\"\"), \"No funds in market on record.\")}\n    ${card(\"Funds closed since \" + (yr - 1), \"#pe~funds\", closed.slice(0, 6).map(f => `\u003ca class=\"hrow\" href=\"#s.${esc(f.slug)}.funds\">\u003cspan class=\"ib deal\">FUND\u003c/span>\u003cspan>\u003cb>${esc(f.name)}\u003c/b>\u003csmall>${esc(f.firm)} \u00b7 closed ${esc(f.final_close)}${f.deployed_pct_est != null ? \" \u00b7 ~\" + f.deployed_pct_est + \"% deployed\" : \"\"}\u003c/small>\u003c/span>\u003cspan class=\"num\">${fmtBn(f.size_usd_bn)}\u003c/span>\u003c/a>`).join(\"\"), \"None on record.\")}\n    ${card(\"New platforms (\" + (yr - 1) + \"-\" + yr + \")\", \"#pe~portfolio\", newP.slice(0, 6).map(h => hRow(h, String(h.year), h.firm + \" \u00b7 \" + (h.subsector || \"\"))).join(\"\"), \"None on record.\")}\n    ${card(\"Most dry powder (est.)\", \"#pe~funds\", Object.entries(F.reduce((m, f) => (m[f.slug] = (m[f.slug] || 0) + (num(f.dry_powder_usd_bn_est) || 0), m), {})).filter(x => x[1]).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([k, v]) => `\u003ca class=\"hrow\" href=\"#s.${esc(k)}.funds\">\u003cspan class=\"ib\">${esc(initials(sponsorDocs.get(k)?.name || k))}\u003c/span>\u003cspan>\u003cb>${esc(sponsorDocs.get(k)?.name || k)}\u003c/b>\u003csmall>Across funds still investing\u003c/small>\u003c/span>\u003cspan class=\"num\">~${fmtBn(v)}\u003c/span>\u003c/a>`).join(\"\"), \"Add funds on a firm page to see this.\")}\n  \u003c/div>\u003c/div>`;\n}\nfunction peSearch() {\n  const q = norm(ui.peq || \"\"); if (q.length \u003c 2) return \"\";\n  const hit = t => norm(t).includes(q);\n  const fs = [...spIndex().values()].filter(e => hit(e.name)).slice(0, 5);\n  const hs = allSpHoldings().filter(h => hit(h.company)).slice(0, 6);\n  const ps = [...new Set(allSpHoldings().flatMap(h => String(h.people || \"\").split(/;\\s*/).filter(n => n && hit(n)).map(n => n + \"|\" + h.slug)))].slice(0, 5);\n  if (!fs.length && !hs.length && !ps.length) return `\u003cdiv class=\"hres\">\u003cdiv class=\"faint\" style=\"padding:10px 12px\">Nothing matches.\u003c/div>\u003c/div>`;\n  return `\u003cdiv class=\"hres\">${fs.length ? `\u003cdiv class=\"hgrp\">Firms\u003c/div>${fs.map(e => `\u003ca class=\"hrow\" href=\"#s.${esc(e.slug)}\">\u003cspan class=\"ib\">${esc(initials(e.name))}\u003c/span>\u003cspan>\u003cb>${esc(e.name)}\u003c/b>\u003csmall>${spHoldings(e.slug).length} holding${spHoldings(e.slug).length === 1 ? \"\" : \"s\"}\u003c/small>\u003c/span>\u003c/a>`).join(\"\")}` : \"\"}${hs.length ? `\u003cdiv class=\"hgrp\">Holdings\u003c/div>${hs.map(h => `\u003ca class=\"hrow\" href=\"${h.c ? \"#c.\" + esc(h.c.id) : \"#s.\" + esc(h.slug) + \".portfolio\"}\">\u003cspan class=\"ib\">${esc(initials(h.company))}\u003c/span>\u003cspan>\u003cb>${esc(h.company)}\u003c/b>\u003csmall>${esc(h.firm)} \u00b7 ${esc(h.subsector || \"\")}\u003c/small>\u003c/span>\u003c/a>`).join(\"\")}` : \"\"}${ps.length ? `\u003cdiv class=\"hgrp\">People\u003c/div>${ps.map(x => { const [n, sl] = x.split(\"|\"); return `\u003ca class=\"hrow\" href=\"#s.${esc(sl)}.team\">\u003cspan class=\"ib\">${esc(initials(n))}\u003c/span>\u003cspan>\u003cb>${esc(n)}\u003c/b>\u003csmall>${esc(sponsorDocs.get(sl)?.name || sl)}\u003c/small>\u003c/span>\u003c/a>`; }).join(\"\")}` : \"\"}\u003c/div>`;\n}\nfunction viewPEFunds(sub) {\n  const F = allSpFunds().slice().sort((a, b) => (b.vintage || 0) - (a.vintage || 0)), raising = sub === \"fundraising\";\n  const rows = raising ? F.filter(f => /fundrais|early/i.test(f.status || \"\") || (f.final_close && dateKey(f.final_close) >= dateKey((new Date().getFullYear() - 1) + \"-01\"))) : F;\n  const byFirm = new Map(); for (const f of F) { if (!byFirm.has(f.slug)) byFirm.set(f.slug, []); byFirm.get(f.slug).push(f); }\n  return peHead(\"Private equity\", raising ? \"Fundraising\" : \"Funds\", raising ? \"Who is raising now and who closed recently. Firms in market are the ones to pitch co-invests and deal flow to; newly closed funds have the most to deploy.\" : \"Every fund on record across firms: vintage, size, how deployed it is and the dry powder left. Deployment is an estimate unless sourced.\")\n  + (raising ? [...byFirm].map(([slug, fs]) => { const d = sponsorDocs.get(slug) || {}, fr = d.fundraising || {}; return `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>${firmLink(slug, d.name || slug)}\u003c/h2>\u003c/div>\u003cdiv class=\"hgrid spclock\">\u003csection class=\"hcard\">\u003cdiv class=\"eyebrow\">Last fundraise\u003c/div>\u003cp>${esc(fr.last_final_close || \"\u2014\")}\u003c/p>\u003c/section>\u003csection class=\"hcard\">\u003cdiv class=\"eyebrow\">In market now\u003c/div>\u003cp>${esc(fr.in_market || \"Nothing reported\")}\u003c/p>\u003c/section>\u003csection class=\"hcard\">\u003cdiv class=\"eyebrow\">Next flagship\u003c/div>\u003cp>${esc(fr.next_flagship || \"\u2014\")}\u003c/p>\u003c/section>\u003c/div>${spTimeline(fs)}\u003c/div>`; }).join(\"\") : \"\")\n  + `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>${raising ? \"Raising or recently closed\" : \"All funds\"}\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">${rows.l
