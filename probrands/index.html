and history pages), then filings, investor material, press releases and deal announcements, owner or sponsor portfolio pages, distributor listings and trade press.\n- You get only a handful of tool rounds, so run two or three searches at once in the first round, each with 2-3 queries (for example \"\u003ccompany> products\", \"\u003ccompany> acquires\", \"site:\u003cits domain> products\"); search excerpts usually answer directly, so read pages only when you need a full product list.\n- Products means actual products: categories, brand families and named products or grades from the company's own catalog pages.\n- Only call something High if a source you found states it. Put the source in basis and list every source you used in \"sources\".\n- If the web has nothing on a point, fall back on what you know and rate it Low. Never invent names, figures or deals.`;\nasync function webSetup() {\n  if (!mcp) return false;\n  try { const perm = await CLAUDE.use(\"permissions\"); if (perm?.request) await perm.request([\"mcp:\" + WEBSRV]); } catch {}\n  return true;\n}\nconst clip = (v, n) => { const t = typeof v === \"string\" ? v : JSON.stringify(v); return t.length > n ? t.slice(0, n) + \" \u2026\" : t; };\n// A stable id per browser: Parallel Search's free tier rate-limits per session id.\nconst WEB_SID = (() => { try { let v = localStorage.getItem(\"profiler_web_sid\"); if (!v) { v = \"profiler-\" + Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, \"0\")).join(\"\"); localStorage.setItem(\"profiler_web_sid\", v); } return v; } catch { return \"profiler-\" + Math.random().toString(16).slice(2) + Date.now().toString(16); } })();\nfunction slimWeb(p) {\n  const rs = Array.isArray(p?.results) ? p.results : null;\n  if (!rs) return clip(p ?? \"\", 12000);\n  return clip(rs.slice(0, 8).map(r => ({ title: r.title, url: r.url, date: r.publish_date || \"\", text: clip((r.excerpts || []).join(\"\\n\") || r.full_content || \"\", 1800) })), 14000);\n}\nfunction webTools(rk, signal) {\n  const note = m => { if (rk && runs[rk]) { runs[rk].msg = m; render(); } };\n  const call = async (tool, input) => {\n    try { const r = await mcp.callTool(WEBSRV, tool, { ...input, session_id: WEB_SID, model_name: \"claude\" }, { signal }); return slimWeb(r.payload); }\n    catch (e) {\n      const msg = String(e?.message || \"\");\n      if ([\"server_not_connected\", \"not_in_manifest\", \"needs_reauth\", \"blocked_by_policy\"].includes(e?.code)) { webOK = false; webIssue = e.code; }\n      if (/rate.?limit/i.test(msg)) webIssue = \"free search limit reached, try again later\";\n      throw new Error(/rate.?limit/i.test(msg) ? \"Web search limit reached for now. Carry on with what you already found and what you know; rate unsourced items Low.\" : \"Web tool failed (\" + (e?.code || \"error\") + \"). Carry on with what you know and rate it Low.\");\n    }\n  };\n  return [\n    { name: \"search_web\", description: \"Search the web. Returns up to 8 results with title, URL, date and page excerpts that usually answer directly. Give 2-3 short keyword queries per call.\", inputSchema: { type: \"object\", properties: { objective: { type: \"string\", description: \"What you are trying to find, one sentence\" }, queries: { type: \"array\", items: { type: \"string\" }, description: \"2-3 keyword queries, 3-6 words each\" } }, required: [\"objective\", \"queries\"] },\n      execute: async i => { const qs = [].concat(i.queries || []).map(String).filter(Boolean).slice(0, 3); const obj = String(i.objective || qs[0] || \"\").slice(0, 300); note(\"Searching: \" + (qs[0] || obj).slice(0, 60)); return call(\"web_search\", { objective: obj, search_queries: qs.length ? qs : [obj.slice(0, 60)] }); } },\n    { name: \"read_pages\", description: \"Read up to 3 specific web pages (for example the company's products page) and return the parts relevant to your objective. Use only when search excerpts are not enough.\", inputSchema: { type: \"object\", properties: { urls: { type: \"array\", items: { type: \"string\" } }, objective: { type: \"string\" } }, required: [\"urls\"] },\n      execute: async i => { const us = [].concat(i.urls || []).map(String).filter(u => /^https?:\\/\\//.test(u)).slice(0, 3); if (!us.length) throw new Error(\"Give full http(s) URLs.\"); note(\"Reading: \" + us[0].replace(/^https?:\\/\\//, \"\").slice(0, 60)); return call(\"web_fetch\", { urls: us, objective: String(i.objective || \"\").slice(0, 200) || null }); } },\n  ];\n}\n\n/* ---------- research: the page runs the web searches itself, in parallel, then Claude writes from them ---------- */\nconst domainOf = u => String(u || \"\").replace(/^https?:\\/\\//, \"\").replace(/^www\\./, \"\").split(/[/?#]/)[0].toLowerCase();\n// Search results are kept for a week and shared across the app, so asking again costs no searches.\nconst WEB_CACHE_DAYS = 7, webMem = new Map();\nfunction webKey(tool, input) {\n  const k = tool + \"|\" + (tool === \"web_search\" ? [...(input.search_queries || [])].map(x => norm(x)).sort().join(\"|\") : [...(input.urls || [])].sort().join(\"|\") + \"|\" + norm(input.objective || \"\"));\n  let h = 5381; for (let i = 0; i \u003c k.length; i++) h = (h * 33 + k.charCodeAt(i)) >>> 0;\n  return \"w\" + h.toString(36) + k.length.toString(36);\n}\nasync function webCall(tool, input, signal) {\n  const key = webKey(tool, input);\n  if (webMem.has(key)) { const r = webMem.get(key).slice(); r.cached = true; return r; }\n  if (db) {\n    try {\n      const d = await db.doc(\"webcache/\" + key).get();\n      if (d.exists && (Date.now() - new Date(d.data().at).getTime()) \u003c WEB_CACHE_DAYS * 864e5) { const r = d.data().results || []; webMem.set(key, r); const out = r.slice(); out.cached = true; return out; }\n    } catch {}\n  }\n  try {\n    const tctl = new AbortController(), timer = setTimeout(() => tctl.abort(), 25000);\n    signal?.addEventListener?.(\"abort\", () => tctl.abort(), { once: true });\n    let r;\n    try { r = await mcp.callTool(WEBSRV, tool, { ...input, session_id: WEB_SID, model_name: \"claude\" }, { signal: tctl.signal }); }\n    catch (e) { if (e?.code === \"cancelled\" && !signal?.aborted) { webIssue = \"search timed out\"; return []; } throw e; }\n    finally { clearTimeout(timer); }\n    const rs = Array.isArray(r.payload?.results) ? r.payload.results.slice(0, 10).map(x => ({ url: x.url, title: String(x.title || \"\").slice(0, 200), publish_date: x.publish_date || \"\", excerpts: [(x.excerpts || []).join(\"\\n\").slice(0, 3000)] })) : [];\n    if (webIssue === \"search timed out\") webIssue = \"\";\n    if (rs.length) { webMem.set(key, rs); if (db && writable) db.doc(\"webcache/\" + key).set({ tool, q: clip(input.search_queries || input.urls || [], 400), at: now(), results: rs }).catch(() => {}); }\n    return rs;\n  }\n  catch (e) {\n    if (e?.code === \"cancelled\") throw e;\n    const m = String(e?.message || \"\");\n    if ([\"server_not_connected\", \"not_in_manifest\", \"needs_reauth\", \"blocked_by_policy\"].includes(e?.code)) { webOK = false; webIssue = e.code; }\n    else if (/rate.?limit/i.test(m)) webIssue = \"free search limit reached; try again in a while\";\n    console.warn(\"web\", tool, e); return [];\n  }\n}\n\n\n// Merge an answer into the profile: confidence rules, derived views, stale marks. Used by Enhance and by web research.\nasync function applyResult(id, key, res, src = {}) {\n  const c = getC(id), sec = c && sectionDef(c, key);\n  if (!c || !sec || !res || typeof res !== \"object\") return;\n  const by = src.by || \"Claude\", web = !!src.web || by === \"Web research\";\n  const cur = getC(id) || c;\n  const locked = new Set(cur.locked || []);\n  const patch = {}, sugg = { ...(cur.suggestions || {}) }, hist = [], conf = { ...(cur.conf || {}) };\n  const rc = res.confidence && typeof res.confidence === \"object\" ? res.confidence : {}, rb = res.basis && typeof res.basis === \"object\" ? res.basis : {};\n  let added = 0, suggested = 0, held = 0;\n  for (const f of sec.fields) {\n    if (res[f] === undefined || res[f] === null) continue;\n    let v = res[f];\n    if (f === \"sectors\" && Array.isArray(v)) v = v.filter(x => x && (x.sector || x.name)).map(x => ({ sector: sectorById(x.sector) && allSectors().some(z => z.id === x.sector) ? x.sector : (sectorFromName(x.sector || x.name)?.id || slugify(x.sector || x.name)), revenue_usd_m: num(x.revenue_usd_m), pct: num(x.pct), what: x.what || \"\" }));\n    if (f === \"primary_sector\") v = allSectors().some(z => z.id === v) ? v : (sectorFromName(v)?.id || slugify(v));\n    if (sec.append && Array.isArray(v)) {\n      const have = new Set((cur[f] || []).map(a => norm(a.target)));\n      const fresh = v.filter(a => a && a.target && !have.has(norm(a.target))).map(a => ({ ...a, added_by: by, added_at: now() }));\n      added = fresh.length;\n      if (!fresh.length) continue;\n      v = [...fresh, ...(cur[f] || [])].sort((a, b) => dateKey(b.date) - dateKey(a.date));\n    }\n    const newL = LEVELS.includes(rc[f]) && rc[f] !== \"Verified\" ? rc[f] : \"Medium\", oldL = confOf(cur, f).level;\n    if (JSON.stringify(v) === JSON.stringify(cur[f])) { if (lvl(newL) > lvl(oldL) && oldL !== \"Verified\") conf[f] = { level: newL, basis: String(rb[f] || \"\").slice(0, 300), at: now(), by }; continue; }\n    if (locked.has(f)) { sugg[f] = { value: v, at: now(), section: key, level: newL, basis: rb[f] || \"\" }; suggested++; continue; }\n    // A weaker answer never overwrites a stronger one; it waits as a suggestion.\n    if (!sec.append && has(cur[f]) && lvl(newL) \u003c lvl(oldL)) { sugg[f] = { value: v, at: now(), section: key, level: newL, basis: rb[f] || \"\" }; held++; continue; }\n    patch[f] = v;\n    conf[f] = { level: sec.append && has(cur[f]) ? oldL : newL, basis: String(rb[f] || \"\").slice(0, 300), at: now(), by };\n    hist.push({ at: now(), field: f, by, before: short(cur[f]), after: short(v), level: newL });\n  }\n  // Derived views: the product pie comes from the catalog; the end-market mix from where each category goes.\n  if (patch.products) { patch.revenue_by_product = productRollup({ ...cur, products: patch.products }); conf.revenue_by_product = conf.products; }\n  const map = patch.product_em_map || (key === \"endmarkets\" ? cur.product_em_map : null);\n  if (map && !locked.has(EM_FIELD)) {\n    const em = emFromMap({ ...cur, ...patch }, map);\n    if (em && JSON.stringify(em) !== JSON.stringify(cur[EM_FIELD])) {\n      hist.push({ at: now(), field: EM_FIELD, by, before: short(cur[EM_FIELD]), after: short(em) });\n      patch[EM_FIELD] = em; conf[EM_FIELD] = { level: minLevel(conf.product_em_map?.level || \"Medium\", confOf({ ...cur, conf }, \"products\").level === \"Low\" ? \"Low\" : \"High\"), basis: \"Rolled up from where each product category goes, weighted by category revenue share\", at: now(), by: \"CRM\" };\n    }\n  }\n  if (web && (src.sources || []).length) {\n    const have = new Set((cur.evidence || []).map(e => e.url));\n    const ev = src.sources.filter(x => x && x.url && !have.has(x.url)).slice(0, 25).map(x => ({ metric: sec.label, value: String(x.supports || x.title || \"\").slice(0, 200), year: x.date || \"\", source_type: String(x.publisher || x.title || \"Web\").slice(0, 80), url: x.url, quote: String(x.quote || \"\").slice(0, 300), at: now(), by }));\n    if (ev.length) patch.evidence = [...ev, ...(cur.evidence || [])].slice(0, 300);\n  }\n  patch.conf = conf;\n  const note = String(res.note || \"\").slice(0, 300) || (Object.keys(patch).length ? \"Section updated.\" : \"No changes.\");\n  const summary = sec.append ? (added ? `Added ${added} new deal${added > 1 ? \"s\" : \"\"}. ${note}` : \"No new deals found.\") : note;\n  const changed = Object.keys(patch).filter(f => sec.fields.includes(f));\n  // Rewording a description or a basis doesn't make other steps out of date; new facts do.\n  const material = changed.filter(f => !PROSE.has(f) && !/_basis$|_arithmetic$|_year$/.test(f));\n  let meta = { ...(cur.section_meta || {}), [key]: { at: now(), by, note: summary, passes: ((cur.section_meta || {})[key]?.passes || 0) + 1 } };\n  if (material.length) meta = markStale(cur, [key], meta);\n  patch.section_meta = meta;\n  patch.suggestions = sugg;\n  patch.history = [...hist, ...(cur.history || [])].slice(0, 200);\n  patch.runs = [...(cur.runs || []), { at: now(), kind: (web ? \"Web research: \" : \"Enhanced: \") + sec.label, summary: summary + (suggested ? ` ${suggested} suggestion${suggested > 1 ? \"s\" : \"\"} held for your overrides.` : \"\") + (held ? ` ${held} weaker answer${held > 1 ? \"s\" : \"\"} held as suggestions because the current value is better supported.` : \"\") }].slice(-60);\n  if (cur.status === \"empty\" || cur.status === \"researching\") patch.status = \"ready\";\n  if (!await save(id, patch, [], true)) throw { code: \"save_failed\", message: lastSaveError };\n  const deps = material.length ? (DEPS[key] || []).length : 0;\n  toast(`${web ? \"Web research \u00b7 \" : \"\"}${sec.label}: ${sec.append ? (added ? `${added} new deal${added > 1 ? \"s\" : \"\"} added` : \"no new deals\") : changed.length ? \"updated\" : (suggested || held) ? \"suggestion held for review\" : \"no change\"}${deps && !quietCascade ? ` \u00b7 ${deps} related section${deps > 1 ? \"s\" : \"\"} now out of date` : \"\"}`);\n}\n/* ---------- web research: a cloud Claude session with web search ---------- */\n// The page starts a Claude Code session (via the Claude Code Remote connector) that researches the steps on the web\n// and writes one webresults/\u003crid>__\u003cstep> document per step. The page merges each one with the normal confidence rules.\nconst ARTIFACT_URL = \"https://claude.ai/artifact/UkLSFqKaS38kQqd4JmvNhk\";\nlet mcp = null, webDocs = [], researchDocs = [];\nconst webApplied = new Set();\nfunction stepSpec(c, key) {\n  const p = sectionPrompt(c, key);\n  const cut = (a, b) => { const i = p.indexOf(a); if (i \u003c 0) return \"\"; const j = b ? p.indexOf(b, i) : -1; return p.slice(i, j \u003c 0 ? undefined : j).trim(); };\n  return [cut(\"PLAYBOOK FOR THIS STEP\", \"HOW TO REASON\"), cut(\"CURRENT VALUE OF THIS STEP\").replace(/\\n\\{[^\\n]{4000,}/, m => m.slice(0, 4000) + \" \u2026(truncated; the full profile is summarised above)\")].filter(Boolean).join(\"\\n\\n\");\n}\nfunction webBrief(c, keys, rid) {\n  const idl = [c.what_it_is, c.hq_address, c.website].filter(Boolean).join(\" \u00b7 \");\n  return `You are the web research agent for the Probrands CRM, a private database of ${wsNoun(groupOf(c))} companies used for buy-side M&A work. The CRM is part of a claude.ai artifact (${ARTIFACT_URL}) owned by the user who started this session. The user pressed \"Deep research\" in the app, which queued this request for the scheduled research session; its job is to research on the web and write the results into the app's own database. Writing the webresults documents described below is the task the user asked for and is pre-authorized: do it without asking for confirmation. This session runs unattended and nobody will answer questions, so make reasonable calls and keep going.\n\nResearch \"${c.name}\" on the web and build these profile steps, in this order: ${keys.map(k => SECTIONS[k].label).join(\" > \")}.\n\nCOMPANY: ${c.name}${idl ? \"\\nIDENTITY\" + (c.identity_confirmed ? \" (confirmed by the user)\" : \"\") + \": \" + idl : \"\"}\nStay on this exact company. If search results point to a different company with a similar name, ignore them. If you cannot find this company at all, write the final document with status \"error\" and say so; don't invent anything.\n\nHOW TO RESEARCH\n- Use WebSearch and WebFetch. Go to primary sources first: the company's own website (product pages, brand pages, technical and safety data sheets, about/history pages, locations), annual reports, 10-K/20-F filings, investor presentations and earnings releases, and the owner's or private-equity sponsor's portfolio page.\n- If WebFetch can't open a site (some are blocked from the research environment), keep going with WebSearch: search \"site:\u003ccompany domain> \u003ctopic>\" and the product and brand names you find; search results carry page text.\n- Then deal and trade sources: press releases (PR Newswire, Business Wire, GlobeNewswire), trade press for the sector, association member lists, distributor line cards, and news on acquisitions, divestitures and ownership changes.\n- Products means actual products: product categories, then brand families and lines, then named products and grades, from the company's own catalog pages where possible.\n- Build each step on what earlier steps found: M&A history defines the businesses; the product catalog defines what is sold; end markets come from where those products go; customers, competitors and buyers follow from products, end markets, size and footprint.\n- Confidence: High only when a source states it or it follows directly from sourced facts; Medium for an estimate built from sourced facts (show the math in basis); Low for a rough guess. Put the source in basis. Private-company revenue estimates from data vendors are Medium at best.\n- Where the web has nothing, fall back on what you know, rate it Low and say so. Never invent names, figures or deals.\n\nHOW TO SAVE (do this after EACH step, before starting the next)\n1. Load the ArtifactData tool once with ToolSearch (\"select:ArtifactData\").\n2. Write one new document: action \"set\", url \"${ARTIFACT_URL}\", collection \"hb_webresults\", doc_id \"${rid}__\u003cstep key>\", data:\n   {\"rid\":\"${rid}\",\"company_id\":\"${c.id}\",\"step\":\"\u003cstep key>\",\"status\":\"done\",\"at\":\"\u003cISO time>\",\"result\":\u003cthe step's JSON object, in the shape given for that step>,\"sources\":[{\"title\":\"\",\"publisher\":\"\",\"url\":\"\",\"date\":\"\",\"supports\":\"which fields or rows this source supports\",\"quote\":\"short supporting quote\"}]}\n   It is a new document, so no if_version. Keep it under 200 KB; shorten long text if a write is refused.\n3. When all steps are done, write doc_id \"${rid}__final\" with {\"rid\":\"${rid}\",\"company_id\":\"${c.id}\",\"step\":\"final\",\"status\":\"done\",\"at\":\"\u003cISO time>\",\"summary\":\"2-3 sentences: what you found, what is still weak\"}. Use status \"error\" if you couldn't do the work.\nWrite ONLY these webresults documents. Don't write, update or delete any other document, and don't touch any git repository, branch or pull request. Finish when the final document is written.\n\nWHAT THE PROFILE KNOWS (grouped by confidence; Verified items were set by the user and are true)\n${knowledgeBase(c) || \"Almost nothing yet beyond the name.\"}\n\n${keys.map((k, i) => `==================== STEP ${i + 1}: ${SECTIONS[k].label.toUpperCase()} (step key \"${k}\") ====================\\n${stepSpec(c, k)}`).join(\"\\n\\n\")}\n\nFor every step, \"result\" must be ONE JSON object in the shape shown for that step, with \"confidence\", \"basis\" and \"note\" filled in.`;\n}\nconst webActive = id => researchDocs.find(r => r.company_id === id && [\"queued\", \"starting\", \"running\"].includes(r.status));\n// Deep research: the app queues a request with a full brief; a scheduled Claude session (with Claude's own\n// web search, on the user's plan) picks it up, researches every step and writes webresults/\u003crid>__\u003cstep>.\nasync function startWeb(id, keys) {\n  const c = getC(id); if (!c || !db || !writable || webActive(id)) return;\n  keys = keys.filter(k => SECTIONS[k]); if (!keys.length) return;\n  const rid = \"r\" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\n  try {\n    await db.doc(\"research/\" + rid).set(clean({ company_id: id, name: c.name, steps: keys, status: \"queued\", requested_at: now(), brief: webBrief(c, keys, rid).slice(0, 200000) }));\n    toast(\"Queued for deep research. A Claude research session picks it up within the hour.\");\n  } catch (e) { handleWriteError(e); }\n}\n// Apply finished steps one at a time, in builder order, so each merge sees the one before.\nlet webBusy = false;\nasync function drainWeb() {\n  if (webBusy || !writable || !db) return;\n  webBusy = true;\n  try {\n    for (;;) {\n      const next = webDocs.filter(d => !d.applied && !webApplied.has(d.id) && (getC(d.company_id) || String(d.company_id || \"\").startsWith(\"tam:\"))).sort((a, b) => String(a.rid).localeCompare(String(b.rid)) || SECTION_ORDER.indexOf(a.step) - SECTION_ORDER.indexOf(b.step))[0];\n      if (!next) break;\n      webApplied.add(next.id);\n      if (next.step === \"final\") {\n        const r = researchDocs.find(x => x.id === next.rid);\n        if (r) await db.doc(\"research/\" + r.id).update({ status: next.status === \"error\" ? \"error\" : \"done\", summary: String(next.summary || \"\").slice(0, 600), error: next.status === \"error\" ? String(next.summary || \"\").slice(0, 300) : \"\", finished_at: now() }).catch(() => {});\n        if (next.status !== \"error\") { const c = getC(next.company_id); if (c) toast(`Web research on ${c.name} finished`); else if (String(next.company_id).startsWith(\"tam:\")) toast(\"Market-size research finished\"); }\n      } else if (next.step === \"tam\" && String(next.company_id).startsWith(\"tam:\") && next.result) {\n        const sid = next.company_id.slice(4), t = tams[sid] || {}, have = new Set((t.sources || []).map(x => norm(x.source) + (x.year || \"\")));\n        const fresh = (next.result.sources || []).filter(x => x?.source && num(x.value_usd_m) && !have.has(norm(x.source) + (x.year || \"\"))).map(x => ({ source: x.source, kind: x.kind || \"\", geography: GEOS.includes(x.geography) ? x.geography : \"Global\", year: x.year || \"\", value_usd_m: num(x.value_usd_m), cagr_pct: num(x.cagr_pct), reliability: [\"High\", \"Medium\", \"Low\"].includes(x.reliability) ? x.reliability : \"Medium\", scope: x.scope || \"\", url: x.url || \"\", by: \"Deep research\" }));\n        await saveTam(sid, { sources: [...(t.sources || []), ...fresh], view: next.result.view || t.view || \"\", geo: t.geo || \"US\", base_year: t.base_year || new Date().getFullYear() - 1, searched_at: now() });\n      } else if (SECTIONS[next.step] && next.result && typeof next.result === \"object\") {\n        await applyResult(next.company_id, next.step, next.result, { by: \"Web research\", sources: Array.isArray(next.sources) ? next.sources : [] });\n      }\n      await db.doc(\"webresults/\" + next.id).update({ applied: true, applied_at: now() }).catch(() => {});\n    }\n  } finally { webBusy = false; }\n}\nfunction webPanel(c) {\n  const rs = researchDocs.filter(r => r.company_id === c.id).sort((a, b) => String(b.requested_at).localeCompare(String(a.requested_at)));\n  const r = rs[0]; if (!r) return \"\";\n  const got = webDocs.filter(d => d.rid === r.id && d.step !== \"final\").map(d => d.step);\n  const link = r.session_id ? ` \u003ca href=\"https://claude.ai/code/${esc(r.session_id)}\" target=\"_blank\" rel=\"noopener\">Open the research session\u003c/a>` : \"\";\n  if (r.status === \"queued\") return `\u003cdiv class=\"run\" role=\"status\">\u003cspan class=\"spin\">\u003c/span>\u003cspan>\u003cb>Queued for deep research.\u003c/b> A Claude research session with web search picks it up within the hour (or run the deep research routine now from claude.ai). Results save here step by step.\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"btn sm ghost\" data-act=\"webdismiss\" data-r=\"${esc(r.id)}\">Cancel\u003c/button>\u003c/div>`;\n  if (r.status === \"starting\" || r.status === \"running\") return `\u003cdiv class=\"run\" role=\"status\">\u003cspan class=\"spin\">\u003c/span>\u003cspan>\u003cb>Deep research running.\u003c/b> ${got.length} of ${(r.steps || []).length} steps back${got.length ? \": \" + esc(got.map(k => SECTIONS[k]?.label || k).join(\", \")) : \"\"}. It takes a few minutes per step; results save here as they arrive.${link}\u003c/span>\u003c/div>`;\n  if (r.status === \"error\") return `\u003cdiv class=\"run warnrun\" role=\"alert\">\u003cspan>\u003cb>Deep research stopped.\u003c/b> ${esc(r.error || \"\")}${link}\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"btn sm ghost\" data-act=\"webdismiss\" data-r=\"${esc(r.id)}\">Dismiss\u003c/button>\u003c/div>`;\n  return \"\";\n}\n\n// One at a time, in dependency order, so each section reasons from what the previous ones just learned.\nlet quietCascade = false;\nasync function enhanceSeq(id, keys) {\n  quietCascade = true; seqDone.clear();\n  try { for (const k of keys) { if (!sample) break; await enhance(id, k); seqDone.add(k); } }\n  finally { quietCascade = false; seqDone.clear(); }\n  const c = getC(id); if (c) toast(`Profile strength now ${strength(c).pct}%`);\n}\nconst enhanceAll = id => chatSteps(id, SECTION_ORDER.slice());\nconst updateStale = id => { const c = getC(id); if (c) chatSteps(id, staleSections(c)); };\nconst enhance = (id, key) => chatSteps(id, [key]);\nfunction short(v) {\n  if (v === null || v === undefined) return \"\";\n  if (typeof v === \"number\") return String(v);\n  if (typeof v === \"string\") return v.length > 120 ? v.slice(0, 117) + \"\u2026\" : v;\n  if (Array.isArray(v)) return `${v.length} rows: ` + v.slice(0, 3).map(x => x.name || x.target || x.business || x.product || x.product_line || \"\").filter(Boolean).join(\", \");\n  return Object.entries(v).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, x]) => `${k} ${x}%`).join(\", \");\n}\n\n/* ---------- buyers and add-ons from the index ---------- */\nfunction likelyBuyers(c) {\n  return memod(\"buyers:\" + c.id, () => {\n    const sid = primarySector(c), size = sectorRev(c, sid) || 0, tot = num(c.total_revenue_usd_m) || size;\n    const out = [];\n    for (const p of list()) {\n      if (p.id === c.id) continue;\n      const ps = sectorRev(p, sid) || 0, pt = num(p.total_revenue_usd_m) || 0;\n      if (!(ps >= Math.max(1.5 * size, 5) || pt >= Math.max(3 * tot, 50))) continue;\n      const o = overlap(c, p); if (o \u003c 20) continue;\n      const n = (p.acquisitions || []).length;\n      const s = o * (0.55 + 0.45 * Math.min(1, n / 10)) * (p.primary_category && p.primary_category === c.primary_category ? 1.15 : 1) * (p.pe_rollup ? 1.1 : 1) * (inSector(p, sid) ? 1.1 : 1);\n      out.push({ p, o, n, s, r: ps || pt });\n    }\n    return out.sort((a, b) => b.s - a.s).slice(0, 12);\n  });\n}\nfunction likelySponsors(c) {\n  const seen = new Map();\n  for (const b of likelyBuyers(c)) {\n    const sp = String(b.p.pe_sponsor || \"\").split(/[;(]/)[0].trim();\n    if (sp && (b.p.pe_backed || b.p.owner_type === \"PE-owned\") && !seen.has(sp)) seen.set(sp, b);\n  }\n  return [...seen.entries()].slice(0, 4).map(([name, b]) => ({ name, via: b.p }));\n}\nfunction likelyAddons(c) {\n  return memod(\"addons:\" + c.id, () => {\n    const sid = primarySector(c), size = sectorRev(c, sid) || num(c.total_revenue_usd_m) || 0, st = stateOf(c);\n    const owned = new Set((c.acquisitions || []).map(a => norm(a.target)));\n    const pool = list().filter(p => p.id !== c.id && !owned.has(norm(p.name)) && p.owner_type !== \"Public\" && p.owner_type !== \"Subsidiary of strategic\" && (sectorRev(p, sid) || (inSector(p, sid) && num(p.total_revenue_usd_m))));\n    const pick = (maxRev, minO) => pool.map(p => {\n      const r = sectorRev(p, sid) || num(p.total_revenue_usd_m); if (r > maxRev) return null;\n      const o = overlap(c, p); if (o \u003c minO) return null;\n      const same = st && stateOf(p) === st;\n      return { name: p.name, id: p.id, what: p.primary_category, rev: r, state: stateOf(p), o, s: o * Math.log10(2 + r) * (same ? 1.25 : 1) };\n    }).filter(Boolean);\n    let cands = pick(Math.max(size * 0.5, 2), 30);\n    if (cands.length \u003c 8) cands = pick(Math.max(size, 3), 15);   // small companies: merger-of-equals and tuck-ins\n    return cands.sort((a, b) => b.s - a.s).slice(0, 15);\n  });\n}\n// The full add-on list: saved ideas, companies that name this one as a buyer, then index matches.\nfunction addonList(c) {\n  const out = [], seen = new Set();\n  const add = x => { const k = norm(x.name); if (!k || seen.has(k)) return; seen.add(k); out.push(x); };\n  (c.addon_ideas || []).forEach((a, i) => add({ name: a.target, id: findCompanyByName(a.target, c.id)?.id, why: a.rationale, rev: num(a.est_revenue_usd_m), state: a.location, src: \"saved\", i }));\n  for (const r of reverseLinks().buyerOf.get(c.id) || []) add({ name: r.target.name, id: r.target.id, why: `${r.target.name}'s profile lists ${c.name} as a potential buyer${r.note ? \": \" + r.note : \"\"}`, rev: sectorRev(r.target, primarySector(c)) ?? num(r.target.total_revenue_usd_m), state: stateOf(r.target), src: \"buyer\" });\n  for (const b of likelyAddons(c)) add({ name: b.name, id: b.id, why: `${b.o.toFixed(0)}% similarity \u00b7 ${b.what || sectorShort(primarySector(companies.get(b.id) || {}))}`, rev: b.rev, state: b.state, src: \"index\" });\n  return out;\n}\n\n/* ---------- views ---------- */\n// Search autofill: companies whose name, parent, sponsor or rolled-in brands match what's typed.\nfunction acMatches() {\n  const lo = x => String(x || \"\").toLowerCase().replace(/[^a-z0-9]+/g, \" \").trim();\n  const q = lo(ui.q); if (!q) return [];\n  const out = [], seen = new Set();\n  const cut = x => { x = String(x || \"\").trim(); return x.length > 60 ? x.slice(0, 57) + \"\u2026\" : x; };\n  for (const c of list()) {\n    const n = lo(c.name);\n    let score = 0, why = \"\";\n    if (n.startsWith(q)) score = 100;\n    else if (n.split(\" \").some(w => w.startsWith(q))) score = 80;\n    else if (n.includes(q)) score = 60;\n    else if (lo(c.platform_name).includes(q)) { score = 45; why = cut(c.platform_name); }\n    else if (lo(c.pe_sponsor).includes(q)) { score = 40; why = \"Sponsor: \" + cut(String(c.pe_sponsor).split(/[;(]/)[0]); }\n    else if (lo(c.rolled_in).includes(q)) { score = 35; why = \"Owns \" + cut((String(c.rolled_in).split(\";\").find(x => lo(x).includes(q)) || \"\").replace(/\\(.*?\\)/g, \"\")); }\n    if (score) { out.push({ c, score: score + Math.min(20, Math.log10(1 + (num(c.total_revenue_usd_m) || 0)) * 5), why }); seen.add(c.id); }\n  }\n  for (const e of meta.entities || []) {\n    if (!e.owner_id || !companies.has(e.owner_id) || !lo(e.name).includes(q)) continue;\n    const c = companies.get(e.owner_id);\n    out.push({ c, score: (lo(e.name).startsWith(q) ? 70 : 30), why: `${cut(e.name)} is part of ${c.name}` });\n  }\n  const best = new Map();\n  for (const m of out) if (!best.has(m.c.id) || best.get(m.c.id).score \u003c m.score) best.set(m.c.id, m);\n  return [...best.values()].sort((a, b) => b.score - a.score).slice(0, 8);\n}\nfunction autofill() {\n  if (!ui.acOpen || !ui.q) return \"\";\n  const ms = acMatches(); if (!ms.length) return \"\";\n  return `\u003cul class=\"ac\" id=\"acList\" role=\"listbox\">${ms.map((m, i) => `\u003cli role=\"option\" id=\"ac-${i}\" aria-selected=\"${i === ui.ac}\" data-open=\"${esc(m.c.id)}\">\u003cspan class=\"ac-n\">${esc(m.c.name)}\u003c/span>\u003cspan class=\"ac-s\">${esc(m.why || [sectorShort(primarySector(m.c)), m.c.business_model, stateOf(m.c)].filter(Boolean).join(\" \u00b7 \"))}\u003c/span>\u003cspan class=\"num faint\">${fmtM(m.c.total_revenue_usd_m)}\u003c/span>\u003c/li>`).join(\"\")}\u003c/ul>`;\n}\nfunction viewSectors() {\n  const stats = memod(\"secstats\", () => {\n    const m = {};\n    for (const c of list()) for (const x of sectorsOf(c)) {\n      const e = m[x.sector] || (m[x.sector] = { n: 0, rev: 0, top: [] });\n      e.n++; const r = sectorRev(c, x.sector) || 0; e.rev += r; e.top.push([r, c]);\n    }\n    for (const k in m) m[k].top = m[k].top.sort((a, b) => b[0] - a[0]).slice(0, 3).map(x => x[1]);\n    return m;\n  });\n  const cards = wsSectors().map(x => {\n    const st = stats[x.id] || { n: 0, rev: 0, top: [] }, busy = seeding[x.id];\n    return `\u003cdiv class=\"panel scard${st.n ? \"\" : \" empty\"}\">\n      \u003ca class=\"scard-h\" href=\"#companies\" data-setsector=\"${esc(x.id)}\">\u003cspan class=\"scard-n\">${esc(x.name)}\u003c/span>\u003cspan class=\"num faint\">${st.n} ${st.n === 1 ? \"company\" : \"companies\"}\u003c/span>\u003c/a>\n      ${st.n ? `\u003cdiv class=\"scard-v num\">${fmtM(st.rev)} \u003cspan class=\"faint\">${x.id === \"water\" ? \"US water treatment revenue\" : \"sector revenue tracked\"}\u003c/span>\u003c/div>\n      \u003cdiv class=\"scard-t\">${st.top.map(c => `\u003ca href=\"#c.${esc(c.id)}\">${esc(c.name.replace(/\\s*\\(.*\\)$/, \"\"))}\u003c/a>`).join(\" \u00b7 \")}\u003c/div>` : `\u003cdiv class=\"faint\" style=\"font-size:13px\">No companies yet.\u003c/div>`}\n      \u003cdiv class=\"scard-a\">${busy ? `\u003cspan class=\"pill accent\">\u003cspan class=\"spin\">\u003c/span>${esc(busy)}\u003c/span>` : canEnhance() ? `\u003cbutton class=\"btn sm enh\" data-act=\"seed\" data-sector=\"${esc(x.id)}\">${st.n ? \"Find more companies\" : \"Build out this sector\"}\u003c/button>` : \"\"}\u003c/div>\n    \u003c/div>`;\n  }).join(\"\");\n  return `\u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">${esc(wsPath())}\u003c/div>\u003ch1>Sectors\u003c/h1>\u003cp>Every company lives in one or more sectors, with a primary one. Pick a sector to see its companies, deals, targets and end markets, or build out a new sector and Claude adds its leading companies as starter profiles.\u003c/p>\u003c/div>\n    ${writable && db ? `\u003cform class=\"add\" id=\"sectorForm\">\u003cinput id=\"newSector\" placeholder=\"New sector, e.g. Industrial gases\" autocomplete=\"off\" aria-label=\"New sector name\">\u003cbutton class=\"btn\" type=\"submit\">Add sector\u003c/button>\u003c/form>` : \"\"}\u003c/div>\n  \u003cdiv class=\"scards\">${cards}\u003c/div>`;\n}\n\nasync function seedSector(sid) {\n  const sec = sectorById(sid); if (!sample || !sec || seeding[sid]) return;\n  seeding[sid] = \"Finding companies\"; render();\n  const have = list().filter(c => inSector(c, sid)).map(c => c.name).slice(0, 150);\n  const prompt = `You are building out the \"${sec.name}\" sector in the Probrands CRM, a private database of ${wsNoun(sec.g || DEFAULT_WS)} companies used by a buy-side M&A team focused on North America.\n\nList up to 30 of the most relevant companies in this sector: the leaders plus the PE-backed and founder-owned mid-market companies an M&A team would track. Skip these, which are already in the database: ${have.join(\"; \") || \"none\"}.\n\nWork from what you know; you cannot browse. Only include companies you are confident really exist; never make up a company. Estimate figures you are not sure of.\n\nReply with ONLY a JSON array of objects:\n[{\"name\":\"\",\"hq_address\":\"City, ST\",\"owner_type\":\"PE-owned | Public | Family/founder-owned | ESOP | Subsidiary of strategic | Other\",\"ultimate_parent\":\"\",\"pe_sponsor\":\"\",\"business_model\":\"short label\",\"total_revenue_usd_m\":0,\"sector_revenue_usd_m\":0,\"sector_pct\":0,\"employees_total\":null,\"website\":\"\",\"what_it_is\":\"one sentence\",\"other_sectors\":[\"sector ids of other business lines\"]}]\nSector ids for other_sectors: ${allSectors().filter(x => x.g === (sec.g || DEFAULT_WS)).map(x => x.id).join(\", \")}.`;\n  try {\n    const rows = await sample.json(prompt, { modelTier: \"complex\", cache: false });\n    if (!Array.isArray(rows)) throw { code: \"invalid_json\" };\n    let added = 0, tagged = 0;\n    for (const r of rows) {\n      if (!r?.name) continue;\n      seeding[sid] = `Saving ${added + tagged + 1} of ${rows.length}`; render();\n      const ex = findCompanyByName(r.name);\n      const line = { sector: sid, revenue_usd_m: num(r.sector_revenue_usd_m), pct: num(r.sector_pct) };\n      if (ex) {\n        if (inSector(ex, sid)) continue;\n        const cur = sectorsOf(ex);\n        await save(ex.id, { sectors: [...cur, line] }, [], true); tagged++; continue;\n      }\n      try { await createStarter(r, sid, \"Sector build\"); added++; }\n      catch (e) { handleWriteError(e); break; }\n    }\n    rebuildIndex();\n    toast(`${sec.name}: ${added} companies added${tagged ? `, ${tagged} existing tagged` : \"\"}`);\n  } catch (e) {\n    if (e?.code === \"not_granted\" || e?.code === \"sampling_disabled\") sample = null;\n    toast(ERRMSG[e?.code] || \"Couldn't build out the sector. Try again.\");\n  }\n  delete seeding[sid]; render();\n}\n\n/* ---------- TAM: triangulated market size, found TAM, names to add ---------- */\nlet tams = {};                         // sectorId -> tam doc\nconst tamBusy = {};\nconst REL_W = { High: 3, Medium: 2, Low: 1 };\nconst GEOS = [\"US\", \"North America\", \"Global\"];\n// Starter profile from a name plus whatever Claude estimated. Used by sector build-outs and TAM suggestions.\nasync function createStarter(r, sid, how) {\n  const sec = sectorById(sid);\n  let id = slugify(r.name), n = 2; while (companies.has(id)) id = slugify(r.name) + \"-\" + n++;\n  const others = (Array.isArray(r.other_sectors) ? r.other_sectors : []).filter(x => x !== sid && allSectors().some(z => z.id === x)).map(x => ({ sector: x, revenue_usd_m: null, pct: null }));\n  const line = { sector: sid, revenue_usd_m: num(r.sector_revenue_usd_m), pct: num(r.sector_pct) };\n  const doc = { name: r.name, primary_sector: sid, sectors: [line, ...others], hq_address: r.hq_address || \"\", owner_type: r.owner_type || \"\", ultimate_parent: r.ultimate_parent || \"\", pe_sponsor: r.pe_sponsor || \"\", business_model: r.business_model || \"\", website: r.website || \"\",\n    total_revenue_usd_m: num(r.total_revenue_usd_m), employees_total: num(r.employees_total), confidence: \"Low\", status: \"ready\",\n    acquisitions: [], buyers: [], addon_ideas: [], competitors: [], locked: [], source_of_truth: [], created_at: now(), updated_at: now(), section_meta: {} };\n  const det = { what_it_is: r.what_it_is || r.why || \"\", runs: [{ at: now(), kind: how, summary: `Added as a starter profile in ${sec?.name || sid}. Figures are estimates; use Enhance all to fill in the rest.` }], customers: [] };\n  await db.doc(\"companies/\" + id).set(doc); await db.doc(\"details/\" + id).set(det);\n  companies.set(id, { ...doc, id }); details[id] = det; ver++;\n  return id;\n}\nasync function saveTam(sid, patch) {\n  const cur = tams[sid] || {}, next = { ...cur, ...patch, sector: sid, updated_at: now() };\n  tams[sid] = next; ver++;\n  try { await db.doc(\"tam/\" + sid).set(next); } catch (e) { handleWriteError(e); }\n}\n\n// Bring every source to the base year with its own growth rate (or the median of the others), weight by\n// reliability, and down-weight outliers far from the median.\nfunction triangulate(t) {\n  const geo = t?.geo || \"US\", base = +(t?.base_year || 2025);\n  const src = (t?.sources || []).filter(x => num(x.value_usd_m));\n  const cagrs = src.map(x => num(x.cagr_pct)).filter(x => x !== null);\n  const medC = median(cagrs) ?? 4;\n  const rows = src.map((x, i) => {\n    const inGeo = (x.geography || \"US\") === geo, g = num(x.cagr_pct) ?? medC, yr = +(yearOf(x.year) || base);\n    const adj = num(x.value_usd_m) * Math.pow(1 + g / 100, base - yr);\n    return { ...x, i, inGeo, adj, g, w0: REL_W[x.reliability] || 1 };\n  });\n  const use = rows.filter(r => r.inGeo);\n  const med = median(use.map(r => r.adj));\n  for (const r of use) { r.outlier = med && (r.adj > 2.5 * med || r.adj \u003c med / 2.5); r.w = r.w0 * (r.outlier ? 0.25 : 1); }\n  const W = use.reduce((s, r) => s + r.w, 0);\n  const tam = W ? use.reduce((s, r) => s + r.adj * r.w, 0) / W : null;\n  const vals = use.map(r => r.adj);\n  return { rows, tam, lo: vals.length ? Math.min(...vals) : null, hi: vals.length ? Math.max(...vals) : null, n: use.length, geo, base, medC };\n}\nconst tamValue = t => num(t?.override_usd_m) ?? triangulate(t).tam;\nfunction foundTam(sid) {\n  return memod(\"found:\" + sid, () => {\n    const rows = list().filter(c => inSector(c, sid)).map(c => ({ c, r: sectorRev(c, sid) || 0 })).filter(x => x.r > 0).sort((a, b) => b.r - a.r);\n    return { rows, total: rows.reduce((s, x) => s + x.r, 0) };\n  });\n}\n// Simple database search: names that profiles in this sector mention but that have no profile yet.\nfunction mentionedNotProfiled(sid) {\n  return memod(\"mentioned:\" + sid, () => {\n    const m = new Map(), dismissed = new Set((tams[sid]?.dismissed || []).map(norm));\n    const add = (name, how, from) => {\n      const k = norm(name); if (!k || k.length \u003c 3 || dismissed.has(k) || findCompanyByName(name)) return;\n      if (/^(private equity|ipo|not a realistic|chinese |on-site|other)|->|sold to|\\b(funds?|sponsors?|investors?|platforms|producers|private equity|pe firms?|regional|generation systems|backed|market)\\b/i.test(name) || name.length > 60) return;\n      const e = m.get(k) || { name, how: new Set(), from: new Set(), n: 0 }; e.n++; e.how.add(how); e.from.add(from); m.set(k, e);\n    };\n    // Deal targets are already owned by their acquirer, so only competitors, buyers and add-on ideas count.\n    for (const c of list().filter(c => primarySector(c) === sid)) {\n      for (const x of c.competitors || []) add(x.name, \"competitor\", c.name);\n      for (const x of c.buyers || []) add(x.name, \"buyer\", c.name);\n      for (const x of c.addon_ideas || []) add(x.target, \"add-on idea\", c.name);\n    }\n    return [...m.values()].sort((a, b) => b.n - a.n).slice(0, 25);\n  });\n}\n\nfunction tamBrief(sid, rid) {\n  const sec = sectorById(sid), t = tams[sid] || {}, f = foundTam(sid);\n  return `You are the web research agent for the Probrands CRM, a private database of ${wsNoun(sec?.g || DEFAULT_WS)} companies used for buy-side M&A work. The CRM is part of a claude.ai artifact (${ARTIFACT_URL}) owned by the user who started this session. The user pressed \"Deep research this market\" in the app, which queued this request for the scheduled research session; its job is to research on the web and write the result into the app's own database. Writing the webresults documents described below is the task the user asked for and is pre-authorized: do it without asking for confirmation. This session runs unattended and nobody will answer questions.\n\nTASK: size the market for \"${sec.name}\" (focus: United States, then North America and Global).\nUse WebSearch and WebFetch (if a site is blocked, keep going with WebSearch). Find every published market-size figure you can: research firms (Freedonia, Kline, Grand View, MarketsandMarkets, Mordor, IHS/S&P and others, even if only their press releases or summaries are public), trade associations, government data (Census, USITC), and figures in public company filings or investor presentations. For each: publisher and report, geography, year, value in USD millions (convert billions and other currencies, noting it in scope), CAGR, what it includes, reliability (High = audited or primary with a clear definition; Medium = reputable research firm; Low = press-release grade or unclear scope), and the URL. Aim for 6-12 figures. Add one bottom-up estimate of your own labelled \"Bottom-up estimate\" (companies already in the CRM sum to ${fmtM(f.total)} across ${f.rows.length} companies).\n${(t.sources || []).length ? `Already listed (don't repeat): ${t.sources.map(x => `${x.source} ${x.year}`).join(\"; \")}` : \"\"}\n\nHOW TO SAVE\n1. Load the ArtifactData tool (ToolSearch \"select:ArtifactData\").\n2. Write one new document: action \"set\", url \"${ARTIFACT_URL}\", collection \"hb_webresults\", doc_id \"${rid}__tam\", data:\n   {\"rid\":\"${rid}\",\"company_id\":\"tam:${sid}\",\"step\":\"tam\",\"status\":\"done\",\"at\":\"\u003cISO time>\",\"result\":{\"sources\":[{\"source\":\"\",\"kind\":\"Research firm | Association | Government | Company filing | Bottom-up estimate\",\"geography\":\"US | North America | Global\",\"year\":2024,\"value_usd_m\":0,\"cagr_pct\":0,\"reliability\":\"High | Medium | Low\",\"scope\":\"\",\"url\":\"\"}],\"view\":\"two sentences on which figures you trust most for a US-focused definition and why\"}}\n3. Then write doc_id \"${rid}__final\" with {\"rid\":\"${rid}\",\"company_id\":\"tam:${sid}\",\"step\":\"final\",\"status\":\"done\",\"at\":\"\u003cISO time>\",\"summary\":\"one line\"}.\nWrite ONLY these two webresults documents. Don't touch any other document or any git repository.`;\n}\nasync function queueTamResearch(sid) {\n  if (!db || !writable) return;\n  if (researchDocs.some(r => r.company_id === \"tam:\" + sid && [\"queued\", \"running\"].includes(r.status))) { toast(\"Already queued\"); return; }\n  const rid = \"r\" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);\n  try { await db.doc(\"research/\" + rid).set(clean({ company_id: \"tam:\" + sid, name: sectorById(sid)?.name || sid, steps: [\"tam\"], status: \"queued\", requested_at: now(), brief: tamBrief(sid, rid) })); toast(\"Queued. The research session picks it up within the hour; sources land here.\"); }\n  catch (e) { handleWriteError(e); }\n}\nasync function findTamSources(sid) {\n  const sec = sectorById(sid); if (!sec || !sample || tamBusy[sid]) return;\n  const t = tams[sid] || {}, f = foundTam(sid);\n  // 1. Search the web ourselves, several angles at once, so Claude works from real, citable pages.\n  let found = [];\n  if (webOK) {\n    tamBusy[sid] = \"Searching the web for market-size reports\"; render();\n    await webSetup();\n    const n = sec.name, S = (objective, qs) => webCall(\"web_search\", { objective, search_queries: qs }, null);\n    const res = await Promise.all([\n      S(`Size of the US ${n} market in dollars, with year and growth rate`, [`US ${n} market size`, `${n} market size United States billion`, `North America ${n} market`]),\n      S(`Global ${n} market size and CAGR from research firms`, [`${n} market size CAGR`, `global ${n} market report 2024`, `${n} market forecast 2030`]),\n      S(`${n} industry size from trade associations, government data or company filings`, [`${n} industry association market size`, `${n} industry revenue US`]),\n    ]);\n    const seen = new Set();\n    for (const r of res.flat()) if (r?.url && !seen.has(r.url)) { seen.add(r.url); found.push({ title: r.title, url: r.url, date: r.publish_date || \"\", text: clip((r.excerpts || []).join(\"\\n\"), 1600) }); }\n    found = found.slice(0, 24);\n  }\n  const webNote = webOK && !found.length ? (webIssue ? `Web search unavailable (${webIssue})` : \"Web search found nothing\") : \"\";\n  tamBusy[sid] = found.length ? `Reading ${found.length} sources` : \"Sizing from Claude's knowledge\"; render();\n  const prompt = `You are sizing the market for \"${sec.name}\" for a buy-side M&A team focused on North America.\n\n${found.length ? `WEB RESULTS (use these; cite each figure with its URL exactly as given):\n${found.map((x, i) => `[${i + 1}] ${x.title} \u2014 ${x.url}${x.date ? \" (\" + x.date + \")\" : \"\"}\\n${x.text}`).join(\"\\n\\n\")}\n\nExtract every market-size figure these results state` : `You have no web results. List the published market-size estimates you know`}: research firms (Freedonia, Kline, Grand View, MarketsandMarkets, Mordor, IHS/S&P and others), trade associations, government data, and figures from company filings. Keep the geography each source states (US, North America or Global), its year, value in USD millions (convert billions; convert other currencies and say so in scope) and CAGR. Then add one bottom-up estimate of your own, labelled \"Bottom-up estimate\", built from company revenues.\n\nFor context, the companies already in the CRM sum to ${fmtM(f.total)} of revenue in this sector across ${f.rows.length} companies.\n${(t.sources || []).length ? `Already listed (don't repeat): ${t.sources.map(x => `${x.source} ${x.year}`).join(\"; \")}` : \"\"}\n\nReliability: High = audited or widely cited primary source with a clear definition; Medium = reputable research firm; Low = press-release-grade or unclear scope. ${found.length ? \"Only use URLs from the web results.\" : \"Leave url empty.\"}\n\nReply with ONLY JSON:\n{\"sources\":[{\"source\":\"publisher and report\",\"kind\":\"Research firm | Association | Government | Company filing | Bottom-up estimate\",\"geography\":\"US | North America | Global\",\"year\":2024,\"value_usd_m\":0,\"cagr_pct\":0,\"reliability\":\"High | Medium | Low\",\"scope\":\"what the number includes\",\"url\":\"\"}],\"view\":\"two sentences on which figures you trust most for a US-focused definition and why\"}`;\n  try {\n    const r = await sample.json(prompt, { modelTier: \"complex\", cache: false });\n    const okUrl = new Set(found.map(x => x.url));\n    const got = (r?.sources || []).filter(x => x?.source && num(x.value_usd_m));\n    const have = new Set((t.sources || []).map(x => norm(x.source) + (x.year || \"\")));\n    const fresh = got.filter(x => !have.has(norm(x.source) + (x.year || \"\"))).map(x => ({ source: x.source, kind: x.kind || \"\", geography: GEOS.includes(x.geography) ? x.geography : \"Global\", year: x.year || \"\", value_usd_m: num(x.value_usd_m), cagr_pct: num(x.cagr_pct), reliability: !found.length ? \"Low\" : LEVELS.includes(x.reliability) && x.reliability !== \"Verified\" ? x.reliability : \"Medium\", scope: (found.length ? \"\" : \"From Claude's knowledge, not checked on the web. \") + (x.scope || \"\"), url: okUrl.has(x.url) ? x.url : \"\", by: found.length ? \"Claude + web\" : \"Claude\" }));\n    await saveTam(sid, { sources: [...(t.sources || []), ...fresh], view: r?.view || t.view || \"\", geo: t.geo || \"US\", base_year: t.base_year || new Date().getFullYear() - 1, searched_at: now() });\n    const tri = triangulate(tams[sid] || {});\n    toast((webNote ? webNote + \": used Claude's knowledge (rated Low). Use Deep research for a full web search. \" : \"\") + (fresh.length ? `${fresh.length} source${fresh.length === 1 ? \"\" : \"s\"} added${tri.tam ? ` \u00b7 TAM ${fmtM(tri.tam)}` : \"\"}` : \"No new market-size figures found.\"));\n  } catch (e) {\n    if (e?.code === \"not_granted\" || e?.code === \"sampling_disabled\") sample = null;\n    toast((ERRMSG[e?.code] || \"Couldn't finish sizing the market.\") + (e?.code ? ` [${e.code}]` : \"\"));\n  }\n  delete tamBusy[sid]; render();\n}\nasync function suggestCompanies(sid) {\n  const sec = sectorById(sid); if (!sample || tamBusy[sid]) return;\n  tamBusy[sid] = \"Finding companies to add\"; render();\n  const t = tams[sid] || {}, f = foundTam(sid), tam = tamValue(t);\n  const have = f.rows.map(x => x.c.name).slice(0, 200), ment = mentionedNotProfiled(sid).map(x => x.name);\n  const prompt = `You are helping complete a company database for the \"${sec.name}\" market (North America focus).\n\nMarket size: ${tam ? fmtM(tam) + ` (${t.geo || \"US\"})` : \"unknown\"}. Companies in the database sum to ${fmtM(f.total)}${tam ? `, so about ${fmtM(Math.max(0, tam - f.total))} of the market is not yet covered` : \"\"}.\nAlready in the database (skip these): ${have.join(\"; \") || \"none\"}.\n${ment.length ? `Names already mentioned in profiles but not yet profiled (include them if they belong in this market): ${ment.join(\"; \")}` : \"\"}\n\nSuggest up to 25 companies that would close the gap, largest first: leaders missing from the list, then the PE-backed and founder-owned mid-market. Work from what you know; you cannot browse. Only include companies you are confident really exist; never make one up.\n\nReply with ONLY a JSON array:\n[{\"name\":\"\",\"hq_address\":\"City, ST\",\"owner_type\":\"PE-owned | Public | Family/founder-owned | ESOP | Subsidiary of strategic | Other\",\"pe_sponsor\":\"\",\"business_model\":\"\",\"total_revenue_usd_m\":0,\"sector_revenue_usd_m\":0,\"sector_pct\":0,\"why\":\"one line on why it belongs\"}]`;\n  try {\n    const rows = await sample.json(prompt, { modelTier: \"complex\", cache: false });\n    const cur = new Set((t.suggestions || []).map(x => norm(x.name)));\n    const fresh = (Array.isArray(rows) ? rows : []).filter(x => x?.name && !findCompanyByName(x.name) && !cur.has(norm(x.name)));\n    await saveTam(sid, { suggestions: [...fresh, ...(t.suggestions || [])].slice(0, 60) });\n    toast(`${fresh.length} companies suggested`);\n  } catch (e) { if (e?.code === \"not_granted\" || e?.code === \"sampling_disabled\") sample = null; toast(ERRMSG[e?.code] || \"Couldn't suggest companies. Try again.\"); }\n  delete tamBusy[sid]; render();\n}\n\nfunction viewTam() {\n  const sid = ui.sector;\n  if (!sid) {\n    const rows = wsSectors().map(x => { const t = tams[x.id], tv = tamValue(t), f = foundTam(x.id); return { x, t, tv, f }; }).filter(r => r.f.rows.length || r.tv);\n    return `\u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">All sectors\u003c/div>\u003ch1>Market size\u003c/h1>\u003cp>Each sector's TAM, triangulated from industry sources, against the revenue of the companies already in the CRM. Pick a sector to see its sources and fill its gaps.\u003c/p>\u003c/div>\u003c/div>\n    \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Sector\u003c/th>\u003cth class=\"r\">TAM\u003c/th>\u003cth>Geography\u003c/th>\u003cth class=\"r\">Found in the CRM\u003c/th>\u003cth class=\"r\">Coverage\u003c/th>\u003cth class=\"r\">Companies\u003c/th>\u003cth class=\"r\">Sources\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${rows.map(r => `\u003ctr class=\"link\" data-setsector-tam=\"${esc(r.x.id)}\">\u003ctd class=\"cname\">${esc(r.x.name)}\u003c/td>\u003ctd class=\"r num\">${fmtM(r.tv)}\u003c/td>\u003ctd class=\"muted\">${esc(r.t?.geo || \"\")}\u003c/td>\u003ctd class=\"r num\">${fmtM(r.f.total)}\u003c/td>\u003ctd class=\"r num\">${r.tv ? Math.round(r.f.total / r.tv * 100) + \"%\" : \"\u2014\"}\u003c/td>\u003ctd class=\"r num\">${r.f.rows.length}\u003c/td>\u003ctd class=\"r num\">${(r.t?.sources || []).length}\u003c/td>\u003c/tr>`).join(\"\") || `\u003ctr>\u003ctd colspan=\"7\" class=\"faint\">No sectors sized yet.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>`;\n  }\n  const sec = sectorById(sid), t = tams[sid] || {}, tri = triangulate(t), tv = tamValue(t), f = foundTam(sid), busy = tamBusy[sid];\n  const cov = tv ? f.total / tv * 100 : null, top10 = f.rows.slice(0, 10).reduce((s, x) => s + x.r, 0);\n  const canW = false, canC = canEnhance();\n  const srcRows = tri.rows.map(r => `\u003ctr class=\"${r.inGeo ? \"\" : \"dim\"}\">\n    ${[\"source\", \"kind\"].map(k => `\u003ctd contenteditable=\"${canW ? \"plaintext-only\" : \"false\"}\" data-tam=\"${sid}\" data-r=\"${r.i}\" data-k=\"${k}\" data-t=\"text\">${esc(r[k] || \"\")}\u003c/td>`).join(\"\")}\n    \u003ctd>\u003cselect data-tamsel=\"geography\" data-r=\"${r.i}\" ${canW ? \"\" : \"disabled\"}>${GEOS.map(g => `\u003coption ${g === (r.geography || \"US\") ? \"selected\" : \"\"}>${g}\u003c/option>`).join(\"\")}\u003c/select>\u003c/td>\n    ${[[\"year\", \"text\"], [\"value_usd_m\", \"num\"], [\"cagr_pct\", \"num\"]].map(([k, ty]) => `\u003ctd class=\"${ty === \"num\" ? \"r num\" : \"num\"}\" contenteditable=\"${canW ? \"plaintext-only\" : \"false\"}\" data-tam=\"${sid}\" data-r=\"${r.i}\" data-k=\"${k}\" data-t=\"${ty}\" data-ph=\"\u2013\">${esc(ty === \"num\" ? fmtInt(r[k]) : r[k] || \"\")}\u003c/td>`).join(\"\")}\n    \u003ctd>\u003cselect data-tamsel=\"reliability\" data-r=\"${r.i}\" ${canW ? \"\" : \"disabled\"}>${[\"High\", \"Medium\", \"Low\"].map(g => `\u003coption ${g === (r.reliability || \"Medium\") ? \"selected\" : \"\"}>${g}\u003c/option>`).join(\"\")}\u003c/select>\u003c/td>\n    \u003ctd class=\"r num\">${r.inGeo ? fmtM(r.adj) : \"\u2014\"}\u003c/td>\n    \u003ctd class=\"r num\">${r.inGeo ? (r.outlier ? `\u003cspan class=\"cb cl\" title=\"Far from the median, so it counts a quarter as much\">Outlier\u003c/span>` : `${Math.round(r.w / (tri.rows.filter(x => x.inGeo).reduce((s, x) => s + x.w, 0) || 1) * 100)}%`) : `\u003cspan class=\"faint\">Other geo\u003c/span>`}\u003c/td>\n    \u003ctd class=\"muted\" style=\"font-size:12px\">${esc(r.scope || \"\")}${r.url ? ` \u003ca href=\"${esc(r.url)}\" target=\"_blank\" rel=\"noopener\">Link\u003c/a>` : \"\"}\u003c/td>\n    \u003ctd>${canW ? `\u003cbutton class=\"x\" style=\"opacity:1\" data-act=\"deltam\" data-r=\"${r.i}\" aria-label=\"Remove source\">\u00d7\u003c/button>` : \"\"}\u003c/td>\u003c/tr>`).join(\"\");\n  const ment = mentionedNotProfiled(sid), sugg = (t.suggestions || []).filter(x => !findCompanyByName(x.name));\n  return `\u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">${esc(sec.name)}\u003c/div>\u003ch1>Market size\u003c/h1>\u003cp>The TAM is triangulated from the sources below: each is brought forward to ${tri.base} with its growth rate, weighted by reliability, and outliers count for less. Found TAM adds up the ${esc(sec.short)} revenue of the companies already in the CRM.\u003c/p>\u003c/div>\n    \u003cdiv class=\"add\">${canC ? `\u003cbutton class=\"btn enh\" data-act=\"tamsources\" ${busy ? \"disabled\" : \"\"}>Find market-size sources\u003c/button>` : \"\"}${canW ? `\u003cbutton class=\"btn\" data-act=\"tamdeep\" title=\"Queue this market for the hourly research session, which uses Claude's own web search (no free-search limit)\">${researchDocs.some(r => r.company_id === \"tam:\" + sid && [\"queued\", \"running\"].includes(r.status)) ? \"Deep research queued\" : \"Deep research this market\"}\u003c/button>` : \"\"}\u003c/div>\u003c/div>\n  ${busy ? `\u003cdiv class=\"run\" role=\"status\">\u003cspan class=\"spin\">\u003c/span>\u003cspan>\u003cb>${esc(busy)}.\u003c/b> This usually takes a minute or two.\u003c/span>\u003c/div>` : \"\"}\n  \u003cdiv class=\"tiles\" style=\"margin-bottom:22px\">\n    ${tile(`TAM ${num(t.override_usd_m) !== null ? `\u003cspan class=\"cb cv\">Verified\u003c/span>` : tri.n ? `\u003cspan class=\"cb ${tri.n >= 3 ? \"ch\" : \"cm\"}\">${tri.n} source${tri.n > 1 ? \"s\" : \"\"}\u003c/span>` : \"\"}`, `\u003cspan class=\"u\">$\u003c/span>\u003cspan contenteditable=\"${canW ? \"plaintext-only\" : \"false\"}\" data-tamov=\"${sid}\" data-t=\"num\" data-ph=\"\u2013\" title=\"Type to set your own TAM\">${esc(fmtInt(tv))}\u003c/span>\u003cspan class=\"u\">M\u003c/span>`, num(t.override_usd_m) !== null ? `Your figure \u00b7 triangulated ${fmtM(tri.tam)}` : tri.n ? `Range ${fmtM(tri.lo)}\u2013${fmtM(tri.hi)}` : \"Add sources or type a figure\", null)}\n    ${tile(\"Geography & year\", `\u003cselect id=\"tamgeo\" ${canW ? \"\" : \"disabled\"}>${GEOS.map(g => `\u003coption ${g === tri.geo ? \"selected\" : \"\"}>${g}\u003c/option>`).join(\"\")}\u003c/select> \u003cselect id=\"tamyear\" ${canW ? \"\" : \"disabled\"}>${[2023, 2024, 2025, 2026].map(y => `\u003coption ${y === tri.base ? \"selected\" : \"\"}>${y}\u003c/option>`).join(\"\")}\u003c/select>`, `Growth assumed ${tri.medC.toFixed(1)}% where a source has none`, null, \"\", true)}\n    ${tile(\"Found in the CRM\", `\u003cspan class=\"u\">$\u003c/span>${fmtInt(Math.round(f.total))}\u003cspan class=\"u\">M\u003c/span>`, `${f.rows.length} companies with ${esc(sec.short)} revenue`, null)}\n    ${tile(\"Coverage\", cov !== null ? `${Math.round(cov)}\u003cspan class=\"u\">%\u003c/span>` : \"\u2014\", tv ? `Gap ${fmtM(Math.max(0, tv - f.total))}${sid === \"water\" ? \" \u00b7 includes distributor resale\" : \"\"}` : \"Needs a TAM\", null)}\n  \u003c/div>\n  ${tv ? `\u003cdiv class=\"cov\">\u003cdiv class=\"cov-f\" style=\"width:${Math.min(100, cov).toFixed(1)}%\">\u003c/div>\u003c/div>\u003cp class=\"faint\" style=\"font-size:12px;margin:6px 0 22px\">Top 10 companies hold ${Math.round(top10 / tv * 100)}% of the TAM.\u003c/p>` : \"\"}\n  ${t.view ? `\u003cdiv class=\"take\" style=\"margin-bottom:22px\">\u003cdiv class=\"eyebrow\">Claude's read on the sources\u003c/div>${esc(t.view)}\u003c/div>` : \"\"}\n  \u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Market-size sources\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">Values in $M. Edit any cell; reliability and geography change the weighting.\u003c/span>\u003cspan class=\"sp\">\u003c/span>${canW ? `\u003cbutton class=\"btn sm ghost\" data-act=\"addtam\">Add source\u003c/button>` : \"\"}\u003c/div>\n    \u003cdiv class=\"tw\">\u003ctable class=\"tamt\">\u003cthead>\u003ctr>\u003cth>Source\u003c/th>\u003cth>Type\u003c/th>\u003cth>Geography\u003c/th>\u003cth>Year\u003c/th>\u003cth class=\"r\">Value $M\u003c/th>\u003cth class=\"r\">CAGR %\u003c/th>\u003cth>Reliability\u003c/th>\u003cth class=\"r\">At ${tri.base}\u003c/th>\u003cth class=\"r\">Weight\u003c/th>\u003cth>Scope\u003c/th>\u003cth>\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${srcRows || `\u003ctr>\u003ctd colspan=\"11\" class=\"faint\">No sources yet. ${canC ? \"Hit Find market-size sources, or add one you have.\" : \"Add one you have.\"}\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n  \u003cdiv class=\"sec grid2\">\n    \u003cdiv>\u003cdiv class=\"sec-h\">\u003ch2>Found TAM by company\u003c/h2>\u003c/div>\n      \u003cdiv class=\"panel bars\" style=\"padding:6px\">${f.rows.slice(0, 15).map((x, i) => `\u003cdiv class=\"brow\" data-open=\"${esc(x.c.id)}\" data-tip=\"${esc(x.c.name)}: ${fmtM(x.r)}${tv ? \" \u00b7 \" + (x.r / tv * 100).toFixed(1) + \"% of TAM\" : \"\"}\">\u003cspan class=\"rk\">${i + 1}\u003c/span>\u003cspan class=\"nm\">${esc(x.c.name)}\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"width:${(x.r / (f.rows[0]?.r || 1) * 100).toFixed(1)}%\">\u003c/div>\u003c/div>\u003cspan class=\"v\">${fmtM(x.r)}\u003c/span>\u003c/div>`).join(\"\") || `\u003cp class=\"faint\" style=\"padding:12px\">No companies with revenue in this sector yet.\u003c/p>`}\n      ${f.rows.length > 15 ? `\u003cp class=\"faint\" style=\"padding:4px 12px;font-size:12px\">+ ${f.rows.length - 15} more companies, ${fmtM(f.rows.slice(15).reduce((s, x) => s + x.r, 0))}\u003c/p>` : \"\"}\u003c/div>\u003c/div>\n    \u003cdiv>\n      \u003cdiv class=\"sec-h\">\u003ch2>Names to add\u003c/h2>\u003cspan class=\"sp\">\u003c/span>${canC ? `\u003cbutton class=\"btn sm enh\" data-act=\"tamsuggest
