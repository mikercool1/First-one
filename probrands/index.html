\n    const ths = [...(t.tHead?.rows[0]?.cells || [])], heads = ths.map(h => h.innerText.replace(/[\u2191\u2193]/g, \"\").trim());\n    if (!heads.length) continue;\n    const cmp = heads.length >= 4 && !t.classList.contains(\"clist\") && !t.querySelector(\"[contenteditable],input,select,textarea\");\n    t.classList.toggle(\"cmp\", cmp);\n    const keys = ths.map(h => h.classList.contains(\"k\"));\n    for (const r of t.tBodies[0]?.rows || []) [...r.cells].forEach((td, i) => { if (td.tagName === \"TD\" && heads[i] && !td.hasAttribute(\"colspan\")) { td.dataset.label = heads[i]; if (cmp && keys[i]) td.classList.add(\"k\"); } });\n  }\n}\n\n/* ---------- chat: ask and tell, with web search; Claude proposes changes, code checks and saves them ---------- */\nconst CHAT_FIELDS = [\"ev_usd_m\", \"what_it_is\", \"business_model\", \"owner_type\", \"ultimate_parent\", \"pe_sponsor\", \"pe_entry_year\", \"prior_owners\", \"hq_address\", \"website\", \"total_revenue_usd_m\", \"total_revenue_year\", \"total_revenue_basis\", \"employees_total\", \"employees_basis\"];\nconst CHAT_LISTS = { fin_history: \"financials\", management: \"overview\", segment_profiles: \"segments\", products: \"products\", acquisitions: \"deals\", customers: \"customers\", competitors: \"competitors\", buyers: \"buyers\", addon_ideas: \"addons\" };\nconst rowName = r => r ? String(r.name || r.target || (r.year ? String(r.year) : \"\") || [r.category, r.line].filter(Boolean).join(\" / \") || r.product || \"\") : \"\";\nconst chat = { id: null, open: false };\n// Each company keeps its own conversation, so a build can keep running while you look at another company.\nconst chatStore = new Map();\nconst cst = id => { if (!chatStore.has(id)) chatStore.set(id, { msgs: [], busy: null, loaded: false }); return chatStore.get(id); };\nasync function chatLoad(id) {\n  const S = cst(id); if (S.loaded) return S; S.loaded = true;\n  try { const d = await db.doc(\"chats/\" + id).get(); if (d.exists && !S.msgs.length) S.msgs = d.data().messages || []; } catch {}\n  if (chat.id === id) chatMsgs();\n  return S;\n}\n// Saved chats stay well under the 256 KB document limit: undo is kept for the latest replies only, and the\n// oldest messages drop off first.\nfunction chatSave(id) {\n  const all = cst(id).msgs.slice(-40), n = all.length;\n  let msgs = all.map((m, i) => { const o = { ...m, pending: false, text: String(m.text || \"\").slice(0, 6000), activity: (m.activity || []).slice(-12) }; if (i \u003c n - 6) delete o.undo; return o; });\n  while (msgs.length > 2 && JSON.stringify(msgs).length > 180000) msgs = msgs.slice(2);\n  return db.doc(\"chats/\" + id).set({ messages: clean(msgs), updated_at: now() }).catch(e => console.warn(\"chat save\", e));\n}\nconst chatEl = $(\"#chat\"), chatFab = $(\"#chatFab\");\nfunction mdLite(t) {\n  let h = esc(String(t || \"\"));\n  h = h.replace(/\\[([^\\]]{1,200})\\]\\((https?:\\/\\/[^\\s)]+)\\)/g, (m, a, u) => `\u003ca href=\"${u}\" target=\"_blank\" rel=\"noopener\">${a}\u003c/a>`);\n  h = h.replace(/(^|[\\s(])(https?:\\/\\/[^\\s\u003c)]+)/g, (m, pre, u) => `${pre}\u003ca href=\"${u}\" target=\"_blank\" rel=\"noopener\">${u.replace(/^https?:\\/\\/(www\\.)?/, \"\").slice(0, 40)}\u003c/a>`);\n  h = h.replace(/\\*\\*([^*]{1,300})\\*\\*/g, \"\u003cb>$1\u003c/b>\").replace(/\\n/g, \"\u003cbr>\");\n  return h;\n}\nfunction chatView() {\n  const r = route(), onCo = r.view === \"company\" && getC(r.id) && !!db;\n  if (onCo) chat.id = r.id;\n  const S0 = onCo ? cst(r.id) : null;\n  chatFab.hidden = !onCo || chat.open;\n  chatFab.textContent = S0?.busy ? \"Chat \u00b7 working\u2026\" : \"Chat\";\n  chatFab.classList.toggle(\"live\", !!S0?.busy);\n  document.body.classList.toggle(\"chat-open\", !!(onCo && chat.open));\n  if (!onCo || !chat.open) { chatEl.hidden = true; return; }\n  const c = getC(r.id);\n  if (!cst(c.id).loaded) chatLoad(c.id);\n  if (!chatEl.firstChild) {\n    chatEl.innerHTML = `\u003cdiv class=\"chat-h\">\u003cb id=\"chatTitle\">\u003c/b>\u003cspan class=\"pill\" id=\"chatWeb\">\u003c/span>\u003cbutton class=\"btn sm ghost\" id=\"chatClear\" title=\"Clear this conversation\">Clear\u003c/button>\u003cbutton class=\"btn sm ghost\" id=\"chatClose\" aria-label=\"Close chat\">Close\u003c/button>\u003c/div>\n      \u003cdiv class=\"chat-m\" id=\"chatMsgs\" aria-live=\"polite\">\u003c/div>\n      \u003cdiv class=\"chat-hint\" id=\"chatHint\">\u003c/div>\n      \u003cform class=\"chat-f\" id=\"chatForm\">\u003ctextarea id=\"chatIn\" rows=\"2\" placeholder=\"Ask or tell, e.g. \u201cFind their product brands\u201d or \u201cRevenue is $40M per the CIM\u201d\" aria-label=\"Message\">\u003c/textarea>\u003cbutton class=\"btn primary\" id=\"chatSend\" type=\"submit\">Send\u003c/button>\u003c/form>`;\n    $(\"#chatClose\").onclick = () => { chat.open = false; chatView(); };\n    $(\"#chatClear\").onclick = () => { const S = cst(chat.id); if (S.busy) return; S.msgs = []; chatMsgs(); chatSave(chat.id); };\n    $(\"#chatForm\").onsubmit = e => { e.preventDefault(); const S = cst(chat.id); if (S.busy) { S.busy.abort(); return; } const t = $(\"#chatIn\").value.trim(); if (t) { $(\"#chatIn\").value = \"\"; chatSend(chat.id, t); } };\n    $(\"#chatIn\").onkeydown = e => { if (e.key === \"Enter\" && !e.shiftKey) { e.preventDefault(); $(\"#chatForm\").requestSubmit(); } };\n    chatEl.addEventListener(\"click\", e => { const b = e.target.closest(\"[data-undo]\"); if (b) chatUndo(+b.dataset.undo); });\n  }\n  chatEl.hidden = false;\n  $(\"#chatTitle\").textContent = c.name;\n  $(\"#chatWeb\").textContent = webOK ? \"Web on\" : \"Web off\"; $(\"#chatWeb\").className = \"pill \" + (webOK ? \"accent\" : \"warn\");\n  $(\"#chatHint\").textContent = !sample ? \"Claude isn't available on this page right now. Open Probrands inside claude.ai (not a public link), signed in, and allow Claude when asked.\" + (sampleIssue ? \" (\" + sampleIssue + \")\" : \"\")\n    : webOK ? \"Searches the web, shows its work, and saves what it finds to this profile. Every save can be undone.\"\n    : \"Web search is off\" + (webIssue ? \" (\" + webIssue + \")\" : \" (connect Parallel Search in claude.ai Settings \u2192 Connectors)\") + \". Chat still answers and saves what you tell it.\";\n  $(\"#chatSend\").textContent = cst(c.id).busy ? \"Stop\" : \"Send\";\n  chatMsgs();\n}\nlet chatRaf = 0;\nfunction chatMsgs() {\n  if (chatRaf) return;\n  chatRaf = requestAnimationFrame(() => {\n    chatRaf = 0;\n    const box = $(\"#chatMsgs\"); if (!box || !chat.id) return;\n    const S = cst(chat.id);\n    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight \u003c 60;\n    box.innerHTML = S.msgs.length ? S.msgs.map((m, i) => m.role === \"user\" ? `\u003cdiv class=\"msg cu${m.step ? \" cstep\" : \"\"}\">${esc(m.text)}\u003c/div>` :\n      `\u003cdiv class=\"msg ca\">${(m.activity || []).length ? `\u003cdiv class=\"act\">${m.activity.map(a => `\u003cspan>${esc(a)}\u003c/span>`).join(\"\")}\u003c/div>` : \"\"}${m.text ? mdLite(m.text) : m.pending ? `\u003cspan class=\"faint\">\u003cspan class=\"spin\">\u003c/span> Thinking\u2026\u003c/span>` : \"\"}${m.error ? `\u003cdiv class=\"saved\">\u003cdiv class=\"no\">${esc(m.error)}\u003c/div>\u003c/div>` : \"\"}${(m.saved || []).length || (m.rejected || []).length ? `\u003cdiv class=\"saved\">${(m.saved || []).map(x => `\u003cdiv>Saved: ${esc(x)}\u003c/div>`).join(\"\")}${(m.rejected || []).map(x => `\u003cdiv class=\"no\">Not saved: ${esc(x)}\u003c/div>`).join(\"\")}${m.undo && !m.undone ? `\u003cbutton class=\"btn sm ghost\" data-undo=\"${i}\" style=\"margin-top:6px\">Undo\u003c/button>` : m.undone ? `\u003cdiv class=\"faint\">Undone\u003c/div>` : \"\"}\u003c/div>` : \"\"}\u003c/div>`).join(\"\")\n      : `\u003cdiv class=\"faint\" style=\"font-size:13px\">Try: \u201cWhat products do they sell? Add the brands.\u201d \u00b7 \u201cDid they make any acquisitions since 2020?\u201d \u00b7 \u201cWho owns them and since when?\u201d \u00b7 \u201cRevenue is about $40M per the CIM.\u201d \u00b7 \u201cFind their top competitors.\u201d\u003c/div>`;\n    if (atBottom || S.busy) box.scrollTop = box.scrollHeight;\n  });\n}\nfunction chatContext(c) {\n  const rows = Object.keys(CHAT_LISTS).map(L => { const a = L === \"products\" ? catalog(c) : (c[L] || []); return a.length ? `${L}: ${a.slice(0, 40).map(rowName).filter(Boolean).join(\"; \")}` : `${L}: (none)`; }).join(\"\\n\");\n  const d = c.dossier?.items?.length ? `\\nEARLIER WEB RESEARCH ON FILE (${fmtDate(c.dossier.at)}): ${c.dossier.items.slice(0, 20).map(x => x.title + \" \u003c\" + x.url + \">\").join(\"; \")}` : \"\";\n  return `COMPANY: ${c.name}${c.what_it_is ? \" \u2014 \" + c.what_it_is : \"\"}${c.hq_address ? \" \u00b7 \" + c.hq_address : \"\"}${c.website ? \" \u00b7 \" + c.website : \"\"}\nWHAT THE PROFILE KNOWS (Verified = set by the user):\n${knowledgeBase(c) || \"Only the name.\"}\nEXISTING ROWS (use these exact names to update instead of adding duplicates):\n${rows}${d}`;\n}\nconst CHAT_RULES = `You are the research assistant inside the Probrands CRM, a buy-side M&A database of US professional brands: companies that own brands of handheld chemical products (lubricants, sealants, adhesives, cleaners, coatings and the like) sold to tradespeople and maintenance pros through distributors. You are working on ONE company with the user. You can search the web (search_web), read pages (read_pages), and save to the profile (record).\n\nHOW TO WORK\n- Before each tool call, write one short line saying what you're checking and why (the user sees your thinking). After results, say in a line what you found.\n- Web searches are rationed: use as few as you need (usually 1-3 per turn), put 2-3 queries in one search_web call rather than several calls, and don't search again for what this conversation or the profile already shows.\n- Search first for anything factual you weren't told. Use 2-3 short queries per search_web call. Prefer the company's own site, filings, press releases, deal announcements and trade press. Read a page only when excerpts aren't enough (e.g. a full product list).\n- Then call record ONCE with every change worth saving: what the user asked for, plus solid new facts you found. Don't call record if nothing should change.\n- Finally answer briefly in plain language, with source links, and say what you saved.\n\nRECORD RULES (code enforces these)\n- source \"web\": list the exact URLs you got from search_web/read_pages this turn or the research on file. No URL, no save.\n- source \"user\": the user told you directly in this conversation. Saved as Verified.\n- source \"knowledge\": your own memory; saved Low only where nothing better exists.\n- confidence: High only when a source states it; Medium for estimates built from sourced facts (put the math in basis).\n- Fields for set_field: ${CHAT_FIELDS.join(\", \")}. Money in USD millions (numbers only).\n- Lists for add_row/update_row/remove_row: fin_history {year, revenue_usd_m, basis: \"Reported | Estimate | Pro forma\", source} (one row per fiscal year; \"match\" is the year), management {name, title, since, background, linkedin} (current leadership team and board chair), segment_profiles {name, revenue_usd_m, products, end_markets, competitors, description} (one row per reported business segment; use for public companies and anyone with disclosed segments), products {category, line, named_products, what_it_is, applications, end_markets[], made_or_resold, share_pct}, acquisitions {date, target, deal_type, what_it_does, what_it_added, value_usd_m}, customers {name, end_market, what, share_pct}, competitors {name, overlap, size}, buyers {name, type, fit, rationale}, addon_ideas {target, rationale, est_revenue_usd_m, location}.\n- set_step: for a builder step (when a STEP BRIEF is given, or to rebuild a whole section): \"step\" is the step key and \"value\" is that step's full object in its shape, with \"confidence\", \"basis\" and \"note\".\n- update_row/remove_row: \"match\" is the existing row's name exactly as listed. Never invent names, figures or deals.\n- Revenue: first find the latest REPORTED number and when it was reported and for what period (press and deal releases, top-company lists, executive LinkedIn bios often state it). Then make it pro forma: add acquisitions closed after that period (their revenue), subtract divestitures, and cross-check with pro forma headcount \u00d7 revenue per employee. Put the bridge in total_revenue_basis via set_step \"financials\" (or state it in basis). A pre-acquisition figure is not current.\n- Stay on this exact company; ignore look-alikes.`;\nfunction chatTools(c, seen, msg) {\n  const act = t => { msg.activity = [...(msg.activity || []), t].slice(-30); chatMsgs(); };\n  const slim = rs => rs.slice(0, 8).map(r => { if (r.url) seen.add(r.url); return { title: r.title, url: r.url, date: r.publish_date || \"\", text: clip((r.excerpts || []).join(\"\\n\"), 1800) }; });\n  const tools = [];\n  if (webOK) tools.push(\n    { name: \"search_web\", description: \"Search the web. Returns up to 8 results with title, URL, date and excerpts that usually answer directly.\", inputSchema: { type: \"object\", properties: { objective: { type: \"string\" }, queries: { type: \"array\", items: { type: \"string\" }, description: \"2-3 keyword queries, 3-6 words each\" } }, required: [\"objective\", \"queries\"] },\n      execute: async (i, ctx) => { const qs = [].concat(i.queries || []).map(String).filter(Boolean).slice(0, 3); act(\"Searching: \" + (qs.join(\" \u00b7 \") || i.objective)); const rs = await webCall(\"web_search\", { objective: String(i.objective || qs[0] || \"\").slice(0, 300), search_queries: qs.length ? qs : [String(i.objective).slice(0, 60)] }, ctx.signal); act(rs.length ? `Found ${rs.length} results${rs.cached ? \" (saved earlier, no search used)\" : \"\"}` : webIssue === \"search timed out\" ? \"Search timed out; carrying on with what we have\" : \"No results (or the free search limit is reached)\"); return clip(slim(rs), 14000); } },\n    { name: \"read_pages\", description: \"Read up to 3 web pages and return the parts relevant to the objective.\", inputSchema: { type: \"object\", properties: { urls: { type: \"array\", items: { type: \"string\" } }, objective: { type: \"string\" } }, required: [\"urls\"] },\n      execute: async (i, ctx) => { const us = [].concat(i.urls || []).map(String).filter(u => /^https?:\\/\\//.test(u)).slice(0, 3); if (!us.length) throw new Error(\"Give full http(s) URLs.\"); act(\"Reading: \" + us.map(u => domainOf(u) + u.replace(/^https?:\\/\\/[^/]+/, \"\").slice(0, 30)).join(\", \")); const rs = await webCall(\"web_fetch\", { urls: us, objective: String(i.objective || \"\").slice(0, 200) || null }, ctx.signal); return clip(slim(rs), 14000); } });\n  tools.push({ name: \"record\", description: \"Save changes to this company's profile. Call once per turn with every change. Returns what was saved and what was refused and why.\",\n    inputSchema: { type: \"object\", properties: { actions: { type: \"array\", items: { type: \"object\", properties: {\n      type: { type: \"string\", enum: [\"set_field\", \"add_row\", \"update_row\", \"remove_row\", \"user_fact\", \"set_step\"] },\n      step: { type: \"string\", enum: SECTION_ORDER, description: \"set_step: builder step key\" },\n      field: { type: \"string\", description: \"set_field: field name\" }, value: { description: \"set_field: new value; set_step: the full step object\" },\n      list: { type: \"string\", enum: Object.keys(CHAT_LISTS) }, match: { type: \"string\", description: \"update_row/remove_row: existing row name\" },\n      row: { type: \"object\", description: \"add_row/update_row: row fields\" }, text: { type: \"string\", description: \"user_fact: the fact in one sentence\" },\n      source: { type: \"string\", enum: [\"web\", \"user\", \"knowledge\"] }, source_urls: { type: \"array\", items: { type: \"string\" } },\n      confidence: { type: \"string\", enum: [\"High\", \"Medium\", \"Low\"] }, basis: { type: \"string\" } }, required: [\"type\", \"source\"] } } }, required: [\"actions\"] },\n    execute: async i => {\n      act(\"Saving to the profile\");\n      const all = Array.isArray(i.actions) ? i.actions : [];\n      const st = await applySteps(c.id, all.filter(a => a?.type === \"set_step\"), seen, msg);\n      const r = await applyChat(c.id, all.filter(a => a?.type !== \"set_step\"), seen);\n      const saved = [...st.saved, ...r.saved], rejected = [...st.rejected, ...r.rejected];\n      msg.saved = [...(msg.saved || []), ...saved]; msg.rejected = [...(msg.rejected || []), ...rejected];\n      const before = { ...(r.undo?.before || {}), ...(st.before || {}) };\n      if (Object.keys(before).length) msg.undo = { id: c.id, before: { ...before, ...(msg.undo?.before || {}) } };\n      chatMsgs(); return { saved, not_saved: rejected };\n    } });\n  return tools;\n}\n// Claude may not have answered at startup (or was allowed only later): ask again before giving up.\nasync function ensureSample() {\n  if (sample || !CLAUDE?.use) return !!sample;\n  try { const s = await CLAUDE.use(\"sample\"); if (s) { sample = s; sampleIssue = \"\"; } else { try { sampleIssue = window.parent.PBHB?.why?.(\"sample\") || sampleIssue; } catch {} } } catch {}\n  return !!sample;\n}\nasync function chatSend(id, text, opts = {}) {\n  const c = getC(id), S = await chatLoad(id); if (!c || S.busy) return false;\n  await ensureSample();\n  if (!sample) { S.msgs.push({ role: \"user\", text, at: now() }, { role: \"assistant\", text: \"\", error: \"Claude isn't available on this page right now, so I can't answer. Open Probrands inside claude.ai while signed in (not through a public link), and allow Claude when it asks.\" + (sampleIssue ? \" [\" + sampleIssue + \"]\" : \"\"), at: now() }); chatView(); return false; }\n  const ctl = new AbortController(); S.busy = ctl;\n  // Watchdog: a turn that hasn't finished in 5 minutes is stopped and says so, instead of spinning.\n  const dog = setTimeout(() => { ctl.timedOut = true; ctl.abort(); }, 300000);\n  const rk = opts.step ? runKey(id, opts.step) : null;\n  if (rk) { runs[rk] = { ctl, msg: \"Researching in chat\u2026\" }; render(); }\n  S.msgs.push({ role: \"user\", text: text.slice(0, 4000), step: opts.step || null, at: now() });\n  const msg = { role: \"assistant\", text: \"\", activity: [], pending: true, at: now() }; S.msgs.push(msg);\n  chatView();\n  if (webOK) await webSetup();\n  const seen = new Set((c.dossier?.items || []).map(x => x.url));\n  const hist = S.msgs.slice(0, -2).filter(m => m.text).slice(opts.step ? -6 : -10).map(m => ({ role: m.role, content: m.text.slice(0, opts.step ? 1500 : 3000) }));\n  while (hist.length && hist[0].role !== \"user\") hist.shift();\n  const turn = `${CHAT_RULES}\\n\\n${chatContext(c)}\\n\\n${opts.brief ? opts.brief + \"\\n\\n\" : \"\"}USER: ${text}`;\n  let ok = true;\n  try {\n    const run = () => sample([...hist, { role: \"user\", content: turn }], { modelTier: \"default\", signal: ctl.signal, tools: chatTools(c, seen, msg), onText: ({ text }) => { msg.text = text; chatMsgs(); } });\n    let r;\n    try { r = await run(); }\n    catch (e) {\n      // A dropped connection mid-turn: try once more. Anything already saved stays saved, and lists merge.\n      if (![\"upstream_error\", \"unavailable\", \"server_unavailable\", \"timeout\"].includes(e?.code) || ctl.signal.aborted) throw e;\n      msg.activity = [...(msg.activity || []), \"Connection dropped; retrying once\"]; msg.text = \"\"; chatMsgs();\n      await new Promise(res => setTimeout(res, 2500));\n      r = await run();\n    }\n    msg.text = r.text;\n  } catch (e) {\n    if (e?.text) msg.text = e.text;\n    msg.error = ctl.timedOut ? \"This took over 5 minutes, so I stopped it. Anything saved before that stays saved; try again or ask a narrower question.\" : e?.code === \"cancelled\" ? \"Stopped.\" : ((ERRMSG[e?.code] || \"Something went wrong.\") + (e?.code ? \" [\" + e.code + (e.message ? \": \" + String(e.message).slice(0, 120) : \"\") + \"]\" : \"\") + \" Try again.\");\n    if (e?.code === \"not_granted\" || e?.code === \"sampling_disabled\") { sample = null; sampleIssue = e.code; }\n    ok = false;\n  }\n  clearTimeout(dog); msg.pending = false; S.busy = null;\n  if (rk) {\n    delete runs[rk];\n    // The step counts as built once its turn finishes, even when nothing new turned up.\n    const cur = getC(id);\n    if (ok && cur && !msg.stepApplied) {\n      const prev = (cur.section_meta || {})[opts.step] || {};\n      await save(id, { section_meta: { ...(cur.section_meta || {}), [opts.step]: { at: now(), by: \"Chat\", note: (msg.saved || []).slice(0, 3).join(\"; \").slice(0, 300) || \"Researched; nothing new to save.\", passes: (prev.passes || 0) + 1 } } }, [], true);\n    }\n    if (ok && !chat.open) toast(`${SECTIONS[opts.step].label} built${(msg.saved || []).length ? \": \" + msg.saved.length + \" update\" + (msg.saved.length > 1 ? \"s\" : \"\") + \" saved\" : \"\"}`);\n    render();\n  }\n  chatView();\n  chatSave(id);\n  return ok;\n}\n// Builder buttons run through the chat: a detailed brief per step, researched the way a conversation would.\nfunction stepBrief(c, key) {\n  const sec = SECTIONS[key], pass = ((c.section_meta || {})[key]?.passes || 0) + 1;\n  const gaps = sectionDef(c, key).fields.filter(f => !PROSE.has(f) && !/_basis$|_arithmetic$/.test(f) && (!has(c[f]) || confOf(c, f).level === \"Low\")).map(f => `${label(f)} (${has(c[f]) ? \"Low confidence\" : \"missing\"})`);\n  const onFile = (c.evidence || []).filter(e => e.url).slice(0, 30).map(e => `- ${e.metric || \"\"}: ${e.url}`).join(\"\\n\");\n  return `STEP BRIEF: ${sec.label.toUpperCase()}${pass > 1 ? ` (pass ${pass})` : \"\"}\n${pass > 1 ? `THIS IS A REBUILD. Start from what the profile already has (below) and add to it; don't start over. Keep everything that is still right. Change a value only when new evidence is stronger, and say what changed : \"\"}`, { step: k, brief: stepBrief(c, k) });\n    if (!ok) break;\n  }\n  const c = getC(id); if (c && keys.length > 1) toast(`Profile strength now ${strength(c).pct}%`);\n}\nfunction coerce(f, v) {\n  if (/_usd_m$|_x$|^employees_total$/.test(f)) { const n = num(typeof v === \"string\" ? v.replace(/[$,~]/g, \"\") : v); return n; }\n  if (/_year$/.test(f)) return String(v ?? \"\").slice(0, 20);\n  return typeof v === \"string\" ? v.slice(0, 1500) : v == null ? null : String(v).slice(0, 1500);\n}\nfunction cleanRow(L, r) {\n  const o = {};\n  for (const [k, v] of Object.entries(r || {})) {\n    if (k === \"end_markets\") o[k] = [].concat(v || []).map(String).filter(Boolean).slice(0, 10);\n    else if (/_usd_m$|_pct$|_x$/.test(k)) o[k] = num(v);\n    else if (v != null && typeof v !== \"object\") o[k] = String(v).slice(0, 600);\n  }\n  return o;\n}\n// Apply chat actions under the same rules as everything else: sourced, never weaker over stronger, undoable.\nasync function applyChat(id, actions, seen) {\n  const cur = getC(id); if (!cur) return { saved: [], rejected: [\"The profile isn't loaded.\"] };\n  const locked = new Set(cur.locked || []), conf = { ...(cur.conf || {}) }, patch = {}, hist = [], saved = [], rejected = [], lockF = [], ev = [], secs = new Set();\n  const before = {};\n  const remember = f => { if (!(f in before)) before[f] = cur[f] === undefined ? null : clean(cur[f] ?? null); };\n  for (const a of actions.slice(0, 40)) {\n    const src = [\"web\", \"user\", \"knowledge\"].includes(a.source) ? a.source : \"knowledge\";\n    const urls = [].concat(a.source_urls || []).map(String).filter(u => seen.has(u));\n    const what = a.type === \"set_field\" ? label(a.field) : a.type === \"user_fact\" ? \"fact\" : `${a.list} row \u201c${rowName(a.row) || a.match || \"\"}\u201d`;\n    if (src === \"web\" && !urls.length) { rejected.push(`${what}: no source page found this turn`); continue; }\n    const level = src === \"user\" ? \"Verified\" : src === \"knowledge\" ? \"Low\" : (a.confidence === \"High\" ? \"High\" : a.confidence === \"Low\" ? \"Low\" : \"Medium\");\n    const basis = (String(a.basis || \"\") + (urls.length ? \" \u00b7 \" + urls.slice(0, 2).join(\" \") : src === \"user\" ? \" \u00b7 you said so in chat\" : \"\")).trim().slice(0, 400);\n    if (a.type === \"user_fact\") {\n      if (src !== \"user\" || !a.text) { rejected.push(\"fact: only things you tell me are saved as facts\"); continue; }\n      remember(\"source_of_truth\"); patch.source_of_truth = [...(patch.source_of_truth || cur.source_of_truth || []), { text: String(a.text).slice(0, 500), at: now() }]; saved.push(\"Your fact: \" + String(a.text).slice(0, 80)); continue;\n    }\n    if (a.type === \"set_field\") {\n      const f = a.field;\n      if (!CHAT_FIELDS.includes(f)) { rejected.push(`${f}: not a field chat can set`); continue; }\n      const v = coerce(f, a.value); if (v === null || v === \"\") { rejected.push(`${label(f)}: empty value`); continue; }\n      const old = confOf(cur, f).level;\n      if (src !== \"user\" && locked.has(f)) { rejected.push(`${label(f)}: you verified the current value`); continue; }\n      if (src !== \"user\" && has(cur[f]) && lvl(level) \u003c lvl(old)) { rejected.push(`${label(f)}: current value is better supported (${old})`); continue; }\n      remember(f); remember(\"conf\"); patch[f] = v;\n      if (src === \"user\") lockF.push(f); else conf[f] = { level, basis, at: now(), by: \"Chat\" };\n      hist.push({ at: now(), field: f, by: src === \"user\" ? \"You (chat)\" : \"Chat\", before: short(cur[f]), after: short(v), level });\n      saved.push(`${label(f)} \u2192 ${short(v)} (${level})`); secs.add(sectionOfField(f));\n    } else if (CHAT_LISTS[a.list]) {\n      const L = a.list;\n      if (!(L in patch)) { remember(L); patch[L] = clean(L === \"products\" ? catalog(cur) : (cur[L] || [])); }\n      const arr = patch[L], key = x => norm(x), m = a.match || rowName(a.row);\n      const idx = m ? arr.findIndex(r => key(rowName(r)) === key(m) || (L === \"products\" && (key(r.line) === key(m) || key(r.category) === key(m)))) : -1;\n      const row = cleanRow(L, a.row);\n      if (a.type === \"remove_row\") { if (idx \u003c 0) { rejected.push(`${L}: no row called \u201c${m}\u201d`); continue; } arr.splice(idx, 1); saved.push(`Removed ${L.replace(/_/g, \" \")} row \u201c${m}\u201d`); }\n      else {\n        if (!rowName(row) && idx \u003c 0) { rejected.push(`${L}: row has no name`); continue; }\n        const tagged = { ...row, confidence: level, source: urls[0] || (src === \"user\" ? \"You (chat)\" : \"Claude's knowledge\"), added_by: \"Chat\", added_at: now() };\n        if (idx >= 0) { arr[idx] = { ...arr[idx], ...tagged }; saved.push(`Updated ${L.replace(/_/g, \" \")}: ${rowName(arr[idx])} (${level})`); }\n        else if (a.type === \"update_row\") { rejected.push(`${L}: no row called \u201c${m}\u201d to update`); continue; }\n        else { arr.push(tagged); saved.push(`Added ${L.replace(/_/g, \" \")}: ${rowName(tagged)} (${level})`); }\n      }\n      if (!conf[L] || lvl(conf[L].level) \u003c lvl(level)) { remember(\"conf\"); conf[L] = { level: level === \"Verified\" ? \"High\" : level, basis: \"Updated in chat\", at: now(), by: \"Chat\" }; }\n      hist.push({ at: now(), field: L, by: \"Chat\", before: short(cur[L]), after: short(arr), level });\n      secs.add(CHAT_LISTS[L]);\n    } else { rejected.push(`${a.type}: unknown action`); continue; }\n    for (const u of urls) ev.push({ metric: what, value: String(a.basis || \"\").slice(0, 200), year: \"\", source_type: domainOf(u), url: u, quote: \"\", at: now(), by: \"Chat\" });\n  }\n  if (!saved.length) return { saved, rejected };\n  if (patch.acquisitions) patch.acquisitions.sort((a, b) => dateKey(b.date) - dateKey(a.date));\n  if (patch.products) { remember(\"revenue_by_product\"); patch.revenue_by_product = productRollup({ ...cur, products: patch.products }); }\n  remember(\"section_meta\"); remember(\"locked\");\n <script>

                set(k, v) { try { localStorage.setItem("probrands2." + k, JSON.stringify(v)); } catch {} } };

/* ---------- state ---------- */

const ui = { own: new Set(store.get("own", ["pe", "family"])), chf: "", pmin: 2, pall: false, psort: "n", pp: { q: "", min: "M", sort: "lead", seg: "", cat: "", own: "", pos: "", limit: 100 }, roll: store.get("roll", []), rview: "xs", wsmk: "core", wslimit: 40, wsst: "", rq: "", cap: "demo", rmin: "", rsort: "head", rlimit: 60, q: "", dch: "", dmk: "", dsort: "brands", dq: "", fam: "", seg: "", rev: "", mkt: "", cseg: "", csort: "attr", emcol: null, syn: { src: "default", rm: 0.02, fr8: 0.03, rmc: 0.03, rms: 0.015, rmx: 0.005, rev: {}, fr: {} }, sort: "dna", dir: -1, showOut: false, limit: 80, focus: null, busy: {},
  b: { q: "", status: "", tri: "", own: "", fam: "", seg: "", ch: "", dist: "", mkt: "", fmt: "", sort: "skus", dir: -1, limit: 100 } };

/* ---------- DNA ---------- */
// Seven checks. Data checks come from the SKU scrape; judgment checks come from Claude, and you can override any of them.

  { k: "hand", t: "Fits in your hand", q: "Small format a worker holds: aerosol, tube, cartridge, wipe, marker, or a bottle or can up to 1 gal.", w: 15 },
  { k: "dist", t: "Sold through pro distributors", q: "Carried by broadline MRO and trade specialty distributors rather than retail.", w: 15 },

  { k: "itw", t: "ITW Pro Brands would want it", q: "Handheld, formulated, consumable pro product sold through MRO and trade distribution.", w: 15 },
  { k: "major", t: "Pro brands are most of revenue", q: "Small-format pro products are the large majority, or all, of sales.", w: 20 },
  { k: "cons", t: "Used up and re-bought", q: "Consumables that come back every month, not tools or equipment.", w: 10 },

  switch (k) {

    case "dist": return { v: m.ndp >= 4 && m.pro >= 0.7 ? 2 : (m.ndp >= 2 && m.pro >= 0.5) ? 1 : 0, why: `${m.ndp || 0} pro distributor${m.ndp === 1 ? "" : "s"} carry it; ${pct(m.pro)} of SKUs are in pro channels, ${pct(m.broad)} at broadline MRO.${thin}` };
    case "cons": return { v: m.cons >= 0.8 ? 2 : m.cons >= 0.5 ? 1 : 0, why: `${pct(m.cons)} of SKUs are consumables (not tools, dispensers or equipment).${thin}` };

    case "itw": return { v: (/pro brand owner|mixed/i.test(c.model || "") ? 1 : 0) + (m.hand >= 0.6 && m.cons >= 0.7 ? 1 : 0), why: "From business model, pack size and consumable share." };
    case "major": { const md = c.model || ""; return { v: /pro brand owner/i.test(md) ? 2 : /mixed/i.test(md) || !md ? 1 : 0, why: md ? `Business model: ${md}.` : "No business model in the map." }; }
  }

function testOf(c, k) {

/* ---------- consolidators ---------- */
function consolidators() {
  if (consolidators.c && consolidators.c.ver === ver) return consolidators.c.rows;
  const by = new Map();
  for (const d of DEALS) {
    if (d.kind !== "addon" || !d.acq_id || !CO.has(d.acq_id)) continue;
    if (!by.has(d.acq_id)) by.set(d.acq_id, []);
    by.get(d.acq_id).push(d);
  }
  const rows = list().map(c => {
    const ds = (by.get(c.id) || []).sort((a, b) => (b.year || 0) - (a.year || 0));
    return { c, deals: ds, n: ds.length, brands: (c.brands || []).length, last: ds[0]?.year || null, recent: ds.filter(d => d.year >= YEAR - 5).length };
  }).filter(r => r.n >= 1 || r.brands >= 4).sort((a, b) => b.n - a.n || b.brands - a.brands || (b.last || 0) - (a.last || 0));
  consolidators.c = { ver, rows };
  return rows;
}
function sponsors() {
  const by = new Map();
  for (const c of list()) if (c.oclass === "pe" && c.sponsor) {
    const k = norm(c.sponsor.split(/[;(]/)[0]); if (!k) continue;
    if (!by.has(k)) by.set(k, { name: c.sponsor.split(/[;(]/)[0].trim(), cos: [] });
    by.get(k).cos.push(c);
  }
  return [...by.values()].sort((a, b) => b.cos.length - a.cos.length || a.name.localeCompare(b.name));
}

/* ---------- routing & chrome ---------- */
function route() {
  const h = decodeURIComponent((location.hash || "#screen").slice(1));
  if (h.startsWith("c.")) return { v: "company", id: h.slice(2) };
  if (h.startsWith("b.")) return { v: "brand", id: h.slice(2) };
  if (h.startsWith("web")) return { v: "web", id: h.split(".")[1] || null };
  if (h.startsWith("cat.")) return { v: "cat", id: h.slice(4) };
  if (h.startsWith("price.")) return { v: "price", id: h.slice(6) };
  if (h.startsWith("d.")) return { v: "dist", id: h.slice(2) };
  if (h.startsWith("s.")) return { v: "strategy", id: h.slice(2) };
  if (h.startsWith("rollup")) { const ids = h.split(":")[1]; if (ids !== undefined) { ui.roll = ids.split(",").filter(x => CO.has(x) || !loaded); store.set("roll", ui.roll); } return { v: "rollup" }; }
  if (["screen", "consolidators", "mix", "brands", "cats", "dists", "reach", "pricing", "premium", "ems", "product"].includes(h)) return { v: h };
  if (h.startsWith("em.")) return { v: "em", id: h.slice(3) };

}

  let rev = {};

      const c = CO.get(id), r = num(c.rev); if (!r) continue;
      const bs = (reachIndex().byOwner.get(id) || []).filter(b => b.ncat && CATNAMES.indexOf(b.ncat) >= 0); if (!bs.length) continue;
      for (const b of bs) { const ci = CATNAMES.indexOf(b.ncat); rev[ci] = (rev[ci] || 0) + r / bs.length; }

  }).map(r => ({ ...r, tot: r.sp + r.sr + r.sf })).filter(r => r.name);

/* ---------- roll-up procurement synergy: from the members' actual overlaps ----------
   1. Each member's revenue is split across categories by its scraped SKU mix; the Product tab's cost structure gives
      its packaging, raw-material and freight spend in each category.
   2. Packaging spend is split by the member's own pack formats (scrape); raw-material spend by the category's raw
      materials (study section 11), grouped into the Product tab's raw-material families.
   3. An input saves money only when 2+ members buy it. The smaller buyers move onto the largest buyer's contract and
      get the full savings rate on their spend; the largest buyer gets the same rate on as much of its own spend as the
      others add (pooling lifts its volume at most twofold): saving = rate x min(total, 2 x (total - largest)).

const FMT_MAP = { "Aerosol": "Aerosol", "Bottle/Liquid": "Bottle / jug", "Cartridge": "Cartridge", "Squeeze tube": "Squeeze tube", "Paste/Can": "Paste can / tub", "Kit": "Kit", "Powder": "Powder / bag", "Wipe": "Wipes", "Marker/Paint stick": "Marker", "Other": "Other" };

function procCalc(ids) {

  const S = ui.syn, frate = f => S.fr[f] ?? P.formats.find(x => x.name === f)?.kv["Savings rate used in calculator"] ?? 0;
  const trate = t => /^comm/i.test(t) ? S.rmc : /^semi/i.test(t) ? S.rms : /^spec/i.test(t) ? S.rmx : S.rms;
  const ex = [], M = [];
  const all = new Set(); const doorsOf = new Map(ids.map(id => [id, reachOf(CO.get(id)).carried || new Set()]));
  for (const id of ids) {
    const c = CO.get(id), rev = num(c.rev); if (!rev) { ex.push(c); continue; }
    let w = Object.entries(c.mix?.cat || {}).map(([k, n]) => [CATNAMES.indexOf(k), n]).filter(([ci]) => ci >= 0 && P.syn[ci]);
    if (!w.length) w = (reachIndex().byOwner.get(id) || []).map(b => [CATNAMES.indexOf(b.ncat), 1]).filter(([ci]) => ci >= 0 && P.syn[ci]);
    const tw = w.reduce((a, [, n]) => a + n, 0); if (!tw) { ex.push(c); continue; }
    const cats = {}; for (const [ci, n] of w) cats[ci] = (cats[ci] || 0) + rev * n / tw;
    let pack = 0, rm = 0, fr = 0; const fam = {};
    for (const [ci, r] of Object.entries(cats)) {
      const v = P.syn[ci]; pack += r * v[3]; fr += r * v[4]; const rmS = r * v[2]; rm += rmS;
      const rows = P.rmc?.[ci] || [], tot = rows.reduce((a, x) => a + (x[1] || 0), 0);
      if (!rows.length || !tot) { const k = "u:" + ci; fam[k] = fam[k] || { spend: 0, t: {} }; fam[k].spend += rmS; fam[k].t.Semi = (fam[k].t.Semi || 0) + rmS; continue; }
      for (const [f, sh, ty] of rows) { const k = f === null ? "u:" + ci : f, x = rmS * (sh || 0) / tot; fam[k] = fam[k] || { spend: 0, t: {} }; fam[k].spend += x; fam[k].t[ty || "Semi"] = (fam[k].t[ty || "Semi"] || 0) + x; }
    }
    const fm = Object.entries(c.mix?.fmt || {}).map(([k, n]) => [FMT_MAP[k] || "Other", n]), fn = fm.reduce((a, [, n]) => a + n, 0);
    const fmts = {};
    if (fn) for (const [f, n] of fm) fmts[f] = (fmts[f] || 0) + pack * n / fn;
    else for (const [ci, r] of Object.entries(cats)) { const mix = P.fmix[ci]; if (!mix) continue; P.fcols.forEach((f, j) => { fmts[f] = (fmts[f] || 0) + r * P.syn[ci][3] * (mix[2 + j] || 0); }); }

  }
  for (const m of M) {

    m.doors = mine.size; m.sharedDoors = [...mine].filter(d => others.has(d)).length; m.shareD = mine.size ? m.sharedDoors / mine.size : 0;
  }
  const packRows = [...new Set(M.flatMap(m => Object.keys(m.fmts)))].map(f => { const xs = M.map(m => m.fmts[f] || 0), p = pool(xs), r = frate(f); return { f, xs, ...p, rate: r, save: p.base * r }; }).sort((a, b) => b.save - a.save || b.t - a.t);
  const rmRows = [...new Set(M.flatMap(m => Object.keys(m.fam)))].map(k => {
    const xs = M.map(m => m.fam[k]?.spend || 0), p = pool(xs), ty = {};
    for (const m of M) for (const [t, v] of Object.entries(m.fam[k]?.t || {})) ty[t] = (ty[t] || 0) + v;
    const tt = Object.values(ty).reduce((a, v) => a + v, 0) || 1, rate = Object.entries(ty).reduce((a, [t, v]) => a + trate(t) * v / tt, 0);
    const name = String(k).startsWith("u:") ? `Other inputs specific to ${CATNAMES[k.slice(2)]}` : P.fams[k];
    return { k, name, xs, ...p, ty, rate, save: p.base * rate, sup: String(k).startsWith("u:") ? "" : P.rmf[k]?.[3] || "" };

  T.tot = T.pack + T.rm + T.fr;

}

// The CRM lives in its own frame, under #crm/<its route> (old #hb/ links still open it). It reads the market map from here
// (window.PBHB) and keeps its own edits in hb_* collections of this artifact's database.
const hbSubs = new Set();
window.PBHB = {
  raw: () => loaded ? { CO, DT, BR, DEALS, DISTS, CATS, CATNAMES, SEGOF, EMS, CSTUDY, SRC, ver } : null,
  subscribe: fn => { hbSubs.add(fn); return () => hbSubs.delete(fn); },
  exit: () => { location.hash = "screen"; },
  use: name => hbUse(name),
  why: name => hbWhy[name] || "",
  route: h => { const want = "#crm/" + String(h || "").replace(/^#/, ""); if (location.hash !== want) history.replaceState(null, "", want); },
};
// The CRM's code runs in its frame's own JavaScript world. Arrays, plain objects, abort signals and callbacks made
// there are foreign to this page, and the claude.ai runtime can refuse them. Every call the CRM makes goes through
// this bridge, which rebuilds its arguments here first; callbacks still run back in the CRM.
function hbAdopt(v) {
  if (v === null || (typeof v !== "object" && typeof v !== "function")) return v;
  if (typeof v === "function") return (...a) => {
    try { const r = v(...a); return r && typeof r.then === "function" ? Promise.resolve(r).then(hbAdopt, e => { throw hbErr(e); }) : hbAdopt(r); }
    catch (e) { throw hbErr(e); }
  };
  if (typeof v.aborted === "boolean" && typeof v.addEventListener === "function") {
    const c = new AbortController(); if (v.aborted) c.abort(); else v.addEventListener("abort", () => c.abort(), { once: true }); return c.signal;
  }
  if (Array.isArray(v)) return Array.from(v, hbAdopt);   // Array.from makes the copy here (v.map would make it there)
  const tag = Object.prototype.toString.call(v);
