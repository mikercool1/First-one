\n    const web = webOK && await webSetup();\n    const r = await sample.json(web ? prompt.replace(\"Which real companies could this mean?\", \"Search the web first (search_web, one call with 2-3 queries such as the name plus \\\"company\\\" and the name plus the sector), then answer from what you find. Which real companies could this mean?\") : prompt, web ? { modelTier: \"default\", tools: webTools(null) } : { modelTier: \"default\", cache: false });\n    if (ui.addFlow?.q !== q) return;\n    ui.addFlow.cands = (r?.candidates || []).filter(x => x?.name && x?.one_line).slice(0, 5);\n    ui.addFlow.status = \"pick\";\n  } catch (e) {\n    if (ui.addFlow?.q !== q) return;\n    if (e?.code === \"not_granted\" || e?.code === \"sampling_disabled\") sample = null;\n    ui.addFlow.status = \"pick\"; ui.addFlow.error = ERRMSG[e?.code] || \"Couldn't look this name up. You can still add it as typed.\";\n  }\n  render();\n}\nfunction viewAddFlow() {\n  const f = ui.addFlow; if (!f) return \"\";\n  const card = (x, i) => `\u003cdiv class=\"idc\">\u003cdiv style=\"min-width:0\">\u003cdiv class=\"who\">${esc(x.name)} ${x.confidence ? `\u003cspan class=\"cb ${CONF_TAG[x.confidence] || \"cm\"}\">${esc(x.confidence)}\u003c/span>` : \"\"}\u003c/div>\u003cdiv>${esc(x.one_line)}\u003c/div>\u003cdiv class=\"faint\" style=\"font-size:12px\">${esc([x.hq, x.parent && \"Owned by \" + x.parent, x.website, sectorById(x.sector)?.short].filter(Boolean).join(\" \u00b7 \"))}\u003c/div>\u003c/div>\u003cbutton class=\"btn primary sm\" data-act=\"pickcand\" data-i=\"${i}\">Yes, add this one\u003c/button>\u003c/div>`;\n  return `\u003cdiv class=\"panel addflow\" role=\"dialog\" aria-label=\"Confirm the company\">\n    \u003cdiv class=\"sec-h\">\u003ch2>Is this the right company?\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">You typed \u201c${esc(f.q)}\u201d\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"btn sm ghost\" data-act=\"canceladd\">Cancel\u003c/button>\u003c/div>\n    ${f.db.length ? `\u003cdiv class=\"eyebrow\" style=\"margin:4px 0 6px\">Already in the CRM\u003c/div>${f.db.map(c => `\u003cdiv class=\"idc\">\u003cdiv style=\"min-width:0\">\u003cdiv class=\"who\">${esc(c.name)}\u003c/div>\u003cdiv class=\"faint\" style=\"font-size:12px\">${esc([sectorShort(primarySector(c)), c.business_model, c.hq_address].filter(Boolean).join(\" \u00b7 \"))}\u003c/div>\u003c/div>\u003ca class=\"btn sm\" href=\"#c.${esc(c.id)}\" data-act=\"canceladd\">Open it\u003c/a>\u003c/div>`).join(\"\")}` : \"\"}\n    ${f.status === \"searching\" ? `\u003cdiv class=\"run\" style=\"margin-top:8px\">\u003cspan class=\"spin\">\u003c/span>\u003cspan>Looking up companies called \u201c${esc(f.q)}\u201d${webOK ? \" on the web\" : \"\"}\u2026\u003c/span>\u003c/div>` : \"\"}\n    ${f.status === \"pick\" && f.cands.length ? `\u003cdiv class=\"eyebrow\" style=\"margin:12px 0 6px\">Companies this could be. Pick one\u003c/div>${f.cands.map(card).join(\"\")}` : \"\"}\n    ${f.status === \"pick\" && !f.cands.length && !f.error && sample ? `\u003cp class=\"muted\" style=\"margin:10px 0\">Claude doesn't recognise a real company by this name. Check the spelling, or add it as typed with your own description below.\u003c/p>` : \"\"}\n    ${f.error ? `\u003cp class=\"muted\" style=\"margin:10px 0\">${esc(f.error)}\u003c/p>` : \"\"}\n    ${f.status === \"pick\" ? `\u003cform class=\"idc typed\" id=\"typedForm\">\u003cdiv style=\"min-width:0;flex:1\">\u003cdiv class=\"who\">None of these. Add \u201c${esc(f.q)}\u201d as typed\u003c/div>\u003cinput id=\"typedDesc\" placeholder=\"One line on what it does, e.g. Salon hair-color brand, Dallas TX\" style=\"width:100%;margin-top:6px\" aria-label=\"One-line description\" required>\u003c/div>\u003cbutton class=\"btn sm\" type=\"submit\">Add as typed\u003c/button>\u003c/form>` : \"\"}\n  \u003c/div>`;\n}\nasync function addConfirmed(x, sid) {\n  const name = x.name.trim();\n  const ex = findCompanyByName(name); if (ex) { ui.addFlow = null; location.hash = \"c.\" + ex.id; return; }\n  let id = slugify(name), n = 2; while (companies.has(id)) id = slugify(name) + \"-\" + n++;\n  const sector = allSectors().some(z => z.id === x.sector) ? x.sector : sid;\n  const doc = { name, primary_sector: sector, sectors: [{ sector, revenue_usd_m: null, pct: null }], hq_address: x.hq || \"\", website: x.website || \"\", ultimate_parent: x.parent || \"\",\n    status: \"empty\", identity_confirmed: true, created_at: now(), updated_at: now(), locked: [\"name\", \"what_it_is\"], source_of_truth: [], acquisitions: [], buyers: [], addon_ideas: [], competitors: [],\n    conf: Object.fromEntries([\"hq_address\", \"website\", \"ultimate_parent\"].filter(k => (k === \"hq_address\" ? x.hq : k === \"website\" ? x.website : x.parent)).map(k => [k, { level: \"High\", basis: \"Confirmed when you added the company\", at: now(), by: \"You\" }])) };\n  const det = { what_it_is: x.one_line || \"\", runs: [{ at: now(), kind: \"Added\", summary: `Identity confirmed: ${x.one_line || \"\"}` }], customers: [] };\n  try { await db.doc(\"companies/\" + id).set(doc); await db.doc(\"details/\" + id).set(det); companies.set(id, { ...doc, id }); details[id] = det; ver++; rebuildIndex(); ui.addFlow = null; location.hash = \"c.\" + id; }\n  catch (e) { handleWriteError(e); }\n}\nasync function deleteCompany(id) {\n  const c = companies.get(id); if (!c) return;\n  try { if (base.companies.has(id)) await db.doc(\"companies/\" + id).set({ deleted: true, updated_at: now() }); else await db.doc(\"companies/\" + id).delete(); db.doc(\"details/\" + id).delete().catch(() => {}); companies.delete(id); delete details[id]; ver++; rebuildIndex(); ui.confirmDel = false; ui.delRow = null; toast(`Deleted ${c.name}`); }\n  catch (err) { handleWriteError(err); }\n}\n\nfunction viewCompanies() {\n  const q = ui.q.toLowerCase(), sid = ui.sector, water = sid === \"water\";\n  let rows = list().filter(c => inSector(c, sid) && (!ui.scope || !water || c.scope === ui.scope) && (!ui.otype || (ui.otype === \"PE-backed\" ? c.pe_backed || c.owner_type === \"PE-owned\" : ui.otype === \"Added in the CRM\" ? !c.imported_from : c.owner_type === ui.otype))\n    && (!q || [c.name, c.platform_name, c.primary_category, c.owner_type, c.pe_sponsor, c.hq_address, c.business_model, c.rolled_in].join(\" \").toLowerCase().includes(q)));\n  const k = ui.sort, d = ui.dir;\n  rows.sort((a, b) => {\n    const val = x => k === \"nbrands\" ? (x.pb_brands || []).length || null : k === \"secrev\" ? sectorRev(x, sid || primarySector(x)) : k === \"rank\" ? (sectorRank(x, sid || primarySector(x))?.rank ?? null) : x[k];\n    let va = val(a), vb = val(b);\n    if (k === \"name\" || k === \"owner_type\") return d * String(va || \"\").localeCompare(String(vb || \"\"));\n    if (k === \"updated_at\") return d * String(va || \"\").localeCompare(String(vb || \"\"));\n    const miss = k === \"rank\" ? Infinity * d : -Infinity;\n    return d * ((num(va) ?? miss) - (num(vb) ?? miss)) || 0;\n  });\n  const all = list().filter(c => inSector(c, sid));\n  const totRev = all.reduce((s, c) => s + (num(c.total_revenue_usd_m) || 0), 0);\n  const secRev = sid ? all.reduce((s, c) => s + (sectorRev(c, sid) || 0), 0) : null;\n  const nDeals = allDeals().length;\n  const sname = sid ? sectorById(sid)?.name : \"All sectors\";\n  const th = (key, label, cls = \"\") => `\u003cth class=\"sortable ${cls}\" data-sort=\"${key}\" aria-sort=\"${ui.sort === key ? (ui.dir > 0 ? \"ascending\" : \"descending\") : \"none\"}\">${label}${ui.sort === key ? (ui.dir > 0 ? \" \u2191\" : \" \u2193\") : \"\"}\u003c/th>`;\n  const shown = rows.slice(0, ui.limit || 150);\n  const body = rows.length ? shown.map(c => {\n    const st = c.status === \"empty\" ? `\u003cspan class=\"pill\">Empty\u003c/span>` : c.status === \"researching\" || anyRunning(c.id) ? `\u003cspan class=\"pill accent\">Researching\u003c/span>` : \"\";\n    const ps = primarySector(c), rk = sectorRank(c, sid || ps);\n    if (ui.delRow === c.id) return `\u003ctr class=\"delrow\">\u003ctd colspan=\"10\">\u003cspan>\u003cb>Delete ${esc(c.name)}\u003c/b> and everything saved on it? This can't be undone.\u003c/span> \u003cbutton class=\"btn sm dangerfill\" data-act=\"rowdelyes\" data-id=\"${esc(c.id)}\">Delete for good\u003c/button> \u003cbutton class=\"btn sm ghost\" data-act=\"rowdelno\">Keep it\u003c/button>\u003c/td>\u003c/tr>`;\n    const mine = !c.imported_from ? `\u003cspan class=\"pill\" title=\"Added in the CRM, not from the market map\">${c.identity_confirmed ? \"Added by you\" : \"Added, not confirmed\"}\u003c/span>` : \"\";\n    return `\u003ctr class=\"link\" data-open=\"${esc(c.id)}\">\u003ctd class=\"num faint hm\">${rk?.rank ?? \"\"}\u003c/td>\u003ctd class=\"cname\">\u003cspan class=\"cn\">${logoBadge(c, \"sm\")}\u003cspan>\u003cb>${esc(c.name)}\u003c/b> ${st} ${mine}${writable && db ? `\u003cbutton class=\"x rowx\" data-act=\"rowdel\" data-id=\"${esc(c.id)}\" title=\"Delete ${esc(c.name)}\" aria-label=\"Delete ${esc(c.name)}\">\u00d7\u003c/button>` : \"\"}\u003csmall>${esc([isPE(c) ? \"PE \u00b7 \" + sponsorOf(c) : c.owner_type, sid ? \"\" : sectorShort(ps), c.business_model || c.primary_category].filter(Boolean).join(\" \u00b7 \"))}\u003c/small>\u003c/span>\u003c/span>\u003c/td>\u003ctd class=\"r num hm\">${fmtM(sectorRev(c, sid || ps))}\u003c/td>\u003ctd class=\"r num\">${fmtM(c.total_revenue_usd_m)}\u003c/td>\u003ctd class=\"r num\">${fmtInt(c.employees_total) || \"\u2014\"}\u003c/td>\u003ctd class=\"r num hm\">${fmtInt(c.pb_skus) || \"\u2014\"}\u003c/td>\u003ctd class=\"r num hm\">${(c.pb_brands || []).length || \"\u2014\"}\u003c/td>\u003c/tr>`;\n  }).join(\"\") + (rows.length > shown.length ? `\u003ctr>\u003ctd colspan=\"9\" style=\"text-align:center;padding:14px\">\u003cbutton class=\"btn sm\" data-act=\"more\">Show ${Math.min(150, rows.length - shown.length)} more of ${rows.length - shown.length}\u003c/button>\u003c/td>\u003c/tr>` : \"\") : `\u003ctr>\u003ctd colspan=\"10\" class=\"faint\" style=\"padding:28px 12px\">${all.length ? \"No companies match that search.\" : `No companies in ${esc(sname)} yet. Add one above, or build out the sector from the Sectors page.`}\u003c/td>\u003c/tr>`;\n  return `\n  \u003cdiv class=\"page-h\">\u003cdiv>\u003cdiv class=\"eyebrow\">${esc(sname)}\u003c/div>\u003ch1>Companies\u003c/h1>\u003cp>${sid ? `Companies with a business line in ${esc(sname)}, ranked by ${water ? \"US water treatment revenue\" : \"revenue in this sector\"}.` : \"Every company in the CRM, across all sectors.\"} Search always covers every sector. Type over any value in a profile to correct it.\u003c/p>\u003c/div>\n    ${writable && db ? `\u003cform class=\"add\" id=\"addForm\">\u003cinput id=\"addName\" placeholder=\"Company name\" autocomplete=\"off\" aria-label=\"New company name\">\u003cselect id=\"addSector\" aria-label=\"Primary sector\">${sectorOptions(wsSectors(), defSector())}\u003c/select>\u003cbutton class=\"btn primary\" type=\"submit\">Add company\u003c/button>\u003c/form>` : \"\"}\u003c/div>\n  ${viewAddFlow()}\n  \u003cdiv class=\"stats\">\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">${all.length}\u003c/div>\u003cdiv class=\"l\">Profiles\u003c/div>\u003c/div>\n    ${sid ? `\u003cdiv class=\"stat\">\u003cdiv class=\"v\">${fmtM(secRev)}\u003c/div>\u003cdiv class=\"l\">${water ? \"US water treatment revenue\" : esc(sname) + \" revenue\"}\u003c/div>\u003c/div>` : \"\"}\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">${fmtM(totRev)}\u003c/div>\u003cdiv class=\"l\">Combined platform revenue\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">${nDeals}\u003c/div>\u003cdiv class=\"l\">Deals logged\u003c/div>\u003c/div>\n    \u003cdiv class=\"stat\">\u003cdiv class=\"v\">${allTargets().length}\u003c/div>\u003cdiv class=\"l\">Companies in Buyer finder\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"bar\">\u003cdiv class=\"grow acwrap\">\u003cinput class=\"search\" id=\"q\" type=\"search\" placeholder=\"Search by name, category, owner, sponsor, HQ or rolled-in company\" value=\"${esc(ui.q)}\" aria-label=\"Search companies\" role=\"combobox\" aria-autocomplete=\"list\" aria-expanded=\"${ui.acOpen && !!ui.q}\" aria-controls=\"acList\" autocomplete=\"off\">${autofill()}\u003c/div>\n    ${water ? `\u003cselect id=\"fscope\" aria-label=\"Scope\">\u003coption value=\"\">Core and adjacent\u003c/option>${[\"Core\", \"Adjacent\"].map(v => `\u003coption ${ui.scope === v ? \"selected\" : \"\"}>${v}\u003c/option>`).join(\"\")}\u003c/select>` : \"\"}\n    \u003cselect id=\"fotype\" aria-label=\"Owner type\">\u003coption value=\"\">All owners\u003c/option>${[\"PE-backed\", \"Public\", \"Family/founder-owned\", \"Subsidiary of strategic\", \"ESOP\", \"Other\", \"Added in the CRM\"].map(v => `\u003coption ${ui.otype === v ? \"selected\" : \"\"}>${v}\u003c/option>`).join(\"\")}\u003c/select>\n    \u003cspan class=\"faint\">${rows.length} shown\u003c/span>\u003c/div>\n  \u003cdiv class=\"mlegend\">\u003cspan>Company\u003c/span>\u003cspan>Revenue\u003c/span>\u003cspan>Employees\u003c/span>\u003c/div>\n  \u003cdiv class=\"tw\">\u003ctable class=\"clist\">\u003cthead>\u003ctr>${th(\"rank\", \"#\")}${th(\"name\", \"Company\")}${th(\"secrev\", sid ? sectorRevLabel(sid) : \"Sector rev\", \"r\")}${th(\"total_revenue_usd_m\", \"Revenue\", \"r\")}${th(\"employees_total\", \"Employees\", \"r\")}${th(\"pb_skus\", \"SKUs\", \"r\")}${th(\"nbrands\", \"Brands\", \"r\")}\u003c/tr>\u003c/thead>\u003ctbody>${body}\u003c/tbody>\u003c/table>\u003c/div>`;\n}\n\nconst TABS = [[\"overview\", \"Overview\"], [\"people\", \"Management\"], [\"products\", \"Products\"], [\"acquisitions\", \"M&A\"], [\"customers\", \"Customers\"], [\"competitors\", \"Competitors\"], [\"buyers\", \"Buyers\"], [\"addons\", \"Add-ons\"], [\"segments\", \"Segments\"], [\"mix\", \"Mix\"], [\"stats\", \"Peers\"], [\"notes\", \"Notes\"], [\"build\", \"Build\"]];\nconst canEnhance = () => !!sample && writable && !!db;\n// Cloud deep research needs a scheduled research session; CRM in Probrands researches in the page instead.\nconst canWeb = () => false;\nfunction enhanceBtn(c, key, label = \"Enhance\") {\n  if (!canEnhance()) return \"\";\n  if (isRunning(c.id, key)) return `\u003cspan class=\"pill accent\">\u003cspan class=\"spin\">\u003c/span>Enhancing\u003c/span>\u003cbutton class=\"btn sm ghost\" data-act=\"stopsec\" data-k=\"${key}\">Stop\u003c/button>`;\n  return `\u003cbutton class=\"btn sm enh\" data-act=\"enhance\" data-k=\"${key}\" title=\"Claude works on this section again from what it knows and saves the result\">${label}\u003c/button>`;\n}\nfunction secMeta(c, key) {\n  const m = (c.section_meta || {})[key];\n  const err = runs[runKey(c.id, key)]?.error;\n  return (m?.at ? `\u003cspan class=\"faint\" style=\"font-size:12px\" title=\"${esc(m.note || \"\")}\">Enhanced ${fmtDate(m.at)}\u003c/span>` : \"\")\n    + (err ? `\u003cspan class=\"pill warn\" role=\"alert\">${esc(err)}\u003c/span>\u003cbutton class=\"btn sm ghost\" data-act=\"dismisssec\" data-k=\"${key}\">Dismiss\u003c/button>` : \"\");\n}\nconst LABELS = { products: \"product catalog\", product_em_map: \"where products go\", business_model: \"business model\", sectors: \"business lines by sector\", primary_sector: \"primary sector\", total_revenue_usd_m: \"revenue\", total_revenue_year: \"revenue year\", total_revenue_basis: \"revenue basis\", employees_total: \"employee count\", end_markets_total_platform: \"end-market mix\", end_market_buckets: \"end-market mix\", revenue_by_business: \"segment split\", revenue_by_product: \"product split\", chemistries: \"product list\", addon_ideas: \"add-on ideas\", acquisitions: \"deal list\", what_it_is: \"description\", bluntly: \"blunt take\", profile_md: \"write-up\", pe_sponsor: \"sponsor\", pe_entry_year: \"entry year\" };\nconst label = f => LABELS[f] || f.replace(/_/g, \" \");\nfunction suggestionBox(c, fields) {\n  const s = c.suggestions || {};\n  return fields.filter(f => s[f]).map(f => `\u003cdiv class=\"sugg\">\u003cdiv>\u003cb>Claude has a different ${esc(label(f))}.\u003c/b> ${(c.locked || []).includes(f) ? \"You've verified this field, so it wasn't replaced.\" : \"The current value is better supported, so it wasn't replaced.\"} Suggested${s[f].level ? ` (${esc(s[f].level)} confidence)` : \"\"}: \u003cspan class=\"mono\">${esc(short(s[f].value))}\u003c/span>${s[f].basis ? `\u003cdiv class=\"faint\" style=\"font-size:12px;margin-top:2px\">${esc(s[f].basis)}\u003c/div>` : \"\"}\u003c/div>\u003cdiv class=\"sugg-a\">\u003cbutton class=\"btn sm primary\" data-act=\"acceptsug\" data-f=\"${f}\">Use Claude's\u003c/button>\u003cbutton class=\"btn sm ghost\" data-act=\"dismisssug\" data-f=\"${f}\">Keep mine\u003c/button>\u003c/div>\u003c/div>`).join(\"\");\n}\nfunction secHead(c, f, title, extra = \"\", key = \"\", fields = null) {\n  const fl = fields || (f ? [f] : []);\n  const sc = key ? sectionConf(c, key) : null, st = key ? (c.section_meta || {})[key]?.stale : null;\n  return `\u003cdiv class=\"sec-h\">\u003ch2>${esc(title)}\u003c/h2>${sc ? `\u003cspan class=\"cb ${CONF_TAG[sc]}\" title=\"Weakest confidence in this section\">${sc}\u003c/span>` : \"\"}${fl.map(x => lockPill(c, x)).join(\"\")}${st ? `\u003cspan class=\"pill warn\" title=\"Changed since this section was last updated\">Out of date \u00b7 ${esc(st.because.join(\", \"))}\u003c/span>` : \"\"}${key ? secMeta(c, key) : \"\"}\u003cspan class=\"sp\">\u003c/span>${extra}${writable && f ? `\u003cbutton class=\"btn sm ghost\" data-act=\"addrow\" data-f=\"${f}\">Add row\u003c/button>` : \"\"}${key ? enhanceBtn(c, key, st ? \"Update\" : \"Enhance\") : \"\"}\u003c/div>${suggestionBox(c, fl)}`;\n}\n\nfunction viewCompany(id, tab) {\n  const c = getC(id);\n  if (!c) return `\u003cdiv class=\"crumb\">\u003ca href=\"#companies\">Companies\u003c/a>\u003c/div>\u003cdiv class=\"panel empty-hero\">\u003ch2>No profile called \u201c${esc(id)}\u201d\u003c/h2>\u003cp class=\"muted\">It may have been deleted. Go back to Companies to add it again.\u003c/p>\u003c/div>`;\n  const busy = SECTION_ORDER.filter(k => isRunning(id, k));\n  const queued = (queueDocs || []).filter(q => q.company_id === id && q.status !== \"done\");\n  const runStrip = busy.length ? `\u003cdiv class=\"run\" role=\"status\">\u003cspan class=\"spin\">\u003c/span>\u003cspan>\u003cb>Enhancing ${busy.length === 1 ? SECTIONS[busy[0]].label : busy.length + \" sections\"}.\u003c/b> Each section saves as soon as it finishes. Your overrides stay as they are.\u003c/span>\u003c/div>` : \"\";\n  const stl = staleSections(c), sg = strength(c);\n  const actions = `\u003cbutton class=\"btn sm ghost\" data-act=\"print\" title=\"Print or save a one-page tear sheet\">Print\u003c/button>${writable && db && !onCampaign(c) && ui.ctwEdit !== c.id ? `\u003cbutton class=\"btn sm\" data-act=\"ctwedit\">Add to campaign\u003c/button>` : \"\"}${writable && db && !inMarket(c) && ui.imEdit !== c.id ? `\u003cbutton class=\"btn sm\" data-act=\"imedit\">Mark in market\u003c/button>` : \"\"}`;\n\n  if (c.status === \"empty\" || c.status === \"researching\" && !(c.runs || []).length) {\n    return `\u003cdiv class=\"crumb\">\u003ca href=\"#companies\">Companies\u003c/a> / ${esc(c.name)}\u003c/div>\n    \u003cdiv class=\"ph\">\u003cdiv class=\"ph-main\">\u003ch1>${ed(\"name\", c.name, \"text\", \"Company name\")}\u003c/h1>\u003cdiv class=\"sub\">No profile yet\u003c/div>\u003c/div>\u003cdiv class=\"ph-act\">${delBtn()}\u003c/div>\u003c/div>\n    ${runStrip}\n    \u003cdiv class=\"panel empty-hero\">\n      \u003cdiv class=\"eyebrow\">First run\u003c/div>\n      \u003ch2>Build this profile\u003c/h2>\n      \u003cp class=\"muted\">The builder works in order: overview, M&A history, products, sectors, end markets (from where the products go), segments, financials, customers, competitors, buyers and add-ons. Each step starts from everything before it and saves as it finishes. You can override any value afterwards and run any step again to go deeper.\u003c/p>\n      \u003clabel class=\"eyebrow\" for=\"seedFacts\">What you already know (optional)\u003c/label>\n      \u003ctextarea id=\"seedFacts\" placeholder=\"e.g. Revenue was $140M in 2025 per the CIM. Largest customer is Veolia at ~15%. Owned by XYZ Capital since 2022.\">\u003c/textarea>\n      \u003cdiv class=\"add\">${canEnhance() ? `\u003cbutton class=\"btn primary\" data-act=\"firstdive\" ${busy.length ? \"disabled\" : \"\"}>Build profile\u003c/button>` : \"\"}${canWeb() ? `\u003cbutton class=\"btn\" data-act=\"webbuild\" ${webActive(c.id) ? \"disabled\" : \"\"}>${webActive(c.id) ? \"Deep research queued\" : \"Deep research\"}\u003c/button>` : \"\"}${writable && db ? `\u003cbutton class=\"btn ghost\" data-act=\"manual\">Fill in by hand\u003c/button>` : \"\"}\u003c/div>\n      ${webPanel(c)}\n      \u003cp class=\"faint\" style=\"font-size:12px;margin-top:14px\">Build profile uses Claude's own knowledge and runs here in the page in a minute or two. Build from the web starts a Claude research session with web search that reads the company's site, filings, press releases and trade press, and saves each step here with its sources. It takes longer and uses your Claude Code usage.\u003c/p>\n    \u003c/div>`;\n  }\n\n  const counts = { people: (c.management || []).length, segments: (c.segment_profiles || []).length, customers: (c.customers || []).length, products: catalog(c).length, competitors: (c.competitors || []).length, acquisitions: (c.acquisitions || []).length, buyers: (c.buyers || []).length, addons: addonList(c).length, notes: (c.evidence || []).length + (c.source_of_truth || []).length };\n  const tabs = TABS.map(([k, l]) => `\u003ca href=\"#c.${esc(id)}.${k}\" aria-current=\"${tab === k}\">${l}${counts[k] ? `\u003cspan class=\"n\">${counts[k]}\u003c/span>` : \"\"}\u003c/a>`).join(\"\");\n  const ps = primarySector(c), prk = sectorRank(c, ps);\n  const chips = [prk && `\u003cspan class=\"pill\">#${prk.rank} of ${prk.of} in ${esc(sectorShort(ps))}${ps === \"water\" && num(c.us_market_share_pct) ? \" \u00b7 \" + (+c.us_market_share_pct).toFixed(1) + \"% US share\" : \"\"}\u003c/span>`, c.owner_type && (isPE(c) ? `\u003ca class=\"pill pe\" href=\"#sponsors~o~${encodeURIComponent(sponsorOf(c))}\" title=\"See ${esc(sponsorOf(c))}'s portfolio and all sponsor-owned companies\">PE-owned \u00b7 ${esc(sponsorOf(c))}${entryYear(c) ? \" since \" + entryYear(c) : \"\"}\u003c/a>` : `\u003cspan class=\"pill\">${esc(c.owner_type)}\u003c/span>`), c.business_model && `\u003cspan class=\"pill\">${esc(c.business_model)}\u003c/span>`, c.primary_category && `\u003cspan class=\"pill\">${esc(c.primary_category)}\u003c/span>`, c.confidence && `\u003cspan class=\"pill ${c.confidence === \"Low\" ? \"warn\" : \"\"}\">${esc(c.confidence)} confidence\u003c/span>`, c.website && `\u003ca class=\"pill\" href=\"${esc(/^https?:/.test(c.website) ? c.website : \"https://\" + c.website)}\" target=\"_blank\" rel=\"noopener\">${esc(String(c.website).replace(/^https?:\\/\\/(www\\.)?/, \"\").replace(/\\/$/, \"\"))} \u2197\u003c/a>`].filter(Boolean).join(\"\");\n  const kpi = (f, lab, note, pre = \"$\", unit = \"M\") => `\u003cdiv class=\"kpi ${confOf(c, f).level === \"Low\" ? \"lowc\" : \"\"}\">\u003cdiv class=\"lab\">${lab} ${confBadge(c, f)}\u003c/div>\u003cdiv class=\"val\">${pre ? `\u003cspan class=\"u\">${pre}\u003c/span>` : \"\"}${ed(f, c[f], \"num\", \"\u2013\")}${unit ? `\u003cspan class=\"u\">${unit}\u003c/span>` : \"\"}\u003c/div>\u003cdiv class=\"note\">${esc(note || \"\")}\u003c/div>\u003c/div>`;\n  const oneLine = String(c.what_it_is || \"\").replace(/\\s+/g, \" \").trim();\n  const tags = [\n    `\u003ca class=\"pill\" href=\"#companies\" data-setsector=\"${esc(ps)}\">${esc(sectorShort(ps))}${prk ? ` \u00b7 #${prk.rank} of ${prk.of}` : \"\"}\u003c/a>`,\n    isPE(c) ? `\u003ca class=\"pill pe\" href=\"#s.${esc(spSlug(sponsorOf(c)))}\">PE-owned \u00b7 ${esc(sponsorOf(c))}\u003c/a>` : c.owner_type ? `\u003cspan class=\"pill\">${esc(c.owner_type)}\u003c/span>` : \"\",\n    inMarket(c) ? `\u003ca class=\"pill accent\" href=\"#inmarket\">In market \u00b7 ${esc(c.in_market.stage)}\u003c/a>` : \"\",\n    onCampaign(c) ? `\u003ca class=\"pill\" href=\"#campaign\">\u003cspan class=\"ragdot ${rag(c).k}\">\u003c/span> Campaign\u003c/a>` : \"\",\n    c.demo ? `\u003cspan class=\"pill warn\" title=\"Invented company for demonstration\">Demo\u003c/span>` : \"\",\n  ].join(\"\");\n  const head = `\n  \u003cdiv class=\"crumb\">${ui.peBack ? `\u003ca href=\"${esc(ui.peBack.hash)}\">\u2190 Back to ${esc(ui.peBack.label)}\u003c/a>` : `\u003ca href=\"#companies\">Companies\u003c/a>`} / ${esc(c.name)}\u003c/div>\n  ${inWs(c) || ui.peBack ? \"\" : `\u003cdiv class=\"run\" role=\"status\">\u003cspan>This company sits in \u003cb>${esc(wsPath(groupOf(c)))}\u003c/b>, outside the vertical you are working in (${esc(wsPath())}).\u003c/span>\u003cspan style=\"flex:1\">\u003c/span>\u003cbutton class=\"btn sm\" data-ws=\"${esc(groupOf(c))}\" data-stay=\"1\">Switch to ${esc(groupByKey(groupOf(c))?.name || \"it\")}\u003c/button>\u003c/div>`}\n  \u003cdiv class=\"ph compact\">\n    \u003cdiv class=\"ph-main\">\u003cdiv class=\"ph-name\">${logoImg(c, \"lg\")}\u003ch1>${ed(\"name\", c.name, \"text\", \"Company name\")}\u003c/h1>\u003c/div>\n      \u003cdiv class=\"sub\">${esc(oneLine ? (oneLine.length > 190 ? oneLine.slice(0, 187) + \"\u2026\" : oneLine) : (c.hq_address || \"\"))}\u003c/div>\n      \u003cdiv class=\"chips\">${tags}\u003c/div>\u003c/div>\n    \u003cdiv class=\"ph-act\">${actions}\u003c/div>\n  \u003c/div>\n  ${runStrip}\n  \u003cnav class=\"tabs\" aria-label=\"Profile sections\">${tabs}\u003c/nav>`;\n  const overviewTop = `\n  \u003cdiv class=\"kpis\">\n    ${kpi(\"total_revenue_usd_m\", \"Revenue\", c.total_revenue_year)}\n    \u003cdiv class=\"kpi\">\u003cdiv class=\"lab\">${esc(sectorRevLabel(ps))} ${confBadge(c, \"sectors\")}\u003c/div>\u003cdiv class=\"val\">\u003cspan class=\"u\">$\u003c/span>${ed(\"__secrev\", sectorRev(c, ps), \"num\", \"\u2013\")}\u003cspan class=\"u\">M\u003c/span>\u003c/div>\u003cdiv class=\"note\">${esc(sectorById(ps)?.name || \"\")}\u003c/div>\u003c/div>\n    ${kpi(\"employees_total\", \"Employees\", \"\", \"\", \"\")}\n    \u003cdiv class=\"kpi\">\u003cdiv class=\"lab\">Brands\u003c/div>\u003cdiv class=\"val\">${(c.pb_brands || []).length || \"\u2013\"}\u003c/div>\u003cdiv class=\"note\">${esc((c.pb_brands || []).slice(0, 4).join(\", \"))}\u003c/div>\u003c/div>\n    \u003cdiv class=\"kpi\">\u003cdiv class=\"lab\">SKUs tracked\u003c/div>\u003cdiv class=\"val\">${fmtInt(c.pb_skus) || \"\u2013\"}\u003c/div>\u003cdiv class=\"note\">${esc(c.pb_channel || \"\")}\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"valrow\">\u003cspan class=\"eyebrow\">Valuation\u003c/span>\u003cspan>EV \u003cb class=\"num\">$${ed(\"ev_usd_m\", c.ev_usd_m, \"num\", \"\u2013\")}M\u003c/b> ${num(c.ev_usd_m) !== null ? confBadge(c, \"ev_usd_m\") : \"\"}\u003c/span>\u003cspan>EV / revenue \u003cb class=\"num\">${num(c.ev_usd_m) && num(c.total_revenue_usd_m) ? (c.ev_usd_m / c.total_revenue_usd_m).toFixed(1) + \"x\" : \"\u2014\"}\u003c/b>\u003c/span>${isPE(c) && entryYear(c) ? `\u003cspan>Sponsor entry \u003cb class=\"num\">${entryYear(c)}\u003c/b>\u003c/span>` : \"\"}\u003c/div>\n  ${campaignPanel(c)}\n  ${inMarketPanel(c)}\n  ${finHistory(c)}\n  \u003cdiv class=\"kpi-foot\">${secMeta(c, \"financials\")}\u003cspan class=\"faint\" style=\"font-size:12px\">Type over any number to override it.\u003c/span>\u003cspan class=\"sp\">\u003c/span>${enhanceBtn(c, \"financials\", \"Enhance financials\")}\u003c/div>\n  ${suggestionBox(c, SECTIONS.financials.fields)}\n  ${builderStrip(c, stl, busy)}`;\n  const buildTab = `\n  \u003cdiv class=\"strength\" title=\"How much of the key picture is known, weighted by confidence\">\u003cspan class=\"eyebrow\">Profile strength\u003c/span>\u003cdiv class=\"sbar\">${[\"Verified\", \"High\", \"Medium\", \"Low\"].map(L => sg.n[L] ? `\u003cspan class=\"${CONF_TAG[L]}\" style=\"flex:${sg.n[L]}\" data-tip=\"${sg.n[L]} ${L}\">\u003c/span>` : \"\").join(\"\")}${sg.n.Missing ? `\u003cspan class=\"cx\" style=\"flex:${sg.n.Missing}\" data-tip=\"${sg.n.Missing} missing\">\u003c/span>` : \"\"}\u003c/div>\u003cb class=\"num\">${sg.pct}%\u003c/b>\u003cspan class=\"faint\" style=\"font-size:12px\">${sg.n.Verified} verified \u00b7 ${sg.n.High} high \u00b7 ${sg.n.Medium} medium \u00b7 ${sg.n.Low} low \u00b7 ${sg.n.Missing} missing\u003c/span>\u003c/div>\n  ${stl.length && !busy.length ? `\u003cdiv class=\"run err\">\u003cspan>\u003cb>${stl.length} section${stl.length > 1 ? \"s are\" : \" is\"} out of date\u003c/b> because newer information came in: ${esc(stl.map(k => SECTIONS[k].label).join(\", \"))}.\u003c/span>\u003cspan style=\"flex:1\">\u003c/span>${canEnhance() ? `\u003cbutton class=\"btn sm primary\" data-act=\"updatestale\">Update them\u003c/button>` : \"\"}\u003c/div>` : \"\"}\n  ${viewBuilder(c)}\n  ${writable && db ? `\u003cform class=\"facts\" id=\"factForm\">\u003cspan class=\"lab\">Add a fact\u003c/span>\u003cinput id=\"factText\" placeholder=\"Something the profile gets wrong or misses, e.g. 2025 revenue was $85M per the CIM\" autocomplete=\"off\" aria-label=\"Add a fact\">\u003cbutton class=\"btn\" type=\"submit\">Save fact\u003c/button>\u003c/form>` : \"\"}\n  ${writable && db ? `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Logo\u003c/h2>\u003c/div>\u003cdiv class=\"logo-row\">${logoImg(c, \"lg\")}\u003cbutton class=\"btn sm\" data-act=\"logoadd\">${logos.has(c.id) ? \"Change logo\" : \"Add logo\"}\u003c/button>${logos.has(c.id) ? `\u003cbutton class=\"btn sm ghost\" data-act=\"logodel\">Remove\u003c/button>` : \"\"}\u003cinput type=\"file\" id=\"logoFile\" accept=\"image/*\" hidden>\u003c/div>\u003c/div>\n  \u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Delete\u003c/h2>\u003c/div>\u003cdiv class=\"add\">${delBtn()}\u003c/div>\u003c/div>` : \"\"}`;\n  if (tab === \"overview\") return head + overviewTop + tabBody(c, \"overview\");\n  if (tab === \"build\") return head + buildTab;\n  return head + tabBody(c, tab);\n}\n// A one-line builder status for the Overview; the full step grid lives on the Build tab.\nfunction builderStrip(c, stl, busy) {\n  if (!canEnhance() && !canWeb()) return \"\";\n  const done = SECTION_ORDER.filter(k => stepState(c, k).cls === \"done\").length, nx = nextStep(c), running = SECTION_ORDER.find(k => isRunning(c.id, k));\n  if (running) return `\u003cdiv class=\"run\" role=\"status\" style=\"margin-top:12px\">\u003cspan class=\"spin\">\u003c/span>\u003cspan>\u003cb>Building ${esc(SECTIONS[running].label)} in the background.\u003c/b> Each step saves as it finishes.\u003c/span>\u003cspan class=\"sp\">\u003c/span>${chat.open ? \"\" : `\u003cbutton class=\"btn sm\" data-act=\"viewchat\">View live\u003c/button>`}\u003cbutton class=\"btn sm ghost\" data-act=\"stopsec\" data-k=\"${running}\">Stop\u003c/button>\u003c/div>`;\n  return `\u003cdiv class=\"bstrip\">\u003cspan>\u003cb>Profile builder\u003c/b> \u003cspan class=\"faint\">${done} of ${SECTION_ORDER.length} steps built${stl.length ? ` \u00b7 ${stl.length} out of date` : \"\"}\u003c/span>\u003c/span>\u003cspan class=\"sp\">\u003c/span>${canEnhance() && nx ? `\u003cbutton class=\"btn sm primary\" data-act=\"enhance\" data-k=\"${nx}\">Build next: ${esc(SECTIONS[nx].label)}\u003c/button>` : \"\"}${canEnhance() ? `\u003cbutton class=\"btn sm\" data-act=\"enhanceall\">Build all\u003c/button>` : \"\"}\u003ca class=\"btn sm ghost\" href=\"#c.${esc(c.id)}.build\">Details\u003c/a>\u003c/div>${webPanel(c)}`;\n}\n// Overview lists: the latest deals, top products and top buyers at a glance.\nfunction overviewLists(c) {\n  const deals = [...(c.acquisitions || [])].sort((a, b) => dateKey(b.date) - dateKey(a.date)).slice(0, 5);\n  const prods = catalog(c).slice(0, 6);\n  const buyers = (c.buyers || []).length ? c.buyers.slice(0, 5).map(b => ({ name: b.name, sub: b.rationale || b.type || \"\", id: findCompanyByName(b.name)?.id })) : likelyBuyers(c).slice(0, 5).map(b => ({ name: b.p.name, id: b.p.id, sub: `${b.o.toFixed(0)}% similarity` }));\n  const li = (who, sub, href) => `\u003cdiv class=\"li\">\u003cdiv class=\"who\">${href ? `\u003ca href=\"${href}\">${who}\u003c/a>` : who}\u003c/div>${sub ? `\u003cdiv class=\"muted\" style=\"font-size:12px\">${sub}\u003c/div>` : \"\"}\u003c/div>`;\n  const box = (title, href, items, empty) => `\u003cdiv>\u003cdiv class=\"sec-h\">\u003ch2>${title}\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003ca class=\"btn sm ghost\" href=\"${href}\">See all\u003c/a>\u003c/div>\u003cdiv class=\"panel list-p\">${items || `\u003cp class=\"faint\" style=\"padding:6px 4px\">${empty}\u003c/p>`}\u003c/div>\u003c/div>`;\n  return `\u003cdiv class=\"sec grid3\">\n    ${box(\"Products\", `#c.${esc(c.id)}.products`, prods.map(p => li(esc([p.category, p.line].filter(Boolean).join(\" \u00b7 \")), esc(String(p.named_products || p.what_it_is || \"\").slice(0, 90)))).join(\"\"), \"No product catalog yet.\")}\n    ${box(\"Latest deals\", `#c.${esc(c.id)}.acquisitions`, deals.map(d => li(`${esc(d.target)} \u003cspan class=\"faint num\" style=\"font-weight:400\">${esc(String(d.date || \"\").slice(0, 7))}\u003c/span>`, esc(String(d.what_it_added || d.what_it_does || \"\").slice(0, 90)), dealHref(d.target, d.date) || `#c.${esc(c.id)}.acquisitions`)).join(\"\"), \"No deals on file.\")}\n    ${box((c.buyers || []).length ? \"Top buyers\" : \"Likely buyers\", `#c.${esc(c.id)}.buyers`, buyers.map(b => li(esc(b.name), esc(String(b.sub).slice(0, 90)), b.id ? `#c.${esc(b.id)}` : \"\")).join(\"\"), \"No buyers yet.\")}\n  \u003c/div>`;\n}\n// Bigger categories as buttons: the company's industries, its sponsor, and the screens that matter for it.\nfunction exploreButtons(c) {\n  const btn = (href, title, sub, attrs = \"\") => `\u003ca class=\"xbtn\" href=\"${href}\" ${attrs}>\u003cb>${title}\u003c/b>${sub ? `\u003csmall>${sub}\u003c/small>` : \"\"}\u003c/a>`;\n  const out = [];\n  for (const x of sectorsOf(c)) { const sec = sectorById(x.sector); if (!sec) continue; const rk = sectorRank(c, x.sector); out.push(btn(\"#companies\", esc(sec.name), [x.pct ? Math.round(x.pct) + \"% of revenue\" : \"\", rk ? `#${rk.rank} of ${rk.of}` : \"\"].filter(Boolean).join(\" \u00b7 \"), `data-setsector=\"${esc(x.sector)}\"`)); }\n  if (isPE(c)) { out.push(btn(`#s.${esc(spSlug(sponsorOf(c)))}`, esc(sponsorOf(c)), `${addonOf(c) ? \"Add-on via \" + esc(addonOf(c)) + \" \u00b7 \" : \"\"}${fundOf(c) ? esc(fundOf(c)) + \" \u00b7 \" : \"\"}PE-owned${entryYear(c) ? \" since \" + entryYear(c) : \"\"}${holdYears(c) !== null ? \" \u00b7 \" + holdYears(c) + \" yr hold\" : \"\"}`)); out.push(btn(\"#sponsors\", \"All sponsor-owned\", `${list().filter(isPE).length} companies by year and owner`)); }\n  else if (c.owner_type) out.push(`\u003cspan class=\"xbtn static\">\u003cb>${esc(c.owner_type)}\u003c/b>${c.ultimate_parent ? `\u003csmall>${esc(String(c.ultimate_parent).slice(0, 60))}\u003c/small>` : \"\"}\u003c/span>`);\n  out.push(btn(\"#inmarket\", \"In market\", inMarket(c) ? esc(c.in_market.stage) : `${list().filter(inMarket).length} live processes`));\n  out.push(btn(`#precedents~${encodeURIComponent(c.id)}`, \"Best precedents\", \"Deals ranked by product and mix overlap\"));\n  out.push(btn(`#c.${esc(c.id)}.buyers`, \"Buyer universe\", \"Strategics and sponsors ranked by fit\"));\n  if (c.website) out.push(`\u003ca class=\"xbtn\" href=\"${esc(/^https?:/.test(c.website) ? c.website : \"https://\" + String(c.website).split(/[ ;,]/)[0])}\" target=\"_blank\" rel=\"noopener\">\u003cb>Website \u2197\u003c/b>\u003csmall>${esc(String(c.website).split(/[ ;,]/)[0].replace(/^https?:\\/\\/(www\\.)?/, \"\"))}\u003c/small>\u003c/a>`);\n  return `\u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Explore\u003c/h2>\u003c/div>\u003cdiv class=\"xgrid\">${out.join(\"\")}\u003c/div>\u003c/div>`;\n}\n// The builder: each step in order, its state, and one click to build the next step or go deeper.\nfunction stepState(c, k) {\n  if (isRunning(c.id, k)) return { cls: \"run\", text: runs[runKey(c.id, k)].msg || \"Building\u2026\" };\n  if (runs[runKey(c.id, k)]?.error) return { cls: \"stale\", text: \"Didn't finish \u00b7 retry\" };\n  const m = (c.section_meta || {})[k] || {};\n  if (m.stale) return { cls: \"stale\", text: \"Out of date\" };\n  if (m.at) return { cls: \"done\", text: `Pass ${m.passes || 1} \u00b7 ${sectionConf(c, k) || \"\u2014\"}` };\n  const d = sectionDef(c, k), hasData = k === \"sectors\" ? !!(c.sectors || c.imported_from) : k === \"products\" ? catalog(c).length > 0 : d.fields.some(f => has(c[f]));\n  return hasData ? { cls: \"imp\", text: c.imported_from ? \"From import\" : \"Has data\" } : { cls: \"todo\", text: \"Not built\" };\n}\nfunction nextStep(c) {\n  const st = SECTION_ORDER.map(k => [k, stepState(c, k).cls]);\n  return (st.find(([, s]) => s !== \"done\") || [])[0] || null;   // first step, in order, the builder hasn't finished\n}\nfunction viewBuilder(c) {\n  const nx = nextStep(c), busy = SECTION_ORDER.some(k => isRunning(c.id, k)), ok = canEnhance();\n  return `\u003cdiv class=\"panel builder\">\n    \u003cdiv class=\"sec-h\">\u003ch2>Profile builder\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">Builds in order; each step starts from everything before it. Click a finished step to go deeper.\u003c/span>${webOK ? `\u003cspan class=\"pill accent\" title=\"Each step searches the web with Parallel Search and cites its sources\">Web search on\u003c/span>` : `\u003cspan class=\"pill warn\" title=\"Connect the free Parallel Search connector in claude.ai Settings \u2192 Connectors, then reload\">Web search off${webIssue ? \" (\" + esc(webIssue) + \")\" : \"\"}\u003c/span>`}\u003cspan class=\"sp\">\u003c/span>\n      ${ok && nx ? `\u003cbutton class=\"btn sm primary\" data-act=\"enhance\" data-k=\"${nx}\" ${busy ? \"disabled\" : \"\"}>Build next: ${esc(SECTIONS[nx].label)}\u003c/button>` : \"\"}${ok ? `\u003cbutton class=\"btn sm\" data-act=\"enhanceall\" ${busy ? \"disabled\" : \"\"}>Build all\u003c/button>` : \"\"}${canWeb() ? `\u003cbutton class=\"btn sm\" data-act=\"webbuild\" ${webActive(c.id) ? \"disabled\" : \"\"} title=\"Queue a full build for the scheduled Claude research session, which uses Claude's own web search (no search limits). Results arrive within the hour.\">${webActive(c.id) ? \"Deep research queued\" : \"Deep research\"}\u003c/button>` : \"\"}\u003c/div>\n    ${webPanel(c)}\n    ${(() => { const k = SECTION_ORDER.find(k => isRunning(c.id, k)); return k ? `\u003cdiv class=\"run\" role=\"status\" style=\"margin-top:10px\">\u003cspan class=\"spin\">\u003c/span>\u003cspan>\u003cb>Building ${esc(SECTIONS[k].label)} in the background.\u003c/b> Each step saves as it finishes.\u003c/span>\u003cspan class=\"sp\">\u003c/span>${chat.open ? \"\" : `\u003cbutton class=\"btn sm\" data-act=\"viewchat\">View live\u003c/button>`}\u003cbutton class=\"btn sm ghost\" data-act=\"stopsec\" data-k=\"${k}\">Stop\u003c/button>\u003c/div>` : \"\"; })()}\n    ${(() => { const k = SECTION_ORDER.find(k => runs[runKey(c.id, k)]?.error); return k ? `\u003cdiv class=\"run warnrun\" role=\"alert\">\u003cspan>\u003cb>${esc(SECTIONS[k].label)} didn't finish.\u003c/b> ${esc(runs[runKey(c.id, k)].error)}\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cbutton class=\"btn sm ghost\" data-act=\"dismisssec\" data-k=\"${k}\">Dismiss\u003c/button>\u003c/div>` : \"\"; })()}\n    \u003col class=\"steps\">${SECTION_ORDER.map((k, i) => { const st = stepState(c, k); return `\u003cli>\u003cbutton class=\"step ${st.cls}\" data-act=\"enhance\" data-k=\"${k}\" ${!ok || busy ? \"disabled\" : \"\"} title=\"${st.cls === \"done\" ? \"Go deeper on \" : \"Build \"}${esc(SECTIONS[k].label)}\">\u003cspan class=\"sn\">${st.cls === \"run\" ? `\u003cspan class=\"spin\">\u003c/span>` : i + 1}\u003c/span>\u003cspan class=\"sl\">${esc(SECTIONS[k].label)}\u003c/span>\u003cspan class=\"ss\">${esc(st.text)}\u003c/span>\u003c/button>\u003c/li>`; }).join(\"\")}\u003c/ol>\n  \u003c/div>`;\n}\nfunction delBtn() {\n  if (!writable || !db) return \"\";\n  return ui.confirmDel ? `\u003cspan class=\"delq\">Delete this company and everything saved on it? This can't be undone.\u003c/span>\u003cbutton class=\"btn dangerfill\" data-act=\"del\">Delete for good\u003c/button>\u003cbutton class=\"btn ghost\" data-act=\"nodel\">Keep it\u003c/button>` : `\u003cbutton class=\"btn danger\" data-act=\"askdel\">Delete company\u003c/button>`;\n}\n\nfunction peerSet(c) {\n  const ps = primarySector(c);\n  return list().filter(p => p.id !== c.id && inSector(p, ps) && sectorRev(p, ps) && (ps !== \"water\" || (p.business_model && p.business_model === c.business_model)));\n}\nfunction percentile(arr, v) { if (v === null || v === undefined || !arr.length) return null; const lt = arr.filter(x => x \u003c v).length, eq = arr.filter(x => x === v).length; return (lt + eq / 2) / arr.length * 100; }\nconst median = arr => { if (!arr.length) return null; const s = [...arr].sort((a, b) => a - b), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };\nfunction tile(label, valueHtml, sub, pct, peerLabel, text = false) {\n  const bar = pct === null || pct === undefined ? \"\" : `\u003cdiv class=\"pbar\" data-tip=\"${Math.round(pct)}th percentile among ${esc(peerLabel)}\">\u003cdiv style=\"width:${Math.max(3, pct).toFixed(0)}%\">\u003c/div>\u003c/div>`;\n  return `\u003cdiv class=\"tile\">\u003cdiv class=\"t-lab\">${label}\u003c/div>\u003cdiv class=\"t-val${text ? \" txt\" : \"\"}\">${valueHtml}\u003c/div>\u003cdiv class=\"t-sub\">${sub || \"\"}\u003c/div>${bar}\u003c/div>`;\n}\nfunction viewSnapshot(c) {\n  const ps = primarySector(c), water = ps === \"water\", sname = sectorById(ps)?.name || ps;\n  const peers = peerSet(c), pl = water ? (c.business_model || \"peers\").toLowerCase() + \"s\" : `${sname} companies`;\n  const V = (p, f) => num(p[f]);\n  const usr = sectorRev(c, ps), tot = V(c, \"total_revenue_usd_m\"), emp = V(c, \"employees_total\"), nb = p => (p.pb_brands || []).length;\n  const rk = sectorRank(c, ps);\n  const deals = (c.acquisitions || []).slice().sort((a, b) => dateKey(b.date) - dateKey(a.date));\n  const hold = yearOf(c.pe_entry_year) ? 2026 - yearOf(c.pe_entry_year) : null;\n  const tiles = [\n    tile(water ? \"US water revenue\" : `${esc(sectorShort(ps))} revenue`, `\u003cspan class=\"u\">$\u003c/span>${ed(water ? \"us_water_treatment_revenue_usd_m\" : \"__secrev\", usr, \"num\", \"\u2013\")}\u003cspan class=\"u\">M\u003c/span>`, rk ? `#${rk.rank} of ${rk.of} in ${esc(sectorShort(ps))}` : \"\", percentile(peers.map(p => sectorRev(p, ps)).filter(x => x !== null), usr), pl),\n    water ? tile(\"US market share\", `${ed(\"us_market_share_pct\", c.us_market_share_pct, \"num\", \"\u2013\")}\u003cspan class=\"u\">%\u003c/span>`, num(c.us_market_share_pct) !== null && +c.us_market_share_pct \u003c 0.1 ? \"Under 0.1% of US water treatment\" : \"Share of US water treatment\", null)\n      : tile(\"Sectors\", `${sectorsOf(c).length}`, esc(sectorsOf(c).map(x => sectorShort(x.sector)).join(\", \")), null),\n    tile(`Platform revenue ${confBadge(c, \"total_revenue_usd_m\", false)}`, `\u003cspan class=\"u\">$\u003c/span>${ed(\"total_revenue_usd_m\", c.total_revenue_usd_m, \"num\", \"\u2013\")}\u003cspan class=\"u\">M\u003c/span>`, esc(c.total_revenue_year || \"\"), percentile(peers.map(p => V(p, \"total_revenue_usd_m\")).filter(x => x !== null), tot), pl),\n    tile(\"Brands\", `${nb(c) || \"\u2013\"}`, esc((c.pb_brands || []).slice(0, 3).join(\", \")), percentile(peers.map(nb).filter(x => x), nb(c)), pl),\n    tile(\"SKUs tracked\", `${fmtInt(c.pb_skus) || \"\u2013\"}`, esc(c.pb_channel || \"\"), percentile(peers.map(p => num(p.pb_skus)).filter(x => x), num(c.pb_skus)), pl),\n    tile(`${esc(sectorShort(ps))} share of revenue`, usr && tot ? `${Math.min(100, usr / tot * 100).toFixed(0)}\u003cspan class=\"u\">%\u003c/span>` : \"\u2014\", esc(water ? c.water_relevance || \"\" : sname), null),\n    tile(\"Headquarters\", esc(stateOf(c) || \"\u2014\"), esc(String(c.hq_address || \"\").slice(0, 60)), null, \"\", true),\n    tile(`Employees ${confBadge(c, \"employees_total\", false)}`, ed(\"employees_total\", c.employees_total, \"num\", \"\u2013\"), emp && tot ? `$${Math.round(tot / emp * 1000)}k revenue per employee` : \"\", percentile(peers.map(p => V(p, \"employees_total\")).filter(x => x), emp), pl),\n    tile(\"Deals logged\", `${deals.length}`, deals[0] ? `Latest: ${esc(deals[0].target)} (${esc(String(deals[0].date).slice(0, 7))})` : \"No deals on file\", percentile(peers.map(p => (p.acquisitions || []).length), deals.length), pl),\n    tile(\"Ownership\", esc(c.owner_type || \"\u2014\"), esc([String(c.pe_sponsor || \"\").split(/[;(]/)[0].trim(), hold !== null ? `held ${hold} yr${hold === 1 ? \"\" : \"s\"}` : \"\"].filter(Boolean).join(\" \u00b7 \")), null, \"\", true),\n    tile(\"Business model\", ed(\"business_model\", c.business_model, \"text\", \"Add\"), esc([c.scope, c.value_chain].filter(Boolean).join(\" \u00b7 \")), null, \"\", true),\n    tile(\"Data confidence\", esc(c.confidence || \"\u2014\"), `Updated ${fmtDate(c.updated_at)}`, null, \"\", true),\n  ].join(\"\");\n  const near = peers.map(p => ({ p, d: Math.abs(Math.log((sectorRev(p, ps) || 1) / (usr || 1))) })).sort((a, b) => a.d - b.d).slice(0, 6);\n  const buyers = (c.buyers || []).length ? c.buyers.slice(0, 5).map(b => ({ name: b.name, sub: b.rationale, id: findCompanyByName(b.name)?.id })) : likelyBuyers(c).slice(0, 5).map(b => ({ name: b.p.name, id: b.p.id, sub: `${b.o.toFixed(0)}% similarity \u00b7 ${b.n} deals` }));\n  const bk = Object.entries(water && Object.keys(buckets(c)).length ? buckets(c) : (c[EM_FIELD] || {})).sort((a, b) => b[1] - a[1]).slice(0, 10);\n  const secRows = tableRows(c, \"sectors\");\n  return `\n  \u003cdiv class=\"sec\">${secHead(c, \"sectors\", \"Business lines by sector\", `\u003clabel class=\"faint\" style=\"font-size:12px\">Primary \u003cselect id=\"primsel\" aria-label=\"Primary sector\">${sectorOptions(allSectors().filter(x => wsHas(groupOf(c).split(\"/\")[0], x.g)), ps)}\u003c/select>\u003c/label>`, \"sectors\", [\"sectors\", \"primary_sector\"])}\n    ${editTable(c, \"sectors\", [{ k: \"name\", label: \"Sector\" }, { k: \"what\", label: \"Products or brands\" }, { k: \"revenue_usd_m\", label: \"Revenue $M\", t: \"num\", w: \"110px\" }, { k: \"pct\", label: \"% of total\", t: \"num\", w: \"100px\" }], secRows, { empty: \"No business lines yet. Hit Enhance and Claude splits revenue by sector.\" })}\n    \u003cp class=\"faint\" style=\"font-size:12px;margin-top:6px\">Type a sector name, e.g. Janitorial / Facility, MRO / Industrial or Plumbing / HVAC. A company shows up in every sector listed here.\u003c/p>\u003c/div>\n  \u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Key stats\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">Bars show where ${esc(c.name)} sits among ${peers.length} ${esc(pl)}. Type over any number to override it.\u003c/span>\u003c/div>\n    \u003cdiv class=\"tiles\">${tiles}\u003c/div>\u003c/div>\n  \u003cdiv class=\"sec grid2\">\n    \u003cdiv>\u003cdiv class=\"sec-h\">\u003ch2>Closest peers\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">${water ? \"Same business model\" : \"Same sector\"}, nearest in size\u003c/span>\u003c/div>\n      \u003cdiv class=\"tw\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Company\u003c/th>\u003cth class=\"r\">${esc(sectorRevLabel(ps))}\u003c/th>\u003cth class=\"r\">Employees\u003c/th>\u003cth>Owner\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${near.map(({ p }) => `\u003ctr class=\"link\" data-open=\"${esc(p.id)}\">\u003ctd class=\"cname\">${esc(p.name)}\u003c/td>\u003ctd class=\"r num\">${fmtM(sectorRev(p, ps))}\u003c/td>\u003ctd class=\"r num\">${fmtInt(p.employees_total) || \"\u2014\"}\u003c/td>\u003ctd class=\"muted\">${esc(p.owner_type || \"\")}\u003c/td>\u003c/tr>`).join(\"\") || `\u003ctr>\u003ctd colspan=\"4\" class=\"faint\">No peers in the market map.\u003c/td>\u003c/tr>`}\u003c/tbody>\u003c/table>\u003c/div>\u003c/div>\n    \u003cdiv>\u003cdiv class=\"sec-h\">\u003ch2>${(c.buyers || []).length ? \"Top buyers\" : \"Likely buyers\"}\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003ca class=\"btn sm ghost\" href=\"#c.${esc(c.id)}.buyers\">All buyers\u003c/a>\u003c/div>\n      \u003cdiv class=\"panel list-p\">${buyers.map(b => `\u003cdiv class=\"li\">\u003cdiv class=\"who\">${b.id ? `\u003ca href=\"#c.${esc(b.id)}\">${esc(b.name)}\u003c/a>` : esc(b.name)}\u003c/div>\u003cdiv class=\"muted\" style=\"font-size:12px\">${esc(b.sub || \"\")}\u003c/div>\u003c/div>`).join(\"\") || `\u003cp class=\"faint\" style=\"padding:12px\">No likely buyers found in the market map.\u003c/p>`}\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"sec grid2\">\n    \u003cdiv>\u003cdiv class=\"sec-h\">\u003ch2>${water && Object.keys(buckets(c)).length ? \"US water end markets\" : \"End markets\"}\u003c/h2>\u003c/div>\n      \u003cdiv class=\"panel bars\" style=\"padding:6px\">${bk.map(([k, v]) => `\u003cdiv class=\"brow\" style=\"cursor:default;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 60px\">\u003cspan class=\"nm\">${esc(k)}\u003c/span>\u003cdiv class=\"track\">\u003cdiv class=\"fill\" style=\"width:${v}%\">\u003c/div>\u003c/div>\u003cspan class=\"v\">${fmtPct(v)}\u003c/span>\u003c/div>`).join(\"\") || `\u003cp class=\"faint\" style=\"padding:10px\">No end-market split yet.\u003c/p>`}\u003c/div>\u003c/div>\n    \u003cdiv>\u003cdiv class=\"sec-h\">\u003ch2>Latest deals\u003c/h2>\u003cspan class=\"sp\">\u003c/span>\u003ca class=\"btn sm ghost\" href=\"#c.${esc(c.id)}.acquisitions\">All deals\u003c/a>\u003c/div>\n      \u003cdiv class=\"panel list-p\">${deals.slice(0, 5).map(d => `\u003cdiv class=\"li\">\u003cdiv class=\"who\">${esc(d.target)} \u003cspan class=\"faint num\" style=\"font-weight:400\">${esc(String(d.date).slice(0, 10))}\u003c/span>\u003c/div>\u003cdiv class=\"muted\" style=\"font-size:12px\">${esc(d.what_it_does || \"\")}\u003c/div>\u003c/div>`).join(\"\") || `\u003cp class=\"faint\" style=\"padding:12px\">No deals on file.\u003c/p>`}\u003c/div>\u003c/div>\n  \u003c/div>`;\n}\n\nconst CONF_COL = { k: \"confidence\", label: \"Conf.\", w: \"86px\" };\nfunction mapCell(name, selfId) {\n  if (!name) return \"\";\n  const m = findCompanyByName(name, selfId);\n  if (m) return `\u003ca href=\"#c.${esc(m.id)}\">${esc(m.name)}\u003c/a>`;\n  return `\u003cspan class=\"faint\">Not in the CRM\u003c/span>${writable && db ? ` \u003cbutton class=\"btn sm ghost\" data-act=\"profile-target\" data-name=\"${esc(name)}\">Create\u003c/button>` : \"\"}`;\n}\nconst SRC = { saved: [\"k-acq\", \"Saved\"], buyer: [\"k-idea\", \"Named buyer\"], index: [\"k-buyer\", \"Market-map match\"] };\nfunction tabBody(c, tab) {\n  const rev = num(c.total_revenue_usd_m);\n  if (tab === \"segments\") return viewSegments(c);\n  if (tab === \"people\") return viewPeople(c);\n  if (tab === \"overview\") {\n    const em = endMarkets(c);\n    return `\n    \u003cdiv class=\"sec pies\">\n      ${donut(\"pe\", \"By end market\", em.map(e => ({ label: e.label, pct: e.pct })), { pctOnly: true, rev, locked: (c.locked || []).includes(EM_FIELD), center: fmtM(rev), centerSub: \"REVENUE\", extra: enhanceBtn(c, \"endmarkets\") })}\n      ${donut(\"ps\", \"By segment\", segments(c), { locked: (c.locked || []).includes(\"revenue_by_business\"), extra: enhanceBtn(c, \"segments\") })}\n      ${donut(\"pp\", \"By product\", products(c), { locked: (c.locked || []).includes(\"revenue_by_product\"), extra: enhanceBtn(c, \"products\") })}\n    \u003c/div>\n    ${suggestionBox(c, [EM_FIELD, \"end_market_buckets\", \"revenue_by_business\", \"revenue_by_product\"])}\n    \u003cdiv class=\"sec\">${secHead(c, \"\", \"About\", \"\", \"overview\", [\"what_it_is\", \"bluntly\"])}\n      ${ed(\"what_it_is\", c.what_it_is, \"text\", \"One or two sentences on what this company is\", \"div\", \"lede\")}\n      \u003cdiv class=\"take\">\u003cdiv class=\"eyebrow\">Bluntly\u003c/div>${ed(\"bluntly\", c.bluntly, \"text\", \"Plain-spoken take on the business\", \"div\")}\u003c/div>\u003c/div>\n    ${overviewLists(c)}\n    ${exploreButtons(c)}`;\n  }\n  if (tab === \"stats\") return viewSnapshot(c);\n  if (tab === \"notes\") {\n    return `\n    \u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Notes\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">The long view: what we know, where we know it from, and what changed.\u003c/span>\u003c/div>\u003c/div>\n    \u003cdiv class=\"sec grid2\">\n      \u003cdiv class=\"panel\">\u003cdiv class=\"kv\">\n        \u003cdt>Owner type\u003c/dt>\u003cdd>${ed(\"owner_type\", c.owner_type, \"text\", \"e.g. PE-owned\")}\u003c/dd>\n        \u003cdt>Ultimate parent\u003c/dt>\u003cdd>${ed(\"ultimate_parent\", c.ultimate_parent)}\u003c/dd>\n        \u003cdt>Sponsor\u003c/dt>\u003cdd>${ed(\"pe_sponsor\", c.pe_sponsor)}\u003c/dd>\n        \u003cdt>Entry year\u003c/dt>\u003cdd>${ed(\"pe_entry_year\", c.pe_entry_year)}\u003c/dd>\n        \u003cdt>Entry EV ($M)\u003c/dt>\u003cdd>${ed(\"pe_entry_ev_usd_m\", c.pe_entry_ev_usd_m, \"num\", \"\u2013\")}\u003c/dd>\n        \u003cdt>Prior owners\u003c/dt>\u003cdd>${ed(\"prior_owners\", c.prior_owners)}\u003c/dd>\n      \u003c/div>\u003c/div>\n      \u003cdiv class=\"panel\">\u003cdiv class=\"kv\">\n        \u003cdt>HQ\u003c/dt>\u003cdd>${ed(\"hq_address\", c.hq_address)}\u003c/dd>\n        \u003cdt>Website\u003c/dt>\u003cdd>${ed(\"website\", c.website)}\u003c/dd>\n        \u003cdt>Category\u003c/dt>\u003cdd>${ed(\"primary_category\", c.primary_category)}\u003c/dd>\n        \u003cdt>Confidence\u003c/dt>\u003cdd>${ed(\"confidence\", c.confidence, \"text\", \"High, Medium or Low\")}\u003c/dd>\n        \u003cdt>US sites\u003c/dt>\u003cdd>${ed(\"us_sites_count\", c.us_sites_count, \"num\", \"\u2013\")}\u003c/dd>\n      \u003c/div>\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"sec\">\n      \u003cdiv class=\"sec-h\">\u003ch2>Profile\u003c/h2>${lockPill(c, \"profile_md\")}\u003cspan class=\"sp\">\u003c/span>${writable && db ? `\u003cbutton class=\"btn sm ghost\" data-act=\"editmd\">${ui.editMd ? \"Done\" : \"Edit text\"}\u003c/button>` : \"\"}\u003c/div>\n      ${ui.editMd ? `\u003ctextarea id=\"mdEdit\" style=\"width:100%;min-height:420px;font-family:var(--f-mono);font-size:13px\">${esc(c.profile_md || \"\")}\u003c/textarea>\u003cdiv style=\"margin-top:8px\">\u003cbutton class=\"btn primary\" data-act=\"savemd\">Save profile text\u003c/button>\u003c/div>` : `\u003cdiv class=\"md\">${md(c.profile_md) || `\u003cp class=\"faint\">No write-up yet. Hit Enhance on About, or click Edit text.\u003c/p>`}\u003c/div>`}\n    \u003c/div>\n    \u003cdiv class=\"sec basis\">\n      ${c.total_revenue_basis ? `\u003cp>\u003cb>Revenue basis.\u003c/b> ${esc(c.total_revenue_basis)}\u003c/p>` : \"\"}\n      ${c.us_water_treatment_arithmetic ? `\u003cp>\u003cb>US water revenue math.\u003c/b> ${esc(c.us_water_treatment_arithmetic)}\u003c/p>` : \"\"}\n      ${c.employees_basis ? `\u003cp>\u003cb>Headcount basis.\u003c/b> ${esc(c.employees_basis)}\u003c/p>` : \"\"}\n    \u003c/div>\n    ${tabBody(c, \"sources\")}`;\n  }\n  if (tab === \"mix\") {\n    const segs = tableRows(c, \"revenue_by_business\"), prods = tableRows(c, \"revenue_by_product\"), ems = tableRows(c, EM_FIELD).sort((a, b) => (b.pct || 0) - (a.pct || 0));\n    const segSum = segs.reduce((s, r) => s + (num(r.revenue_usd_m) || 0), 0), emSum = ems.reduce((s, r) => s + (num(r.pct) || 0), 0);\n    return `\n    \u003cp class=\"muted\" style=\"margin-top:-6px\">Edit any number and the pie charts update. A table you edit becomes an override: Enhance won't replace it and shows Claude's version as a suggestion instead.\u003c/p>\n    \u003cdiv class=\"sec\">${secHead(c, \"revenue_by_business\", \"Segment istory\", `\u003ca class=\"btn sm ghost\" href=\"#precedents~${encodeURIComponent(c.id)}\">Best precedents\u003c/a>`, \"deals\")}\u003cp class=\"muted\" style=\"margin:-4px 0 10px;font-size:13px\">Enhance looks for deals that aren't listed yet and adds them. Every deal here also shows up in Buyer finder and Precedents.\u003c/p>${html}\u003c/div>\n    ${c.rolled_in ? `\u003cdiv class=\"sec basis\">\u003cp>\u003cb>Rolled into this platform.\u003c/b> ${esc(c.rolled_in)}\u003c/p>\u003c/div>` : \"\"}\n    ${c.addon_corrections ? `\u003cdiv class=\"sec basis\">\u003cp>\u003cb>Notes on the deal list.\u003c/b> ${esc(c.addon_corrections)}\u003c/p>\u003c/div>` : \"\"}`;\n  }\n  if (tab === \"buyers\") {\n    const lb = likelyBuyers(c), sp = likelySponsors(c), saved = new Set((c.buyers || []).map(b => norm(b.name)));\n    return `\u003cdiv class=\"sec\">${secHead(c, \"buyers\", \"Top buyers\", \"\", \"buyers\")}${editTable(c, \"buyers\", [{ k: \"name\", label: \"Buyer\", w: \"200px\" }, { k: \"_m\", label: \"In CRM\", ro: true, w: \"200px\", fmt: r => mapCell(r.name, c.id) }, { k: \"type\", label: \"Type\", w: \"110px\" }, { k: \"fit\", label: \"Fit\", w: \"70px\" }, { k: \"rationale\", label: \"Why they'd buy\" }, CONF_COL], tableRows(c, \"buyers\"), { empty: \"No buyer list saved yet. Hit Enhance and Claude ranks the best buyers, or save the likely buyers below.\" })}\n      \u003cp class=\"faint\" style=\"font-size:12px;margin-top:8px\">Every buyer that has a profile automatically lists ${esc(c.name)} on its Add-ons tab.\u003c/p>\u003c/div>\n    \u003cdiv class=\"sec\">\u003cdiv class=\"sec-h\">\u003ch2>Likely buyers from the market map\u003c/h2>\u003cspan class=\"faint\" style=\"font-size:12px\">Bigger companies in the CRM with the most similar sectors and end markets, weighted toward active acquirers\u003c/span>\u003cspan class=\"sp\">\u003c/span>${writable && db && lb.length ? `\u003cbutton class=\"btn sm ghost\" data-act=\"savebuyers\">Save top 5\u003c/button>` : \"\"}\
