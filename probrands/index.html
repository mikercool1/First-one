<title>Probrands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a left control rail (stencilled brand plate, nav, ownership filter) beside the work area.
   Shop-floor palette: gunmetal, galvanised steel, safety yellow used sparingly; DNA bands are green / amber / red. */
:root{
  --bg:#121311; --rail:#0b0c0a; --panel:#1b1c19; --panel-2:#22231f; --sunk:#0f100e; --line:#33342e; --line-2:#45463f;
  --ink:#ece7da; --ink-2:#aaa596; --ink-3:#77736a; --accent:#f2b705; --accent-ink:#141209; --accent-text:#f2b705;
  --good:#46b35f; --mid:#e8860c; --bad:#d9472f; --good-soft:#1c3122; --mid-soft:#3a2a12; --bad-soft:#3b1d17;
  --c1:#f2b705; --c2:#5aa9e6; --c3:#46b35f; --c4:#e8860c; --c5:#b48ee8; --c6:#d9472f; --c7:#3fc1b0; --c8:#c9c27a; --c0:#5d5b53;
  --k-pe:#bb8b00; --k-fam:#2fa38c; --ch-pro:#3d7fe0; --ch-mixed:#2aa37a; --ch-retail:#c9792b; --ch-diy:#a070d0;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Barlow", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --hazard:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--accent-ink) 10px 20px);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#e4e1d8; --rail:#1a1b18; --panel:#f3f1ea; --panel-2:#ebe8df; --sunk:#d9d5ca; --line:#c3beb1; --line-2:#a9a497;
  --ink:#171611; --ink-2:#55524a; --ink-3:#7c786d; --accent:#f2b705; --accent-ink:#141209; --accent-text:#8a6300;
  --good:#2e8a45; --mid:#b9620a; --bad:#b8321d; --good-soft:#d6ead9; --mid-soft:#f3e0c6; --bad-soft:#f2d6cf;
  --c1:#c99500; --c2:#2f7fc0; --c3:#2e8a45; --c4:#c96a06; --c5:#7d5bc2; --c6:#b8321d; --c7:#1e9585; --c8:#8c8540; --c0:#a39f93; --k-pe:#a87b00; --k-fam:#0f8f76; --ch-pro:#2f6fcf; --ch-mixed:#13895c; --ch-retail:#b0621a; --ch-diy:#8a5cc8;
  color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e4e1d8; --rail:#1a1b18; --panel:#f3f1ea; --panel-2:#ebe8df; --sunk:#d9d5ca; --line:#c3beb1; --line-2:#a9a497;
  --ink:#171611; --ink-2:#55524a; --ink-3:#7c786d; --accent:#f2b705; --accent-ink:#141209; --accent-text:#8a6300;
  --good:#2e8a45; --mid:#b9620a; --bad:#b8321d; --good-soft:#d6ead9; --mid-soft:#f3e0c6; --bad-soft:#f2d6cf;
  --c1:#c99500; --c2:#2f7fc0; --c3:#2e8a45; --c4:#c96a06; --c5:#7d5bc2; --c6:#b8321d; --c7:#1e9585; --c8:#8c8540; --c0:#a39f93; --k-pe:#a87b00; --k-fam:#0f8f76; --ch-pro:#2f6fcf; --ch-mixed:#13895c; --ch-retail:#b0621a; --ch-diy:#8a5cc8;
  color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
body{font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input,select{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:2px;padding:7px 10px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
h1{font-size:clamp(38px,6vw,64px);font-weight:900}
h2{font-size:24px;font-weight:800}
h3{font-size:17px;font-weight:800}
.lbl{font:600 11px/1.2 var(--f-mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- shell ---- */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{background:var(--rail);color:#ece7da;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;border-right:1px solid #000}
.rail .hz{height:12px;background:var(--hazard);flex:none}
.plate{margin:18px 16px 10px;padding:12px 12px 10px;border:2px solid #4b4c45;border-radius:3px;position:relative;background:linear-gradient(180deg,#22231f,#161714)}
.plate::before,.plate::after{content:"";position:absolute;top:6px;width:6px;height:6px;border-radius:50%;background:#55564f;box-shadow:inset 0 1px 0 #77786f}
.plate::before{left:6px}.plate::after{right:6px}
.plate b{display:block;font:900 27px/0.9 var(--f-display);letter-spacing:.02em;text-transform:uppercase;color:#f2b705}
.plate small{display:block;margin-top:5px;font:600 10px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#99958a}
.nav{display:flex;flex-direction:column;padding:8px 10px;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 10px;text-decoration:none;font:800 19px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;color:#bdb8aa;border-left:4px solid transparent}
.nav a:hover{color:#fff;background:#1a1b18}
.nav a[aria-current="page"]{color:#fff;border-left-color:#f2b705;background:#1d1e1a}
.nav a small{margin-left:auto;font:600 11px var(--f-mono);color:#77736a;letter-spacing:0}
.rail .sect{padding:14px 16px 6px;border-top:1px solid #26271f;margin-top:8px}
.rail .sect .lbl{color:#77736a;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid #45463f;border-radius:2px;font:600 12px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:#bdb8aa;background:transparent}
.chip[aria-pressed="true"]{background:#f2b705;border-color:#f2b705;color:#141209}
.chip small{font-weight:400;opacity:.75}
.rail .foot{margin-top:auto;padding:14px 16px 18px;font:500 11px/1.5 var(--f-mono);color:#77736a}
.rail .foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#77736a;margin-right:6px;vertical-align:1px}
.rail .foot .dot.on{background:#46b35f}
.main{min-width:0;padding:28px 32px 60px}
.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:18px}
.page-h p{margin:8px 0 0;max-width:68ch;color:var(--ink-2)}
.page-h .grow{flex:1 1 380px;min-width:0}

/* ---- stats strip ---- */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));border:1px solid var(--line);background:var(--panel);margin-bottom:18px}
.gauge{padding:12px 14px;border-right:1px solid var(--line)}
.gauge:last-child{border-right:0}
.gauge b{display:block;font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.gauge span{display:block;margin-top:4px}
.gauge.glink{text-decoration:none;color:inherit;background:var(--panel-2);box-shadow:inset 0 -3px 0 var(--accent)}
.gauge.glink:hover{background:var(--sunk)}
.gauge.g b{color:var(--good)}.gauge.a b{color:var(--mid)}.gauge.r b{color:var(--bad)}

/* ---- toolbar ---- */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .search{flex:1 1 240px;min-width:0}
.bar select{max-width:100%;min-width:0;text-overflow:ellipsis}
.tog{display:inline-flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line);background:var(--panel);font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2)}
.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
.tog[aria-pressed="true"]::before{content:"";width:8px;height:8px;background:var(--accent)}

/* ---- the screen ---- */
.rows{border:1px solid var(--line);background:var(--panel)}
.rhead,.row{display:grid;grid-template-columns:6px 64px 116px minmax(0,2.2fr) minmax(0,1.5fr) 64px 56px 64px;align-items:center;gap:0 14px}
.rhead{padding:9px 14px 9px 0;border-bottom:2px solid var(--line-2);background:var(--panel-2)}
.rhead button{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);text-align:left}
.rhead button[aria-sort]{color:var(--ink)}
.rhead .r,.row .r{text-align:right}
.row{padding:10px 14px 10px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--panel-2)}
.row .stripe{align-self:stretch;margin:-10px 0}
.band-g{background:var(--good)}.band-a{background:var(--mid)}.band-r{background:var(--bad)}
.score{font:800 28px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score.g{color:var(--good)}.score.a{color:var(--mid)}.score.r{color:var(--bad)}
.dna{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;width:112px}
.dna i{height:14px;display:block;border-radius:1px}
.dna i.v2{background:var(--good)}.dna i.v1{background:var(--mid)}.dna i.v0{background:var(--bad)}
.dna i.ov{box-shadow:inset 0 0 0 2px var(--accent)}
.co b{display:block;font-weight:700;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co small{display:block;color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.own{display:inline-block;padding:1px 6px;margin-right:6px;font:600 10px/1.6 var(--f-mono);text-transform:uppercase;letter-spacing:.08em;border:1px solid var(--line-2);color:var(--ink-2);vertical-align:1px}
.own.pe{border-color:var(--accent);color:var(--accent-text)}
.own.family{border-color:var(--c3);color:var(--c3)}
.unv{color:var(--mid);font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
.brs{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cut{border-top:3px solid var(--line-2);padding:10px 14px;background:var(--sunk);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cut b{font:800 15px var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.more{display:block;width:100%;padding:12px;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);border-top:1px solid var(--line)}
.more:hover{color:var(--ink);background:var(--panel-2)}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2)}
@media (max-width:1100px){.rhead,.row{grid-template-columns:6px 56px 112px minmax(0,1fr) 60px 56px}.rhead .hide-m,.row .hide-m{display:none}}

/* ---- company page ---- */
.back{display:inline-block;margin-bottom:12px;font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);text-decoration:none}
.back:hover{color:var(--ink)}
.nameplate{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end;padding:22px 24px;border:2px solid var(--line-2);background:var(--panel);position:relative;margin-bottom:18px}
.nameplate::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--hazard)}
.nameplate h1{font-size:clamp(34px,5vw,56px);margin-top:6px}
.nameplate .what{margin:12px 0 0;max-width:75ch;color:var(--ink-2)}
.specs{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font:500 13px var(--f-mono);color:var(--ink-2)}
.specs b{color:var(--ink);font-weight:600}
.dial{text-align:right}
.dial b{display:block;font:900 84px/0.85 var(--f-display);font-variant-numeric:tabular-nums}
.dial b.g{color:var(--good)}.dial b.a{color:var(--mid)}.dial b.r{color:var(--bad)}
.dial span{display:block;margin-top:6px}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.panel{border:1px solid var(--line);background:var(--panel);margin-bottom:18px}
.panel > header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.panel > header .sp{flex:1}
.panel .body{padding:14px 16px}
.test{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:4px 14px;padding:11px 16px;border-bottom:1px solid var(--line)}
.test:last-child{border-bottom:0}
.test .t{font-weight:700}
.test .why{grid-column:1;color:var(--ink-2);font-size:13.5px}
.test .src{grid-column:2;text-align:right}
.verdict{grid-row:1/span 2;grid-column:2;align-self:start;justify-self:end;width:92px;padding:6px 0;text-align:center;font:800 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:2px solid currentColor}
.verdict.v2{color:var(--good)}.verdict.v1{color:var(--mid)}.verdict.v0{color:var(--bad)}
.verdict:hover:not([disabled]){background:var(--panel-2)}
.verdict[disabled]{cursor:default}
.src{font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.src.you{color:var(--accent-text)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--line-2);background:var(--panel);font:700 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.5;cursor:default}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);text-align:left;padding:9px 12px;border-bottom:2px solid var(--line-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td b{font-weight:700}
.tag{display:inline-block;font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;padding:1px 5px;border:1px solid var(--line-2);color:var(--ink-2);margin:1px 3px 1px 0;white-space:nowrap}
td.rv{font-size:13px;line-height:1.5;white-space:nowrap}
.tag.tri{border-color:var(--good);color:var(--good)}
.mixes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px}
.mix h3{margin-bottom:8px}
.stack{display:flex;height:22px;border:1px solid var(--line-2);margin-bottom:10px;overflow:hidden}
.stack i{display:block;height:100%}
.legend{list-style:none;margin:0;padding:0;font-size:13.5px}
.legend li{display:grid;grid-template-columns:12px minmax(0,1fr) auto 46px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px dashed var(--line)}
.legend li:last-child{border-bottom:0}
.legend .sw{width:12px;height:12px}
.legend span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .num{color:var(--ink-2);font-size:12.5px;text-align:right}
.prose{max-width:75ch;color:var(--ink-2)}
.prose p{margin:0 0 10px}
.prose b,.prose strong{color:var(--ink)}
.srcs{list-style:none;margin:0;padding:0;font-size:13.5px}
.srcs li{padding:6px 0;border-bottom:1px dashed var(--line)}
.srcs a{color:var(--accent-text)}

/* ---- bars (SKU mix page, consolidators) ---- */
.hbars{list-style:none;margin:0;padding:0}
.hbars li{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 54px 42px;gap:10px;align-items:center;padding:4px 0;font-size:13.5px}
.hbars li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .track{height:14px;background:var(--sunk);position:relative}
.hbars .fill{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.hbars .num{text-align:right;font-size:12.5px;color:var(--ink-2)}
.cons-row{cursor:pointer}
.st{font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.st-guess,.st-prior{color:var(--mid)}
.btable td{font-size:13.5px}
.btable td:nth-child(2){min-width:220px}
.btable td:first-child{min-width:130px}
.btable th button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
.rhead button,.btable th button{white-space:nowrap}
.cons-row:hover td{background:var(--panel-2)}
.rank{font:800 22px/1 var(--f-display);color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ---- web ---- */
.webwrap{border:1px solid var(--line);background:var(--sunk);position:relative;height:min(72vh,760px);min-height:420px;overflow:hidden;touch-action:none}
.webwrap svg{width:100%;height:100%;display:block;cursor:grab}
.webwrap svg.drag{cursor:grabbing}
.webwrap .ctl{position:absolute;right:10px;top:10px;display:flex;gap:6px}
.webwrap .ctl button{width:34px;height:34px;border:1px solid var(--line-2);background:var(--panel);font:700 18px var(--f-mono)}
.webwrap .key{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px 14px;padding:8px 10px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);font:500 12px var(--f-mono);color:var(--ink-2);max-width:calc(100% - 20px)}
.webwrap .key i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.wl{font:600 11px var(--f-mono);fill:var(--ink-2);pointer-events:none}
.wh{font:800 14px var(--f-display);fill:var(--ink);text-transform:uppercase;letter-spacing:.03em;pointer-events:none;paint-order:stroke;stroke:var(--sunk);stroke-width:4px}
.hubg{cursor:pointer}
.focus-list{margin-top:18px}

/* ---- misc ---- */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font:700 13px var(--f-mono);padding:10px 16px;z-index:50;text-transform:uppercase;letter-spacing:.06em}
.note{border-left:4px solid var(--accent);background:var(--panel);padding:10px 14px;margin-bottom:16px;color:var(--ink-2);font-size:14px}
.note.warn{border-left-color:var(--mid)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel-2);border:1px solid var(--line-2);padding:8px 10px;font-size:13px;color:var(--ink);max-width:280px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#tip b{display:block;margin-bottom:2px}
.qchart{width:100%;height:auto;display:block}
.qchart .gl{stroke:var(--line);stroke-width:1}
.qchart .ax{fill:var(--ink-3);font:600 11px var(--f-mono)}
.qchart .ql{fill:var(--ink-2);font:600 12px var(--f-mono);text-transform:uppercase;letter-spacing:.08em}
.qchart .dot{cursor:pointer;stroke:var(--panel);stroke-width:2}
.qchart .dot:hover{stroke:var(--ink)}
.penbar{display:inline-block;width:80px;height:8px;background:var(--sunk);border:1px solid var(--line);vertical-align:middle;margin-right:6px}
.penbar i{display:block;height:100%;background:var(--accent)}
.obar{display:flex;height:12px;min-width:120px;background:var(--sunk);border:1px solid var(--line)}
.obar i{display:block;height:100%}
.olegend{display:flex;flex-wrap:wrap;gap:4px 14px;font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.olegend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.players{margin:0;padding-left:18px}.players li{margin:3px 0}
.skel{padding:80px 0;color:var(--ink-3);font:600 13px var(--f-mono);text-transform:uppercase;letter-spacing:.12em}

/* ---- phone ---- */
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0}
  .plate{margin:12px 16px 6px}
  .plate b{font-size:24px}
  .nav{flex-direction:row;overflow-x:auto;padding:4px 12px 8px}
  .nav a{border-left:0;border-bottom:4px solid transparent;padding:8px 10px;white-space:nowrap;font-size:17px}
  .nav a[aria-current="page"]{border-bottom-color:#f2b705}
  .nav a small{display:none}
  .rail .sect{margin-top:0;padding:10px 16px}
  .rail .foot{display:none}
  .main{padding:18px 16px 48px}
  .rhead{display:none}

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => (v === null || v === undefined || v === "" || isNaN(+v)) ? null : +v;
const pct = v => v === null || v === undefined ? "—" : Math.round(v * 100) + "%";
const fmtM = v => { v = num(v); if (v === null) return "—"; return v >= 1000 ? "$" + (v / 1000).toFixed(1).replace(/\.0$/, "") + "B" : "$" + Math.round(v) + "M"; };
const norm = s => String(s || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const now = () => new Date().toISOString();
const YEAR = new Date().getFullYear();
const store = { get(k, d) { try { const v = localStorage.getItem("probrands2." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("probrands2." + k, JSON.stringify(v)); } catch {} } };

/* ---------- state ---------- */
let db = null, sample = null, writable = false, dbState = "connecting";
const CO = new Map(), DT = new Map(), DNA = new Map(), BR = new Map(), SKU = new Map(), skuLoading = new Set();
let brandByName = new Map();
let CATS = [], CATNAMES = [], SEGOF = {}, PRICING = {};
const PRICES = new Map(), priceLoading = new Set();
let DEALS = [], DISTS = [], SRC = "", loaded = false, ver = 0;
const OWN = [["pe", "PE"], ["family", "Family"], ["esop", "ESOP"], ["private", "Private"], ["corp", "Corporate"]];
const ownKey = c => c.oclass === "public" || c.oclass === "sub_private" ? "corp" : c.oclass;
const ui = { own: new Set(store.get("own", ["pe", "family"])), chf: "", pmin: 2, pall: false, psort: "n", pp: { q: "", min: 3, sort: "lead", seg: "", cat: "", own: "", pos: "", limit: 100 }, roll: store.get("roll", []), rview: "xs", wsmk: "core", wslimit: 40, wsst: "", rq: "", cap: "demo", rmin: "", rsort: "head", rlimit: 60, q: "", dch: "", dmk: "", dsort: "brands", dq: "", fam: "", seg: "", rev: "", mkt: "", cseg: "", csort: "n", sort: "dna", dir: -1, showOut: false, limit: 80, focus: null, busy: {},
  b: { q: "", status: "", tri: "", own: "", fam: "", seg: "", ch: "", dist: "", mkt: "", fmt: "", sort: "skus", dir: -1, limit: 100 } };

/* ---------- DNA ---------- */
// Seven checks. Data checks come from the SKU scrape; judgment checks come from Claude, and you can override any of them.
const TESTS = [
  { k: "hand", t: "Fits in your hand", q: "Small format a worker holds: aerosol, tube, cartridge, wipe, marker, or a bottle or can up to 1 gal.", w: 15 },
  { k: "dist", t: "Sold through pro distributors", q: "Carried by broadline MRO and trade specialty distributors rather than retail.", w: 15 },
  { k: "pull", t: "Pros ask for it by name", q: "A brand tradespeople want to own, not whatever is on the shelf.", w: 15 },
  { k: "itw", t: "ITW Pro Brands would want it", q: "Handheld, formulated, consumable pro product sold through MRO and trade distribution.", w: 15 },
  { k: "major", t: "Pro brands are most of revenue", q: "Small-format pro products are the large majority, or all, of sales.", w: 20 },
  { k: "cons", t: "Used up and re-bought", q: "Consumables that come back every month, not tools or equipment.", w: 10 },
  { k: "own", t: "Owns its brand", q: "A real brand owner, not private label, contract fill or a distributor house brand.", w: 10 },
];
const V = ["Fail", "Partly", "Pass"];
function autoTest(c, k) {
  const m = c.m || {}, n = c.skus || 0, thin = n < 5 ? ` Only ${n} SKU${n === 1 ? "" : "s"} scraped, so treat with care.` : "";
  switch (k) {
    case "hand": return { v: m.hand >= 0.75 ? 2 : m.hand >= 0.45 ? 1 : 0, why: `${pct(m.hand)} of ${n} scraped SKUs are hand-sized packs.${thin}` };
    case "dist": return { v: m.ndp >= 4 && m.pro >= 0.7 ? 2 : (m.ndp >= 2 && m.pro >= 0.5) ? 1 : 0, why: `${m.ndp || 0} pro distributor${m.ndp === 1 ? "" : "s"} carry it; ${pct(m.pro)} of SKUs are in pro channels, ${pct(m.broad)} at broadline MRO.${thin}` };
    case "cons": return { v: m.cons >= 0.8 ? 2 : m.cons >= 0.5 ? 1 : 0, why: `${pct(m.cons)} of SKUs are consumables (not tools, dispensers or equipment).${thin}` };
    case "own": { const md = c.model || ""; const v = /private label|contract/i.test(md) ? 0 : /distributor-owned/i.test(md) ? 0 : 2; return { v, why: md ? `Business model: ${md}.` : "No business model in the map; assumed a brand owner." }; }
    case "pull": return { v: m.maxbd >= 6 ? 2 : m.maxbd >= 3 ? 1 : 0, why: `Its widest brand is carried by ${m.maxbd || 0} pro distributors.` };
    case "itw": return { v: (/pro brand owner|mixed/i.test(c.model || "") ? 1 : 0) + (m.hand >= 0.6 && m.cons >= 0.7 ? 1 : 0), why: "From business model, pack size and consumable share." };
    case "major": { const md = c.model || ""; return { v: /pro brand owner/i.test(md) ? 2 : /mixed/i.test(md) || !md ? 1 : 0, why: md ? `Business model: ${md}.` : "No business model in the map." }; }
  }
}
// Precedence: your override, then Claude's re-check from the page, then the imported judgment, then the data rule.
function testOf(c, k) {
  const o = DNA.get(c.id)?.tests?.[k];
  if (o && [0, 1, 2].includes(o.v)) return { v: o.v, why: o.why || "", src: o.by === "you" ? "you" : "claude" };
  const j = c.judge?.[k];
  if (j && [0, 1, 2].includes(j.v)) return { v: j.v, why: j.why || "", src: "claude" };
  return { ...autoTest(c, k), src: "data" };
}
function dnaOf(c) {
  if (c._dna && c._dna.ver === ver) return c._dna;
  const tests = TESTS.map(t => ({ ...t, ...testOf(c, t.k) }));
  const score = Math.round(tests.reduce((a, t) => a + t.w * t.v / 2, 0));
  const band = score >= 70 ? "g" : score >= 45 ? "a" : "r";
  return (c._dna = { ver, tests, score, band, out: tests.find(t => t.k === "major").v === 0 });
}
const dnaStrip = d => `<span class="dna" aria-label="DNA checks">${d.tests.map(t => `<i class="v${t.v}${t.src === "you" ? " ov" : ""}" title="${esc(t.t)}: ${V[t.v]}"></i>`).join("")}</span>`;

/* ---------- ownership ---------- */
const holdYrs = c => num(c.pe_year) ? YEAR - +c.pe_year : null;
function ownerLine(c) {
  const k = c.oclass;
  if (k === "pe") return `<span class="own pe">PE</span>${esc(c.sponsor || "Sponsor not named")}${c.pe_year ? ` · since ${esc(c.pe_year)}` : ""}`;
  if (k === "family") return `<span class="own family">Family</span>${esc(c.parent && !/not|unknown|undisclosed/i.test(c.parent) ? c.parent : "Founder or family owned")}`;
  if (k === "esop") return `<span class="own">ESOP</span>Employee owned`;
  if (k === "private") return `<span class="own">Private</span>${esc(c.parent && !/^unknown/i.test(c.parent) ? c.parent : "Owner not confirmed")}`;
  return `<span class="own">Corporate</span>${esc(c.parent || c.otype)}`;
}
const inOwn = c => ui.own.has(ownKey(c));

/* ---------- data helpers ---------- */
const list = () => [...CO.values()];
const visible = () => list().filter(inOwn);
/* categories: the market map's normalized categories. A brand counts in its primary category and in any other
   category where it has 2+ SKUs, so a category's list is as wide as what's actually on the shelf. */
const catHref = name => "#cat." + CATNAMES.indexOf(name);
const catLink = name => CATNAMES.includes(name) ? `<a href="${catHref(name)}">${esc(name)}</a>` : esc(name);
const md1 = s => esc(s).replace(/https?:\/\/[^\s;]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\/(www\.)?/, "").split("/")[0]}</a>`);
const plays = (b, cat) => b.ncat === cat || (b.allc?.[cat] || 0) >= 2;
const segments = () => [...new Set(CATS.map(c => c.seg).concat(Object.values(SEGOF)))].filter(Boolean);
const catsIn = seg => CATNAMES.filter(c => !seg || SEGOF[c] === seg);
const REVB = [["", "Any revenue"], ["s", "Under $10M"], ["m", "$10–50M"], ["l", "$50–250M"], ["x", "$250M–1B"], ["xx", "Over $1B"], ["u", "Revenue not known"]];
const revBand = c => { const r = num(c.rev); return r === null ? "u" : r < 10 ? "s" : r < 50 ? "m" : r < 250 ? "l" : r < 1000 ? "x" : "xx"; };
function families() { const s = new Set(); for (const c of list()) for (const f of Object.keys(c.mix?.fam || {})) s.add(f); return [...s].sort(); }
function markets() { const s = new Set(); for (const c of list()) for (const f of Object.keys(c.mix?.mkt || {})) s.add(f); return [...s].sort(); }
const topKey = o => Object.entries(o || {}).sort((a, b) => b[1] - a[1])[0]?.[0] || "";
function agg(cos, field, limit) {
  const m = new Map(); for (const c of cos) for (const [k, v] of Object.entries(c.mix?.[field] || {})) m.set(k, (m.get(k) || 0) + v);
  const rows = [...m].sort((a, b) => b[1] - a[1]); return limit ? rows.slice(0, limit) : rows;
}
const PAL = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];
function mixBlock(title, rows, total, cap = 8) {
  if (!rows.length) return `<div class="mix"><h3>${esc(title)}</h3><p class="faint">No SKUs scraped.</p></div>`;
  const head = rows.slice(0, cap), rest = rows.slice(cap).reduce((a, r) => a + r[1], 0);
  const parts = [...head.map((r, i) => [r[0], r[1], PAL[i % PAL.length]]), ...(rest ? [["Everything else", rest, "var(--c0)"]] : [])];
  return `<div class="mix"><h3>${esc(title)}</h3>
    <div class="stack" role="img" aria-label="${esc(title)}">${parts.map(p => `<i style="width:${(p[1] / total * 100).toFixed(2)}%;background:${p[2]}" title="${esc(p[0])}: ${p[1]} SKUs"></i>`).join("")}</div>
    <ul class="legend">${parts.map(p => `<li><i class="sw" style="background:${p[2]}"></i><span>${esc(p[0])}</span><span class="num">${p[1]}</span><span class="num">${Math.round(p[1] / total * 100)}%</span></li>`).join("")}</ul></div>`;
}
function hbars(rows, total, fmt = v => v) {
  const max = Math.max(1, ...rows.map(r => r[1]));
  return `<ul class="hbars">${rows.map(r => `<li><span title="${esc(r[0])}">${esc(r[0])}</span><span class="track"><span class="fill" style="width:${(r[1] / max * 100).toFixed(1)}%"></span></span><span class="num">${fmt(r[1])}</span><span class="num">${total ? Math.round(r[1] / total * 100) + "%" : ""}</span></li>`).join("")}</ul>`;
}

/* ---------- consolidators ---------- */
function consolidators() {
  if (consolidators.c && consolidators.c.ver === ver) return consolidators.c.rows;
  const by = new Map();
  for (const d of DEALS) {
    if (d.kind !== "addon" || !d.acq_id || !CO.has(d.acq_id)) continue;
    if (!by.has(d.acq_id)) by.set(d.acq_id, []);
    by.get(d.acq_id).push(d);
  }
  const rows = list().map(c => {
    const ds = (by.get(c.id) || []).sort((a, b) => (b.year || 0) - (a.year || 0));
    return { c, deals: ds, n: ds.length, brands: (c.brands || []).length, last: ds[0]?.year || null, recent: ds.filter(d => d.year >= YEAR - 5).length };
  }).filter(r => r.n >= 1 || r.brands >= 4).sort((a, b) => b.n - a.n || b.brands - a.brands || (b.last || 0) - (a.last || 0));
  consolidators.c = { ver, rows };
  return rows;
}
function sponsors() {
  const by = new Map();
  for (const c of list()) if (c.oclass === "pe" && c.sponsor) {
    const k = norm(c.sponsor.split(/[;(]/)[0]); if (!k) continue;
    if (!by.has(k)) by.set(k, { name: c.sponsor.split(/[;(]/)[0].trim(), cos: [] });
    by.get(k).cos.push(c);
  }
  return [...by.values()].sort((a, b) => b.cos.length - a.cos.length || a.name.localeCompare(b.name));
}

/* ---------- routing & chrome ---------- */
function route() {
  const h = decodeURIComponent((location.hash || "#screen").slice(1));
  if (h.startsWith("c.")) return { v: "company", id: h.slice(2) };
  if (h.startsWith("b.")) return { v: "brand", id: h.slice(2) };
  if (h.startsWith("web")) return { v: "web", id: h.split(".")[1] || null };
  if (h.startsWith("cat.")) return { v: "cat", id: h.slice(4) };
  if (h.startsWith("price.")) return { v: "price", id: h.slice(6) };
  if (h.startsWith("d.")) return { v: "dist", id: h.slice(2) };
  if (h.startsWith("s.")) return { v: "strategy", id: h.slice(2) };
  if (h.startsWith("rollup")) { const ids = h.split(":")[1]; if (ids !== undefined) { ui.roll = ids.split(",").filter(x => CO.has(x) || !loaded); store.set("roll", ui.roll); } return { v: "rollup" }; }
  if (["screen", "consolidators", "mix", "brands", "cats", "dists", "reach", "pricing", "premium"].includes(h)) return { v: h };
  return { v: "screen" };
}
function chrome(r) {
  document.querySelectorAll("#nav a").forEach(a => a.setAttribute("aria-current", a.dataset.v === (r.v === "company" ? "screen" : r.v === "brand" ? "brands" : r.v === "cat" ? "cats" : r.v === "price" || r.v === "premium" ? "pricing" : r.v === "dist" ? "dists" : r.v === "strategy" ? "screen" : r.v) ? "page" : "false"));
  const counts = {}; for (const c of list()) counts[ownKey(c)] = (counts[ownKey(c)] || 0) + 1;
  $("#ownChips").innerHTML = OWN.map(([k, l]) => `<button class="chip" type="button" data-own="${k}" aria-pressed="${ui.own.has(k)}">${l}<small>${counts[k] || 0}</small></button>`).join("");
  $("#nBrands").textContent = BR.size || "";
  $("#nCats").textContent = CATS.length || "";
  $("#nDists").textContent = DISTS.length || "";
  $("#nRoll").textContent = ui.roll.length || "";
  $("#nScreen").textContent = loaded ? visible().filter(c => ui.showOut || !dnaOf(c).out).length : "";
  const live = { connecting: ["", "Connecting"], live: ["on", "Live · " + CO.size + " owners"], readonly: ["on", "View only · " + CO.size + " owners"], off: ["", "Not connected"] }[dbState];
  $("#live").innerHTML = `<span class="dot ${live[0]}"></span>${esc(live[1])}`;
  $("#srcline").textContent = SRC;
  document.title = "Probrands";
}

/* ---------- view: the screen ---------- */
function viewScreen() {
  const q = norm(ui.q);
  const base = visible();
  let rows = base.filter(c => (!ui.seg || topKey(c.mix?.seg) === ui.seg || (c.mix?.seg?.[ui.seg] || 0) >= 2)
    && (!ui.fam || topKey(c.mix?.cat) === ui.fam || (c.mix?.cat?.[ui.fam] || 0) >= 2) && (!ui.rev || revBand(c) === ui.rev) && (!ui.chf || coClass(c) === ui.chf)
    && (!ui.mkt || (c.mix?.mkt?.[ui.mkt] || 0) / (c.skus || 1) >= 0.25)
    && (!q || norm([c.name, ...(c.brands || []), c.sponsor, c.parent, c.category].join(" ")).includes(q)));
  const outN = rows.filter(c => dnaOf(c).out).length;
  const inScope = rows.filter(c => !dnaOf(c).out), outRows = rows.filter(c => dnaOf(c).out);
  const key = { dna: c => dnaOf(c).score, skus: c => c.skus || 0, brands: c => (c.brands || []).length, name: c => c.name.toLowerCase(), dist: c => c.m?.ndp || 0, rev: c => num(c.rev) ?? -1, pen: c => reachOf(c).pen ?? 2 }[ui.sort];
  const cmp = (a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * ui.dir || dnaOf(b).score - dnaOf(a).score; };
  inScope.sort(cmp); outRows.sort(cmp);
  const shown = inScope.slice(0, ui.limit);
  const band = b => inScope.filter(c => dnaOf(c).band === b).length;
  const mkts = markets();
  const sortBtn = (k, label, cls = "") => `<button type="button" class="${cls}" data-sort="${k}" ${ui.sort === k ? `aria-sort="${ui.dir < 0 ? "descending" : "ascending"}"` : ""}>${label}${ui.sort === k ? (ui.dir < 0 ? " ▼" : " ▲") : ""}</button>`;
  const row = c => {
    const d = dnaOf(c);
    return `<a class="row" href="#c.${esc(c.id)}">
      <span class="stripe band-${d.band}"></span>
      <span class="score ${d.band} num">${d.score}</span>
      ${dnaStrip(d)}
      <span class="co"><b>${esc(c.name)}${c.verified ? "" : ` <span class="unv">owner unverified</span>`}</b><small>${ownerLine(c)}</small></span>
      <span class="hide-m mod"><span class="brs">${esc((c.brands || []).slice(0, 4).join(", "))}</span><small class="faint" style="display:block;font-size:12.5px">${esc(c.model || "Business model not mapped")}${c.rev ? ` · ${fmtM(c.rev)} rev.` : ""}${c.emp_band || c.emp ? ` · ${esc(c.emp_band || Math.round(c.emp).toLocaleString())} staff` : ""}${coClass(c) ? ` · ${esc(coClass(c))}` : ""}</small></span>
      <span class="num r">${c.skus || 0}</span>
      <span class="num r">${c.m?.ndp || 0}</span>
      <span class="num r hide-m">${(p => p === null ? "—" : pct(p))(reachOf(c).pen)}</span>
    </a>`;
  };
  return `<div class="page-h"><div class="grow"><div class="lbl">${esc(ownSummary())}</div><h1>The screen</h1>
    <p>Every brand owner in the market map, ranked by its DNA. Green fits the pro brands playbook: handheld, pro-distributed, brands pros ask for, and most of the business. Red doesn't. Click a company to see each check and override it.</p></div></div>
  <div class="gauges">
    <div class="gauge"><b>${inScope.length}</b><span class="lbl">In scope</span></div>
    <div class="gauge g"><b>${band("g")}</b><span class="lbl">Green · 70+</span></div>
    <div class="gauge a"><b>${band("a")}</b><span class="lbl">Amber · 45–69</span></div>
    <div class="gauge r"><b>${band("r")}</b><span class="lbl">Red · under 45</span></div>
    <div class="gauge"><b>${inScope.filter(c => c.oclass === "pe").length}</b><span class="lbl">PE owned</span></div>
    <div class="gauge"><b>${inScope.filter(c => c.oclass === "family").length}</b><span class="lbl">Family owned</span></div>
    <a class="gauge glink" href="#brands"><b>${BR.size.toLocaleString()}</b><span class="lbl">Brands →</span></a>
  </div>
  <div class="bar">
    <input class="search" id="q" type="search" placeholder="Search companies, brands, sponsors…" value="${esc(ui.q)}" aria-label="Search">
    <select id="seg" aria-label="Segment"><option value="">All segments</option>${segments().map(f => `<option ${f === ui.seg ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>
    <select id="fam" aria-label="Category"><option value="">All categories</option>${catsIn(ui.seg).map(f => `<option ${f === ui.fam ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>
    <select id="chf" aria-label="Channel">${[["", "Any channel"], ["Pro-only", "Pro-only (<5% retail)"], ["Pro-led", "Pro-led (5-19%)"], ["Mixed", "Mixed (20-49%)"], ["Retail-led", "Retail-led (50%+)"]].map(([k, l]) => `<option value="${k}" ${k === ui.chf ? "selected" : ""}>${l}</option>`).join("")}</select>
    <select id="rev" aria-label="Revenue">${REVB.map(([k, l]) => `<option value="${k}" ${k === ui.rev ? "selected" : ""}>${l}</option>`).join("")}</select>
    <select id="mkt" aria-label="End market"><option value="">All end markets</option>${mkts.map(f => `<option ${f === ui.mkt ? "selected" : ""}>${esc(f)}</option>`).join("")}</select>
  </div>
  <div class="rows" role="list">

    <div class="gauge"><b>${chanSum ? Math.round(chan.broadline / chanSum * 100) : 0}%</b><span class="lbl">Broadline MRO</span></div><div class="gauge"><b>${chanSum ? Math.round(chan.specialty / chanSum * 100) : 0}%</b><span class="lbl">Trade specialty</span></div><div class="gauge"><b>${chanSum ? Math.round(chan.retail / chanSum * 100) : 0}%</b><span class="lbl">Retail-leaning</span></div></div>
  <section class="panel"><div class="body mixes">${mixBlock("Package format", fmt, total, 10)}${mixBlock("End market", mkt, total, 10)}${mixBlock("Segment", seg, total, 10)}</div></section>
  <section class="panel"><header><h2>Categories</h2><span class="sp"></span><span class="lbl">SKUs by the market map's normalized category · click through on the Categories page</span></header><div class="body">${hbars(fam.slice(0, 25), total)}</div></section>
  <div class="grid2">
    <section class="panel"><header><h2>Distributors</h2><span class="sp"></span><span class="lbl">Top 20 by SKUs</span></header><div class="body">${hbars(dist.map(([k, v]) => [k.replace(/\s*\(.*\)$/, ""), v]), total)}</div></section>
    <section class="panel"><header><h2>Brands</h2><span class="sp"></span><span class="lbl">Top 25 by SKUs</span></header><div class="body">${hbars(brand, total)}</div></section>
  </div>
  <div class="note">Scrape coverage: ${DISTS.filter(d => /scraped/i.test(d.status)).length} of ${DISTS.length} distributors so far, so the mix leans toward the channels already scraped.</div>`;
}

/* ---------- render ---------- */
function render() {
  const r = route();
  chrome(r);
  if (!loaded) { if (dbState === "off") app.innerHTML = `<div class="empty"><h2>Not connected</h2><p>Probrands keeps the market map in a shared database that loads when this page is opened in Claude while signed in.</p></div>`; return; }
  const y = scrollY;
  app.innerHTML = r.v === "company" ? viewCompany(r.id) : r.v === "brand" ? viewBrand(r.id) : r.v === "brands" ? viewBrands() : r.v === "cats" ? viewCats() : r.v === "dists" ? viewDists() : r.v === "reach" ? viewReach() : r.v === "pricing" ? viewPricing() : r.v === "premium" ? viewPremium() : r.v === "price" ? viewPrice(r.id) : r.v === "rollup" ? viewRollup() : r.v === "strategy" ? viewStrategy(r.id) : r.v === "dist" ? viewDist(r.id) : r.v === "cat" ? viewCat(r.id) : r.v === "consolidators" ? viewConsolidators() : r.v === "web" ? viewWeb(r.id) : r.v === "mix" ? viewMix() : viewScreen();
  if (render.last === location.hash) scrollTo(0, y); else scrollTo(0, 0);
  render.last = location.hash;
  if (r.v === "web") bindWeb();
}
let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- writes: DNA overrides ---------- */
async function saveDna(id, tests) {
  if (!db || !writable) return;
  const doc = { tests, updated_at: now() };
  DNA.set(id, doc); ver++; render();
  try { await db.doc("dna/" + id).set(doc); } catch (e) { toast(e?.code === "permission_denied" ? "You can view but not edit" : "Couldn't save"); }
}
function cycle(id, k) {
  const c = CO.get(id); if (!c) return;
  const cur = testOf(c, k).v, next = (cur + 2) % 3; // pass -> partly -> fail -> pass
  const tests = { ...(DNA.get(id)?.tests || {}) };
  tests[k] = { v: next, by: "you", why: `Set by you (was ${V[cur].toLowerCase()}).`, at: now() };
  saveDna(id, tests);
}
async function askClaude(id) {
  const c = CO.get(id), dt = DT.get(id) || {}; if (!c || !sample) return;
  ui.busy[id] = "Claude is checking…"; render();
  const prompt = `You are screening US "professional brands" for a buy-side M&A team: branded chemical products tradespeople and plant workers hold in their hand (lubricants, penetrants, sealants, cleaners, hand cleaners, marking paint, plumbing, HVAC/R, electrical, welding chemicals) sold mainly through pro distributors. Benchmark: ITW Pro Brands, WD-40, CRC, Oatey, RectorSeal, Nu-Calgon.

Company: ${c.name}
Owner: ${c.otype}${c.sponsor ? " (" + c.sponsor + ")" : ""}${c.parent ? "; parent " + c.parent : ""}
Business model (market map): ${c.model || "not mapped"}
What it is: ${(dt.what || c.blunt || "").slice(0, 600)}
Brands: ${(dt.brands || []).slice(0, 15).map(b => `${b.name} (${b.cat}; ${b.form}; ${b.skus} SKUs; ${(b.dists || []).length} distributors)`).join("; ")}
Scrape: ${c.skus} SKUs, ${pct(c.m?.hand)} hand-sized, ${pct(c.m?.pro)} in pro channels, ${c.m?.ndp} pro distributors.${c.rev ? ` Revenue ~${fmtM(c.rev)}.` : ""}

Give three verdicts, 2 = yes, 1 = partly, 0 = no, each with a reason of at most 18 words:
pull: would pros ask for this brand by name and want to own it?
itw: would ITW put it in its Pro Brands business?
major: are small-format pro, distributor-sold products the large majority (60%+) or all of revenue?
Also pro_pct: rough % of revenue from such products (integer or null). Use your knowledge; don't invent facts.
Reply with ONLY JSON: {"pull":{"v":0,"why":""},"itw":{"v":0,"why":""},"major":{"v":0,"why":""},"pro_pct":null}`;
  try {
    const r = await sample.json(prompt, { modelTier: "default", cache: false });
    const tests = { ...(DNA.get(id)?.tests || {}) };
    for (const k of ["pull", "itw", "major"]) if (r?.[k] && [0, 1, 2].includes(+r[k].v) && tests[k]?.by !== "you") tests[k] = { v: +r[k].v, why: String(r[k].why || "").slice(0, 200), by: "claude", at: now() };
    delete ui.busy[id];
    await saveDna(id, tests);
    toast("Claude re-checked " + c.name);
  } catch (e) {
    delete ui.busy[id]; render();
    toast(e?.code === "not_granted" ? "Claude isn't allowed on this page" : e?.code === "rate_limited" ? "Claude is busy; try again shortly" : "Claude couldn't answer");
  }
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target;
  const own = t.closest("[data-own]");
  if (own) { const k = own.dataset.own; ui.own.has(k) ? ui.own.delete(k) : ui.own.add(k); store.set("own", [...ui.own]); ui.limit = 80; render(); return; }
  const so = t.closest("[data-sort]");
  if (so) { const k = so.dataset.sort; if (ui.sort === k) ui.dir *= -1; else { ui.sort = k; ui.dir = k === "name" ? 1 : -1; } render(); return; }
  const a = t.closest("[data-act]");
  if (a) {
    const act = a.dataset.act;
    if (act === "more") { ui.limit += 80; render(); }
    else if (act === "radd") { ui.rq = ""; location.hash = "rollup:" + [...ui.roll.filter(x => x !== a.dataset.id), a.dataset.id].join(","); }
    else if (act === "rdel") { location.hash = "rollup:" + ui.roll.filter(x => x !== a.dataset.id).join(","); }
    else if (act === "rclear") { location.hash = "rollup:"; }
    else if (act === "plan") askPlan(a.dataset.id);
    else if (act === "rplan") askRollPlan();
    else if (act === "pall") { ui.pall = !ui.pall; render(); }
    else if (act === "rview") { ui.rview = a.dataset.v; render(); }
    else if (act === "ppos") { ui.pp.pos = ui.pp.pos === a.dataset.v ? "" : a.dataset.v; ui.pp.limit = 100; render(); }
    else if (act === "ppmore") { ui.pp.limit += 100; render(); }
    else if (act === "wsmk") { ui.wsmk = a.dataset.v; ui.wslimit = 40; render(); }
    else if (act === "wsmore") { ui.wslimit += 40; render(); }
    else if (act === "rsave") saveRoll(false);
    else if (act === "rsavenew") saveRoll(true);
    else if (act === "rdelsave") deleteRoll(a.dataset.id);
    else if (act === "rmore") { ui.rlimit += 60; render(); }
    else if (act === "bmore") { ui.b.limit += 100; render(); }
    else if (act === "out") { ui.showOut = !ui.showOut; render(); }
    else if (act === "cycle") cycle(a.dataset.id, a.dataset.k);
    else if (act === "askclaude") askClaude(a.dataset.id);
    else if (act === "reset") saveDna(a.dataset.id, {});
    else if (act === "unfocus") location.hash = "web";
    return;
  }
  const bs = t.closest("[data-bsort]");
  if (bs) { const k = bs.dataset.bsort; if (ui.b.sort === k) ui.b.dir *= -1; else { ui.b.sort = k; ui.b.dir = k === "name" || k === "owner" ? 1 : -1; } render(); return; }
  const go = t.closest("[data-go]");
  if (go && !t.closest("a")) { location.hash = go.dataset.go; return; }
  const z = t.closest("[data-zoom]");
  if (z) { zoomWeb(+z.dataset.zoom || 0); return; }
});
document.addEventListener("input", e => {
  if (e.target.id === "ppq") { ui.pp.q = e.target.value; ui.pp.limit = 100; const pos = e.target.selectionStart; render(); const q = $("#ppq"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; }
  if (e.target.id === "bq") { ui.b.q = e.target.value; ui.b.limit = 100; const pos = e.target.selectionStart; render(); const q = $("#bq"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; }
  if (e.target.id === "rname") { ui.rname = e.target.value; return; }
  if (e.target.matches?.("select[data-wsdoor]")) { setDoorStatus(e.target.dataset.roll, e.target.dataset.wsdoor, e.target.value); return; }
  if (e.target.id === "wsst") { ui.wsst = e.target.value; render(); return; }
  if (e.target.id === "rq") { ui.rq = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#rq"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; }
  if (e.target.id === "dq") { ui.dq = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#dq"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } return; }
  if (e.target.id === "q") { ui.q = e.target.value; ui.limit = 80; const pos = e.target.selectionStart; render(); const q = $("#q"); if (q) { q.focus(); q.setSelectionRange(pos, pos); } }
});
document.addEventListener("change", e => {
  if (e.target.id === "fam") { ui.fam = e.target.value; render(); }
  if (e.target.id === "seg") { ui.seg = e.target.value; if (ui.fam && SEGOF[ui.fam] !== ui.seg) ui.fam = ""; render(); }
  if (e.target.id === "rev") { ui.rev = e.target.value; render(); }
  if (e.target.id === "chf") { ui.chf = e.target.value; render(); }
  if (e.target.id === "pmin") { ui.pmin = +e.target.value; render(); }
  if (e.target.id === "psort") { ui.psort = e.target.value; render(); }
  const ppmap = { ppsort: "sort", ppseg: "seg", ppcat: "cat", ppown: "own" };
  if (e.target.id === "ppmin") { ui.pp.min = +e.target.value; ui.pp.limit = 100; render(); }
  if (ppmap[e.target.id]) { ui.pp[ppmap[e.target.id]] = e.target.value || (e.target.id === "ppsort" ? "lead" : ""); if (e.target.id === "ppseg" && ui.pp.cat && SEGOF[CATNAMES[ui.pp.cat]] !== ui.pp.seg) ui.pp.cat = ""; ui.pp.limit = 100; render(); }
  if (e.target.id === "rcap") { ui.cap = e.target.value === "demo" ? "demo" : +e.target.value; render(); }
  if (e.target.id === "rmin") { ui.rmin = e.target.value; render(); }
  if (e.target.id === "rsort") { ui.rsort = e.target.value; render(); }
  if (e.target.id === "dch") { ui.dch = e.target.value; render(); }
  if (e.target.id === "dmk") { ui.dmk = e.target.value; render(); }
  if (e.target.id === "dsort") { ui.dsort = e.target.value; render(); }
  if (e.target.id === "cseg") { ui.cseg = e.target.value; render(); }
  if (e.target.id === "csort") { ui.csort = e.target.value; render(); }
  const bmap = { btri: "tri", bstatus: "status", bown: "own", bfam: "fam", bseg: "seg", bch: "ch", bdist: "dist", bmkt: "mkt", bfmt: "fmt" };
  if (bmap[e.target.id]) { ui.b[bmap[e.target.id]] = e.target.value; ui.b.limit = 100; render(); }
  if (e.target.id === "mkt") { ui.mkt = e.target.value; render(); }
});
window.addEventListener("hashchange", render);
document.addEventListener("pointermove", e => {
  const tip = $("#tip"), el = e.target.closest?.("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.innerHTML = el.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + "px"; tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, e.clientY + 14)) + "px";
});
function bindWeb() {
  const svg = $("#websvg"); if (!svg) return;
  let drag = null, moved = false;
  const toWorld = (cx, cy) => { const r = svg.getBoundingClientRect(), [x, y, w, h] = view, s = Math.max(w / r.width, h / r.height), ox = x + (w - r.width * s) / 2, oy = y + (h - r.height * s) / 2; return [ox + (cx - r.left) * s, oy + (cy - r.top) * s, s]; };
  svg.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, v: [...view] }; moved = false; svg.setPointerCapture(e.pointerId); svg.classList.add("drag"); });
  svg.addEventListener("pointermove", e => {
    if (!drag) return; const [, , s] = toWorld(e.clientX, e.clientY);
    const dx = (e.clientX - drag.x) * s, dy = (e.clientY - drag.y) * s; if (Math.abs(dx) + Math.abs(dy) > 3 * s) moved = true;
    view = [drag.v[0] - dx, drag.v[1] - dy, drag.v[2], drag.v[3]]; svg.setAttribute("viewBox", view.map(v => v.toFixed(1)).join(" "));
  });
  svg.addEventListener("pointerup", e => {
    svg.classList.remove("drag"); const was = drag; drag = null;
    if (was && !moved) { const hub = document.elementsFromPoint(e.clientX, e.clientY).map(el => el.closest?.("[data-hub]")).find(Boolean); if (hub) location.hash = "web." + hub.dataset.hub; }
  });
  svg.addEventListener("wheel", e => { e.preventDefault(); const [wx, wy] = toWorld(e.clientX, e.clientY); zoomWeb(e.deltaY > 0 ? 1.12 : 0.89, wx, wy); }, { passive: false });
}

/* ---------- boot ---------- */
render();
(async () => {
  if (!window.claude?.use) { dbState = "off"; render(); return; }
  const [d, s, u] = await Promise.all([window.claude.use("db").catch(() => null), window.claude.use("sample").catch(() => null), window.claude.use("user").catch(() => null)]);
  db = d; sample = s;
  if (!db) { dbState = "off"; render(); return; }
  try { const w = u?.can ? await u.can("data.write") : null; writable = w !== false; } catch { writable = true; }
  dbState = writable ? "live" : "readonly";
  db.collection("rollups").limit(500).onSnapshot(snap => { ROLLS = snap.docs.map(x => ({ id: x.id, ...(x.data() || {}) })); if (loaded) render(); }, () => {});
  db.collection("dna").limit(1000).onSnapshot(snap => { DNA.clear(); snap.docs.forEach(x => DNA.set(x.id, x.data())); ver++; if (loaded) render(); }, () => {});
  db.collection("data").limit(100).onSnapshot(snap => {
    CO.clear(); DT.clear(); BR.clear();
    snap.docs.forEach(x => {
      const v = x.data() || {};
      if (x.id.startsWith("co-")) for (const [id, c] of Object.entries(v.companies || {})) CO.set(id, { ...c, id });
      else if (x.id.startsWith("dt-")) for (const [id, t] of Object.entries(v.details || {})) DT.set(id, t);
      else if (x.id.startsWith("br-")) for (const [id, b] of Object.entries(v.brands || {})) BR.set(id, { ...b, id });
      else if (x.id === "deals") DEALS = v.deals || [];
      else if (x.id === "dists") DISTS = v.list || [];
      else if (x.id === "index") SRC = v.source || "";
      else if (x.id === "pricing") { PRICING = v.cats || {}; PLEARN = v.learn || null; }
      else if (x.id === "cats") { CATS = v.cats || []; CATNAMES = v.names || []; SEGOF = v.segs || {}; }
    });
    const dmk = new Map(DISTS.map(d => [d.name, d.market]));
    for (const b of BR.values()) {  // categories arrive as indexes into the Competition tab's list
      b.ncat = CATNAMES[b.nc] || "Unclassified"; b.seg = SEGOF[b.ncat] || "Unclassified";
      b.mkts = [...new Set((b.dists || []).map(d => dmk.get(d)).filter(Boolean))].sort();
      b.allc = b.cats ? Object.fromEntries(Object.entries(b.cats).map(([i, n]) => [CATNAMES[i] || "Unclassified", n])) : { [b.ncat]: b.skus || 0 };
    }
    brandByName = new Map([...BR.values()].map(b => [norm(b.name), b.id]));
    loaded = true; ver++; render();
  }, err => { dbState = "off"; render(); });
})();
})();
