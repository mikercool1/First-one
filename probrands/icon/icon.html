<!doctype html><html><head><meta charset=utf-8>

<style>@font-face{font-family:"Big Shoulders Display";font-weight:900;src:url(bs.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-weight:700;src:url(jb.woff2) format("woff2")}
html,body{margin:0;width:1024px;height:1024px;overflow:hidden;background:#121311}
.ic{position:relative;width:1024px;height:1024px;background:radial-gradient(circle at 50% 40%,#22231f 0,#121311 70%)}
.hz{position:absolute;left:0;right:0;top:0;height:170px;background:repeating-linear-gradient(-45deg,#f2b705 0 60px,#141209 60px 120px)}
.hz.b{top:auto;bottom:0;height:90px}
.plate{position:absolute;left:110px;right:110px;top:250px;bottom:190px;border:14px solid #4b4c45;border-radius:18px;background:linear-gradient(180deg,#22231f,#161714);display:flex;flex-direction:column;align-items:center;justify-content:center}
.plate::before,.plate::after{content:"";position:absolute;top:26px;width:36px;height:36px;border-radius:50%;background:#55564f;box-shadow:inset 0 5px 0 #77786f}
.plate::before{left:26px}.plate::after{right:26px}
.pb{font:900 430px/0.8 "Big Shoulders Display";color:#f2b705;letter-spacing:.01em;margin-top:30px}
.sub{font:700 54px/1 "JetBrains Mono";color:#99958a;letter-spacing:.12em;margin-top:38px}
</style></head><body><div class="ic"><div class="hz"></div><div class="plate"><div class="pb">PB</div><div class="sub">PROBRANDS</div></div><div class="hz b"></div></div></body></html>
